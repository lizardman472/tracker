<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">
<meta name="theme-color" content="#0c0d10">
<meta name="mobile-web-app-capable" content="yes">
<title>Rack-Free Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%230c0d10' width='100' height='100' rx='20'/><text x='50' y='62' text-anchor='middle' font-size='50'>🏋️</text></svg>">
<style>
:root {
  --bg: #0c0d10; --card: #13141a; --card-border: #1e2028; --input-bg: #1a1c24;
  --input-border: #2a2d38; --text: #dce0e8; --muted: #6b7084; --dim: #444;
  --gold: #f0c850; --blue: #50b0f0; --green: #50f0a0; --red: #f07070; --orange: #ffaa44;
  --p10: #c44040; --p5: #4080c4; --p2: #50a050; --p1: #a0a0a0;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif; min-height: 100vh; min-height: 100dvh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
body { max-width: 480px; margin: 0 auto; padding-bottom: calc(70px + var(--safe-b)); }
input, select, button, textarea { font-family: inherit; }
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; }

/* Header */
.header { padding: 16px 16px 10px; border-bottom: 1px solid var(--card-border); position: sticky; top: 0; background: var(--bg); z-index: 100; }
.header h1 { font-size: 17px; font-weight: 800; color: var(--gold); letter-spacing: 1.5px; margin-bottom: 2px; }
.header small { font-size: 10px; color: var(--dim); letter-spacing: 0.3px; }

/* Nav */
.nav { display: flex; gap: 1px; padding: 0 16px; background: var(--bg); position: sticky; top: 52px; z-index: 99; padding-top: 6px; padding-bottom: 2px; }
.nav button { flex: 1; padding: 10px 0; font-size: 11px; font-weight: 600; border: none; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); cursor: pointer; letter-spacing: 0.5px; transition: all 0.15s; }
.nav button.active { color: var(--gold); border-bottom-color: var(--gold); }

/* Section */
.section { padding: 14px 16px; }
.section.hidden { display: none; }

/* Cards */
.card { background: var(--card); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; border: 1px solid var(--card-border); }
.card-hl { border-color: var(--gold); }

/* Badges */
.badge { display: inline-block; padding: 2px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
.badge-a { background: var(--gold); color: var(--bg); }
.badge-b { background: var(--blue); color: var(--bg); }
.badge-c { background: var(--green); color: var(--bg); }

/* Labels */
.label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 4px; }
.muted { font-size: 12px; color: var(--muted); }
.dim { font-size: 11px; color: var(--dim); }

/* Exercise card in workout */
.ex-card { background: var(--card); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; border: 1px solid var(--card-border); }
.ex-name { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
.ex-meta { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
.sugg { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 5px; display: inline-block; margin-bottom: 8px; }
.sugg-up { color: var(--green); background: rgba(80,240,160,0.08); }
.sugg-stay { color: var(--gold); background: rgba(240,200,80,0.08); }
.sugg-new { color: var(--blue); background: rgba(80,176,240,0.08); }

/* Inputs */
.rep-input { width: 44px; height: 40px; padding: 4px; font-size: 16px; font-weight: 600; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 8px; color: #fff; text-align: center; outline: none; }
.rep-input:focus { border-color: var(--gold); }
.note-input { width: 100%; padding: 7px 10px; font-size: 12px; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 8px; color: #999; outline: none; margin-top: 6px; }
.note-input:focus { border-color: var(--gold); color: var(--text); }
.band-select { padding: 7px 10px; font-size: 13px; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 8px; color: #fff; outline: none; max-width: 200px; -webkit-appearance: none; }

/* Weight Stepper */
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper-btn { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text); font-size: 22px; font-weight: 700; cursor: pointer; user-select: none; -webkit-user-select: none; transition: background 0.1s; }
.stepper-btn:active { background: var(--card-border); }
.stepper-btn.disabled { color: #333; cursor: default; }
.stepper-val { min-width: 68px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: var(--input-bg); border: 2px solid var(--gold); font-size: 18px; font-weight: 800; color: var(--gold); padding: 0 6px; }
.stepper-val span { font-size: 10px; color: var(--muted); margin-left: 2px; font-weight: 400; }

/* Plate Visual */
.plates { display: flex; align-items: center; gap: 2px; padding: 5px 0; flex-wrap: wrap; }
.plates-label { font-size: 9px; color: var(--dim); margin-right: 4px; }
.plate { height: 28px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #fff; }
.plate-10 { background: var(--p10); width: 26px; }
.plate-5 { background: var(--p5); width: 22px; }
.plate-2 { background: var(--p2); width: 18px; }
.plate-1 { background: var(--p1); width: 14px; }
.plates-total { font-size: 10px; color: var(--dim); margin-left: 4px; }

/* Buttons */
.btn { padding: 14px 20px; font-size: 15px; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; letter-spacing: 0.3px; width: 100%; display: block; transition: opacity 0.15s; }
.btn:active { opacity: 0.8; }
.btn-gold { background: var(--gold); color: var(--bg); }
.btn-dark { background: var(--card-border); color: var(--text); }
.btn-red { background: #2a1a1a; color: var(--red); border: 1px solid #3a2020; }
.btn-sm { padding: 7px 14px; font-size: 11px; width: auto; display: inline-block; border-radius: 6px; }

/* Chips */
.chip { display: inline-block; font-size: 10px; padding: 3px 7px; border-radius: 4px; background: var(--input-bg); color: var(--muted); margin: 0 3px 3px 0; }

/* Exercise row in home preview */
.preview-row { padding: 6px 0; border-bottom: 1px solid #1a1c24; display: flex; justify-content: space-between; align-items: flex-start; }
.preview-row:last-child { border-bottom: none; }

/* History expand */
.hist-detail { margin-top: 10px; }
.hist-ex { padding: 6px 0; border-bottom: 1px solid #1a1c24; }

/* Settings row */
.setting-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--card-border); }

/* Prog rule */
.prog-rule { font-size: 10px; color: var(--dim); font-style: italic; margin-top: 6px; }

/* Scrollable */
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }

/* Plate table */
.plate-table-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border-radius: 6px; margin-bottom: 2px; }
.plate-table-row:nth-child(odd) { background: var(--card); }
</style>
</head>
<body>

<div class="header">
  <h1>RACK-FREE TRACKER</h1>
  <small>11kg bar · 4×10 · 4×5 · 2×2.5 · 4×1 · KB 32/20</small>
</div>

<div class="nav" id="nav"></div>
<div id="app"></div>

<script>
// ═══════════════════════════════════════════════════════════
// EQUIPMENT
// ═══════════════════════════════════════════════════════════
const BAR = 11;
const PLATES = [{w:10,q:4},{w:5,q:4},{w:2.5,q:2},{w:1,q:4}];
const VALID = (()=>{const s=new Set();
  for(let a=0;a<=2;a++)for(let b=0;b<=2;b++)for(let c=0;c<=1;c++)for(let d=0;d<=2;d++)
    s.add(BAR+2*(a*10+b*5+c*2.5+d*1));
  return[...s].sort((a,b)=>a-b)})();

function perSide(t){let r=(t-BAR)/2;if(r<0)return null;const o=[];
  for(const p of PLATES){const m=p.q/2;let c=Math.min(Math.floor(r/p.w),m);
    if(c>0){o.push({w:p.w,c});r-=c*p.w}}return Math.abs(r)<.01?o:null}

function fmtPlates(t){if(t<=BAR)return'Bar only';const p=perSide(t);
  return p?p.map(x=>`${x.c}×${x.w%1?x.w:x.w|0}kg`).join(' + '):'—'}

function nextUp(cur){for(const w of VALID)if(w>cur)return w;return cur}
function prevDown(cur){for(let i=VALID.length-1;i>=0;i--)if(VALID[i]<cur)return VALID[i];return cur}

// ═══════════════════════════════════════════════════════════
// PROGRAM
// ═══════════════════════════════════════════════════════════
const PROG={
A:[
  {id:'deadlift',name:'Deadlift',sets:3,reps:'5',rest:'3 min',rir:'1-2',type:'bb',rule:'Hit 3×5 → next weight',tgt:5},
  {id:'pullup_a',name:'Pull-ups (Wide)',sets:4,reps:'4-8',rest:'2-3 min',rir:'1-2',type:'band',rule:'4×8 → thinner band'},
  {id:'floor_press',name:'Floor Press',sets:3,reps:'8-10',rest:'2 min',rir:'2',type:'bb',rule:'Hit 3×10 → next weight',tgt:10},
  {id:'zercher_a',name:'Zercher Squat',sets:3,reps:'6-8',rest:'2 min',rir:'2',type:'bb',rule:'Hit 3×8 → next weight',tgt:8},
  {id:'face_pull',name:'Face Pull',sets:3,reps:'15-20',rest:'60s',rir:'2-3',type:'band',rule:'3×20 → heavier band'},
  {id:'leg_raise',name:'Floor Leg Raise',sets:3,reps:'10-15',rest:'60s',rir:'2',type:'bw',rule:'+reps → +weight → slow eccentric'},
],
B:[
  {id:'zercher_b',name:'Zercher Squat (Heavy)',sets:4,reps:'5-6',rest:'3-4 min',rir:'1-2',type:'bb',rule:'Hit 4×6 → next weight',tgt:6},
  {id:'ohp',name:'Barbell OHP',sets:3,reps:'5-7',rest:'2-3 min',rir:'1-2',type:'bb',rule:'Hit 3×7 → next weight (slow lift!)',tgt:7},
  {id:'dips',name:'Dips',sets:4,reps:'4-8',rest:'2-3 min',rir:'1-2',type:'band',rule:'4×8 → thinner band'},
  {id:'bb_row',name:'Barbell Row',sets:3,reps:'8-10',rest:'2 min',rir:'2',type:'bb',rule:'Hit 3×10 → next weight',tgt:10},
  {id:'kb_swing',name:'KB Swing',sets:3,reps:'12-15',rest:'90s',rir:'2-3',type:'kb',rule:'20kg → 32kg → single-arm'},
  {id:'pallof',name:'Pallof Press',sets:3,reps:'10/side',rest:'60s',rir:'2',type:'band',rule:'Heavier band → step-out → overhead'},
],
C:[
  {id:'rdl',name:'Romanian DL',sets:3,reps:'8-10',rest:'2 min',rir:'2',type:'bb',rule:'Hit 3×10 → next weight',tgt:10},
  {id:'split_squat',name:'Split Squat',sets:3,reps:'10/leg',rest:'90s',rir:'2',type:'bw',rule:'BW → 20kg bag → 30kg bag → Zercher'},
  {id:'pushups',name:'Push-ups',sets:4,reps:'8-15',rest:'90s',rir:'1-2',type:'bw',rule:'4×15 → advance variation'},
  {id:'pullup_c',name:'Pull-ups (Volume)',sets:3,reps:'6-10',rest:'2 min',rir:'2-3',type:'band',rule:'One band easier than Day A'},
  {id:'kb_press',name:'KB Press',sets:3,reps:'10/arm',rest:'60s',rir:'2',type:'kb',rule:'Increase KB or add reps'},
  {id:'carry',name:'Loaded Carry',sets:3,reps:'40m',rest:'90s',rir:'—',type:'carry',rule:'Increase load or distance'},
  {id:'arms',name:'Arms (Curl/Ext)',sets:2,reps:'12-15',rest:'60s',rir:'2',type:'kb',rule:'+reps → +weight'},
]};

const BANDS=['Green (heaviest)','Blue','Purple','Red','Purple+Red','Red+Black','Black','None'];

const SEED={sessions:[
  {id:'s1',date:'2026-02-26',day:'A',ex:[
    {id:'deadlift',wt:41,reps:[8,7,7],band:'',notes:'Finding week. 2×10+2×5'},
    {id:'pullup_a',wt:null,reps:[6,5,5,4],band:'Blue',notes:'Wide grip'},
    {id:'floor_press',wt:26,reps:[8,8,8],band:'',notes:'2×5+2×2.5. Did 4 sets by mistake'},
    {id:'face_pull',wt:null,reps:[18,16,15],band:'Purple',notes:''},
    {id:'leg_raise',wt:5,reps:[12,10,10],band:'',notes:'5kg overhead'}]},
  {id:'s2',date:'2026-03-01',day:'A',ex:[
    {id:'deadlift',wt:46,reps:[6,6,6],band:'',notes:'2×10+2×5+2×2.5'},
    {id:'pullup_a',wt:null,reps:[5,5,4,4],band:'Green',notes:''},
    {id:'zercher_a',wt:28,reps:[7,6,6],band:'',notes:'2×5+2×2.5+2×1'}]},
  {id:'s3',date:'2026-03-04',day:'A',ex:[
    {id:'deadlift',wt:46,reps:[1,1,1],band:'',notes:'Heavy singles'},
    {id:'floor_press',wt:26,reps:[8,8,8],band:'',notes:''},
    {id:'zercher_a',wt:21,reps:[8,7,6],band:'',notes:'2×5'}]},
  {id:'s4',date:'2026-03-06',day:'B',ex:[
    {id:'zercher_b',wt:26,reps:[6,6,5,5],band:'',notes:'2×5+2×2.5'},
    {id:'ohp',wt:16,reps:[7,6,5],band:'',notes:'Ramped cautiously'}]},
  {id:'s5',date:'2026-03-10',day:'B',ex:[
    {id:'zercher_b',wt:31,reps:[6,6,6,5],band:'',notes:'Too light → going up'},
    {id:'ohp',wt:21,reps:[6,5,5],band:'',notes:''},
    {id:'dips',wt:null,reps:[6,5,5,4],band:'Purple+Red',notes:''},
    {id:'bb_row',wt:30,reps:[10,9,8],band:'',notes:''}]},
  {id:'s6',date:'2026-03-14',day:'C',ex:[
    {id:'rdl',wt:46,reps:[8,8,8],band:'',notes:'2×10+2×5+2×2.5'}]},
],nextDay:'A'};

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
const STORE_KEY='rft-v3';
let DATA, VIEW='home', ACTIVE_DAY=null, LOG={}, EXPANDED=null;

function load(){
  try{const s=localStorage.getItem(STORE_KEY);DATA=s?JSON.parse(s):JSON.parse(JSON.stringify(SEED))}
  catch(e){DATA=JSON.parse(JSON.stringify(SEED))}
}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(DATA))}catch(e){}}

function getLast(exId){
  for(let i=DATA.sessions.length-1;i>=0;i--){
    const e=DATA.sessions[i].ex.find(x=>x.id===exId);
    if(e)return{...e,date:DATA.sessions[i].date,day:DATA.sessions[i].day}}return null}

function getSugg(ex,last){
  if(!last)return{text:'First time — find your weight',type:'new',wt:null};
  if(ex.type==='bb'&&last.wt){
    const v=last.reps.filter(r=>r>0),all=v.length>=ex.sets&&v.slice(0,ex.sets).every(r=>r>=ex.tgt);
    if(all){const n=nextUp(last.wt);return{text:`↑ ${n}kg`,type:'up',wt:n}}
    return{text:`→ ${last.wt}kg`,type:'stay',wt:last.wt}}
  if(ex.type==='band')return{text:last.band||'Check band',type:'stay',wt:null};
  return{text:last.wt?`${last.wt}kg`:'Continue',type:'stay',wt:last.wt}}

function fmtDate(d){return new Date(d+'T00:00:00').toLocaleDateString('en-NZ',{weekday:'short',day:'numeric',month:'short'})}
function daysAgo(d){const diff=Math.floor((new Date()-new Date(d+'T00:00:00'))/864e5);
  return diff===0?'Today':diff===1?'Yesterday':`${diff}d ago`}
function today(){return new Date().toISOString().split('T')[0]}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

// ═══════════════════════════════════════════════════════════
// PLATE HTML
// ═══════════════════════════════════════════════════════════
function plateHTML(total){
  if(!total||total<=BAR)return'';
  const ps=perSide(total);if(!ps||!ps.length)return'';
  let h='<div class="plates"><span class="plates-label">/side:</span>';
  for(const p of ps)for(let i=0;i<p.c;i++){
    const cls=p.w>=10?'plate-10':p.w>=5?'plate-5':p.w>=2.5?'plate-2':'plate-1';
    h+=`<div class="plate ${cls}">${p.w%1?p.w:p.w|0}</div>`}
  h+=`<span class="plates-total">= ${total}kg</span></div>`;return h}

// ═══════════════════════════════════════════════════════════
// RENDER ENGINE
// ═══════════════════════════════════════════════════════════
function render(){
  // Nav
  const navEl=document.getElementById('nav');
  if(VIEW==='workout'){navEl.innerHTML=''}
  else{
    const tabs=[['home','NEXT UP'],['history','HISTORY'],['plates','PLATES'],['settings','⚙']];
    navEl.innerHTML=tabs.map(([v,l])=>
      `<button class="${VIEW===v?'active':''}" onclick="go('${v}')">${l}</button>`).join('')}

  const app=document.getElementById('app');
  if(VIEW==='home')renderHome(app);
  else if(VIEW==='workout')renderWorkout(app);
  else if(VIEW==='history')renderHistory(app);
  else if(VIEW==='plates')renderPlates(app);
  else if(VIEW==='settings')renderSettings(app);
}

function go(v){VIEW=v;EXPANDED=null;render();window.scrollTo(0,0)}

// ─── HOME ────────────────────────────────────────────────
function renderHome(el){
  const nd=DATA.nextDay||'A', exs=PROG[nd];
  let h=`<div class="section"><div class="card card-hl"><div class="label">NEXT WORKOUT</div>
    <div style="display:flex;align-items:center;gap:10px;margin:6px 0 10px">
      <span class="badge badge-${nd.toLowerCase()}">DAY ${nd}</span>
      <span class="muted" style="font-size:11px">${DATA.sessions.length} sessions logged</span></div>`;

  for(const ex of exs){
    const last=getLast(ex.id),sugg=getSugg(ex,last);
    h+=`<div class="preview-row"><div>
      <span style="font-size:13px;color:var(--text);font-weight:500">${esc(ex.name)}</span>
      <span class="muted" style="margin-left:6px;font-size:10px">${ex.sets}×${ex.reps}</span></div>
      <div style="text-align:right;flex-shrink:0">`;
    if(sugg.type==='up')h+=`<span style="font-size:11px;color:var(--green);font-weight:600">${sugg.text}</span>`;
    else if(sugg.type==='stay')h+=`<span style="font-size:11px;color:var(--gold)">${sugg.text}</span>`;
    else h+=`<span style="font-size:11px;color:var(--blue)">NEW</span>`;
    h+=`</div></div>`;
    if(ex.type==='bb'&&sugg.wt)h+=`<div style="font-size:9px;color:var(--dim);margin:-2px 0 2px;padding-left:2px">Load /side: ${esc(fmtPlates(sugg.wt))}</div>`;
  }

  h+=`<button class="btn btn-gold" style="margin-top:14px" onclick="startWorkout('${nd}')">START DAY ${nd}</button></div>`;

  // Other days
  h+=`<div style="display:flex;gap:8px;margin-bottom:16px">`;
  for(const d of['A','B','C'])if(d!==nd)
    h+=`<button class="btn btn-dark" style="flex:1;font-size:12px;padding:10px 0" onclick="startWorkout('${d}')">DAY ${d}</button>`;
  h+=`</div>`;

  // Recent
  const recent=[...DATA.sessions].reverse().slice(0,6);
  if(recent.length){
    h+=`<div class="label" style="margin-bottom:8px">RECENT SESSIONS</div>`;
    for(const s of recent){
      h+=`<div class="card"><div style="display:flex;align-items:center;gap:8px">
        <span class="badge badge-${s.day.toLowerCase()}">DAY ${s.day}</span>
        <span style="font-size:11px;color:#999">${fmtDate(s.date)}</span>
        <span style="font-size:10px;color:var(--dim)">${daysAgo(s.date)}</span></div>
        <div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:3px">`;
      for(const e of s.ex){
        const def=[...PROG.A,...PROG.B,...PROG.C].find(p=>p.id===e.id);
        const maxR=Math.max(...e.reps.filter(r=>r>0));
        h+=`<span class="chip">${esc(def?.name||e.id)}: ${e.wt?e.wt+'kg':''}${e.band||''}${maxR>0?' ×'+maxR:''}</span>`}
      h+=`</div></div>`}}
  h+=`</div>`;
  el.innerHTML=h;
}

// ─── START WORKOUT ───────────────────────────────────────
function startWorkout(day){
  ACTIVE_DAY=day;LOG={};
  for(const ex of PROG[day]){
    const last=getLast(ex.id),sugg=getSugg(ex,last);
    LOG[ex.id]={wt:sugg.wt||last?.wt||(ex.type==='bb'?BAR:''),band:last?.band||'',
      reps:Array(ex.sets).fill(''),notes:''}}
  VIEW='workout';render();window.scrollTo(0,0);
}

// ─── WORKOUT ─────────────────────────────────────────────
function renderWorkout(el){
  const exs=PROG[ACTIVE_DAY];
  const filled=Object.values(LOG).filter(v=>v.reps.some(r=>r!==''&&r>0)).length;

  let h=`<div class="section">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:10px">
        <span class="badge badge-${ACTIVE_DAY.toLowerCase()}">DAY ${ACTIVE_DAY}</span>
        <span class="muted">${filled}/${exs.length}</span></div>
      <button class="btn btn-dark btn-sm" onclick="cancelWorkout()">✕ CANCEL</button></div>`;

  for(const ex of exs){
    const last=getLast(ex.id),sugg=getSugg(ex,last);
    const log=LOG[ex.id];

    h+=`<div class="ex-card"><div class="ex-name">${esc(ex.name)}</div>
      <div class="ex-meta">${ex.sets}×${ex.reps} · Rest ${ex.rest} · RIR ${ex.rir}</div>
      <div class="sugg sugg-${sugg.type==='up'?'up':sugg.type==='new'?'new':'stay'}">${esc(sugg.text)}</div>`;

    // Last session
    if(last)h+=`<div class="dim" style="margin-bottom:8px">Last (${fmtDate(last.date)}): ${last.wt?last.wt+'kg':''}${last.band?' '+last.band:''} [${last.reps.join(',')}]</div>`;

    // Weight input
    if(ex.type==='bb'){
      const cur=Number(log.wt)||BAR;
      const idx=VALID.indexOf(cur);
      h+=`<div class="stepper" style="margin-bottom:4px">
        <div class="stepper-btn ${idx<=0?'disabled':''}" onclick="stepWt('${ex.id}',-1)">−</div>
        <div class="stepper-val">${cur}<span>kg</span></div>
        <div class="stepper-btn ${idx>=VALID.length-1?'disabled':''}" onclick="stepWt('${ex.id}',1)">+</div></div>`;
      h+=plateHTML(cur);
      h+=`<div style="font-size:9px;color:var(--dim);margin-bottom:6px">/side: ${esc(fmtPlates(cur))}</div>`;
    } else if(ex.type==='band'){
      h+=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
        <span style="font-size:11px;color:var(--muted)">Band:</span>
        <select class="band-select" onchange="setLog('${ex.id}','band',this.value)">
          <option value="">Select...</option>${BANDS.map(b=>`<option value="${esc(b)}"${log.band===b?' selected':''}>${esc(b)}</option>`).join('')}
        </select></div>`;
    } else {
      h+=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
        <span style="font-size:11px;color:var(--muted)">Load:</span>
        <input type="number" class="rep-input" style="width:58px" value="${log.wt}" placeholder="—" onchange="setLog('${ex.id}','wt',this.value)">
        <span style="font-size:10px;color:var(--dim)">kg</span>
        ${ex.type==='kb'?'<span style="font-size:9px;color:var(--dim);margin-left:4px">KBs: 20 / 32</span>':''}
      </div>`}

    // Reps
    h+=`<div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:4px">
      <span style="font-size:10px;color:var(--muted)">Reps:</span>`;
    for(let i=0;i<ex.sets;i++)
      h+=`<div style="text-align:center"><div style="font-size:8px;color:var(--dim);margin-bottom:1px">S${i+1}</div>
        <input type="number" class="rep-input" value="${log.reps[i]}" placeholder="—"
          oninput="setRep('${ex.id}',${i},this.value)" inputmode="numeric"></div>`;
    h+=`</div>`;

    // Notes
    h+=`<input type="text" class="note-input" value="${esc(log.notes)}" placeholder="Notes..."
      onchange="setLog('${ex.id}','notes',this.value)">`;
    h+=`<div class="prog-rule">${esc(ex.rule)}</div></div>`;
  }

  h+=`<button class="btn btn-gold" style="margin-top:10px" onclick="finishWorkout()">FINISH & SAVE</button></div>`;
  el.innerHTML=h;
}

function stepWt(exId,dir){
  const cur=Number(LOG[exId].wt)||BAR;
  const idx=VALID.indexOf(cur);
  if(dir<0&&idx>0)LOG[exId].wt=VALID[idx-1];
  if(dir>0&&idx<VALID.length-1)LOG[exId].wt=VALID[idx+1];
  render();
}
function setLog(exId,field,val){LOG[exId][field]=val}
function setRep(exId,idx,val){LOG[exId].reps[idx]=val}

function finishWorkout(){
  const exs=Object.entries(LOG).filter(([,v])=>v.reps.some(r=>r!==''&&r>0))
    .map(([id,v])=>({id,wt:v.wt?Number(v.wt):null,reps:v.reps.map(r=>r===''?0:Number(r)),
      band:v.band||'',notes:v.notes}));
  if(!exs.length){if(!confirm('No exercises logged. Save empty session?'))return}
  const nxt={A:'B',B:'C',C:'A'};
  DATA.sessions.push({id:'s'+Date.now(),date:today(),day:ACTIVE_DAY,ex:exs});
  DATA.nextDay=nxt[ACTIVE_DAY];save();
  ACTIVE_DAY=null;LOG={};go('home');
}
function cancelWorkout(){if(confirm('Discard this workout?')){ACTIVE_DAY=null;LOG={};go('home')}}

// ─── HISTORY ─────────────────────────────────────────────
function renderHistory(el){
  const sessions=[...DATA.sessions].reverse();
  let h=`<div class="section"><div class="label" style="margin-bottom:12px">ALL SESSIONS (${sessions.length})</div>`;
  for(const s of sessions){
    const isExp=EXPANDED===s.id;
    h+=`<div class="card" onclick="toggleExpand('${s.id}')">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="badge badge-${s.day.toLowerCase()}">DAY ${s.day}</span>
          <span style="font-size:11px;color:#999">${fmtDate(s.date)}</span></div>
        <span class="dim">${daysAgo(s.date)}</span></div>`;
    if(isExp){
      h+=`<div class="hist-detail">`;
      for(const e of s.ex){
        const def=[...PROG.A,...PROG.B,...PROG.C].find(p=>p.id===e.id);
        h+=`<div class="hist-ex"><div style="font-size:13px;font-weight:600;color:var(--text)">${esc(def?.name||e.id)}</div>
          <div style="font-size:12px;color:var(--muted)">${e.wt?e.wt+'kg':''}${e.band?' '+e.band:''} [${e.reps.join(',')}]
          ${e.notes?'<span style="color:var(--dim)"> — '+esc(e.notes)+'</span>':''}</div>`;
        if(e.wt&&e.wt>BAR)h+=plateHTML(e.wt);
        h+=`</div>`}
      h+=`<button class="btn btn-red btn-sm" style="margin-top:8px" onclick="event.stopPropagation();delSession('${s.id}')">DELETE</button></div>`}
    h+=`</div>`}
  h+=`</div>`;el.innerHTML=h;
}
function toggleExpand(id){EXPANDED=EXPANDED===id?null:id;render()}
function delSession(id){if(!confirm('Delete this session?')){return}
  DATA.sessions=DATA.sessions.filter(s=>s.id!==id);
  if(DATA.sessions.length){const l=DATA.sessions[DATA.sessions.length-1].day;DATA.nextDay={A:'B',B:'C',C:'A'}[l]}
  else DATA.nextDay='A';save();render()}

// ─── PLATES ──────────────────────────────────────────────
function renderPlates(el){
  let h=`<div class="section"><div class="label" style="margin-bottom:12px">ALL VALID WEIGHTS (${VALID.length})</div>`;
  let prev=null;
  for(const w of VALID){
    const jump=prev!==null?`+${(w-prev)}kg`:'';
    h+=`<div class="plate-table-row"><div>
      <span style="font-size:15px;font-weight:700;color:#fff">${w}</span>
      <span style="font-size:10px;color:var(--dim)">kg</span></div>
      <div style="text-align:right">
        <div style="font-size:10px;color:var(--muted)">${esc(fmtPlates(w))}</div>
        ${jump?`<div style="font-size:9px;color:var(--green)">${jump}</div>`:''}
      </div></div>`;prev=w}
  h+=`</div>`;el.innerHTML=h;
}

// ─── SETTINGS ────────────────────────────────────────────
function renderSettings(el){
  const dataStr=JSON.stringify(DATA,null,2);
  const size=(new Blob([dataStr])).size;
  let h=`<div class="section">
    <div class="label" style="margin-bottom:12px">DATA & SETTINGS</div>
    <div class="card">
      <div style="font-size:12px;color:var(--text);line-height:1.8">
        <div><span style="color:var(--gold)">Sessions:</span> ${DATA.sessions.length}</div>
        <div><span style="color:var(--gold)">Next day:</span> ${DATA.nextDay}</div>
        <div><span style="color:var(--gold)">Data size:</span> ${(size/1024).toFixed(1)} KB</div>
      </div>
    </div>
    <div class="label" style="margin-top:16px;margin-bottom:8px">EQUIPMENT</div>
    <div class="card">
      <div style="font-size:12px;color:#999;line-height:1.8">
        <div><span style="color:var(--gold)">Bar:</span> 11kg (1.8m Olympic, no bearings)</div>
        <div><span style="color:var(--p10)">10kg</span> ×4 · <span style="color:var(--p5)">5kg</span> ×4 · <span style="color:var(--p2)">2.5kg</span> ×2 · <span style="color:var(--p1)">1kg</span> ×4</div>
        <div>Range: ${VALID[0]}–${VALID[VALID.length-1]}kg (${VALID.length} combos)</div>
        <div style="margin-top:4px"><span style="color:var(--gold)">KBs:</span> 32kg (fixed) · 20kg (adjustable)</div>
      </div>
    </div>
    <div class="label" style="margin-top:16px;margin-bottom:8px">BACKUP</div>
    <button class="btn btn-dark" style="margin-bottom:8px" onclick="exportData()">↓ EXPORT DATA (JSON)</button>
    <div style="margin-bottom:8px">
      <label class="btn btn-dark" style="text-align:center;cursor:pointer;display:block">
        ↑ IMPORT DATA (JSON)
        <input type="file" accept=".json" style="display:none" onchange="importData(event)">
      </label>
    </div>
    <div class="label" style="margin-top:16px;margin-bottom:8px">DANGER ZONE</div>
    <button class="btn btn-red" style="margin-bottom:6px" onclick="resetData()">RESET TO ORIGINAL DATA</button>
    <div class="dim" style="font-size:9px">Restores your initial logged sessions</div>

    <div class="label" style="margin-top:24px;margin-bottom:8px">BAND ORDER (most → least help)</div>
    <div class="card">
      <div style="font-size:12px;color:var(--muted);line-height:2">
        ${BANDS.map((b,i)=>`<span style="color:${i<3?'var(--green)':i<5?'var(--gold)':'var(--text)'}">${esc(b)}</span>`).join(' → ')}
      </div>
    </div>

    <div class="label" style="margin-top:16px;margin-bottom:8px">PROGRESSION RULES</div>
    <div class="card">
      <div style="font-size:12px;line-height:1.7">
        <div style="color:var(--green);font-weight:600;margin-bottom:4px">↑ INCREASE</div>
        <div style="color:var(--muted);margin-bottom:10px">Hit top of rep range on ALL prescribed sets → next valid weight up</div>
        <div style="color:var(--gold);font-weight:600;margin-bottom:4px">→ MAINTAIN</div>
        <div style="color:var(--muted);margin-bottom:10px">Within range but not all sets at top → same weight, push for more reps</div>
        <div style="color:var(--orange);font-weight:600;margin-bottom:4px">⟳ GRIND</div>
        <div style="color:var(--muted);margin-bottom:10px">Bottom of range or mixed results → same weight, focus form. 3× stall → drop one step</div>
        <div style="color:var(--red);font-weight:600;margin-bottom:4px">↓ REDUCE</div>
        <div style="color:var(--muted);margin-bottom:10px">Missed minimum on 2+ sets → drop one weight step</div>
        <div style="color:var(--text);font-weight:600;margin-top:12px;margin-bottom:4px">FALLBACK (can't add weight)</div>
        <div style="color:var(--muted)">More reps → 2s pause → 3s eccentric → +1 set</div>
      </div>
    </div>
  </div>`;
  el.innerHTML=h;
}

function exportData(){
  const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`workout-backup-${today()}.json`;a.click();URL.revokeObjectURL(a.href)}

function importData(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{const d=JSON.parse(e.target.result);
      if(!d.sessions||!d.nextDay)throw new Error('Invalid format');
      if(!confirm(`Import ${d.sessions.length} sessions? This will replace all current data.`))return;
      DATA=d;save();render();
    }catch(err){alert('Invalid file: '+err.message)}};
  reader.readAsText(file);event.target.value=''}

function resetData(){
  if(!confirm('Reset all data to your original logged sessions?'))return;
  DATA=JSON.parse(JSON.stringify(SEED));save();go('home')}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
load();render();

// PWA: Register service worker from inline blob
if('serviceWorker' in navigator){
  const swCode=`self.addEventListener('install',e=>self.skipWaiting());
    self.addEventListener('activate',e=>e.waitUntil(clients.claim()));
    self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>new Response('Offline'))))});`;
  const swBlob=new Blob([swCode],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
}

// PWA: Manifest
const manifest={name:'Rack-Free Tracker',short_name:'Tracker',start_url:'.',display:'standalone',
  background_color:'#0c0d10',theme_color:'#0c0d10',
  icons:[{src:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%230c0d10" width="100" height="100" rx="20"/><text x="50" y="65" text-anchor="middle" font-size="50">🏋️</text></svg>',
    sizes:'any',type:'image/svg+xml'}]};
const mBlob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
const mLink=document.createElement('link');mLink.rel='manifest';mLink.href=URL.createObjectURL(mBlob);
document.head.appendChild(mLink);
</script>
</body>
