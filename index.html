<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tracker">
<meta name="theme-color" content="#f5f6f8">
<meta name="mobile-web-app-capable" content="yes">
<title>Rack-Free Tracker v12</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
<style>
:root{--bg:#f5f6f8;--cd:#fff;--cb:#e2e8f0;--ib:#f0f2f5;--ibr:#d5dce6;--tx:#1e293b;--mu:#8594a7;--dm:#a8b5c4;
--pr:#4a6fa5;--prl:#e8eef6;--gr:#2d8a6e;--grl:#e6f5ef;--am:#b8862d;--aml:#faf3e6;--rd:#c45050;--rdl:#fce8e8;
--pu:#7c6aad;--pul:#f0ecf7;--bl:#3b82c4;--bll:#e5f3ff;
--p10:#c44040;--p5:#4a6fa5;--p25:#2d8a6e;--p1:#8594a7;
--sh:0 1px 3px rgba(0,0,0,.06);--shm:0 4px 12px rgba(0,0,0,.08);--sab:env(safe-area-inset-bottom,0px);
--rad:12px;--rad-sm:8px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body{max-width:480px;margin:0 auto;padding-bottom:calc(20px + var(--sab))}
input,select,button,textarea{font-family:inherit}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}

/* Layout */
.hdr{padding:12px 16px 8px;background:#fff;border-bottom:1px solid var(--cb);position:sticky;top:0;z-index:100;box-shadow:var(--sh)}
.hdr h1{font-size:14px;font-weight:700;color:var(--pr);letter-spacing:.5px}
.nav{display:flex;background:#fff;position:sticky;top:44px;z-index:99;box-shadow:var(--sh)}
.nav button{flex:1;padding:10px 0;font-size:10px;font-weight:600;border:none;border-bottom:2px solid transparent;background:0;color:var(--mu);cursor:pointer;letter-spacing:.3px}
.nav button.a{color:var(--pr);border-bottom-color:var(--pr)}
.sec{padding:12px 14px}

/* Cards */
.cd{background:var(--cd);border-radius:var(--rad);padding:12px 14px;margin-bottom:8px;box-shadow:var(--sh)}

/* Type */
.lb{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;font-weight:600}
.mu{font-size:12px;color:var(--mu)}.dm{font-size:11px;color:var(--dm)}

/* Badges */
.bg{display:inline-block;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700;letter-spacing:.5px}
.bg-a{background:var(--prl);color:var(--pr)}.bg-b{background:var(--bll);color:var(--bl)}.bg-c{background:var(--grl);color:var(--gr)}.bg-d{background:var(--aml);color:var(--am)}
.sg{font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px;display:inline-block}
.sg-up{color:var(--gr);background:var(--grl)}.sg-st{color:var(--am);background:var(--aml)}.sg-nw{color:var(--pr);background:var(--prl)}
.sg-dn{color:var(--rd);background:var(--rdl)}.sg-cf{color:var(--bl);background:var(--bll)}
.wk-1{background:var(--prl);color:var(--pr)}.wk-2{background:var(--pul);color:var(--pu)}
.regress{font-size:10px;color:var(--rd);padding:2px 6px;background:var(--rdl);border-radius:5px;display:inline-block}
.pr-badge{font-size:10px;font-weight:700;color:var(--am);background:var(--aml);padding:2px 8px;border-radius:5px}
.max-badge{font-size:9px;font-weight:700;color:var(--rd);background:var(--rdl);padding:2px 6px;border-radius:4px;margin-left:4px}
.cue{font-size:12px;color:var(--pr);padding:8px 12px;background:var(--prl);border-radius:var(--rad-sm);margin:6px 0;border-left:3px solid var(--pr)}

/* Inputs */
.ri{width:52px;height:52px;font-size:20px;font-weight:700;background:var(--ib);border:2px solid var(--ibr);border-radius:var(--rad);color:var(--tx);text-align:center;outline:none;transition:.15s}
.ri:focus{border-color:var(--pr);background:#fff;box-shadow:0 0 0 3px rgba(74,111,165,.12)}
.ri.pf{color:var(--dm)}.ri.done{border-color:var(--gr);background:var(--grl);color:var(--gr)}
.ni{width:100%;padding:8px 10px;font-size:12px;background:var(--ib);border:1px solid var(--ibr);border-radius:var(--rad-sm);color:var(--mu);outline:none}
.ni:focus{border-color:var(--pr);color:var(--tx);background:#fff}
.bs{padding:8px 10px;font-size:12px;background:var(--ib);border:1px solid var(--ibr);border-radius:var(--rad-sm);color:var(--tx);outline:none;width:100%}
.body-input{width:80px;padding:10px;font-size:16px;background:var(--ib);border:1px solid var(--ibr);border-radius:var(--rad);color:var(--tx);text-align:center;outline:none;font-weight:600}
.body-input:focus{border-color:var(--pr);background:#fff}
.sess-note{width:100%;padding:8px 10px;font-size:12px;background:var(--ib);border:1px solid var(--ibr);border-radius:var(--rad-sm);color:var(--tx);outline:none;resize:none;min-height:36px;font-family:inherit}
.sess-note:focus{border-color:var(--pr);background:#fff}

/* Weight stepper */
.stp{display:flex;align-items:center;gap:6px;justify-content:center}
.stp-b{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:var(--rad);border:1px solid var(--ibr);background:var(--ib);color:var(--tx);font-size:22px;font-weight:700;cursor:pointer;user-select:none}
.stp-b:active{background:var(--cb);transform:scale(.95)}.stp-b.dis{color:var(--dm)}
.stp-v{min-width:80px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:var(--rad);background:#fff;border:2px solid var(--pr);font-size:20px;font-weight:800;color:var(--pr)}
.stp-v span{font-size:10px;color:var(--mu);margin-left:3px;font-weight:500}
.pls{display:flex;align-items:center;gap:3px;padding:3px 0;justify-content:center}
.pl{height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff}
.pl-10{background:var(--p10);width:22px}.pl-5{background:var(--p5);width:18px}.pl-2{background:var(--p25);width:16px}.pl-1{background:var(--p1);width:12px}

/* Buttons */
.btn{padding:14px 20px;font-size:15px;font-weight:700;border:none;border-radius:var(--rad);cursor:pointer;width:100%;display:block;transition:.15s}
.btn:active{transform:scale(.98);opacity:.9}
.btn-pr{background:var(--pr);color:#fff;box-shadow:0 2px 8px rgba(74,111,165,.2)}
.btn-wh{background:#fff;color:var(--tx);border:1px solid var(--cb);box-shadow:var(--sh)}
.btn-rd{background:var(--rdl);color:var(--rd);border:1px solid #e5bfbf}
.btn-sm{padding:6px 12px;font-size:11px;width:auto;display:inline-block;border-radius:var(--rad-sm);font-weight:600}
.btn-ghost{background:0;border:none;color:var(--pr);font-weight:600;padding:6px 10px;font-size:12px}

/* Bars */
.fg-bar{height:5px;border-radius:3px;background:var(--ib);overflow:hidden;margin:4px 0}
.fg-fill{height:100%;border-radius:3px;transition:.3s}
.prog-strip{display:flex;gap:2px;margin:6px 0}
.prog-seg{flex:1;height:5px;border-radius:3px;background:var(--ib);transition:.3s}
.prog-seg.pg-done{background:var(--gr)}.prog-seg.pg-cur{background:var(--pr)}

/* Timer — compact floating pill */
.timer-pill{position:fixed;bottom:16px;right:16px;max-width:160px;background:#fff;border:2px solid var(--pr);border-radius:40px;padding:8px 14px;z-index:200;display:flex;align-items:center;gap:8px;box-shadow:0 4px 16px rgba(0,0,0,.15);font-variant-numeric:tabular-nums}
.timer-pill.done{border-color:var(--gr);background:var(--grl);animation:pulse .6s ease 2}
.timer-pill .t-time{font-size:18px;font-weight:800;color:var(--pr)}
.timer-pill.done .t-time{color:var(--gr)}
.timer-pill .t-x{width:28px;height:28px;border-radius:50%;border:none;background:var(--ib);color:var(--mu);font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.timer-pill .t-x:active{background:var(--cb)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

/* Banners */
.deload-banner{background:var(--aml);border:1px solid #e5d4b8;border-radius:var(--rad);padding:8px 12px;margin-bottom:8px;font-size:12px;color:var(--am)}

/* Workout list */
.ex-row{background:var(--cd);border-radius:var(--rad);padding:10px 12px;margin-bottom:6px;box-shadow:var(--sh);cursor:pointer;border:1.5px solid transparent;transition:border-color .2s,background .2s}
.ex-row.cur{border-color:var(--pr);box-shadow:var(--shm);cursor:default}
.ex-row.done-row{border-color:#2d8a6e;background:linear-gradient(135deg,#e6f5ef,#fff)}
.ex-row.upcoming{opacity:.55}
.ex-row.upcoming:active{opacity:.7}
.ex-expand{padding:10px 0 2px;margin-top:8px;border-top:1px solid var(--cb)}

/* Set tick */
.set-tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--ibr);background:var(--ib);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;transition:.15s;margin:4px auto 0}
.set-tick.done{background:var(--grl);border-color:var(--gr);color:var(--gr)}
.set-tick:active{transform:scale(.88)}

/* Warmup */
.wu-check{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--cb);cursor:pointer}
.wu-box{width:26px;height:26px;border-radius:var(--rad-sm);border:2px solid var(--ibr);background:var(--ib);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:.15s}
.wu-box.checked{background:var(--grl);border-color:var(--gr);color:var(--gr)}

/* Discomfort */
.disc-row{display:flex;gap:4px;justify-content:center;margin-top:6px}
.disc-btn{padding:5px 10px;border-radius:var(--rad-sm);border:1px solid var(--ibr);background:var(--ib);font-size:10px;font-weight:600;cursor:pointer;color:var(--mu)}
.disc-btn.sel-none{border-color:var(--gr);background:var(--grl);color:var(--gr)}
.disc-btn.sel-mild{border-color:var(--am);background:var(--aml);color:var(--am)}
.disc-btn.sel-mod{border-color:var(--rd);background:var(--rdl);color:var(--rd)}
.disc-joints{display:flex;gap:4px;justify-content:center;margin-top:4px;flex-wrap:wrap}
.disc-joint{padding:3px 8px;border-radius:5px;border:1px solid var(--ibr);background:var(--ib);font-size:10px;font-weight:600;cursor:pointer;color:var(--mu)}
.disc-joint.sel{border-color:var(--rd);background:var(--rdl);color:var(--rd)}

/* RPE scale */
.diff-btn{width:44px;height:44px;border-radius:50%;border:2px solid var(--ibr);background:var(--ib);font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.diff-btn.sel{border-color:var(--pr);background:var(--prl)}

/* Summary */
.summary-card{background:#fff;border-radius:16px;padding:20px;margin-bottom:12px;box-shadow:var(--shm);text-align:center}
.summary-num{font-size:26px;font-weight:800;color:var(--pr)}
.summary-label{font-size:9px;color:var(--mu);text-transform:uppercase;letter-spacing:.8px}

/* Hero start */
.start-hero{background:linear-gradient(135deg,#4a6fa5,#3a5a85);color:#fff;border-radius:14px;padding:18px;text-align:center;margin-bottom:10px;box-shadow:0 4px 16px rgba(58,90,133,.3)}
.start-hero h2{font-size:17px;font-weight:800;margin-bottom:2px}
.start-hero .meta{font-size:11px;opacity:.75;margin-bottom:12px}
.start-hero button{background:#fff;color:var(--pr);border:none;border-radius:10px;padding:12px 36px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.start-hero button:active{transform:scale(.97)}
.preview-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--cb);font-size:12px}
.preview-row:last-child{border:none}

/* Stats */
.ch{display:inline-block;font-size:9px;padding:2px 6px;border-radius:5px;background:var(--ib);color:var(--mu);margin:0 2px 3px 0;font-weight:500}
svg text{font-family:-apple-system,system-ui,sans-serif}
.hm-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.hm-cell{aspect-ratio:1;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--dm)}
.pr-tbl{width:100%}.pr-tbl td,.pr-tbl th{padding:5px 6px;text-align:left;font-size:11px;border-bottom:1px solid var(--cb)}
.pr-tbl th{color:var(--mu);font-size:9px;text-transform:uppercase;font-weight:600}
.ex-sel{width:100%;padding:10px;font-size:13px;background:var(--ib);border:1px solid var(--ibr);border-radius:var(--rad);color:var(--pr);font-weight:600;outline:none;margin-bottom:10px}
.warmup{background:var(--ib);border-radius:var(--rad-sm);padding:8px 10px;margin-bottom:6px;font-size:11px;color:var(--mu)}
.warmup-set{display:flex;justify-content:space-between;padding:2px 0}
.cardio-btn{padding:10px;border-radius:var(--rad-sm);border:1px solid var(--ibr);background:var(--ib);color:var(--tx);font-size:12px;font-weight:600;cursor:pointer;text-align:center}
.cardio-btn.sel{border-color:var(--gr);background:var(--grl);color:var(--gr)}
.phase-banner{background:var(--prl);border:1px solid #c5d4e8;border-radius:var(--rad);padding:8px 12px;margin-bottom:8px;font-size:11px;color:var(--pr);display:flex;justify-content:space-between;align-items:center}
.phase-bar{height:3px;border-radius:2px;background:var(--ib);overflow:hidden;flex:1;margin-left:10px}
.phase-fill{height:100%;border-radius:2px;background:var(--pr)}
</style>
</head>
<body>
<div class="hdr"><h1>RACK-FREE TRACKER</h1></div>
<div class="nav" id="nav"></div>
<div id="app"></div>
<div id="timer-root"></div>
<script>
// ═══════════════ EQUIPMENT ═══════════════
const BAR=11,MAX_BB=80,PL=[{w:10,q:4},{w:5,q:4},{w:2.5,q:2},{w:1,q:4}];
const VW=(()=>{const s=new Set();for(let a=0;a<=2;a++)for(let b=0;b<=2;b++)for(let c=0;c<=1;c++)for(let d=0;d<=2;d++)s.add(BAR+2*(a*10+b*5+c*2.5+d*1));return[...s].sort((a,b)=>a-b)})();
function perSide(t){let r=(t-BAR)/2;if(r<0)return null;const o=[];for(const p of PL){const m=p.q/2;let c=Math.min(Math.floor(r/p.w),m);if(c>0){o.push({w:p.w,c});r-=c*p.w}}return Math.abs(r)<.01?o:null}
function fmtPl(t){if(t<=BAR)return'Bar only';const p=perSide(t);return p?p.map(x=>`${x.c}×${x.w%1?x.w:x.w|0}kg`).join(' + '):'—'}
function nxUp(c){for(const w of VW)if(w>c)return w;return c}
function nxDn(c){for(let i=VW.length-1;i>=0;i--)if(VW[i]<c)return VW[i];return c}
function snapW(t){let b=VW[0];for(const w of VW)if(Math.abs(w-t)<Math.abs(b-t))b=w;return b}
function plateH(t){if(!t||t<=BAR)return'';const ps=perSide(t);if(!ps||!ps.length)return'';let h='<div class="pls">';for(const p of ps)for(let i=0;i<p.c;i++){const c=p.w>=10?'pl-10':p.w>=5?'pl-5':p.w>=2.5?'pl-2':'pl-1';h+=`<div class="pl ${c}">${p.w%1?p.w:p.w|0}</div>`}h+=`</div>`;return h}

// ═══════════════ PROGRAM — Phase-aware rep ranges ═══════════════
const PHASES={1:{name:'Linear',wk:8,desc:'Build strength. Add weight with confirmation sessions.',
  adj:{deadlift:{rp:'5',tg:5},hex_dl:{rp:'5',tg:5},b_stance_rdl:{rp:'8/side',tg:8},lm_sl_rdl:{rp:'8',tg:8},zercher_b:{rp:'5-6',tg:6},ohp:{rp:'5-7',tg:7},lm_press:{rp:'6-8',tg:8},floor_press:{rp:'8-10',tg:10},lm_floor_press:{rp:'8-10',tg:10},lm_squat:{rp:'8-10',tg:10},bb_row:{rp:'8-10',tg:10},meadows_row:{rp:'8-10',tg:10},rdl:{rp:'8-10',tg:10},hex_rdl:{rp:'8-10',tg:10},lateral_raise:{rp:'12-15',tg:15},kb_curl:{rp:'8-12',tg:12},band_pushdown:{rp:'10-12',tg:12},pallof_press:{rp:'10/side',tg:10},band_er:{rp:'15/side',tg:15}}},
2:{name:'Hypertrophy',wk:8,desc:'Higher reps, more volume. Weight drops ~15%.',
  adj:{deadlift:{rp:'8',tg:8},hex_dl:{rp:'8',tg:8},b_stance_rdl:{rp:'10/side',tg:10},lm_sl_rdl:{rp:'10',tg:10},zercher_b:{rp:'8',tg:8},ohp:{rp:'8-10',tg:10},lm_press:{rp:'8-10',tg:10},floor_press:{rp:'10-12',tg:12},lm_floor_press:{rp:'10-12',tg:12},lm_squat:{rp:'10-12',tg:12},bb_row:{rp:'10-12',tg:12},meadows_row:{rp:'10-12',tg:12},rdl:{rp:'10-12',tg:12},hex_rdl:{rp:'10-12',tg:12},lateral_raise:{rp:'15-20',tg:20},kb_curl:{rp:'10-15',tg:15},band_pushdown:{rp:'12-15',tg:15},pallof_press:{rp:'12/side',tg:12},band_er:{rp:'15-20/side',tg:20}}},
3:{name:'Strength',wk:8,desc:'Return to lower reps at higher weights.',
  adj:{deadlift:{rp:'3-5',tg:5},hex_dl:{rp:'3-5',tg:5},b_stance_rdl:{rp:'6/side',tg:6},lm_sl_rdl:{rp:'6-8',tg:8},zercher_b:{rp:'4-5',tg:5},ohp:{rp:'5-6',tg:6},lm_press:{rp:'5-6',tg:6},floor_press:{rp:'6-8',tg:8},lm_floor_press:{rp:'6-8',tg:8},lm_squat:{rp:'6-8',tg:8},bb_row:{rp:'6-8',tg:8},meadows_row:{rp:'6-8',tg:8},rdl:{rp:'6-8',tg:8},hex_rdl:{rp:'6-8',tg:8},lateral_raise:{rp:'10-12',tg:12},kb_curl:{rp:'6-10',tg:10},band_pushdown:{rp:'8-10',tg:10},pallof_press:{rp:'10/side',tg:10},band_er:{rp:'15/side',tg:15}}}};

const BASE_PR={A:[
{id:'deadlift',nm:'Deadlift',s:3,rp:'5',rst:'3:00',rir:'2',tp:'bb',rl:'Confirm → ↑ weight',tg:5,rstS:180,tempo:'3-1-2-0',isoWU:'Mid-pull hold 2×10s',perSide:false},
{id:'b_stance_rdl',nm:'B-Stance RDL',s:3,rp:'8/side',rst:'2:00',rir:'2',tp:'bb',rl:'Front foot 70%, back foot kickstand. Start at 60% of bilateral RDL.',tg:8,rstS:120,tempo:'3-1-2-0',isoWU:'Hinge hold at knee 2×10s',perSide:true},
{id:'pullup_a',nm:'Pull-ups (Wide)',s:4,rp:'4-8',rst:'2:30',rir:'1-2',tp:'band',rl:'4×8 → less assistance. Full ROM, control through bottom (no dead-hang).',tg:8,rstS:150,tempo:'3-1-2-1',bandMode:'assist',perSide:false},
{id:'floor_press',nm:'Floor Press',s:3,rp:'8-10',rst:'2:00',rir:'2',tp:'bb',rl:'Confirm → ↑ weight. Wrist wraps.',tg:10,rstS:120,tempo:'3-1-2-0',perSide:false},
{id:'face_pull',nm:'Face Pull',s:3,rp:'15-20',rst:'1:00',rir:'2-3',tp:'band',rl:'⚡ Superset with Dead Bugs. At max resistance — add pause/tempo.',tg:20,rstS:60,tempo:'2-1-2-1',bandMode:'resist',perSide:false},
{id:'dead_bugs_a',nm:'Dead Bugs (Loaded)',s:3,rp:'8/side',rst:'1:00',rir:'2',tp:'kb',rl:'⚡ Superset with Face Pull. Control first. Anti-extension focus.',tg:8,rstS:60,tempo:'3-0-3-1',perSide:true}],
B:[
{id:'zercher_b',nm:'Zercher Squat (Heavy)',s:4,rp:'5-6',rst:'3:30',rir:'1-2',tp:'bb',rl:'PILLAR. Confirm → ↑ weight.',tg:6,rstS:210,tempo:'3-1-2-0',isoWU:'Zercher hold at 90° 2×10s',perSide:false},
{id:'ohp',nm:'Barbell OHP',s:3,rp:'5-7',rst:'2:30',rir:'1-2',tp:'bb',rl:'Confirm → ↑ weight (slow!). Full ROM, soft top — not bouncy lockout.',tg:7,rstS:150,tempo:'3-1-2-0',perSide:false},
{id:'dips',nm:'Dips',s:4,rp:'4-8',rst:'2:30',rir:'1-2',tp:'band',rl:'4×8 → less assistance. Depth to upper-arm parallel.',tg:8,rstS:150,tempo:'3-1-2-1',bandMode:'assist',perSide:false},
{id:'bb_row',nm:'Barbell Row',s:4,rp:'8-10',rst:'2:00',rir:'2',tp:'bb',rl:'Confirm → ↑ weight',tg:10,rstS:120,tempo:'3-1-2-0',perSide:false},

// ═══════════════ PERIODIZATION ═══════════════
function getPhaseInfo(){
const wksSince=Math.max(1,Math.floor((new Date()-new Date(D.phaseStart+'T00:00:00'))/6048e5)+1);
const sessSince=D.sessions.filter(s=>s.date>=D.phaseStart).length;
const p=PHASES[D.phase]||PHASES[1];
// Intelligent phase assessment: check how many exercises are stalling
const pr=getCurPR();const allDays=Object.values(pr);
let stalledEx=0,totalEx=0,progressingEx=0;
for(const day of allDays)for(const ex of day){if(ex.tp==='bw'||ex.tp==='carry'||ex.tp==='club'||ex.tp==='mace')continue;
  const sg=getSmartSugg(ex);totalEx++;
  if(sg.type==='dn')stalledEx++;
  if(sg.type==='up'||sg.type==='cf')progressingEx++}
const timerDue=wksSince>=p.wk;
const stallDue=stalledEx>=2; // 2+ exercises genuinely stalling (below min range)
// Phase change recommended if: timer AND stalls, OR early if lots of stalls
const recommend=timerDue&&stallDue?'due':timerDue&&!stallDue?'timer_only':!timerDue&&stallDue?'early_stall':'not_due';
return{phase:D.phase,name:p.name,desc:p.desc,wk:wksSince,maxWk:p.wk,sess:sessSince,
  recommend,stalledEx,progressingEx,totalEx,timerDue,stallDue}}
function advancePhase(){const next=D.phase>=3?1:D.phase+1;D.phase=next;D.phaseStart=today();save()}

// ═══════════════ PROGRESSION ═══════════════
function getHist(exId,n=20){const h=[];for(let i=D.sessions.length-1;i>=0&&h.length<n;i--){const e=D.sessions[i].ex.find(x=>x.id===exId);if(e)h.unshift({...e,date:D.sessions[i].date})}return h}
function getLast(exId){const h=getHist(exId,1);return h.length?h[0]:null}
function getRepMin(ex){const parts=ex.rp.replace(/\/.*/, '').split('-');return parseInt(parts[0])||ex.tg}
function getDiscomfortRecent(exId,n=3){return D.discomfort.filter(d=>d.exId===exId).slice(-n)}

// Patch 2: effectiveReps — halve reps for perSide exercises
function effectiveReps(ex,reps){
const vals=(reps||[]).filter(r=>Number(r)>0).map(Number);
if(ex&&ex.perSide)return vals.map(v=>Math.floor(v/2));
return vals}

// Volume helper — accounts for loadUnit (per_db = double the weight)
function calcExVol(exId,wt,reps){
const def=ALL_EX.find(e=>e.id===exId);
const vr=(reps||[]).filter(r=>Number(r)>0).map(Number);
if(!wt||!vr.length)return 0;
const mult=(def&&def.loadUnit==='per_db')?2:1;
return wt*mult*vr.reduce((a,b)=>a+b,0)}

// RPE scale — replaces emoji system
const RPE_LABELS=['Light','Moderate','Hard','Very Hard','Maximal'];
const RPE_COLORS=['var(--gr)','var(--pr)','var(--am)','var(--rd)','#8b0000'];
const RPE_SHORT=['L','M','H','VH','MAX'];

function getSmartSugg(ex){
const hist=getHist(ex.id,5),last=hist.length?hist[hist.length-1]:null;
if(!last)return{text:'First time — find your weight',type:'new',wt:null,traj:[],detail:'',regress:''};

// Discomfort check — if moderate discomfort in last 2 sessions, auto-hold
const recentDisc=getDiscomfortRecent(ex.id,3);
const modDisc=recentDisc.filter(d=>d.level==='moderate').length;
const mildDisc=recentDisc.filter(d=>d.level==='mild').length;
let discWarn='';
if(modDisc>=2)discWarn='⚠ Repeated moderate discomfort — hold weight';
else if(modDisc>=1)discWarn='⚠ Moderate discomfort last session — consider holding';
else if(mildDisc>=3)discWarn='⚠ Mild discomfort 3 sessions running — monitor closely';

// ─── WEIGHT-BASED (bb, mace, db) — handle null wt fallback for type migrations (e.g., Cossack bw→bb) ───
if(ex.tp==='bb'||ex.tp==='mace'||ex.tp==='db'){
  // Find most recent session with a valid weight; if none, treat as a brand-new exercise
  const lastWithWt=[...hist].reverse().find(h=>h.wt&&Number(h.wt)>0);
  if(!lastWithWt){
    return{text:'First weighted session — find your starting load',type:'new',wt:null,traj:[],detail:'Earlier sessions were bodyweight or unrecorded.',regress:discWarn}}
  // If most recent session had no weight but earlier ones did, use the earlier weight as reference
  if(!last.wt){
    return{text:`→ ${lastWithWt.wt}kg`,type:'stay',wt:lastWithWt.wt,traj:[],detail:`Last weighted: ${lastWithWt.wt}kg on ${lastWithWt.date}`,regress:discWarn}}
}
if((ex.tp==='bb'||ex.tp==='mace'||ex.tp==='db')&&last.wt){
  const mn=getRepMin(ex);
  const atW=hist.filter(h=>h.wt===last.wt);
  const hitTarget=h=>{const v=effectiveReps(ex,h.reps);return v.length>=ex.s&&v.slice(0,ex.s).every(r=>r>=ex.tg)};
  const inRange=h=>{const v=effectiveReps(ex,h.reps);return v.length>=ex.s&&v.slice(0,ex.s).every(r=>r>=mn)};
  const stalls=atW.filter(h=>!inRange(h)).length;
  const plateauSess=atW.filter(h=>inRange(h)&&!hitTarget(h)).length;
  const hitsAtW=atW.filter(h=>hitTarget(h)).length;
  const lastHit=hitTarget(last);const lastInRange=inRange(last);
  const traj=hist.map((h,i)=>{const p=hist[i-1];if(!p)return{s:'●',c:'same'};if(h.wt>p.wt)return{s:'↑',c:'up'};if(h.wt<p.wt)return{s:'↓',c:'dn'};
    const ps=effectiveReps(ex,p.reps).reduce((a,b)=>a+b,0),cs=effectiveReps(ex,h.reps).reduce((a,b)=>a+b,0);
    return cs>ps?{s:'↗',c:'up'}:cs<ps?{s:'↘',c:'dn'}:{s:'→',c:'same'}});
  let regress='';
  if(atW.length>=2){const prev=atW[atW.length-2],curr=atW[atW.length-1];
    const pT=effectiveReps(ex,prev.reps).reduce((a,b)=>a+b,0),cT=effectiveReps(ex,curr.reps).reduce((a,b)=>a+b,0);
    if(cT<pT-2)regress=`Reps dropped ${pT}→${cT} at ${last.wt}kg`}
  if(!regress&&hist.length>=2){const prev=hist[hist.length-2];
    if(prev.wt&&last.wt&&last.wt<prev.wt)regress=`Weight dropped ${prev.wt}→${last.wt}kg`;
    else if(prev.wt===last.wt){const pT=effectiveReps(ex,prev.reps).reduce((a,b)=>a+b,0),cT=effectiveReps(ex,last.reps).reduce((a,b)=>a+b,0);
    if(cT<pT-2)regress=`Reps dropped ${pT}→${cT}`}}
  if(discWarn)regress=discWarn;
  const dbInc=ex.tp==='db'?0.5:1;
  // Discomfort override — hold weight if moderate pain trending
  if(modDisc>=2){return{text:`→ ${last.wt}kg (hold)`,type:'stay',wt:last.wt,traj,detail:'Holding due to discomfort trend',regress}}
  // HIT TARGET — use session count for confirmation (no side effects)
  if(lastHit){
    if(hitsAtW>=2){
      // Confirmed by training data — 2+ sessions hit target at this weight
      const nxt=ex.tp==='bb'?nxUp(last.wt):last.wt+dbInc;
      if(ex.tp==='bb'&&nxt>MAX_BB){
        return{text:`🔒 MAX — push reps`,type:'st',wt:last.wt,traj,detail:`At plate ceiling. Expand rep range or add tempo.`,regress,maxed:true}}
      return{text:`↑ ${nxt}kg${ex.tp==='db'?'/DB':''}`,type:'up',wt:nxt,traj,detail:`Hit ${ex.s}×${ex.tg}${ex.perSide?'/side':''} twice — go up!`,regress}}
    // First time hitting target at this weight → confirm next session
    return{text:`→ Confirm ${last.wt}kg`,type:'cf',wt:last.wt,traj,detail:`Hit ${ex.s}×${ex.tg}${ex.perSide?'/side':''} — repeat to confirm`,regress}}
  // FAILING (below minimum) → count stalls
  if(!lastInRange){
    if(stalls>=3){const d=ex.tp==='bb'?nxDn(last.wt):Math.max(0,last.wt-dbInc);
      return{text:`↓ ${d}kg`,type:'dn',wt:d,traj,detail:`${stalls} sessions below ${ex.s}×${mn}${ex.perSide?'/side':''} — reset`,regress}}
    return{text:`→ ${last.wt}kg`,type:'stay',wt:last.wt,traj,detail:`Below min. ${stalls}/3 stalls. Push for ${ex.s}×${mn}+${ex.perSide?' /side':''}`,regress}}
  // IN RANGE but not at target → push reps
  const eR=effectiveReps(ex,last.reps);
  const avgRep=eR.length?Math.round(eR.reduce((a,b)=>a+b,0)/eR.length):0;
  let tip=`Push for ${ex.s}×${ex.tg}${ex.perSide?'/side':''}`;
  if(plateauSess>=4)tip=`${plateauSess} sessions at ${avgRep}s — try ${Math.min(avgRep+1,ex.tg)},${avgRep},${avgRep} next`;
  else if(plateauSess>=2)tip=`Building at ${avgRep}s. Push for ${Math.min(avgRep+1,ex.tg)}s.`;
  return{text:`→ ${last.wt}kg`,type:'stay',wt:last.wt,traj,detail:tip,regress}}

// ─── CLUB exercises (perSide-aware) ───
if(ex.tp==='club'){
  const traj=hist.map((h,i)=>{if(!i)return{s:'●',c:'same'};const pw=hist[i-1].wt||0,cw=h.wt||0;
    return cw>pw?{s:'↑',c:'up'}:cw<pw?{s:'↓',c:'dn'}:{s:'→',c:'same'}});
  const reps=effectiveReps(ex,last.reps);
  const totalReps=reps.reduce((a,b)=>a+b,0);
  const allHit=reps.length>=ex.s&&reps.slice(0,ex.s).every(r=>r>=ex.tg);
  if(allHit){return{text:`${last.wt||6}kg — smooth? → try ${(last.wt||6)+2}kg`,type:'up',wt:last.wt,traj,detail:`Hit target${ex.perSide?' /side':''}. Progress if shoulder feels smooth.`,regress:discWarn}}
  return{text:`${last.wt||6}kg club`,type:'stay',wt:last.wt,traj,detail:`Focus on smooth form. ${totalReps} eff. reps${ex.perSide?' /side':''}.`,regress:discWarn}}

// ─── BAND exercises (bandMode-aware: assist vs resist) ───
if(ex.tp==='band'){
  const isResist=ex.bandMode==='resist';
  const traj=hist.map((h,i)=>{if(!i)return{s:'●',c:'same'};const pi=BAND_IDX(hist[i-1].band),ci=BAND_IDX(h.band);
    if(isResist){return ci<pi?{s:'↑',c:'up'}:ci>pi?{s:'↓',c:'dn'}:{s:'→',c:'same'}}
    return ci>pi?{s:'↑',c:'up'}:ci<pi?{s:'↓',c:'dn'}:{s:'→',c:'same'}});
  const reps=effectiveReps(ex,last.reps);
  const hitTop=reps.length>=ex.s&&reps.slice(0,ex.s).every(r=>r>=ex.tg);
  let regress=discWarn;if(!regress&&hist.length>=2){const prev=hist[hist.length-2];
    if(BAND_IDX(prev.band)===BAND_IDX(last.band)){const pT=effectiveReps(ex,prev.reps).reduce((a,b)=>a+b,0),cT=reps.reduce((a,b)=>a+b,0);
    if(cT<pT-2)regress=`Reps dropped ${pT}→${cT}`}}
  if(hitTop){
    if(isResist){
      const curIdx=BAND_IDX(last.band);
      if(curIdx<=0)return{text:'At max resistance — add pause/tension',type:'st',wt:null,traj,
        detail:`Hit ${ex.s}×${ex.tg}${ex.perSide?'/side':''} at heaviest band`,regress};
      return{text:'↑ More resistance (thicker)',type:'up',wt:null,traj,
        detail:`Hit ${ex.s}×${ex.tg}${ex.perSide?'/side':''} — increase band resistance`,regress}}
    // assist mode
    const curIdx=BAND_IDX(last.band);
    if(curIdx>=BANDS.length-1)return{text:'No band! 🎉',type:'up',wt:null,traj,
      detail:`Hit ${ex.s}×${ex.tg} — try unassisted`,regress};
    return{text:'↑ Less assistance (thinner)',type:'up',wt:null,traj,
      detail:`Hit ${ex.s}×${ex.tg} — reduce band help`,regress}}
  return{text:last.band||'Check band',type:'stay',wt:null,traj,detail:`Stay on ${last.band||'current'}`,regress}}

// ─── CARRY exercises ───
if(ex.tp==='carry'||(ex.tp==='db'&&ex.id.includes('carry'))){
  const lastWt=last.wt||0;
  return{text:lastWt?`${lastWt}kg`:'Log weight',type:'stay',wt:lastWt,traj:[],detail:'↑ load or distance when comfortable',regress:discWarn}}

// ─── BODYWEIGHT (push-ups, inverted rows, dead bugs, dand-baithak) — perSide-aware ───
if(ex.tp==='bw'){
  const reps=effectiveReps(ex,last.reps);
  const totalReps=reps.reduce((a,b)=>a+b,0);
  const isDand=ex.id.includes('dand');
  if(isDand){return{text:`${last.reps.filter(r=>r>0).reduce((a,b)=>a+b,0)} total`,type:'stay',wt:null,traj:[],detail:ex.rl,regress:''}}
  const traj=hist.map((h,i)=>{if(!i)return{s:'●',c:'same'};
    const pt=effectiveReps(ex,hist[i-1].reps).reduce((a,b)=>a+b,0),ct=effectiveReps(ex,h.reps).reduce((a,b)=>a+b,0);
    return ct>pt?{s:'↗',c:'up'}:ct<pt?{s:'↘',c:'dn'}:{s:'→',c:'same'}});
  const allHit=reps.length>=ex.s&&reps.slice(0,ex.s).every(r=>r>=ex.tg);
  let regress=discWarn;
  if(!regress&&hist.length>=2){const pt=effectiveReps(ex,hist[hist.length-2].reps).reduce((a,b)=>a+b,0);
    if(totalReps<pt-3)regress=`Total reps dropped ${pt}→${totalReps}`}
  if(allHit)return{text:`Hit target${ex.perSide?' /side':''} — progress`,type:'up',wt:null,traj,detail:ex.rl,regress};
  return{text:`${totalReps} reps${ex.perSide?' /side':''}`,type:'stay',wt:null,traj,detail:`Push for ${ex.s}×${ex.tg}${ex.perSide?'/side':''}`,regress}}

// ─── Fallback ───
return{text:last.wt?`${last.wt}kg`:'Continue',type:'stay',wt:last.wt,traj:[],detail:'',regress:discWarn}}

function getSkips(day,exId){const def=ALL_EX.find(e=>e.id===exId);if(def&&def.optional)return{sk:0,tot:0};
const ds=D.sessions.filter(s=>s.day===day&&(s.loc||'home')===D.location).slice(-3);let sk=0;for(const s of ds)if(!s.ex.find(e=>e.id===exId))sk++;return{sk,tot:ds.length}}
function getPRs(exId){let bw=0,bv=0,be=0;const def=ALL_EX.find(x=>x.id===exId);
for(const s of D.sessions)for(const e of s.ex)if(e.id===exId){const vr=e.reps.filter(r=>r>0);if(!vr.length)continue;
const eR=effectiveReps(def,e.reps);const mx=eR.length?Math.max(...eR):0;
const vol=calcExVol(e.id,e.wt,e.reps);
if(e.wt>bw)bw=e.wt;if(vol>bv)bv=vol;if(e.wt&&mx>0){const x=e.wt*(1+mx/30);if(x>be)be=x}}
return{bestWt:bw,bestVol:bv,bestE1RM:Math.round(be*10)/10}}
function checkPR(exId,wt,reps){const pr=getPRs(exId),vr=reps.filter(r=>r>0);if(!vr.length)return[];const ps=[];
const vol=calcExVol(exId,wt,reps);
if(wt&&wt>pr.bestWt&&pr.bestWt>0)ps.push('WT');if(vol>pr.bestVol&&pr.bestVol>0)ps.push('VOL');return ps}
function e1rm(wt,reps){return reps<=0||!wt?0:reps===1?wt:Math.round(wt*(1+reps/30)*10)/10}
function warmupSets(wt){if(!wt||wt<=BAR)return[];const s=[{wt:BAR,reps:8,l:'Bar only'}];const w60=snapW(BAR+(wt-BAR)*.5),w80=snapW(BAR+(wt-BAR)*.8);if(w60>BAR&&w60<wt)s.push({wt:w60,reps:5,l:fmtPl(w60)});if(w80>w60&&w80<wt)s.push({wt:w80,reps:3,l:fmtPl(w80)});return s}

// Discomfort analysis
function getDiscomfortTrend(exId,joint){const recent=D.discomfort.filter(d=>d.exId===exId&&d.joint===joint).slice(-5);
return{count:recent.length,recent3:recent.slice(-3).filter(d=>d.level!=='none').length}}

function svgLine(data,W,H,color,label){
if(data.length<2)return`<div class="dm" style="text-align:center;padding:16px">Need 2+ data points</div>`;
const pad={t:22,r:10,b:28,l:36},w=W-pad.l-pad.r,h=H-pad.t-pad.b;
const vals=data.map(d=>d.v),mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1;
const pts=data.map((d,i)=>({x:pad.l+(i/(data.length-1))*w,y:pad.t+h-((d.v-mn)/rng)*h,...d}));
let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">`;
for(let i=0;i<=3;i++){const y=pad.t+(h/3)*i,v=Math.round(mx-((mx-mn)/3)*i);
s+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#e2e8f0" stroke-width="1"/><text x="${pad.l-4}" y="${y+3}" text-anchor="end" fill="#8594a7" font-size="9">${v}</text>`}
s+=`<polyline points="${pts.map(p=>`${p.x},${p.y}`).join(' ')}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
for(const p of pts)s+=`<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="${color}" stroke="#fff" stroke-width="2"/>`;
if(data.length<=8)for(const p of pts)s+=`<text x="${p.x}" y="${H-4}" text-anchor="middle" fill="#8594a7" font-size="8">${p.l}</text>`;
s+=`<text x="${W/2}" y="14" text-anchor="middle" fill="${color}" font-size="11" font-weight="600">${label}</text></svg>`;return s}

function getFatigue(){const now=new Date(),scores=[];
for(let i=0;i<7;i++){const d=new Date(now);d.setDate(d.getDate()-i);const ds=d.toISOString().split('T')[0];
D.sessions.filter(s=>s.date===ds).forEach(s=>{let vol=0;s.ex.forEach(e=>{vol+=calcExVol(e.id,e.wt,e.reps)});scores.push({vol,diff:s.difficulty||3})});
D.cardioLog.filter(c=>c.date===ds).forEach(c=>scores.push({vol:c.duration*(c.intensity==='hard'?30:20),diff:3}))}
if(!scores.length)return{score:0,label:'Fresh',color:'var(--gr)'};
const f=scores.length,ad=scores.reduce((a,b)=>a+b.diff,0)/f,tv=scores.reduce((a,b)=>a+b.vol,0);
const sc=Math.round(Math.min(10,f*1.2+ad*.9+tv/(1200*Math.max(1,f)))*10)/10;
if(sc<=3)return{score:sc,label:'Fresh',color:'var(--gr)'};if(sc<=5)return{score:sc,label:'Ready',color:'var(--pr)'};
if(sc<=7)return{score:sc,label:'Building',color:'var(--am)'};return{score:sc,label:'Fatigued',color:'var(--rd)'}}

function getStreak(){const now=new Date();let streak=0,w=new Date(now);const day=w.getDay();w.setDate(w.getDate()-(day||7)+1);w.setHours(0,0,0,0);
while(true){const wE=new Date(w);wE.setDate(wE.getDate()+6);const cnt=D.sessions.filter(s=>{const d=new Date(s.date+'T00:00:00');return d>=w&&d<=wE}).length;
if(cnt>=3)streak++;else break;w.setDate(w.getDate()-7);if(streak>52)break}return streak}
function getDeload(){const st=D.lastDeload||D.sessions[0]?.date;if(!st)return null;const wk=Math.max(1,Math.floor((new Date()-new Date(st+'T00:00:00'))/6048e5)+1);
const sc=D.lastDeload?D.sessions.filter(s=>s.date>D.lastDeload).length:D.sessions.length;
// Signal-driven: don't deload on timer alone — check for actual fatigue signals
const recent5=D.sessions.slice(-5);
const avgDiff=recent5.filter(s=>s.difficulty).length?recent5.filter(s=>s.difficulty).reduce((a,s)=>a+s.difficulty,0)/recent5.filter(s=>s.difficulty).length:0;
const highFatigue=avgDiff>=4;
// For beginners (<30 sessions), extend timer to 8 weeks and require signals
const isBeginner=D.sessions.length<30;const timerThresh=isBeginner?8:6;
const due=wk>=timerThresh&&highFatigue;const consider=wk>=timerThresh&&!highFatigue;
return{wk,sc,due,consider,isBeginner,avgDiff:Math.round(avgDiff*10)/10}}

// ─── HELPERS ───────────────────────────────────
function stepWt(id,dir){const c=Number(LOG[id].wt)||BAR,ix=VW.indexOf(c);
const ni=Math.max(0,Math.min(VW.length-1,ix+dir));LOG[id].wt=VW[ni];LOG[id].pf=false;saveAW();render()}
function setL(id,f,v){LOG[id][f]=v}
function setRep(id,i,v){LOG[id].reps[i]=v;LOG[id].pf=false;saveAW();
const ex=ALL_EX.find(e=>e.id===id);if(ex){const filled=LOG[id].reps.filter(r=>r!==''&&Number(r)>0).length;
if(filled===i+1&&filled<ex.s&&!TIMER)startTimer(ex.rstS)}}
function toggleSetDone(id,i){if(!LOG[id].setDone)LOG[id].setDone=Array(LOG[id].reps.length).fill(false);
LOG[id].setDone[i]=!LOG[id].setDone[i];
if(LOG[id].setDone[i]){const ex=ALL_EX.find(e=>e.id===id);if(ex&&!TIMER)startTimer(ex.rstS)}
saveAW();render()}
function toggleJoint(exId,joint){const j=LOG[exId].discJoints;const idx=j.indexOf(joint);
if(idx>=0)j.splice(idx,1);else j.push(joint);saveAW();render()}
let CANCEL_ARMED=false;
function cancelW(){if(CANCEL_ARMED){ADAY=null;LOG={};SS=null;CANCEL_ARMED=false;SNOTES='';clearAW();clearTimer();go('home')}
else{CANCEL_ARMED=true;setTimeout(()=>CANCEL_ARMED=false,3000);render()}}
function editCue(exId){const cur=D.cues[exId]||'';const v=prompt(`Cue for ${ALL_EX.find(e=>e.id===exId)?.nm||exId}:`,cur);
if(v!==null){if(v.trim())D.cues[exId]=v.trim();else delete D.cues[exId];save();render()}}

// ─── FINISH + SUMMARY ─────────────────────────
function finishW(){
const pr=getCurPR(),exs=pr[ADAY];
const logged=Object.entries(LOG).filter(([,v])=>v.reps.some(r=>r!==''&&Number(r)>0))
  .map(([id,v])=>({id,wt:v.wt?Number(v.wt):null,reps:v.reps.map(r=>r===''?0:Number(r)),band:v.band||'',notes:v.notes}));
if(!logged.length)return;
for(const[id,v] of Object.entries(LOG)){if(v.disc&&v.disc!=='none'&&v.discJoints.length){
  for(const j of v.discJoints)D.discomfort.push({date:today(),exId:id,level:v.disc,joint:j})}}
const prs=[];for(const e of logged){const p=checkPR(e.id,e.wt,e.reps);if(p.length)prs.push({nm:ALL_EX.find(x=>x.id===e.id)?.nm||e.id})}
let tv=0,ts=0,tr=0;for(const e of logged){const vr=e.reps.filter(r=>r>0);ts+=vr.length;tr+=vr.reduce((a,b)=>a+b,0);tv+=calcExVol(e.id,e.wt,e.reps)}
const discCount=Object.values(LOG).filter(v=>v.disc&&v.disc!=='none').length;
window._S={exs:logged,prs,tv,ts,tr,dur:SS?Math.round((Date.now()-SS)/6e4):0,day:ADAY,warmup:WU_CHECKS.filter(Boolean).length,discCount,notes:SNOTES};
SDIFF=0;clearAW();VIEW='summary';render();window.scrollTo(0,0)}

function rSumm(el){const S=window._S;
let h=`<div class="sec"><div class="summary-card">
<div style="font-size:17px;font-weight:800;margin-bottom:6px">Session Complete ✓</div>
<span class="bg bg-${S.day.toLowerCase()}">Day ${S.day}</span>

function impD(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();

// Patch 10: Merge sessions — REPLACE same-ID, ADD new
const existingMap=new Map(D.sessions.map(s=>[s.id,s]));
let added=0,replaced=0;
for(const s of d.sessions){if(existingMap.has(s.id))replaced++;else added++;existingMap.set(s.id,s)}
D.sessions=[...existingMap.values()];
D.sessions.sort((a,b)=>a.date.localeCompare(b.date));
// Merge cardio, discomfort, body logs (additive)
const cIds=new Set(D.cardioLog.map(c=>c.id));
for(const c of d.cardioLog){if(!cIds.has(c.id))D.cardioLog.push(c)}
const dKeys=new Set(D.discomfort.map(x=>x.date+x.exId+x.joint));
for(const x of d.discomfort){if(!dKeys.has(x.date+x.exId+x.joint))D.discomfort.push(x)}
const bKeys=new Set(D.bodyLog.map(x=>x.date));
for(const x of d.bodyLog){if(!bKeys.has(x.date))D.bodyLog.push(x)}
for(const[k,v] of Object.entries(d.cues))D.cues[k]=v;
// Patch 10: Adopt global metadata from import
if(d.phase)D.phase=d.phase;
if(d.phaseStart)D.phaseStart=d.phaseStart;
if(d.lastDeload!==undefined)D.lastDeload=d.lastDeload;
if(d.trainingWeek)D.trainingWeek=d.trainingWeek;
if(d.location)D.location=d.location;

D.nextDay=nxt[last.day]||D.nextDay}

migrateData(D);
