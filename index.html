<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tracker">
<meta name="theme-color" content="#0a0d13">
<meta name="mobile-web-app-capable" content="yes">
<title>Rack-Free Tracker v12</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@600;700;800;900&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
/* Slate dark — cool neutral base, electric sky-cyan accent. Clean, modern, punchy. */
--bg:#0a0d13;--bg2:#0e131c;--cd:#141b27;--cd2:#1c2535;--cb:#2a3444;--ib:#121823;--ibr:#2d3949;
--tx:#eef3fa;--mu:#8b97ab;--dm:#586577;
/* sky-cyan signature accent */
--prRGB:56,189,248;--pr:#38bdf8;--prl:#07242f;--prg:#0ea5e9;--ink:#05131c;
--gr:#34d399;--grl:#08251c;--am:#f5a524;--aml:#2a200d;--rd:#fb7185;--rdl:#2c1622;
--pu:#a78bfa;--pul:#1d1936;--bl:#60a5fa;--bll:#0f1d33;
--p10:#fb7185;--p5:#60a5fa;--p25:#34d399;--p1:#586577;
--sh:0 1px 3px rgba(0,0,0,.45);--shm:0 10px 32px rgba(0,0,0,.6);--sab:env(safe-area-inset-bottom,0px);
--rad:16px;--rad-sm:10px;
--disp:'Archivo Expanded',-apple-system,system-ui,sans-serif;
--body:'Archivo',-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:var(--body);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
/* atmospheric backdrop: subtle volt glow top, deep fade */
body{max-width:480px;margin:0 auto;padding-bottom:calc(28px + var(--sab));position:relative;
background:radial-gradient(125% 55% at 50% -12%,rgba(var(--prRGB),.12),transparent 58%),radial-gradient(90% 50% at 100% 8%,rgba(167,139,250,.10),transparent 60%),var(--bg);background-attachment:fixed}
input,select,button,textarea{font-family:inherit}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
::selection{background:var(--pr);color:var(--ink)}

/* Layout */
.hdr{padding:16px 18px 10px;background:rgba(11,10,18,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--cb);position:sticky;top:0;z-index:100}
.hdr h1{font-family:var(--disp);font-size:15px;font-weight:900;color:var(--tx);letter-spacing:1.5px;text-transform:uppercase}
.hdr h1::before{content:'';display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--pr);margin-right:9px;vertical-align:middle;box-shadow:0 0 14px var(--pr),0 0 4px var(--pr)}
.nav{display:flex;background:rgba(11,10,18,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);position:sticky;top:48px;z-index:99;border-bottom:1px solid var(--cb)}
.nav button{flex:1;padding:12px 0;font-family:var(--disp);font-size:10px;font-weight:700;border:none;border-bottom:2px solid transparent;background:0;color:var(--mu);cursor:pointer;letter-spacing:1px;text-transform:uppercase;transition:color .2s}
.nav button.a{color:var(--pr);border-bottom-color:var(--pr);text-shadow:0 0 14px rgba(var(--prRGB),.6)}
.sec{padding:14px 14px;animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Cards */
.cd{background:linear-gradient(180deg,var(--cd),var(--bg2));border-radius:var(--rad);padding:14px 16px;margin-bottom:10px;border:1px solid var(--cb);box-shadow:var(--sh)}

/* Type */
.lb{font-family:var(--disp);font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;font-weight:700}
.mu{font-size:12px;color:var(--mu)}.dm{font-size:11px;color:var(--dm)}

/* Badges */
.bg{display:inline-block;padding:3px 9px;border-radius:6px;font-family:var(--disp);font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase}
.bg-a{background:var(--prl);color:var(--pr)}.bg-b{background:var(--bll);color:var(--bl)}.bg-c{background:var(--grl);color:var(--gr)}.bg-d{background:var(--aml);color:var(--am)}
.sg{font-family:var(--disp);font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;display:inline-block;letter-spacing:.3px}
.sg-up{color:var(--ink);background:var(--pr)}.sg-st{color:var(--am);background:var(--aml)}.sg-nw{color:var(--pr);background:var(--prl)}
.sg-dn{color:var(--rd);background:var(--rdl)}.sg-cf{color:var(--bl);background:var(--bll)}
.wk-1{background:var(--prl);color:var(--pr)}.wk-2{background:var(--pul);color:var(--pu)}
.regress{font-size:10px;color:var(--rd);padding:3px 7px;background:var(--rdl);border-radius:6px;display:inline-block;font-weight:600}
.pr-badge{font-family:var(--disp);font-size:10px;font-weight:800;color:var(--ink);background:var(--am);padding:3px 9px;border-radius:6px;letter-spacing:.5px}
.max-badge{font-size:9px;font-weight:800;color:var(--rd);background:var(--rdl);padding:2px 7px;border-radius:5px;margin-left:4px}
.cue{font-size:12px;color:var(--tx);padding:9px 12px;background:var(--prl);border-radius:var(--rad-sm);margin:6px 0;border-left:3px solid var(--pr)}

/* Inputs */
.ri{width:54px;height:54px;font-family:var(--disp);font-size:21px;font-weight:800;background:var(--ib);border:2px solid var(--ibr);border-radius:var(--rad-sm);color:var(--tx);text-align:center;outline:none;transition:.15s;font-variant-numeric:tabular-nums}
.ri:focus{border-color:var(--pr);background:var(--cd2);box-shadow:0 0 0 3px rgba(var(--prRGB),.18)}
.ri.pf{color:var(--dm)}.ri.done{border-color:var(--gr);background:var(--grl);color:var(--gr)}
.ni{width:100%;padding:9px 11px;font-size:12px;background:var(--ib);border:1px solid var(--ibr);border-radius:var(--rad-sm);color:var(--tx);outline:none}
.ni:focus{border-color:var(--pr);color:var(--tx);background:var(--cd2)}
.bs{padding:9px 11px;font-size:12px;background:var(--ib);border:1px solid var(--ibr);border-radius:var(--rad-sm);color:var(--tx);outline:none;width:100%}
.body-input{width:84px;padding:11px;font-family:var(--disp);font-size:18px;background:var(--ib);border:1px solid var(--ibr);border-radius:var(--rad-sm);color:var(--tx);text-align:center;outline:none;font-weight:800;font-variant-numeric:tabular-nums}
.body-input:focus{border-color:var(--pr);background:var(--cd2)}
.sess-note{width:100%;padding:9px 11px;font-size:12px;background:var(--ib);border:1px solid var(--ibr);border-radius:var(--rad-sm);color:var(--tx);outline:none;resize:none;min-height:38px;font-family:inherit}
.sess-note:focus{border-color:var(--pr);background:var(--cd2)}

/* Weight stepper */
.stp{display:flex;align-items:center;gap:8px;justify-content:center}
.stp-b{width:50px;height:50px;display:flex;align-items:center;justify-content:center;border-radius:var(--rad-sm);border:1px solid var(--ibr);background:var(--ib);color:var(--tx);font-size:24px;font-weight:700;cursor:pointer;user-select:none;transition:.12s}
.stp-b:active{background:var(--pr);color:var(--ink);transform:scale(.92)}.stp-b.dis{color:var(--dm)}
.stp-v{min-width:88px;height:50px;display:flex;align-items:center;justify-content:center;border-radius:var(--rad-sm);background:var(--ib);border:2px solid var(--pr);font-family:var(--disp);font-size:21px;font-weight:800;color:var(--pr);font-variant-numeric:tabular-nums;box-shadow:0 0 16px rgba(var(--prRGB),.12)}
.stp-v span{font-size:10px;color:var(--mu);margin-left:3px;font-weight:500;font-family:var(--body)}
/* Dominant weight readout for the active barbell card */
.stp-big{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:6px}
.stp-hero{font-family:var(--disp);font-size:66px;font-weight:900;color:var(--pr);font-variant-numeric:tabular-nums;line-height:.88;letter-spacing:-2.5px;text-shadow:0 0 38px rgba(var(--prRGB),.5),0 0 12px rgba(var(--prRGB),.3);position:relative}
.stp-hero sub{font-family:var(--body);font-size:15px;font-weight:600;color:var(--mu);vertical-align:baseline;margin-left:4px;text-shadow:none;letter-spacing:0}
.stp-row{display:flex;align-items:center;gap:18px}
.stp-big .stp-b{width:56px;height:56px;font-size:28px;border-radius:50%}
.pls{display:flex;align-items:center;gap:3px;padding:3px 0;justify-content:center}
.pl{height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:var(--ink)}
.pl-10{background:var(--p10);width:24px}.pl-5{background:var(--p5);width:20px}.pl-2{background:var(--p25);width:17px}.pl-1{background:var(--p1);width:13px}

/* Buttons */
.btn{padding:16px 20px;font-family:var(--disp);font-size:14px;font-weight:800;border:none;border-radius:var(--rad-sm);cursor:pointer;width:100%;display:block;transition:.15s;letter-spacing:1px;text-transform:uppercase}
.btn:active{transform:scale(.97);opacity:.92}
.btn-pr{background:linear-gradient(135deg,var(--pr),var(--prg));color:var(--ink);box-shadow:0 4px 24px rgba(var(--prRGB),.35),inset 0 1px 0 rgba(255,255,255,.25)}
.btn-wh{background:var(--cd2);color:var(--tx);border:1px solid var(--cb)}
.btn-rd{background:var(--rdl);color:var(--rd);border:1px solid #4a2236}
.btn-sm{padding:7px 13px;font-size:10px;width:auto;display:inline-block;border-radius:8px;font-weight:700;letter-spacing:.5px}
.btn-ghost{background:0;border:none;color:var(--pr);font-weight:700;padding:6px 10px;font-size:12px;font-family:var(--body)}

/* Bars */
.fg-bar{height:6px;border-radius:4px;background:var(--ib);overflow:hidden;margin:5px 0}
.fg-fill{height:100%;border-radius:4px;transition:width .5s cubic-bezier(.34,1.56,.64,1)}
.prog-strip{display:flex;gap:3px;margin:7px 0}
.prog-seg{flex:1;height:6px;border-radius:4px;background:var(--ib);transition:.3s}
.prog-seg.pg-done{background:var(--pr);box-shadow:0 0 8px rgba(var(--prRGB),.4)}.prog-seg.pg-cur{background:var(--pu)}

/* Timer — compact floating pill */
.timer-pill{position:fixed;bottom:18px;right:16px;max-width:170px;background:var(--cd);border:2px solid var(--pr);border-radius:40px;padding:9px 15px;z-index:200;display:flex;align-items:center;gap:8px;box-shadow:0 6px 24px rgba(0,0,0,.5),0 0 20px rgba(var(--prRGB),.15);font-variant-numeric:tabular-nums}
.timer-pill.done{border-color:var(--gr);background:var(--grl);animation:pulse .6s ease 2}
.timer-pill .t-time{font-family:var(--disp);font-size:19px;font-weight:800;color:var(--pr)}
.timer-pill.done .t-time{color:var(--gr)}
.timer-pill .t-x{width:30px;height:30px;border-radius:50%;border:none;background:var(--ib);color:var(--mu);font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.timer-pill .t-x:active{background:var(--cb)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* Banners */
.deload-banner{background:var(--aml);border:1px solid #4a3a14;border-radius:var(--rad-sm);padding:10px 13px;margin-bottom:10px;font-size:12px;color:var(--am)}

/* Workout list */
.ex-row{background:var(--cd);border-radius:var(--rad);padding:12px 14px;margin-bottom:8px;border:1.5px solid var(--cb);cursor:pointer;transition:border-color .2s,background .2s,transform .1s}
.ex-row.cur{border-color:var(--pr);box-shadow:var(--shm),0 0 24px rgba(var(--prRGB),.1);cursor:default}
.ex-row.done-row{border-color:var(--gr);background:linear-gradient(135deg,var(--grl),var(--cd))}
.ex-row.upcoming{opacity:.45}
.ex-row.upcoming:active{opacity:.65}
.ex-expand{padding:12px 0 2px;margin-top:10px;border-top:1px solid var(--cb)}

/* Set tick */
.set-tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--ibr);background:var(--ib);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;transition:.15s;margin:4px auto 0;color:var(--mu)}
.set-tick.done{background:var(--pr);border-color:var(--pr);color:var(--ink);animation:tickpop .35s cubic-bezier(.34,1.56,.64,1)}
.set-tick:active{transform:scale(.85)}
@keyframes tickpop{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}

/* Toggle switch */
.toggle{width:42px;height:24px;border-radius:14px;background:var(--cb);border:1px solid var(--ibr);position:relative;cursor:pointer;padding:0;transition:.18s;flex:0 0 auto}
.toggle.on{background:var(--pr);border-color:var(--pr)}
.toggle-dot{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.toggle.on .toggle-dot{left:20px}
/* Form rating */
.form-rate{margin:8px 0 2px;padding:8px 10px;background:var(--ib);border:1px solid var(--ibr);border-radius:var(--rad-sm)}
.form-row1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.form-lbl{font-family:var(--disp);font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--mu)}
.form-btns{display:flex;gap:4px}
.form-b{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--cb);background:var(--cd);color:var(--mu);font-family:var(--disp);font-size:13px;font-weight:800;cursor:pointer;transition:.12s;padding:0}
.form-b:active{transform:scale(.92)}
.form-b.sm{width:24px;height:24px;font-size:11px;border-radius:6px}
.form-cap{font-size:10px;font-weight:600;margin-top:5px;display:flex;align-items:center;flex-wrap:wrap}
.form-perset{margin-top:7px;padding-top:7px;border-top:1px solid var(--cb);display:flex;flex-direction:column;gap:5px}
.form-prow{display:flex;align-items:center;justify-content:space-between}
.form-ps-lbl{font-size:10px;font-weight:700;color:var(--mu)}
.form-chip{display:inline-block;font-family:var(--disp);font-size:8px;font-weight:800;letter-spacing:.4px;border:1px solid;border-radius:4px;padding:1px 4px;margin-left:5px;vertical-align:middle}
/* Exercise swap */
.swap-btn{font-size:10px;font-weight:800;color:var(--pr);border:1px solid var(--cb);border-radius:7px;padding:3px 8px;letter-spacing:.3px}
.swap-btn.on{background:var(--prl);border-color:var(--pr)}
.swap-badge{display:inline-block;font-family:var(--disp);font-size:8px;font-weight:800;letter-spacing:.5px;color:var(--ink);background:var(--pr);border-radius:4px;padding:1px 4px;vertical-align:middle}
.swap-panel{margin-top:8px;background:var(--ib);border:1px solid var(--ibr);border-radius:var(--rad-sm);padding:9px 10px}
.swap-hd{font-family:var(--disp);font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--mu);font-weight:700;margin-bottom:7px}
.swap-filters{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.swap-filters button{font-size:10px;font-weight:700;color:var(--mu);background:var(--cd);border:1px solid var(--cb);border-radius:20px;padding:4px 10px;cursor:pointer;transition:.12s}
.swap-filters button.on{color:var(--ink);background:var(--pr);border-color:var(--pr)}
.swap-opt{display:flex;justify-content:space-between;align-items:center;padding:8px 9px;margin-bottom:5px;background:var(--cd);border:1px solid var(--cb);border-radius:9px;cursor:pointer;transition:.12s}
.swap-opt:active{transform:scale(.99)}.swap-opt:hover{border-color:var(--pr)}
.swap-go{font-size:10px;font-weight:800;color:var(--pr);flex:0 0 auto;margin-left:8px}
/* Warmup */
.wu-check{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--cb);cursor:pointer}
.wu-box{width:28px;height:28px;border-radius:8px;border:2px solid var(--ibr);background:var(--ib);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:.15s;color:var(--mu)}
.wu-box.checked{background:var(--pr);border-color:var(--pr);color:var(--ink)}

/* Discomfort */
.disc-row{display:flex;gap:5px;justify-content:center;margin-top:7px}
.disc-btn{padding:6px 11px;border-radius:8px;border:1px solid var(--ibr);background:var(--ib);font-size:10px;font-weight:700;cursor:pointer;color:var(--mu)}
.disc-btn.sel-none{border-color:var(--gr);background:var(--grl);color:var(--gr)}
.disc-btn.sel-mild{border-color:var(--am);background:var(--aml);color:var(--am)}
.disc-btn.sel-mod{border-color:var(--rd);background:var(--rdl);color:var(--rd)}
.disc-joints{display:flex;gap:5px;justify-content:center;margin-top:5px;flex-wrap:wrap}
.disc-joint{padding:4px 9px;border-radius:6px;border:1px solid var(--ibr);background:var(--ib);font-size:10px;font-weight:600;cursor:pointer;color:var(--mu)}
.disc-joint.sel{border-color:var(--rd);background:var(--rdl);color:var(--rd)}

/* RPE scale */
.diff-btn{width:46px;height:46px;border-radius:50%;border:2px solid var(--ibr);background:var(--ib);font-family:var(--disp);font-size:18px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;color:var(--tx)}
.diff-btn.sel{border-color:var(--pr);background:var(--prl);color:var(--pr)}

/* Summary */
.summary-card{background:var(--cd);border-radius:var(--rad);padding:22px;margin-bottom:12px;border:1px solid var(--cb);box-shadow:var(--shm);text-align:center}
.summary-num{font-family:var(--disp);font-size:34px;font-weight:900;color:var(--pr);font-variant-numeric:tabular-nums;text-shadow:0 0 24px rgba(var(--prRGB),.3)}
.summary-label{font-family:var(--disp);font-size:9px;color:var(--mu);text-transform:uppercase;letter-spacing:1.2px;font-weight:700}

/* Hero start */
.start-hero{background:linear-gradient(140deg,#1c1733,#120f1e);border:1px solid #3a4a1c;color:#fff;border-radius:var(--rad);padding:22px;text-align:center;margin-bottom:12px;position:relative;overflow:hidden;box-shadow:var(--shm)}
.start-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(80% 100% at 50% 0%,rgba(var(--prRGB),.18),transparent 70%);pointer-events:none}
.start-hero h2{font-family:var(--disp);font-size:22px;font-weight:900;margin-bottom:4px;letter-spacing:.5px;text-transform:uppercase;position:relative}
.start-hero .meta{font-size:11px;color:var(--mu);margin-bottom:16px;position:relative;letter-spacing:.3px}
.start-hero button{background:var(--pr);color:var(--ink);border:none;border-radius:var(--rad-sm);padding:14px 40px;font-family:var(--disp);font-size:15px;font-weight:800;cursor:pointer;letter-spacing:1px;text-transform:uppercase;box-shadow:0 4px 20px rgba(var(--prRGB),.3);position:relative}
.start-hero button:active{transform:scale(.96)}
.dpick{display:flex;gap:6px;justify-content:center;margin-bottom:14px;position:relative}
.dpick button{flex:0 0 auto;min-width:54px;padding:8px 0;border-radius:9px;border:1.5px solid var(--cb);background:rgba(255,255,255,.04);color:var(--mu);font-family:var(--disp);font-size:12px;font-weight:800;letter-spacing:.5px;cursor:pointer;transition:.15s}
.dpick button.on{background:var(--pr);color:var(--ink);border-color:var(--pr);box-shadow:0 2px 14px rgba(var(--prRGB),.3)}
/* Training-cycle cue: A→B→C rotation pills + rest-day timeline */
.cyc{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:10px}
.cyc-d{min-width:42px;height:42px;padding:0 6px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:16px;border:2px solid var(--cb);background:var(--ib);color:var(--mu)}
.cyc-d.done{background:var(--grl);border-color:var(--gr);color:var(--gr)}
.cyc-d.next{background:var(--pr);border-color:var(--pr);color:var(--ink);box-shadow:0 0 16px rgba(var(--prRGB),.3)}
.cyc-arr{color:var(--dm);font-size:15px;padding:0 8px}
.cyc-tl{display:flex;align-items:center;overflow-x:auto;padding:6px 0;gap:0}
.cyc-node{display:flex;flex-direction:column;align-items:center;flex-shrink:0;min-width:36px}
.cyc-gap{display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;padding:0 9px;color:var(--mu);font-size:9px;font-weight:600;white-space:nowrap}
.cyc-dash{width:20px;height:2px;background:var(--cb);border-radius:2px;margin-bottom:3px}
.preview-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--cb);font-size:12px}
.preview-row:last-child{border:none}
.prev2{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px solid var(--cb);cursor:pointer;transition:background .15s}

.prev2-ic{width:30px;height:30px;border-radius:9px;background:var(--ib);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}

/* Stats */
.ch{display:inline-block;font-size:9px;padding:3px 7px;border-radius:6px;background:var(--ib);color:var(--mu);margin:0 2px 3px 0;font-weight:600}
svg text{font-family:var(--body)}

<script>
// ═══════════════ EQUIPMENT ═══════════════
const BAR=11,HEXBAR=7,MAX_BB=80;
// Plate inventory: {w: plate weight kg, q: total count owned (pairs loaded symmetrically)}
// Mains + micro set (pairs of 0.25/0.5/0.75/1kg). q must be even to load evenly.
const PL=[{w:10,q:4},{w:5,q:4},{w:2.5,q:2},{w:1,q:6},{w:0.75,q:2},{w:0.5,q:2},{w:0.25,q:2}];
// Valid weights for a given bar: enumerate every loadable combo (each plate 0..floor(q/2) per side, ×2).
// Bar-aware: the hex/trap bar is lighter (7kg) than the straight bar (11kg), so its ladder differs.
function buildVW(barW){
  const per=PL.map(p=>({w:p.w,max:Math.floor(p.q/2)}));
  const set=new Set([barW]);
  let combos=[0];
  for(const p of per){
    const next=[];
    for(const base of combos)for(let c=0;c<=p.max;c++)next.push(base+c*p.w);
    combos=[...new Set(next)];
  }
  for(const side of combos){const t=Math.round((barW+2*side)*100)/100;if(t<=MAX_BB)set.add(t)}
  return [...set].sort((a,b)=>a-b);
}
const VW=buildVW(BAR);      // 11kg straight bar (default)
const VWH=buildVW(HEXBAR);  // 7kg hex/trap bar
// Landmine lifts (lm:true) load ONE end only — the other pivots on the floor — so plates
// are NOT mirrored: each plate type can fill the single sleeve up to its FULL owned count,
// and total = bar + that single-side load. This is a finer ladder than the symmetric one
// (a lone 0.25kg micro plate → 11.25kg, which mirrored pairs can't make). Bar is still 11kg.
function buildVWL(barW){
  let combos=[0];
  for(const p of PL){const next=[];for(const base of combos)for(let c=0;c<=p.q;c++)next.push(base+c*p.w);combos=[...new Set(next)]}
  const set=new Set([barW]);
  for(const side of combos){const t=Math.round((barW+side)*100)/100;if(t<=MAX_BB)set.add(t)}
  return [...set].sort((a,b)=>a-b);
}
const VWL=buildVWL(BAR);    // 11kg straight bar, single-end (landmine) loading
// Resolve the bar weight + valid-weight ladder an exercise loads on (hex lifts carry bar:7,
// landmine lifts carry lm:true and load one end on the 11kg bar's single-sided ladder).
function barOf(ex){return ex&&ex.bar?ex.bar:BAR}
function vwOf(ex){return ex&&ex.lm?VWL:ex&&ex.bar===HEXBAR?VWH:VW}
// Plate breakdown. lm=true → single loaded end (no ÷2, plates available up to full count);
// otherwise symmetric per-side (÷2, capped at half the owned pairs).
function perSide(t,bar=BAR,lm=false){let r=lm?(t-bar):(t-bar)/2;if(r<0)return null;const o=[];for(const p of PL){const m=lm?p.q:p.q/2;let c=Math.min(Math.floor(r/p.w),m);if(c>0){o.push({w:p.w,c});r-=c*p.w}}return Math.abs(r)<.01?o:null}
function fmtPl(t,bar=BAR,lm=false){if(t<=bar)return'Bar only';const p=perSide(t,bar,lm);return p?p.map(x=>`${x.c}×${x.w%1?x.w:x.w|0}kg`).join(' + '):'—'}
function nxUp(c,vw=VW){for(const w of vw)if(w>c)return w;return c}
function nxDn(c,vw=VW){for(let i=vw.length-1;i>=0;i--)if(vw[i]<c)return vw[i];return c}
// Jump n discrete plate-steps up from current weight (AMRAP-sized, joint-capped)
function nxUpN(c,n,vw=VW){let w=c;for(let i=0;i<n;i++){const nw=nxUp(w,vw);if(nw===w)break;w=nw}return w}
// Lifts where a single good session is NOT enough — heavy spinal-loaded compounds keep a 1-session confirm brake
const CONFIRM_LIFTS=new Set(['deadlift','zercher_b','zercher_a','hex_dl','hex_squat_b']);
function snapW(t,vw=VW){let b=vw[0];for(const w of vw)if(Math.abs(w-t)<Math.abs(b-t))b=w;return b}
// Tolerant weight equality — ladder weights are exact, but a manually-typed "38.0" vs a
// stored 38 (or re-anchor dust) must still bucket together for stall/confirm counting.
const wEq=(a,b)=>Math.abs((a||0)-(b||0))<0.001;
function plateH(t,bar=BAR,lm=false){if(!t||t<=bar)return'';const ps=perSide(t,bar,lm);if(!ps||!ps.length)return'';let h='<div class="pls">';for(const p of ps)for(let i=0;i<p.c;i++){const c=p.w>=10?'pl-10':p.w>=5?'pl-5':p.w>=2.5?'pl-2':'pl-1';h+=`<div class="pl ${c}">${p.w%1?p.w:p.w|0}</div>`}h+=`</div>`;return h}

{id:'hex_dl',nm:'Hex Bar Deadlift',s:3,rp:'5',rst:'3:00',rir:'2',tp:'bb',bar:7,rl:'Neutral grip, centered load. ⚠ Hex bar is 7kg (light) — loads sit lower than a straight bar. Confirm → ↑ weight.',tg:5,rstS:180,tempo:'3-1-2-0',isoWU:'Mid-pull hold 2×10s',perSide:false},

{id:'pullup_a',nm:'Pull-ups (Wide)',s:4,rp:'4-8',rst:'2:30',rir:'1-2',tp:'band',rl:'4×8 → less assistance. Full ROM, control through bottom (no dead-hang).',tg:8,rstS:150,tempo:'3-1-2-1',bandMode:'assist',perSide:false},
{id:'floor_press',nm:'Floor Press',s:3,rp:'8-10',rst:'2:00',rir:'2',tp:'bb',rl:'Confirm → ↑ weight. Wrist wraps.',tg:10,rstS:120,tempo:'3-1-2-0',perSide:false},
{id:'bb_rear_row',nm:'Bent-Over Barbell Rear-Delt Row',s:3,rp:'12-15',rst:'1:00',rir:'2-3',tp:'bb',rl:'Bent-over hinge, flat back. Row the bar to chest / upper-sternum, elbows high and wide. Squeeze rear delts at the top — don\'t shrug or use the lats. Confirm → ↑ weight.',tg:15,rstS:60,tempo:'2-1-2-1',perSide:false},
{id:'lm_lateral',nm:'Landmine Lateral Raise',s:3,rp:'12-15',rst:'1:00',rir:'1-2',tp:'bb',lm:true,rl:'Hold the bar end in one hand. Raise out to the side leading with the elbow, controlled lower. Stop at shoulder height. Load plates on the FREE end only (the app tracks single-end load; leverage makes it feel lighter — that\'s fine). Confirm → ↑ weight.',tg:15,rstS:60,tempo:'2-0-1-1',perSide:false},

// Effective sets per muscle over the last N days, ALL locations — muscle stimulus
// accumulates regardless of venue, and the A→B→C rotation can span both within a
// week, so a per-location filter would undercount and raise false below-MEV flags.
function getWeeklyVolume(days){
  const cut=new Date();cut.setDate(cut.getDate()-(days||7));
  const cutS=ymd(cut);
  const tot={};
  for(const s of D.sessions){
    if(s.date<cutS)continue;
    for(const e of s.ex){
      const map=MG[e.id];if(!map)continue;
      const sets=(e.reps||[]).filter(r=>Number(r)>0).length;if(!sets)continue;
      for(const[m,w] of Object.entries(map))tot[m]=(tot[m]||0)+sets*w;
    }
  }
  return tot;
}

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
// Local calendar date (YYYY-MM-DD). NOTE: never use toISOString() to derive a
// calendar day — it converts to UTC and rolls back a day for UTC+ timezones
// (e.g. NZ mornings), which silently mis-dates sessions, rest-day detection,
// the heatmap and weekly buckets.
function ymd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function today(){return ymd(new Date())}
// Banner dismissal: a banner stays hidden only while its "sig" (situation signature) is unchanged.
// When the underlying state moves on (more sessions, new week), the sig changes and the banner returns.
function bannerDismissed(key,sig){return D.dismissed&&D.dismissed[key]===String(sig)}
function dismissBanner(key,sig){if(!D.dismissed)D.dismissed={};D.dismissed[key]=String(sig);save();render()}
function fmtD(d){return new Date(d+'T00:00:00').toLocaleDateString('en-NZ',{weekday:'short',day:'numeric',month:'short'})}
function dAgo(d){const x=Math.floor((new Date()-new Date(d+'T00:00:00'))/864e5);return x===0?'Today':x===1?'Yesterday':`${x}d ago`}
function elapsed(){if(!SS)return'';const s=Math.floor((Date.now()-SS)/1000),m=Math.floor(s/60);return`${m}:${String(s%60).padStart(2,'0')}`}
function getCurPR(){return getProgram(D.phase,D.location,D.trainingWeek)}

// ═══════════════ PERIODIZATION ═══════════════
function getPhaseInfo(){
const wksSince=Math.max(1,Math.floor((new Date()-new Date(D.phaseStart+'T00:00:00'))/6048e5)+1);
const sessSince=D.sessions.filter(s=>s.date>=D.phaseStart).length;
const p=PHASES[D.phase]||PHASES[1];
// Intelligent phase assessment: check how many exercises are stalling
const pr=getCurPR();const allDays=Object.values(pr);
let stalledEx=0,totalEx=0,progressingEx=0;
for(const day of allDays)for(const ex of day){if(ex.tp==='bw'||ex.tp==='carry'||ex.tp==='club'||ex.tp==='mace')continue;
  const sg=getSmartSugg(ex);totalEx++;
  if(sg.type==='dn'||sg.stalled)stalledEx++;
  if(sg.type==='up'||sg.type==='cf')progressingEx++}
const timerDue=wksSince>=p.wk;
const stallDue=stalledEx>=2; // 2+ exercises genuinely stalling (below min range)
// Phase change recommended if: timer AND stalls, OR early if lots of stalls
const recommend=timerDue&&stallDue?'due':timerDue&&!stallDue?'timer_only':!timerDue&&stallDue?'early_stall':'not_due';
return{phase:D.phase,name:p.name,desc:p.desc,wk:wksSince,maxWk:p.wk,sess:sessSince,
  recommend,stalledEx,progressingEx,totalEx,timerDue,stallDue}}
function advancePhase(){const next=D.phase>=3?1:D.phase+1;D.phase=next;D.phaseStart=today();save()}

// ═══════════════ PROGRESSION ═══════════════
function getHist(exId,n=20){const h=[];for(let i=D.sessions.length-1;i>=0&&h.length<n;i--){const e=D.sessions[i].ex.find(x=>x.id===exId);if(e)h.unshift({...e,date:D.sessions[i].date})}return h}
function getLast(exId){const h=getHist(exId,1);return h.length?h[0]:null}
function getRepMin(ex){const parts=ex.rp.replace(/\/.*/, '').split('-');return parseInt(parts[0])||ex.tg}
function getDiscomfortRecent(exId,n=3){return D.discomfort.filter(d=>d.exId===exId).slice(-n)}

// CONVENTION: reps are entered AS PERFORMED PER SIDE for perSide exercises,
// matching the on-screen prescription ("8/side" → type 8). Targets (tg) and
// rep minimums are also per-side, so entered values compare directly — no
// halving. (The old Patch-2 halving assumed both-sides totals were entered,
// which made every per-side exercise need double the displayed reps to progress.)
function effectiveReps(ex,reps){
return (reps||[]).filter(r=>Number(r)>0).map(Number)}

// ── Form quality (1–5: 5=Strict … 1=Negatives). Per-set scores are the source of
// truth; sessClean() gates progression — a session only counts as a "clean hit"
// if no working set was rated below FORM_MIN. Unrated sets count as clean, so
// gating is opt-in and historical data is never penalised. ──
const FORM_LABELS=['','Negatives','Loose','Hybrid','Solid','Strict'];
const FORM_C=['','var(--rd)','#fb923c','var(--am)','#a3e635','var(--gr)'];
const FORM_MIN=4;
function sessClean(h){const f=h&&h.form;if(!Array.isArray(f)||!f.length)return true;
for(let i=0;i<f.length;i++){const r=Number((h.reps||[])[i]);if(r>0&&f[i]>0&&f[i]<FORM_MIN)return false}return true}
// Worst rated working-set score for a session (0 = unrated) — for display + rollup.
function sessForm(h){const f=h&&h.form;if(!Array.isArray(f))return 0;let m=0;
for(let i=0;i<f.length;i++){const r=Number((h.reps||[])[i]);if(r>0&&f[i]>0)m=m?Math.min(m,f[i]):f[i]}return m}

// Tonnage helper. perSide reps are logged per side, so the load is moved twice
// the entered rep count; per_db means the entered weight is per dumbbell with two
// held. Carries log steps/metres in the rep field — excluding them keeps kg·steps
// from dwarfing real tonnage (32kg × 120 steps was adding ~3.8t to a session).
function calcExVol(exId,wt,reps){
const def=ALL_EX.find(e=>e.id===exId);
if(def&&def.tp==='carry')return 0;
const vr=(reps||[]).filter(r=>Number(r)>0).map(Number);
if(!wt||!vr.length)return 0;
const mult=((def&&def.loadUnit==='per_db')?2:1)*((def&&def.perSide)?2:1);
return wt*mult*vr.reduce((a,b)=>a+b,0)}

// RPE scale — replaces emoji system
const RPE_LABELS=['Light','Moderate','Hard','Very Hard','Maximal'];
const RPE_COLORS=['var(--gr)','var(--pr)','var(--am)','var(--rd)','#9f1239'];
const RPE_SHORT=['L','M','H','VH','MAX'];

// ═══════════════ RELATED EXERCISE MAPPINGS ═══════════════
// When a new exercise has no history, fall back to a related exercise's most recent
// weight/band to suggest a sensible starting load.
// Format: 'new_ex_id': {id:'related_ex_id', mult:number, addKg:number, note:string}
//   mult — multiplier on related weight (default 1.0)
//   addKg — kg to add after multiplication (default 0)
const RELATED_EX={
  // Home program new exercises
  // Hex-bar lifts (NEW pattern — loads do NOT carry from straight DL / Zercher). Seed low on the
  // 7kg bar and let the engine progress from a feel-out set. All seeds are valid VWH (7kg) weights.
  'hex_dl':         {id:null,               seedWt:40, note:'NEW — hex DL ≠ straight deadlift. Feel-out set on the 7kg bar.'},
  'hex_squat_b':    {id:null,               seedWt:48, note:'NEW — high-handle hex squat (heavy) ≠ Zercher. Feel-out set, build from here.'},
  'hex_carry':      {id:null,               seedWt:30, note:'NEW — hex farmer carry on the 7kg bar (30kg total). Push distance, then load.'},
  // Landmine / barbell accessory swaps (NEW — loads do NOT carry from the band lifts they replace).
  // Landmine lifts load ONE end of the 11kg bar, so 11kg (bar only) is the floor — seed there
  // and add plates to the free end up the single-sided ladder. bb_rear_row is a true two-handed
  // barbell row, seeded as a normal symmetric lift.
  'bb_rear_row':    {id:null,               seedWt:15, note:'NEW — barbell rear-delt row replaces band face pull. Feel-out at 15kg (1kg/side), build from there.'},
  'lm_lateral':     {id:null,               seedWt:11, note:'NEW — landmine lateral. Start bar-only (11kg, no plates); leverage makes it feel light. Add plates to the free end as it gets easy.'},
  'lm_pallof':      {id:null,               seedWt:11, note:'NEW — landmine anti-rotation replaces band Pallof. Start bar-only (11kg), then load the free end.'},
  'b_stance_rdl':   {id:'rdl',              mult:0.7,  seedWt:32, note:'~70% of bilateral RDL, front-foot loaded'},
  'band_er':        {id:'ext_rot',          mult:1.0,            note:'same movement, renamed v12'},
  'pallof_press':   {id:'pallof',           mult:1.0,            note:'same movement, renamed v12'},
  // Delts / arms — no clean peer lift, use validated starting loads from audit prescription
  'lateral_raise':  {id:null,               seedBand:'Red',      note:'never trained — start lightest band (Red), strict to 15, then → thicker band'},
  'rear_delt':      {id:null,               seedBand:'Red',      note:'new movement — start lightest band (Red), build up. Do NOT inherit maxed face-pull band'},
  'kb_curl':        {id:null,               seedWt:16,           note:'neutral-grip KB by horns, soft elbow'},
  'band_pushdown':  {id:null,               seedBand:'Purple',   note:'resistance band; target → thicker band'},
  // Partner program new/never-logged exercises
  'db_rdl':         {id:'db_row_b',         mult:0.85,           note:'rough DB load proxy from row'},
  'db_floor_press': {id:'db_floor_press_v', mult:1.0, addKg:0.5, note:'heavy slot, +0.5kg over volume slot'},
  'db_sl_rdl':      {id:'db_lunge',         mult:1.0,            note:'similar unilateral DB load'},
  'cb_mills':       {id:'cb_shield',        mult:1.0,            note:'same clubbell weight class'}
};

function getRelatedSuggestion(ex){
  const rel=RELATED_EX[ex.id];
  if(!rel)return null;
  // No peer lift — use explicit seed value from audit prescription
  if(!rel.id){
    if(rel.seedBand)return{wt:null,band:rel.seedBand,note:rel.note,relName:'starting load'};
    if(rel.seedWt!=null)return{wt:rel.seedWt,band:'',note:rel.note,relName:'starting load'};
    return null;
  }
  const relHist=getHist(rel.id,5);
  const relLast=relHist.length?relHist[relHist.length-1]:null;
  // Peer lift has no history — fall back to seed if one is provided
  if(!relLast){
    if(rel.seedWt!=null)return{wt:rel.seedWt,band:'',note:rel.note,relName:'starting load'};
    return null;
  }
  // Band exercises: copy band setting
  if(ex.tp==='band'&&relLast.band){
    return{wt:null,band:relLast.band,note:`${rel.note} (${relLast.band})`,relName:(ALL_EX.find(e=>e.id===rel.id)||{}).nm||rel.id};
  }
  // BW exercises with no weight: use rep total as reference
  if(ex.tp==='bw'&&(!relLast.wt||relLast.wt===0)){
    const tot=relLast.reps.reduce((a,b)=>a+b,0);
    return{wt:null,band:'',note:`${rel.note} — last: ${tot} reps`,relName:(ALL_EX.find(e=>e.id===rel.id)||{}).nm||rel.id};
  }
  // Weighted: compute suggested kg, snap to 0.5kg
  if(relLast.wt){
    let kg=relLast.wt*(rel.mult||1.0)+(rel.addKg||0);
    kg=Math.round(kg*2)/2;
    return{wt:kg,band:'',note:`${rel.note} (last ${relLast.wt}kg)`,relName:(ALL_EX.find(e=>e.id===rel.id)||{}).nm||rel.id};
  }
  return null;
}

function getSmartSugg(ex){
const hist=getHist(ex.id,5),last=hist.length?hist[hist.length-1]:null;
if(!last){
  // No history for this exercise — try a related-exercise fallback
  const rs=getRelatedSuggestion(ex);
  if(rs){
    if(rs.wt!=null)return{text:`Try ${rs.wt}kg`,type:'new',wt:rs.wt,traj:[],detail:`Based on ${rs.relName} · ${rs.note}`,regress:''};
    if(rs.band)return{text:`Try ${rs.band}`,type:'new',wt:null,band:rs.band,traj:[],detail:`Based on ${rs.relName} · ${rs.note}`,regress:''};
    return{text:'New — start light',type:'new',wt:null,traj:[],detail:`Based on ${rs.relName} · ${rs.note}`,regress:''};
  }
  return{text:'First time — find your weight',type:'new',wt:null,traj:[],detail:'',regress:''};
}

// Discomfort check — if moderate discomfort in last 2 sessions, auto-hold
const recentDisc=getDiscomfortRecent(ex.id,3);
const modDisc=recentDisc.filter(d=>d.level==='moderate').length;
const mildDisc=recentDisc.filter(d=>d.level==='mild').length;
let discWarn='';
if(modDisc>=2)discWarn='⚠ Repeated moderate discomfort — hold weight';
else if(modDisc>=1)discWarn='⚠ Moderate discomfort last session — consider holding';
else if(mildDisc>=3)discWarn='⚠ Mild discomfort 3 sessions running — monitor closely';

// ─── WEIGHT-BASED (bb, mace, db, kb) — handle null wt fallback for type migrations (e.g., Cossack bw→bb) ───
// kb (loaded dead bugs etc.) progresses like db: rep-first double progression with
// micro-load steps, rather than falling through to a bare "Continue".
if(ex.tp==='bb'||ex.tp==='mace'||ex.tp==='db'||ex.tp==='kb'){
  // Find most recent session with a valid weight; if none, treat as a brand-new exercise
  const lastWithWt=[...hist].reverse().find(h=>h.wt&&Number(h.wt)>0);
  if(!lastWithWt){
    return{text:'First weighted session — find your starting load',type:'new',wt:null,traj:[],detail:'Earlier sessions were bodyweight or unrecorded.',regress:discWarn}}
  // If most recent session had no weight but earlier ones did, use the earlier weight as reference
  if(!last.wt){
    return{text:`→ ${lastWithWt.wt}kg`,type:'stay',wt:lastWithWt.wt,traj:[],detail:`Last weighted: ${lastWithWt.wt}kg on ${lastWithWt.date}`,regress:discWarn}}
}
if((ex.tp==='bb'||ex.tp==='mace'||ex.tp==='db'||ex.tp==='kb')&&last.wt){
  const mn=getRepMin(ex);
  const atW=hist.filter(h=>wEq(h.wt,last.wt));
  const hitTarget=h=>{const v=effectiveReps(ex,h.reps);return v.length>=ex.s&&v.every(r=>r>=ex.tg)};
  const inRange=h=>{const v=effectiveReps(ex,h.reps);return v.length>=ex.s&&v.every(r=>r>=mn)};
  const stalls=atW.filter(h=>!inRange(h)).length;
  const plateauSess=atW.filter(h=>inRange(h)&&!hitTarget(h)).length;
  // Confirm brake counts CONSECUTIVE recent clean target-hits at the current weight ending
  // now — not lifetime hits — so re-approaching a previously-confirmed weight (after a
  // deload) still requires a fresh confirm session rather than advancing immediately.
  const hitsAtW=(()=>{let n=0;for(let i=hist.length-1;i>=0;i--){const h=hist[i];if(wEq(h.wt,last.wt)&&hitTarget(h)&&sessClean(h))n++;else break}return n})();
  const lastHit=hitTarget(last)&&sessClean(last);const lastInRange=inRange(last);
  const traj=hist.map((h,i)=>{const p=hist[i-1];if(!p)return{s:'●',c:'same'};if(h.wt>p.wt)return{s:'↑',c:'up'};if(h.wt<p.wt)return{s:'↓',c:'dn'};
    const ps=effectiveReps(ex,p.reps).reduce((a,b)=>a+b,0),cs=effectiveReps(ex,h.reps).reduce((a,b)=>a+b,0);
    return cs>ps?{s:'↗',c:'up'}:cs<ps?{s:'↘',c:'dn'}:{s:'→',c:'same'}});
  let regress='';
  if(atW.length>=2){const prev=atW[atW.length-2],curr=atW[atW.length-1];
    const pT=effectiveReps(ex,prev.reps).reduce((a,b)=>a+b,0),cT=effectiveReps(ex,curr.reps).reduce((a,b)=>a+b,0);
    if(cT<pT-2)regress=`Reps dropped ${pT}→${cT} at ${last.wt}kg`}
  if(!regress&&hist.length>=2){const prev=hist[hist.length-2];
    if(prev.wt&&last.wt&&last.wt<prev.wt&&!wEq(last.wt,prev.wt))regress=`Weight dropped ${prev.wt}→${last.wt}kg`;
    else if(wEq(prev.wt,last.wt)){const pT=effectiveReps(ex,prev.reps).reduce((a,b)=>a+b,0),cT=effectiveReps(ex,last.reps).reduce((a,b)=>a+b,0);
    if(cT<pT-2)regress=`Reps dropped ${pT}→${cT}`}}
  if(discWarn)regress=discWarn;
  const dbInc=ex.tp==='db'?0.5:1;
  // Discomfort override — hold weight if moderate pain trending
  if(modDisc>=2){return{text:`→ ${last.wt}kg (hold)`,type:'stay',wt:last.wt,traj,detail:'Holding due to discomfort trend',regress}}
  // Phase-transition re-anchor: if the last session predates the current phase and this
  // lift's rep target changed, re-derive the working load from e1RM for the new target.
  // The achieved reps are CAPPED at the new target so a strong over-target AMRAP can't
  // inflate the anchor heavier: higher-rep phases (Hypertrophy) land lighter, while a
  // lower-rep phase holds at the proven load (tgt===last.wt → no-op) and progresses up
  // from there. Ratio = e1rmF(min(oldReps,newTg))/e1rmF(newTg), so it only ever drops.
  if(PHASE_ADJ_IDS.has(ex.id)&&D.phaseStart&&last.date<D.phaseStart){
    const eRl=effectiveReps(ex,last.reps);
    const repsAch=eRl.length?Math.min(Math.min(...eRl),ex.tg):ex.tg;
    if(last.wt>0){
      const raw=last.wt*e1rmF(repsAch)/e1rmF(ex.tg);
      const tgt=ex.tp==='bb'?snapW(raw,vwOf(ex)):Math.round(raw*2)/2;
      if(tgt>0&&tgt!==last.wt){
        const dir=tgt<last.wt?'lighter':'heavier';
        return{text:`→ ${tgt}kg${ex.tp==='db'?'/DB':''}`,type:'new',wt:tgt,traj,
          detail:`New phase (${(PHASES[D.phase]||PHASES[1]).name}) — re-anchored ${dir} for ${ex.s}×${ex.tg}${ex.perSide?'/side':''}. Adjust to taste, then progress from here.`,regress}}
    }
  }
  // FORM GATE — hit the reps but a working set was rated below clean: hold load and
  // clean it up rather than advancing on broken-down reps.
  if(hitTarget(last)&&!sessClean(last)){
    return{text:`→ ${last.wt}kg${ex.tp==='db'?'/DB':''} (clean up)`,type:'stay',wt:last.wt,traj,
      detail:`Hit ${ex.s}×${ex.tg}${ex.perSide?'/side':''} but form slipped (${FORM_LABELS[sessForm(last)]||'breakdown'}) — hold and get strict reps before adding load.`,regress}}
  // HIT TARGET (single-session double progression). AMRAP signal = reps over target on the last set.
  if(lastHit){
    const isConfirmLift=CONFIRM_LIFTS.has(ex.id);
    // Heavy spinal compounds keep a 1-session confirm brake (joint safety): need 2 sessions at target.
    if(isConfirmLift&&hitsAtW<2){
      return{text:`→ Confirm ${last.wt}kg`,type:'cf',wt:last.wt,traj,detail:`Hit ${ex.s}×${ex.tg}${ex.perSide?'/side':''} — confirm once more (heavy lift), then ↑`,regress}}
    // AMRAP: how many reps over target on the lowest working set drives the jump size.
    const eRl=effectiveReps(ex,last.reps);
    const minRep=eRl.length?Math.min(...eRl):ex.tg;
    const over=minRep-ex.tg; // 0 = just hit target; higher = lots in reserve
    if(ex.tp==='bb'){
      // joint-capped: 1 plate-step normally, 2 steps only if comfortably over (≥3 reps past target on every set)
      const steps=over>=3?2:1;
      const nxt=nxUpN(last.wt,steps,vwOf(ex));
      // nxUpN can't exceed the plate inventory, so "at ceiling" shows up as no
      // movement (nxt===last.wt), not as nxt>MAX_BB — that branch was unreachable.
      if(nxt<=last.wt){
        return{text:`🔒 MAX — push reps`,type:'st',wt:last.wt,traj,detail:`At plate ceiling. Expand rep range or add tempo.`,regress,maxed:true}}
      const jump=Math.round((nxt-last.wt)*10)/10;
      return{text:`↑ ${nxt}kg`,type:'up',wt:nxt,traj,detail:over>=3?`Hit ${ex.s}×${ex.tg}+${over} — strong, +${jump}kg`:`Hit ${ex.s}×${ex.tg} — +${jump}kg`,regress}}
    // DB / mace: micro-load. AMRAP scales how many 0.5kg steps (1 normally, 2 if ≥3 over).
    const steps=over>=3?2:1;
    const nxt=Math.round((last.wt+dbInc*steps)*10)/10;
    return{text:`↑ ${nxt}kg${ex.tp==='db'?'/DB':''}`,type:'up',wt:nxt,traj,detail:over>=3?`Hit ${ex.s}×${ex.tg}+${over} — +${(dbInc*steps)}kg`:`Hit ${ex.s}×${ex.tg} — +${dbInc}kg`,regress}}
  // FAILING (below minimum) → escalation ladder: rep-scheme cluster first, then load reset
  if(!lastInRange){
    if(stalls>=3){
      // True deload: back off ~10% (the prior one-rung step was <2% on a micro-plate
      // ladder, so it sent you straight back into the same wall). bb snaps to the
      // nearest valid weight ≤90% (never below the bar); micro-load lifts round to 0.5kg.
      let d;
      if(ex.tp==='bb'){const vw=vwOf(ex),cap=last.wt*0.9;d=[...vw].reverse().find(w=>w<=cap)??vw[0]}
      else d=Math.max(0,Math.round(last.wt*0.9*2)/2);
      // At/near the lightest load (bar-only) there is no lower rung — a "deload" would be a
      // phantom 0kg cut. Switch to rep/tempo rebuild instead of printing a fake percentage.
      if(d>=last.wt){
        return{text:`→ ${last.wt}kg${ex.tp==='db'?'/DB':''} (rebuild)`,type:'stay',wt:last.wt,traj,stalled:true,
          detail:`${stalls} stalls at ${last.wt}kg — already the lightest load. Add tempo/pauses and rebuild ${ex.s}×${mn}${ex.perSide?'/side':''} reps before adding load.`,regress}}
      const cut=Math.round((last.wt-d)*10)/10;
      const pct=Math.round((last.wt-d)/last.wt*100);
      return{text:`↓ ${d}kg${ex.tp==='db'?'/DB':''}`,type:'dn',wt:d,traj,stalled:true,detail:`${stalls} sessions below ${ex.s}×${mn}${ex.perSide?'/side':''} — deload to ${d}kg (−${cut}kg, ~${pct}%) and rebuild`,regress}}
    if(stalls===2){
      // Before the reset: try a cluster/rep-scheme tweak (GZCLP-style) to break through
      return{text:`→ ${last.wt}kg (cluster)`,type:'stay',wt:last.wt,traj,detail:`${stalls}/3 stalls. Try clusters: ${ex.s+1}×${Math.max(1,mn-2)} this session before any load cut.`,regress}}
    return{text:`→ ${last.wt}kg`,type:'stay',wt:last.wt,traj,detail:`Below min. ${stalls}/3 stalls. Push for ${ex.s}×${mn}+${ex.perSide?' /side':''}`,regress}}
  // IN RANGE but not at target → push reps; if stuck for many sessions, escalate to adding a set
  const eR=effectiveReps(ex,last.reps);
  const avgRep=eR.length?Math.round(eR.reduce((a,b)=>a+b,0)/eR.length):0;
  let tip=`Push for ${ex.s}×${ex.tg}${ex.perSide?'/side':''}`;
  if(plateauSess>=4)tip=`${plateauSess} sessions stuck at ~${avgRep}. Add a set (${ex.s+1}×) to push volume, or try ${Math.min(avgRep+1,ex.tg)},${avgRep},${avgRep}.`;
  else if(plateauSess>=2)tip=`Building at ~${avgRep}. Push the top set for ${Math.min(avgRep+1,ex.tg)}.`;
  return{text:`→ ${last.wt}kg`,type:'stay',wt:last.wt,traj,detail:tip,regress}}

// ─── CLUB exercises (perSide-aware) ───
if(ex.tp==='club'){
  const traj=hist.map((h,i)=>{if(!i)return{s:'●',c:'same'};const pw=hist[i-1].wt||0,cw=h.wt||0;
    return cw>pw?{s:'↑',c:'up'}:cw<pw?{s:'↓',c:'dn'}:{s:'→',c:'same'}});
  const reps=effectiveReps(ex,last.reps);
  const totalReps=reps.reduce((a,b)=>a+b,0);
  const allHit=reps.length>=ex.s&&reps.slice(0,ex.s).every(r=>r>=ex.tg);
  if(allHit){return{text:`${last.wt||6}kg — smooth? → try ${(last.wt||6)+2}kg`,type:'up',wt:last.wt,traj,detail:`Hit target${ex.perSide?' /side':''}. Progress if shoulder feels smooth.`,regress:discWarn}}
  return{text:`${last.wt||6}kg club`,type:'stay',wt:last.wt,traj,detail:`Focus on smooth form. ${totalReps} eff. reps${ex.perSide?' /side':''}.`,regress:discWarn}}

// ─── BAND exercises (bandMode-aware: assist vs resist) ───
if(ex.tp==='band'){
  const isResist=ex.bandMode==='resist';
  const traj=hist.map((h,i)=>{if(!i)return{s:'●',c:'same'};const pi=BAND_IDX(hist[i-1].band),ci=BAND_IDX(h.band);
    if(isResist){return ci<pi?{s:'↑',c:'up'}:ci>pi?{s:'↓',c:'dn'}:{s:'→',c:'same'}}
    return ci>pi?{s:'↑',c:'up'}:ci<pi?{s:'↓',c:'dn'}:{s:'→',c:'same'}});
  const reps=effectiveReps(ex,last.reps);
  const hitTop=reps.length>=ex.s&&reps.slice(0,ex.s).every(r=>r>=ex.tg);
  let regress=discWarn;if(!regress&&hist.length>=2){const prev=hist[hist.length-2];
    if(BAND_IDX(prev.band)===BAND_IDX(last.band)){const pT=effectiveReps(ex,prev.reps).reduce((a,b)=>a+b,0),cT=reps.reduce((a,b)=>a+b,0);
    if(cT<pT-2)regress=`Reps dropped ${pT}→${cT}`}}
  // FORM GATE — for assist bands this is the key save: hitting reps with negatives/
  // partials must NOT trigger "less assistance", or it pushes you off a cliff.
  if(hitTop&&!sessClean(last)){
    const fl=FORM_LABELS[sessForm(last)]||'breakdown';
    return{text:`Stay on ${last.band||'band'} — clean up`,type:'stay',wt:null,traj,
      detail:isResist?`Hit ${ex.s}×${ex.tg} but form slipped (${fl}) — get strict reps before more resistance.`:`Hit ${ex.s}×${ex.tg} with ${fl.toLowerCase()} (not strict) — get clean reps on this band before reducing assistance.`,regress}}
  if(hitTop){
    if(isResist){
      const curIdx=BAND_IDX(last.band);
      if(curIdx<=0)return{text:'At max resistance — add pause/tension',type:'st',wt:null,traj,
        detail:`Hit ${ex.s}×${ex.tg}${ex.perSide?'/side':''} at heaviest band`,regress};
      return{text:'↑ More resistance (thicker)',type:'up',wt:null,traj,
        detail:`Hit ${ex.s}×${ex.tg}${ex.perSide?'/side':''} — increase band resistance`,regress}}
    // assist mode
    const curIdx=BAND_IDX(last.band);
    if(curIdx>=BANDS.length-1)return{text:'No band! 🎉',type:'up',wt:null,traj,
      detail:`Hit ${ex.s}×${ex.tg} — try unassisted`,regress};
    return{text:'↑ Less assistance (thinner)',type:'up',wt:null,traj,
      detail:`Hit ${ex.s}×${ex.tg} — reduce band help`,regress}}
  return{text:last.band||'Check band',type:'stay',wt:null,traj,detail:`Stay on ${last.band||'current'}`,regress}}

// ─── CARRY exercises ───
if(ex.tp==='carry'||(ex.tp==='db'&&ex.id.includes('carry'))){
  const lastWt=last.wt||0;
  return{text:lastWt?`${lastWt}kg`:'Log weight',type:'stay',wt:lastWt,traj:[],detail:'↑ load or distance when comfortable',regress:discWarn}}

// ─── BODYWEIGHT (push-ups, inverted rows, dead bugs, dand-baithak) — perSide-aware ───
if(ex.tp==='bw'){
  const reps=effectiveReps(ex,last.reps);
  const totalReps=reps.reduce((a,b)=>a+b,0);
  const isDand=ex.id.includes('dand');
  if(isDand){return{text:`${last.reps.filter(r=>r>0).reduce((a,b)=>a+b,0)} total`,type:'stay',wt:null,traj:[],detail:ex.rl,regress:''}}
  const traj=hist.map((h,i)=>{if(!i)return{s:'●',c:'same'};
    const pt=effectiveReps(ex,hist[i-1].reps).reduce((a,b)=>a+b,0),ct=effectiveReps(ex,h.reps).reduce((a,b)=>a+b,0);
    return ct>pt?{s:'↗',c:'up'}:ct<pt?{s:'↘',c:'dn'}:{s:'→',c:'same'}});
  const allHit=reps.length>=ex.s&&reps.slice(0,ex.s).every(r=>r>=ex.tg);
  let regress=discWarn;
  if(!regress&&hist.length>=2){const pt=effectiveReps(ex,hist[hist.length-2].reps).reduce((a,b)=>a+b,0);
    if(totalReps<pt-3)regress=`Total reps dropped ${pt}→${totalReps}`}
  if(allHit&&!sessClean(last))return{text:`Clean up the reps`,type:'stay',wt:null,traj,detail:`Hit ${ex.s}×${ex.tg} but form slipped (${FORM_LABELS[sessForm(last)]||'breakdown'}) — get strict full-ROM reps before progressing.`,regress};
  if(allHit)return{text:`Hit target${ex.perSide?' /side':''} — progress`,type:'up',wt:null,traj,detail:ex.rl,regress};
  return{text:`${totalReps} reps${ex.perSide?' /side':''}`,type:'stay',wt:null,traj,detail:`Push for ${ex.s}×${ex.tg}${ex.perSide?'/side':''}`,regress}}

// ─── Fallback ───
return{text:last.wt?`${last.wt}kg`:'Continue',type:'stay',wt:last.wt,traj:[],detail:'',regress:discWarn}}

function getPRs(exId){let bw=0,bv=0,be=0;const def=ALL_EX.find(x=>x.id===exId);
for(const s of D.sessions)for(const e of s.ex)if(e.id===exId){const vr=e.reps.filter(r=>r>0);if(!vr.length)continue;
const eR=effectiveReps(def,e.reps);const mx=eR.length?Math.max(...eR):0;
const vol=calcExVol(e.id,e.wt,e.reps);
if(e.wt>bw)bw=e.wt;if(vol>bv)bv=vol;{const x=e1rm(e.wt,mx);if(x>be)be=x}}
return{bestWt:bw,bestVol:bv,bestE1RM:Math.round(be*10)/10}}
function checkPR(exId,wt,reps){const pr=getPRs(exId),vr=reps.filter(r=>r>0);if(!vr.length)return[];const ps=[];
const vol=calcExVol(exId,wt,reps);
if(wt&&wt>pr.bestWt&&pr.bestWt>0)ps.push('WT');if(vol>pr.bestVol&&pr.bestVol>0)ps.push('VOL');return ps}
// Rep→1RM multiplier. Epley (1+r/30) tracks well at low reps but turns optimistic
// past ~10; Lombardi (r^0.1) is the conservative curve there. min() of the two is
// continuous (crossover ≈7 reps) and keeps 10–20-rep accessory e1RMs honest.
// Shared with the phase re-anchor so load translation uses one curve both ways.
function e1rmF(reps){return reps<=1?1:Math.min(1+reps/30,Math.pow(reps,0.10))}
function e1rm(wt,reps){return reps<=0||!wt?0:Math.round(wt*e1rmF(reps)*10)/10}
function warmupSets(wt,bar=BAR,vw=VW,lm=false){if(!wt||wt<=bar)return[];const s=[{wt:bar,reps:8,l:'Bar only'}];const w60=snapW(bar+(wt-bar)*.5,vw),w80=snapW(bar+(wt-bar)*.8,vw);if(w60>bar&&w60<wt)s.push({wt:w60,reps:5,l:fmtPl(w60,bar,lm)});if(w80>w60&&w80<wt)s.push({wt:w80,reps:3,l:fmtPl(w80,bar,lm)});return s}

// Discomfort analysis
function getDiscomfortTrend(exId,joint){const recent=D.discomfort.filter(d=>d.exId===exId&&d.joint===joint).slice(-5);
return{count:recent.length,recent3:recent.slice(-3).filter(d=>d.level!=='none').length}}

// Bar chart for weekly series; data=[{v,lbl}], optional target line
function svgBars(data,W,H,color,label,opts){
opts=opts||{};
if(!data.length)return`<div class="dm" style="text-align:center;padding:16px">No data yet</div>`;
const pad={t:22,r:10,b:24,l:34},w=W-pad.l-pad.r,h=H-pad.t-pad.b;
const mx=Math.max(...data.map(d=>d.v),opts.target||0,1);
const bw=w/data.length,gap=Math.min(6,bw*0.25);
let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">`;
for(let i=0;i<=3;i++){const y=pad.t+(h/3)*i,v=Math.round(mx-(mx/3)*i);
s+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#2c2745" stroke-width="1"/><text x="${pad.l-4}" y="${y+3}" text-anchor="end" fill="#988fb8" font-size="9">${v}</text>`}
data.forEach((d,i)=>{const bh=Math.max(1,(d.v/mx)*h);const x=pad.l+i*bw+gap/2,y=pad.t+h-bh;
s+=`<rect x="${x}" y="${y}" width="${bw-gap}" height="${bh}" rx="3" fill="${color}"/>`;
if(data.length<=12)s+=`<text x="${x+(bw-gap)/2}" y="${H-12}" text-anchor="middle" fill="#988fb8" font-size="7.5">${d.lbl}</text>`});
if(opts.target){const ty=pad.t+h-(opts.target/mx)*h;s+=`<line x1="${pad.l}" y1="${ty}" x2="${W-pad.r}" y2="${ty}" stroke="#fb7185" stroke-width="1" stroke-dasharray="4 3"/>`}

function svgLine(data,W,H,color,label){

s+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#2c2745" stroke-width="1"/><text x="${pad.l-4}" y="${y+3}" text-anchor="end" fill="#988fb8" font-size="9">${v}</text>`}

function getFatigue(){const now=new Date(),scores=[];
for(let i=0;i<7;i++){const d=new Date(now);d.setDate(d.getDate()-i);const ds=ymd(d);
D.sessions.filter(s=>s.date===ds).forEach(s=>{let vol=0;s.ex.forEach(e=>{vol+=calcExVol(e.id,e.wt,e.reps)});scores.push({vol,diff:s.difficulty||3})});
D.cardioLog.filter(c=>c.date===ds).forEach(c=>scores.push({vol:c.duration*(c.intensity==='hard'?30:c.intensity==='moderate'?25:20),diff:3}))}
if(!scores.length)return{score:0,label:'Fresh',color:'var(--gr)'};
const f=scores.length,ad=scores.reduce((a,b)=>a+b.diff,0)/f,tv=scores.reduce((a,b)=>a+b.vol,0);
const sc=Math.round(Math.min(10,f*1.2+ad*.9+tv/(1200*Math.max(1,f)))*10)/10;
if(sc<=3)return{score:sc,label:'Fresh',color:'var(--gr)'};if(sc<=5)return{score:sc,label:'Ready',color:'var(--pr)'};
if(sc<=7)return{score:sc,label:'Building',color:'var(--am)'};return{score:sc,label:'Fatigued',color:'var(--rd)'}}

function getDeload(){const st=D.lastDeload||D.sessions[0]?.date;if(!st)return null;const wk=Math.max(1,Math.floor((new Date()-new Date(st+'T00:00:00'))/6048e5)+1);
const sc=D.lastDeload?D.sessions.filter(s=>s.date>D.lastDeload).length:D.sessions.length;
// Signal-driven: don't deload on timer alone — check for actual fatigue signals.
// Average RPE over the last 14 days (not the last 5 sessions whenever they were)
// so a fortnight-old hard block can't keep flagging fatigue today. Fall back to
// the 5 most recent rated sessions if nothing falls inside the window.
const cut14=ymd(new Date(Date.now()-14*864e5));
let rated=D.sessions.filter(s=>s.date>=cut14&&s.difficulty);
if(!rated.length)rated=D.sessions.filter(s=>s.difficulty).slice(-5);
const avgDiff=rated.length?rated.reduce((a,s)=>a+s.difficulty,0)/rated.length:0;
const highFatigue=avgDiff>=4;
// For beginners (<30 sessions), extend timer to 8 weeks and require signals
const isBeginner=D.sessions.length<30;const timerThresh=isBeginner?8:6;
const due=wk>=timerThresh&&highFatigue;const consider=wk>=timerThresh&&!highFatigue;
return{wk,sc,due,consider,isBeginner,avgDiff:Math.round(avgDiff*10)/10}}

// Wall-clock based: setInterval is throttled/paused with the screen off on
// mobile, so counting ticks drifts long. Recompute remaining from an end
// timestamp each tick — after a background pause the display resyncs instantly.
function startTimer(secs){clearTimer();TIMER={tot:secs,end:Date.now()+secs*1000,left:secs,done:false};
TIV=setInterval(()=>{TIMER.left=Math.max(0,Math.ceil((TIMER.end-Date.now())/1000));
if(TIMER.left<=0&&!TIMER.done){TIMER.done=true;clearInterval(TIV);TIV=null;
try{navigator.vibrate([200,100,200,100,200])}catch(e){}playBeep();notifyRestDone()}rTimer()},500);rTimer()}
// Notifications — best-effort, no backend. The reliably-deliverable case is the
// rest-timer alert while the app sits backgrounded on a locked phone; true
// scheduled "train today" pushes need a server, so we only fire what the browser
// will honour from a live (even if hidden) page.
function notifyOK(){return D.notify&&D.notify.enabled&&D.notify.rest&&typeof Notification!=='undefined'&&Notification.permission==='granted'}
function notifyRestDone(){if(!notifyOK())return;
if(typeof document!=='undefined'&&document.visibilityState==='visible')return; // pill+beep already visible
try{new Notification('Rest complete 💪',{body:'Back to it — next set.',tag:'rft-rest',silent:false})}catch(e){}}
function reqNotify(){if(typeof Notification==='undefined'){alert('This browser does not support notifications.');return}
Notification.requestPermission().then(p=>{D.notify=D.notify||{enabled:false,rest:true};
D.notify.enabled=(p==='granted');if(p==='granted'){D.notify.rest=true;
try{new Notification('Notifications on ✓',{body:'Rest timers will ping you when they finish.',tag:'rft-test'})}catch(e){}}
else if(p==='denied')alert('Notifications are blocked. Enable them for this site in your browser settings.');
save();render()})}

function playBeep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();
o.connect(g);g.connect(a.destination);o.frequency.value=880;o.type='square';g.gain.value=.25;o.start();o.stop(a.currentTime+.12);
setTimeout(()=>{const o2=a.createOscillator(),g2=a.createGain();o2.connect(g2);g2.connect(a.destination);o2.frequency.value=1100;o2.type='square';g2.gain.value=.25;o2.start();o2.stop(a.currentTime+.15)},180)}catch(e){}}

const m=Math.floor(Math.abs(TIMER.left)/60),s=Math.abs(TIMER.left)%60,sg=TIMER.left<0?'+':'';
el.innerHTML=`<div class="timer-pill${TIMER.done?' done':''}"><span class="t-time">${sg}${m}:${String(s).padStart(2,'0')}</span>

// Training-cycle position + rest-day gaps for the home cue.
// Walks all sessions (both locations) to show where you are in the A→B→C rotation
// and how many rest days fell between recent sessions.
function getCycleInfo(){
const order=['A','B','C'];
const ss=[...D.sessions].sort((a,b)=>a.date.localeCompare(b.date));
// recent timeline: last up to 5 sessions; gap = calendar days from the previous session
const recent=ss.slice(-5).map((s,i,arr)=>{const prev=arr[i-1];
const gap=prev?Math.round((new Date(s.date+'T00:00:00')-new Date(prev.date+'T00:00:00'))/864e5):null;
return{day:s.day,loc:s.loc||'home',date:s.date,gap}});
// days completed in the current cycle: walk back to and including the most recent 'A'
let done=new Set();
for(let i=ss.length-1;i>=0;i--){const d=ss[i].day;if(!order.includes(d))continue;done.add(d);if(d==='A')break}
const next=D.nextDay||'A';
if(next==='A')done=new Set(); // a fresh A→B→C cycle is about to start
// days since last session + average gap across all sessions
const last=ss[ss.length-1];
const sinceLast=last?Math.round((new Date(today()+'T00:00:00')-new Date(last.date+'T00:00:00'))/864e5):null;
let gaps=[];for(let i=1;i<ss.length;i++)gaps.push((new Date(ss[i].date+'T00:00:00')-new Date(ss[i-1].date+'T00:00:00'))/864e5);
const avgGap=gaps.length?Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length*10)/10:null;
return{order,recent,done,next,sinceLast,avgGap}}

// ─── WORKOUT ───────────────────────────────────
// Seed a LOG row for one exercise (prefilled from last session / smart suggestion).
// Idempotent — used by beginW and by the swap flow when a new movement enters the day.
function ensureLog(ex){if(!ex||LOG[ex.id])return;const last=getLast(ex.id),sg=getSmartSugg(ex);
const defWt=ex.tp==='bb'?barOf(ex):'';
LOG[ex.id]={wt:sg.wt||last?.wt||defWt,band:last?.band||sg.band||'',
reps:last?last.reps.slice(0,ex.s).map(r=>r>0?String(r):''):Array(ex.s).fill(''),
setDone:Array(ex.s).fill(false),form:Array(ex.s).fill(0),notes:'',pf:!!last,wu:false,disc:'none',discJoints:[],touched:false}}

// The day's exercise list with any in-session swaps applied. Each returned object
// carries _slot (the original program id it occupies) so the swap controls can
// re-swap or revert that slot regardless of what currently fills it.
function dayExs(day,sw){sw=sw||SWAP;return (getCurPR()[day]||[]).map(ex=>{
const id=sw[ex.id],alt=id&&ALL_EX.find(e=>e.id===id);
return alt?{...alt,_slot:ex.id,_swapped:true}:{...ex,_slot:ex.id}})}

// Candidate replacements for a slot: library movements sharing a primary muscle,
// not already in today's session, not legacy stubs, optionally filtered by gear.
const TP_LABEL={bb:'Barbell',db:'Dumbbell',band:'Band',kb:'Kettlebell',bw:'Bodyweight',mace:'Mace',club:'Club',carry:'Carry'};
function swapCandidates(slotId,curId,tpFilter){
const src=MG[curId]||MG[slotId]||{};
const prim=Object.keys(src).filter(m=>src[m]>=1);const pset=prim.length?prim:Object.keys(src);
const shown=new Set(dayExs(ADAY).map(e=>e.id));
return ALL_EX.filter(e=>{
  if(e.id===curId||shown.has(e.id))return false;
  if(/legacy|retired/i.test(e.rl||''))return false;
  if(tpFilter!=='all'&&e.tp!==tpFilter)return false;
  const m=MG[e.id];return m&&pset.some(x=>m[x])})
.map(e=>({e,ov:pset.reduce((a,x)=>a+((MG[e.id]||{})[x]||0),0)}))
.sort((a,b)=>b.ov-a.ov).slice(0,12).map(x=>x.e)}

function openSwap(slotId){SWAP_OPEN=SWAP_OPEN===slotId?null:slotId;SWAP_FILTER='all';render()}
function doSwap(slotId,newId){const oldId=SWAP[slotId]||slotId;
if(oldId!==newId&&LOG[oldId]&&!LOG[oldId].touched)delete LOG[oldId];
SWAP[slotId]=newId;ensureLog(ALL_EX.find(e=>e.id===newId));
SWAP_OPEN=null;saveAW();render()}
function revertSwap(slotId){const oldId=SWAP[slotId];
if(oldId&&LOG[oldId]&&!LOG[oldId].touched)delete LOG[oldId];
delete SWAP[slotId];ensureLog((getCurPR()[ADAY]||[]).find(e=>e.id===slotId));
SWAP_OPEN=null;saveAW();render()}

function beginW(day){ADAY=day;WU_CHECKS=[false,false,false];SNOTES='';SWAP={};SWAP_OPEN=null;
const exs=dayExs(day);LOG={};SS=Date.now();CIDX=0;
for(const ex of exs)ensureLog(ex);
saveAW();VIEW='workout';render();window.scrollTo(0,0)}

function loggedExIds(){const s=new Set();for(const ses of D.sessions)for(const e of ses.ex)if(e.reps&&e.reps.some(r=>Number(r)>0))s.add(e.id);return s}

function statSnapshot(){

for(const s of sess)for(const e of s.ex){totalVol+=calcExVol(e.id,e.wt,e.reps);totalSets+=(e.reps||[]).filter(r=>Number(r)>0).length}
// current streak = consecutive weeks with >=1 session, counting back from this week
const dates=[...new Set(sess.map(s=>s.date))].sort();
// training days in last 7 / 30
const now=new Date();const d7=new Date(now);d7.setDate(d7.getDate()-7);const d30=new Date(now);d30.setDate(d30.getDate()-30);
const last7=dates.filter(d=>new Date(d+'T00:00:00')>=d7).length;
const last30=dates.filter(d=>new Date(d+'T00:00:00')>=d30).length;
// week streak — calendar weeks (Mon-anchored, same buckets as the weekly charts).
// Rolling 7-day windows shifted with the weekday you opened the app and could
// count one session into two windows. Grace: an empty current week doesn't
// break the streak — it's still in progress.
let streak=0;{const wks=new Set(dates.map(weekKey));
const prevWk=k=>{const d=new Date(k+'T00:00:00');d.setDate(d.getDate()-7);return ymd(d)};
let cur=weekKey(today());
if(!wks.has(cur))cur=prevWk(cur);
while(wks.has(cur)&&streak<520){streak++;cur=prevWk(cur)}}
const first=dates[0],span=first?Math.round((now-new Date(first+'T00:00:00'))/6048e5):0;
return{sessions:sess.length,days:dates.length,totalVol:Math.round(totalVol),totalSets,last7,last30,streak,weeks:span,first};
}
// Per-exercise quick stats
// ── e1RM slope (kg/week): least-squares fit over per-session best e1RM ──
// Needs ≥3 weighted sessions spanning ≥2 weeks; otherwise the fit is noise.
// e1RM (not raw weight) so rep-target changes and phase re-anchors don't read
// as strength loss.
function e1rmSlope(exId,days){
const def=ALL_EX.find(e=>e.id===exId);
const cut=ymd(new Date(Date.now()-(days||56)*864e5));
const pts=[];
for(const h of getHist(exId,200)){if(h.date<cut||!h.wt)continue;
const eR=effectiveReps(def,h.reps);if(!eR.length)continue;
pts.push({x:new Date(h.date+'T00:00:00').getTime()/6048e5,y:e1rm(h.wt,Math.max(...eR))})}
if(pts.length<3)return null;
if(pts[pts.length-1].x-pts[0].x<2)return null;
const n=pts.length,mx=pts.reduce((a,p)=>a+p.x,0)/n,my=pts.reduce((a,p)=>a+p.y,0)/n;
let num=0,den=0;for(const p of pts){num+=(p.x-mx)*(p.y-my);den+=(p.x-mx)*(p.x-mx)}
if(!den)return null;
return{slope:Math.round(num/den*100)/100,n,latest:Math.round(pts[pts.length-1].y*10)/10}}
// ── Momentum board: every logged weighted lift ranked by e1RM kg/week ──
function strengthMomentum(){
const logged=loggedExIds();const out=[];
for(const ex of ALL_EX){if(!logged.has(ex.id))continue;
if(!['bb','db','kb','mace'].includes(ex.tp))continue;
const s=e1rmSlope(ex.id,56);if(s)out.push({id:ex.id,nm:ex.nm,...s})}
out.sort((a,b)=>b.slope-a.slope);return out}
// ── Strength standards: bodyweight-relative e1RM thresholds marking the start of
// each tier. Approximate, calibrated for these specific (often unconventional)
// rack-free lifts — Zercher ≈ ¾ back-squat, floor press ≈ bench, strict OHP. Meant
// as motivational signposts, not a certified standards table. ──
const STD={deadlift:[1.0,1.5,2.0,2.5],zercher_b:[0.75,1.1,1.4,1.75],ohp:[0.5,0.7,0.9,1.1],floor_press:[0.75,1.0,1.25,1.5]};
const TIERS=['Beginner','Novice','Intermediate','Advanced','Elite'];
const TIER_C=['var(--mu)','var(--bl)','var(--gr)','var(--pr)','var(--am)'];
// ── Relative strength: best e1RM in the last 60 days ÷ latest logged bodyweight ──
function relStrength(){
const bw=[...(D.bodyLog||[])].reverse().find(b=>b.weight)?.weight;if(!bw)return null;
const cut=ymd(new Date(Date.now()-60*864e5));
const lifts=[['deadlift','Deadlift'],['zercher_b','Zercher'],['ohp','OHP'],['floor_press','Floor Press']];
const out=[];
for(const[id,lbl] of lifts){const def=ALL_EX.find(e=>e.id===id);let best=0;
for(const h of getHist(id,200)){if(h.date<cut||!h.wt)continue;
const eR=effectiveReps(def,h.reps);if(!eR.length)continue;
const v=e1rm(h.wt,Math.max(...eR));if(v>best)best=v}
if(!best)continue;
const ratio=Math.round(best/bw*100)/100,th=STD[id];
let ti=0;for(let i=0;i<th.length;i++)if(ratio>=th[i])ti=i+1;
const lo=ti===0?0:th[ti-1],hi=ti<th.length?th[ti]:th[th.length-1];
const pct=ti>=th.length?100:Math.max(2,Math.min(100,Math.round((ratio-lo)/(hi-lo)*100)));
const nextKg=ti<th.length?Math.round(th[ti]*bw*10)/10:null;
out.push({lbl,ratio,e1rm:best,tier:TIERS[ti],tierIdx:ti,color:TIER_C[ti],pct,next:ti<th.length?TIERS[ti+1]:null,nextKg})}
return out.length?{bw,lifts:out}:null}

function exStats(exId){
const def=ALL_EX.find(e=>e.id===exId);
const h=getHist(exId,200);
let totalVol=0,totalReps=0,sessions=h.length;
for(const e of h){totalVol+=calcExVol(exId,e.wt,e.reps);totalReps+=(e.reps||[]).filter(r=>Number(r)>0).reduce((a,b)=>a+Number(b),0)}
const pr=getPRs(exId);const last=h.length?h[h.length-1]:null;
// trend: e1RM change over the last 8 weeks (slope × 8). First-vs-last weight
// would read a phase re-anchor (deliberate load drop for a new rep range) as loss.
let trend=null;const sl=e1rmSlope(exId,56);if(sl)trend=Math.round(sl.slope*8*10)/10;

// ── ISO-week key (Mon-anchored) for time bucketing ──
function weekKey(dateStr){const d=new Date(dateStr+'T00:00:00');const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return ymd(d)}
// Continuous Monday keys for the last n weeks, ending at the current week.
function weekKeys(n){const out=[];const cur=new Date(weekKey(today())+'T00:00:00');
for(let i=n-1;i>=0;i--){const d=new Date(cur);d.setDate(d.getDate()-7*i);out.push(ymd(d))}return out}
// ── Weekly tonnage + session-count series (last N calendar weeks) ──
// Weeks without sessions appear as ZEROS: bucketing only existing keys would
// compress the time axis and hide layoffs — the very thing a trend must reveal.
// The current (in-progress) week is flagged `partial` so trend verdicts and
// charts can treat it honestly instead of reading mid-week as a volume crash.
function weeklySeries(weeks){
const buckets={};
for(const s of D.sessions){const wk=weekKey(s.date);if(!buckets[wk])buckets[wk]={vol:0,sets:0,sessions:0,rpe:[],dur:0};
let v=0,st=0;for(const e of s.ex){v+=calcExVol(e.id,e.wt,e.reps);st+=(e.reps||[]).filter(r=>Number(r)>0).length}
buckets[wk].vol+=v;buckets[wk].sets+=st;buckets[wk].sessions++;if(s.difficulty)buckets[wk].rpe.push(s.difficulty);if(s.duration)buckets[wk].dur+=s.duration}
const first=Object.keys(buckets).sort()[0];if(!first)return[];
const cw=weekKey(today());
return weekKeys(weeks||10).filter(k=>k>=first).map(k=>{const b=buckets[k]||{vol:0,sets:0,sessions:0,rpe:[],dur:0};
return{wk:k,partial:k===cw,vol:Math.round(b.vol),sets:b.sets,sessions:b.sessions,
rpe:b.rpe.length?Math.round(b.rpe.reduce((a,x)=>a+x,0)/b.rpe.length*10)/10:null,dur:b.dur,
lbl:new Date(k+'T00:00:00').toLocaleDateString('en-NZ',{day:'numeric',month:'short'})}});
}
// ── Recent PRs: scan history, find sessions that set a new best-weight or best-e1RM at the time ──
function recentPRs(sinceDays){
const cut=sinceDays?ymd(new Date(Date.now()-sinceDays*864e5)):null;
const prs=[];
for(const ex of ALL_EX){const h=getHist(ex.id,200);if(h.length<1)continue;
// The first logged session establishes the baseline — it isn't itself a PR
// (otherwise every exercise's debut shows up as a weight PR).
let bw=0,be=0,seen=false;
for(const e of h){const vr=(e.reps||[]).filter(r=>Number(r)>0);if(!vr.length)continue;
const def=ALL_EX.find(x=>x.id===ex.id);const eR=effectiveReps(def,e.reps);const mx=eR.length?Math.max(...eR):0;
const e1=e.wt&&mx>0?e1rm(e.wt,mx):0;
let isPR=null;
if(seen){
  if(e.wt&&e.wt>bw)isPR={type:'weight',val:e.wt};
  else if(e1>be)isPR={type:'e1rm',val:e1};
}
if(e.wt&&e.wt>bw)bw=e.wt;
if(e1>be)be=e1;
seen=true;
if(isPR&&(!cut||e.date>=cut))prs.push({nm:ex.nm,date:e.date,...isPR})}}
prs.sort((a,b)=>b.date.localeCompare(a.date));return prs;
}
// ── Milestones: cumulative tonnage / session / streak achievements ──
function milestones(){
const snap=statSnapshot();const out=[];
const tonnes=snap.totalVol/1000;
const volMarks=[10,25,50,75,100,150,200,300];const nextVol=volMarks.find(m=>m>tonnes);
const lastVol=[...volMarks].reverse().find(m=>m<=tonnes);
if(lastVol)out.push({icon:'🏔',label:`${lastVol}t lifted`,done:true});
if(nextVol)out.push({icon:'🎯',label:`${nextVol}t (${(nextVol-tonnes).toFixed(1)}t to go)`,done:false,pct:Math.round(tonnes/nextVol*100)});
const sessMarks=[10,25,50,100,150,200];const lastS=[...sessMarks].reverse().find(m=>m<=snap.sessions);const nextS=sessMarks.find(m=>m>snap.sessions);

}
// ── Per-muscle weekly volume history (for trend bars) ──
// Same zero-fill rule as weeklySeries: untrained weeks show as 0, not skipped.
function muscleWeekly(muscleKey,weeks){
const buckets={};let first=null;
for(const s of D.sessions){const wk=weekKey(s.date);if(!first||wk<first)first=wk;if(!buckets[wk])buckets[wk]=0;
for(const e of s.ex){const map=MG[e.id];if(!map||!map[muscleKey])continue;const sets=(e.reps||[]).filter(r=>Number(r)>0).length;buckets[wk]+=sets*map[muscleKey]}}
if(!first)return[];
return weekKeys(weeks||8).filter(k=>k>=first).map(k=>({wk:k,v:Math.round((buckets[k]||0)*10)/10}));
}
// ── Consistency metrics ──
function consistency(){
const ss=D.sessions;const dates=[...new Set(ss.map(s=>s.date))].sort();
// avg sessions/week over active span
const first=dates[0],last=dates[dates.length-1];
const spanWk=first?Math.max(1,(new Date(last+'T00:00:00')-new Date(first+'T00:00:00'))/6048e5):1;
const perWk=Math.round(ss.length/spanWk*10)/10;
// warmup compliance
const wuSessions=ss.filter(s=>s.warmup!==undefined);
const wuRate=wuSessions.length?Math.round(wuSessions.filter(s=>s.warmup>0).length/wuSessions.length*100):null;
// avg gap between sessions
let gaps=[];for(let i=1;i<dates.length;i++)gaps.push((new Date(dates[i]+'T00:00:00')-new Date(dates[i-1]+'T00:00:00'))/864e5);
const avgGap=gaps.length?Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length*10)/10:null;
// avg duration & rpe
const durs=ss.filter(s=>s.duration).map(s=>s.duration);const avgDur=durs.length?Math.round(durs.reduce((a,b)=>a+b,0)/durs.length):null;
const rpes=ss.filter(s=>s.difficulty).map(s=>s.difficulty);const avgRpe=rpes.length?Math.round(rpes.reduce((a,b)=>a+b,0)/rpes.length*10)/10:null;
return{perWk,wuRate,avgGap,avgDur,avgRpe,spanWk:Math.round(spanWk)};
}

// ─── BODY ────────────────────────────────────
// Body-composition tracking: bodyweight (scale) + circumference sites (tape

// keys are preserved, the rest are additive, so old data renders unchanged.
const BODY_METRICS=[
  {k:'weight',    lb:'Weight',    u:'kg', c:'#38bdf8', step:'0.1'},
  {k:'neck',      lb:'Neck',      u:'cm', c:'#a78bfa', step:'0.5'},
  {k:'shoulders', lb:'Shoulders', u:'cm', c:'#f5a524', step:'0.5'},
  {k:'chest',     lb:'Chest',     u:'cm', c:'#34d399', step:'0.5'},
  {k:'arms',      lb:'Arms',      u:'cm', c:'#fb7185', step:'0.5'},
  {k:'forearms',  lb:'Forearms',  u:'cm', c:'#f59e0b', step:'0.5'},
  {k:'waist',     lb:'Waist',     u:'cm', c:'#60a5fa', step:'0.5'},
  {k:'hips',      lb:'Hips',      u:'cm', c:'#c084fc', step:'0.5'},
  {k:'thigh',     lb:'Thigh',     u:'cm', c:'#2dd4bf', step:'0.5'},
  {k:'calf',      lb:'Calf',      u:'cm', c:'#94a3b8', step:'0.5'}
];
let BODY_METRIC='weight';
// Ordered {date,v} series for one metric (oldest→newest), only the logs that
// actually recorded it — so a chart never plots a gap as a zero.
function bodySeries(k){return (D.bodyLog||[]).filter(b=>b[k]!=null&&b[k]!=='').map(b=>({date:b.date,v:Number(b[k])}))}
function bodyStat(k){const s=bodySeries(k);if(!s.length)return null;
  const first=s[0],last=s[s.length-1];
  const change=s.length>=2?Math.round((last.v-first.v)*10)/10:null;
  return{first,last,change,n:s.length}}

function rBody(el){
const bl=D.bodyLog||[];
const wStat=bodyStat('weight');
let h=`<div class="sec"><div class="lb" style="margin-bottom:10px">Body Tracking</div>`;
// headline strip — bodyweight is the anchor metric
if(wStat){const wc=wStat.change;
h+=`<div class="estrip">
<div class="estrip-cell"><div class="estrip-num" style="color:var(--pr)">${wStat.last.v}<span style="font-size:10px;color:var(--mu)">kg</span></div><div class="estrip-lbl">Current</div></div>
<div class="estrip-cell"><div class="estrip-num" style="color:var(--tx)">${wc!=null?(wc>0?'+':'')+wc:'—'}</div><div class="estrip-lbl">Change</div></div>
<div class="estrip-cell"><div class="estrip-num">${bl.length}</div><div class="estrip-lbl">Logs</div></div></div>`}
// input card — prefilled with today's stored values so a re-log edits in place
const t=today();const todayE=bl.find(b=>b.date===t)||{};
const loggedToday=BODY_METRICS.some(m=>todayE[m.k]!=null&&todayE[m.k]!=='');
h+=`<div class="cd"><div class="lb" style="margin-bottom:8px">Log Today · <span class="dm" style="text-transform:none;letter-spacing:0">${fmtD(t)}</span></div>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px">`;
for(const m of BODY_METRICS){const val=todayE[m.k]!=null?todayE[m.k]:'';
h+=`<div><div class="lb">${m.lb} <span style="color:var(--dm)">${m.u}</span></div>
<input type="number" step="${m.step}" class="body-input" id="bm_${m.k}" value="${val}" placeholder="—" inputmode="decimal"></div>`}
h+=`</div><button class="btn btn-pr" style="padding:12px" onclick="saveBod()">${loggedToday?'Update Today':'Log Today'}</button>
<div class="dm" style="margin-top:8px">Measure at a consistent time (e.g. fasted, morning). Leave a field blank to skip it.</div></div>`;
// ── DATA PRESENTATION ──
// Trend: pick any tracked metric to chart. Chips show only metrics with data.
const charted=BODY_METRICS.filter(m=>bodySeries(m.k).length>=1);
if(charted.length){
if(!bodySeries(BODY_METRIC).length)BODY_METRIC=charted[0].k;
const sel=BODY_METRICS.find(m=>m.k===BODY_METRIC)||charted[0];
h+=`<div class="lb" style="margin-top:14px;margin-bottom:8px">Trend</div>
<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">`;
for(const m of charted){const on=m.k===sel.k;
h+=`<button onclick="setBodyMetric('${m.k}')" style="font-family:var(--disp);font-size:10px;font-weight:800;letter-spacing:.3px;padding:5px 11px;border-radius:20px;cursor:pointer;border:1.5px solid ${on?m.c:'var(--cb)'};background:${on?m.c:'var(--cd)'};color:${on?'var(--ink)':'var(--mu)'}">${m.lb}</button>`}
h+=`</div>`;
const data=bodySeries(sel.k).map(s=>({v:s.v,l:new Date(s.date+'T00:00:00').toLocaleDateString('en-NZ',{day:'numeric',month:'short'})}));
h+=`<div class="cd">${svgLine(data,360,180,sel.c,sel.lb+' ('+sel.u+')')}</div>`}
// Summary table — current value + change-since-first for every tracked site
const tracked=BODY_METRICS.map(m=>({m,st:bodyStat(m.k)})).filter(x=>x.st);
if(tracked.length){
h+=`<div class="lb" style="margin-top:14px;margin-bottom:6px">All Measurements</div>
<div class="cd" style="overflow-x:auto"><table class="pr-tbl"><tr><th>Site</th><th>Current</th><th>Change</th><th>Logs</th></tr>`;
for(const{m,st} of tracked){const ch=st.change;
const chTxt=ch==null?'—':(ch>0?'+':'')+ch+m.u;
h+=`<tr><td style="font-weight:600"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${m.c};margin-right:6px"></span>${m.lb}</td>
<td style="color:var(--pr);font-weight:700">${st.last.v}${m.u}</td>
<td style="color:${ch==null?'var(--dm)':'var(--tx)'};font-weight:700">${chTxt}</td>
