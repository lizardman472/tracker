// ─── WORKOUT ───────────────────────────────────
// Seed a LOG row for one exercise (prefilled from last session / smart suggestion).
// Idempotent — used by beginW and by the swap flow when a new movement enters the day.
function ensureLog(ex){if(!ex||LOG[ex.id])return;const last=getLast(ex.id),sg=getSmartSugg(ex);
const defWt=ex.tp==='bb'||(ex.tp==='carry'&&ex.bar)?barOf(ex):'';
// Prefill is PADDED to today's set count — slice() alone left a 3-entry reps array when
// the last session had fewer sets than today prescribes (same id on a 3-set and a 4-set
// day, or a set-count bump like floor press 3→4 in v21), rendering "undefined" in the
// 4th input and mis-reading the exercise as done.
LOG[ex.id]={wt:sg.wt||last?.wt||defWt,band:last?.band||sg.band||'',
reps:Array.from({length:ex.s},(_,i)=>{const r=last?last.reps[i]:null;return r>0?String(r):''}),
setDone:Array(ex.s).fill(false),form:Array(ex.s).fill(0),notes:'',pf:!!last,wu:false,disc:'none',discJoints:[],touched:false}}

// The day's exercise list with any in-session swaps applied. Each returned object
// carries _slot (the original program id it occupies) so the swap controls can
// re-swap or revert that slot regardless of what currently fills it.
function dayExs(day,sw){sw=sw||SWAP;return (getCurPR()[day]||[]).map(ex=>{
const id=sw[ex.id],alt=id&&ALL_EX.find(e=>e.id===id);
// Swapped-in movements get the CURRENT phase's rep prescription too — the raw ALL_EX
// def carries base (phase-1) rp/tg, which silently un-periodized any swap.
const adj=alt&&(PHASES[D.phase]||PHASES[1]).adj[id];
return alt?{...alt,...(adj?{rp:adj.rp,tg:adj.tg}:{}),_slot:ex.id,_swapped:true}:{...ex,_slot:ex.id}})}

// Candidate replacements for a slot: library movements sharing a primary muscle,
// not already in today's session, not legacy stubs, optionally filtered by gear.
const TP_LABEL={bb:'Barbell',db:'Dumbbell',band:'Band',kb:'Kettlebell',bw:'Bodyweight',mace:'Mace',club:'Club',carry:'Carry'};
// Equipment actually present per location — swap suggestions must not offer hex-bar/
// landmine lifts at the partner's or DB lifts at home.
const LOC_TP={home:['bb','band','kb','bw','carry','mace'],partner:['db','band','club','bw','carry']};
function swapCandidates(slotId,curId,tpFilter){
const src=MG[curId]||MG[slotId]||{};
const prim=Object.keys(src).filter(m=>src[m]>=1);const pset=prim.length?prim:Object.keys(src);
const shown=new Set(dayExs(ADAY).map(e=>e.id));
const okTp=LOC_TP[D.location||'home']||LOC_TP.home;
return ALL_EX.filter(e=>{
  if(e.id===curId||shown.has(e.id))return false;
  if(/legacy|retired/i.test(e.rl||''))return false;
  if(!okTp.includes(e.tp))return false;
  if(tpFilter!=='all'&&e.tp!==tpFilter)return false;
  const m=MG[e.id];return m&&pset.some(x=>m[x])})
.map(e=>({e,ov:pset.reduce((a,x)=>a+((MG[e.id]||{})[x]||0),0)}))
.sort((a,b)=>b.ov-a.ov).slice(0,12).map(x=>x.e)}

function openSwap(slotId){SWAP_OPEN=SWAP_OPEN===slotId?null:slotId;SWAP_FILTER='all';render()}
function doSwap(slotId,newId){const oldId=SWAP[slotId]||slotId;
if(oldId!==newId&&LOG[oldId]&&!LOG[oldId].touched)delete LOG[oldId];
SWAP[slotId]=newId;ensureLog(ALL_EX.find(e=>e.id===newId));
SWAP_OPEN=null;saveAW();render()}
function revertSwap(slotId){const oldId=SWAP[slotId];
if(oldId&&LOG[oldId]&&!LOG[oldId].touched)delete LOG[oldId];
delete SWAP[slotId];ensureLog((getCurPR()[ADAY]||[]).find(e=>e.id===slotId));
SWAP_OPEN=null;saveAW();render()}

function beginW(day){
// A pending resumable session dies the moment a new one starts (saveAW overwrites the
// blob) — one accidental tap on Start used to silently destroy 45 minutes of logging.
if(checkResume()&&typeof confirm==='function'&&!confirm('You have an unfinished workout waiting to resume — starting a new one discards it. Continue?'))return;
ADAY=day;WU_CHECKS=[false,false,false];SNOTES='';SWAP={};SWAP_OPEN=null;
const exs=dayExs(day);LOG={};SS=Date.now();CIDX=0;
for(const ex of exs)ensureLog(ex);
saveAW();VIEW='workout';render();window.scrollTo(0,0)}

function resumeW(){const r=checkResume();if(!r)return;ADAY=r.day;LOG=r.log;SS=r.start;CIDX=r.cidx||0;SWAP=r.swaps||{};SWAP_OPEN=null;
SNOTES=typeof r.notes==='string'?r.notes:'';
WU_CHECKS=Array.isArray(r.wu)&&r.wu.length===3?r.wu:[false,false,false];
// Normalize resumed LOG rows: a blob written by an older build may lack fields newer
// code dereferences (discJoints, setDone, form) — crash-proof them.
for(const[id,row] of Object.entries(LOG)){if(!row||typeof row!=='object'){delete LOG[id];continue}
if(!Array.isArray(row.reps))row.reps=[];
if(!Array.isArray(row.setDone))row.setDone=Array(row.reps.length).fill(false);
if(!Array.isArray(row.form))row.form=[];
if(!Array.isArray(row.discJoints))row.discJoints=[];
if(row.disc==null)row.disc='none';if(row.notes==null)row.notes=''}
for(const ex of dayExs(ADAY))ensureLog(ex);
// A drifted blob may carry a cidx beyond the current day's exercise count — clamp so
// the workout screen never opens on a nonexistent slot.
CIDX=Math.min(CIDX,Math.max(0,dayExs(ADAY).length-1));
VIEW='workout';render();window.scrollTo(0,0)}

// Session date comes from when the workout STARTED — a post-midnight save used to

window._S={exs:logged,prs,tv,ts,tr,dur:SS?Math.round((Date.now()-SS)/6e4):0,day:ADAY,date:ymd(new Date(SS||Date.now())),warmup:WU_CHECKS.filter(Boolean).length,discCount,notes:SNOTES};

// ─── STATS ───────────────────────────────────
// ── Stats helpers for the Progress tab ──
// Exercise IDs that actually have logged history (for a clean, uncluttered picker)
function loggedExIds(){const s=new Set();for(const ses of D.sessions)for(const e of ses.ex)if(e.reps&&e.reps.some(r=>Number(r)>0))s.add(e.id);return s}
// Current active program exercise IDs (home + partner, all phases) — so newly-added moves show even pre-history
function programExIds(){const s=new Set();for(const loc of ['home','partner']){const pr=getProgram(D.phase||1,loc,1);for(const d in pr)for(const e of pr[d])s.add(e.id)}return s}
// Headline numbers
function statSnapshot(){
const sess=D.sessions;
let totalVol=0,totalSets=0;
for(const s of sess)for(const e of s.ex){totalVol+=calcExVol(e.id,e.wt,e.reps);totalSets+=(e.reps||[]).filter(r=>Number(r)>0).length}
// current streak = consecutive weeks with >=1 session, counting back from this week
const dates=[...new Set(sess.map(s=>s.date))].sort();
// training days in last 7 / 30
const now=new Date();const d7=new Date(now);d7.setDate(d7.getDate()-7);const d30=new Date(now);d30.setDate(d30.getDate()-30);
const last7=dates.filter(d=>new Date(d+'T00:00:00')>=d7).length;
const last30=dates.filter(d=>new Date(d+'T00:00:00')>=d30).length;
// week streak — calendar weeks (Mon-anchored, same buckets as the weekly charts).
// Rolling 7-day windows shifted with the weekday you opened the app and could
// count one session into two windows. Grace: an empty current week doesn't
// break the streak — it's still in progress.
let streak=0;{const wks=new Set(dates.map(weekKey));
const prevWk=k=>{const d=new Date(k+'T00:00:00');d.setDate(d.getDate()-7);return ymd(d)};
let cur=weekKey(today());
if(!wks.has(cur))cur=prevWk(cur);
while(wks.has(cur)&&streak<520){streak++;cur=prevWk(cur)}}
const first=dates[0],span=first?Math.round((now-new Date(first+'T00:00:00'))/6048e5):0;
return{sessions:sess.length,days:dates.length,totalVol:Math.round(totalVol),totalSets,last7,last30,streak,weeks:span,first};
}
// Per-exercise quick stats
// ── e1RM slope (kg/week): least-squares fit over per-session best e1RM ──
// Needs ≥3 weighted sessions spanning ≥2 weeks; otherwise the fit is noise.
// e1RM (not raw weight) so rep-target changes and phase re-anchors don't read
// as strength loss.
function e1rmSlope(exId,days){
const def=ALL_EX.find(e=>e.id===exId);
const cut=daysAgoStr(days||56);
const pts=[];
for(const h of getHist(exId,200)){if(h.date<cut||!h.wt)continue;
const eR=effectiveReps(def,h.reps);if(!eR.length)continue;
pts.push({x:new Date(h.date+'T00:00:00').getTime()/6048e5,y:e1rm(h.wt,Math.max(...eR))})}
if(pts.length<3)return null;
if(pts[pts.length-1].x-pts[0].x<2)return null;
const n=pts.length,mx=pts.reduce((a,p)=>a+p.x,0)/n,my=pts.reduce((a,p)=>a+p.y,0)/n;
let num=0,den=0;for(const p of pts){num+=(p.x-mx)*(p.y-my);den+=(p.x-mx)*(p.x-mx)}
if(!den)return null;
return{slope:Math.round(num/den*100)/100,n,latest:Math.round(pts[pts.length-1].y*10)/10}}
// ── Band-lift progression helpers. BANDS (index 0 = heaviest band) is the ladder:
// for ASSIST lifts a higher index = less assistance = progress; for RESIST lifts a
// heavier band (lower index) = progress. Combo strings like 'Purple+Red' are their
// own rung; unknown/legacy strings → -1 (untracked, render as plain label). ──
function bandRank(band){return BANDS.indexOf(band)}
// Least-squares slope of per-session TOTAL REPS (reps/week) — the progression axis
// for band/bodyweight lifts, where e1rmSlope has no weight to fit. Same guards as
// e1rmSlope: ≥3 sessions spanning ≥2 weeks, else null.
function repsSlope(exId,days){
const cut=daysAgoStr(days||56);
const pts=[];
for(const h of getHist(exId,200)){if(h.date<cut)continue;
const tot=(h.reps||[]).filter(r=>Number(r)>0).reduce((a,b)=>a+Number(b),0);
if(tot>0)pts.push({x:new Date(h.date+'T00:00:00').getTime()/6048e5,y:tot})}
if(pts.length<3)return null;
if(pts[pts.length-1].x-pts[0].x<2)return null;
const n=pts.length,mx=pts.reduce((a,p)=>a+p.x,0)/n,my=pts.reduce((a,p)=>a+p.y,0)/n;
let num=0,den=0;for(const p of pts){num+=(p.x-mx)*(p.y-my);den+=(p.x-mx)*(p.x-mx)}
if(!den)return null;
return{slope:Math.round(num/den*10)/10,n,latest:pts[pts.length-1].y}}
// ── Momentum board: every logged weighted lift ranked by e1RM kg/week ──
function strengthMomentum(){
const logged=loggedExIds();const out=[];
for(const ex of ALL_EX){if(!logged.has(ex.id))continue;
if(!['bb','db','kb','mace'].includes(ex.tp))continue;
const s=e1rmSlope(ex.id,56);if(s)out.push({id:ex.id,nm:ex.nm,...s})}
out.sort((a,b)=>b.slope-a.slope);return out}
// ── Strength standards: bodyweight-relative e1RM thresholds marking the start of
// each tier. Approximate, calibrated for these specific (often unconventional)
// rack-free lifts — hex-bar deadlift runs ~10% over a conventional pull, the
// high-handle hex squat is loaded much heavier than the old Zercher (≈ back-squat
// territory), floor press ≈ bench, strict OHP. Motivational signposts, not a
// certified standards table. ──
const STD={hex_dl:[1.1,1.6,2.1,2.6],hex_squat_b:[1.0,1.5,2.0,2.5],ohp:[0.5,0.7,0.9,1.1],floor_press:[0.75,1.0,1.25,1.5]};
const TIERS=['Beginner','Novice','Intermediate','Advanced','Elite'];
const TIER_C=['var(--mu)','var(--bl)','var(--gr)','var(--pr)','var(--am)'];
// ── Relative strength: best e1RM in the last 60 days ÷ latest logged bodyweight ──
function relStrength(){
const bw=[...(D.bodyLog||[])].reverse().find(b=>b.weight)?.weight;if(!bw)return null;
const cut=daysAgoStr(60);
const lifts=[['hex_dl','Hex Bar Deadlift'],['hex_squat_b','Hex Bar Squat'],['ohp','OHP'],['floor_press','Floor Press']];
const out=[];
for(const[id,lbl] of lifts){const def=ALL_EX.find(e=>e.id===id);let best=0;
for(const h of getHist(id,200)){if(h.date<cut||!h.wt)continue;
const eR=effectiveReps(def,h.reps);if(!eR.length)continue;
const v=e1rm(h.wt,Math.max(...eR));if(v>best)best=v}
if(!best)continue;
const ratio=Math.round(best/bw*100)/100,th=STD[id];
let ti=0;for(let i=0;i<th.length;i++)if(ratio>=th[i])ti=i+1;
const lo=ti===0?0:th[ti-1],hi=ti<th.length?th[ti]:th[th.length-1];
const pct=ti>=th.length?100:Math.max(2,Math.min(100,Math.round((ratio-lo)/(hi-lo)*100)));
const nextKg=ti<th.length?Math.round(th[ti]*bw*10)/10:null;
out.push({lbl,ratio,e1rm:best,tier:TIERS[ti],tierIdx:ti,color:TIER_C[ti],pct,next:ti<th.length?TIERS[ti+1]:null,nextKg})}
return out.length?{bw,lifts:out}:null}

function exStats(exId){
const def=ALL_EX.find(e=>e.id===exId);
const h=getHist(exId,200);
let totalVol=0,totalReps=0,sessions=h.length;
for(const e of h){totalVol+=calcExVol(exId,e.wt,e.reps);totalReps+=(e.reps||[]).filter(r=>Number(r)>0).reduce((a,b)=>a+Number(b),0)}

// trend: e1RM change over the last 8 weeks (slope × 8). First-vs-last weight
// would read a phase re-anchor (deliberate load drop for a new rep range) as loss.
let trend=null;const sl=e1rmSlope(exId,56);if(sl)trend=Math.round(sl.slope*8*10)/10;
return{def,sessions,totalVol:Math.round(totalVol),totalReps,pr,last,trend,history:h};
}

// ── ISO-week key (Mon-anchored) for time bucketing ──
function weekKey(dateStr){const d=new Date(dateStr+'T00:00:00');const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return ymd(d)}
// Continuous Monday keys for the last n weeks, ending at the current week.
function weekKeys(n){const out=[];const cur=new Date(weekKey(today())+'T00:00:00');
for(let i=n-1;i>=0;i--){const d=new Date(cur);d.setDate(d.getDate()-7*i);out.push(ymd(d))}return out}
// ── Weekly tonnage + session-count series (last N calendar weeks) ──
// Weeks without sessions appear as ZEROS: bucketing only existing keys would
// compress the time axis and hide layoffs — the very thing a trend must reveal.
// The current (in-progress) week is flagged `partial` so trend verdicts and
// charts can treat it honestly instead of reading mid-week as a volume crash.
function weeklySeries(weeks){
const buckets={};
for(const s of D.sessions){const wk=weekKey(s.date);if(!buckets[wk])buckets[wk]={vol:0,sets:0,sessions:0,rpe:[],dur:0};
let v=0,st=0;for(const e of s.ex){v+=calcExVol(e.id,e.wt,e.reps);st+=(e.reps||[]).filter(r=>Number(r)>0).length}
buckets[wk].vol+=v;buckets[wk].sets+=st;buckets[wk].sessions++;if(s.difficulty)buckets[wk].rpe.push(s.difficulty);if(s.duration)buckets[wk].dur+=s.duration}
const first=Object.keys(buckets).sort()[0];if(!first)return[];
const cw=weekKey(today());
return weekKeys(weeks||10).filter(k=>k>=first).map(k=>{const b=buckets[k]||{vol:0,sets:0,sessions:0,rpe:[],dur:0};
return{wk:k,partial:k===cw,vol:Math.round(b.vol),sets:b.sets,sessions:b.sessions,
rpe:b.rpe.length?Math.round(b.rpe.reduce((a,x)=>a+x,0)/b.rpe.length*10)/10:null,dur:b.dur,
lbl:new Date(k+'T00:00:00').toLocaleDateString('en-NZ',{day:'numeric',month:'short'})}});
}
// ── Event markers for weekly charts: the week each phase change landed (first
// session stamped with a new phase number) and the deload week (lastDeload),
// mapped to bar indices of a weeklySeries slice. Sessions without a phase stamp
// (old history) are skipped — absence of a stamp is not a phase change. ──
function weeklyMarks(series){
const marks=[];if(!Array.isArray(series)||!series.length)return marks;
const idx={};series.forEach((w,i)=>{idx[w.wk]=i});
const ss=[...D.sessions].sort((a,b)=>a.date.localeCompare(b.date));
let prev=null;
for(const s of ss){const p=s.phase;if(p==null)continue;
if(prev!=null&&p!==prev){const i=idx[weekKey(s.date)];if(i!=null&&!marks.some(m=>m.i===i))marks.push({i,label:'P'+p})}
prev=p}
if(D.lastDeload){const i=idx[weekKey(D.lastDeload)];if(i!=null)marks.push({i,label:'DL',color:CH_TARGET})}
return marks}
// ── Recent PRs: scan history, find sessions that set a new best-weight or best-e1RM at the time ──
function recentPRs(sinceDays){
const cut=sinceDays?daysAgoStr(sinceDays):null;
const prs=[];
for(const ex of ALL_EX){const h=getHist(ex.id,200);if(h.length<1)continue;
// The first logged session establishes the baseline — it isn't itself a PR
// (otherwise every exercise's debut shows up as a weight PR).
let bw=0,be=0,seen=false;
for(const e of h){const vr=(e.reps||[]).filter(r=>Number(r)>0);if(!vr.length)continue;
const def=ALL_EX.find(x=>x.id===ex.id);const eR=effectiveReps(def,e.reps);const mx=eR.length?Math.max(...eR):0;
const e1=(E1RM_TYPES.has(ex.tp)&&e.wt&&mx>0)?e1rm(e.wt,mx):0; // carries/bands never mint e1RM PRs
let isPR=null;
if(seen){
  if(e.wt&&e.wt>bw)isPR={type:'weight',val:e.wt};
  else if(e1>be)isPR={type:'e1rm',val:e1};
}
if(e.wt&&e.wt>bw)bw=e.wt;
if(e1>be)be=e1;
seen=true;
if(isPR&&(!cut||e.date>=cut))prs.push({nm:ex.nm,date:e.date,...isPR})}}
prs.sort((a,b)=>b.date.localeCompare(a.date));return prs;
}
// ── Milestones: cumulative tonnage / session / streak achievements ──
// Accepts a precomputed snapshot so rStats' single-pass ctx isn't recomputed here.
function milestones(snap=statSnapshot()){
const out=[];
const tonnes=snap.totalVol/1000;
const volMarks=[10,25,50,75,100,150,200,300];const nextVol=volMarks.find(m=>m>tonnes);
const lastVol=[...volMarks].reverse().find(m=>m<=tonnes);
if(lastVol)out.push({icon:'🏔',label:`${lastVol}t lifted`,done:true});
if(nextVol)out.push({icon:'🎯',label:`${nextVol}t (${(nextVol-tonnes).toFixed(1)}t to go)`,done:false,pct:Math.round(tonnes/nextVol*100)});
const sessMarks=[10,25,50,100,150,200];const lastS=[...sessMarks].reverse().find(m=>m<=snap.sessions);const nextS=sessMarks.find(m=>m>snap.sessions);
if(lastS)out.push({icon:'💪',label:`${lastS} sessions`,done:true});
if(nextS)out.push({icon:'🎯',label:`${nextS} sessions (${nextS-snap.sessions} to go)`,done:false,pct:Math.round(snap.sessions/nextS*100)});
if(snap.streak>=4)out.push({icon:'🔥',label:`${snap.streak}-week streak`,done:true});
return out;
}
// ── Per-muscle weekly volume history (for trend bars) ──
// Same zero-fill rule as weeklySeries: untrained weeks show as 0, not skipped.
function muscleWeekly(muscleKey,weeks){
const buckets={};let first=null;
for(const s of D.sessions){const wk=weekKey(s.date);if(!first||wk<first)first=wk;if(!buckets[wk])buckets[wk]=0;
for(const e of s.ex){const map=MG[e.id];if(!map||!map[muscleKey])continue;const sets=(e.reps||[]).filter(r=>Number(r)>0).length;buckets[wk]+=sets*map[muscleKey]}}
if(!first)return[];
return weekKeys(weeks||8).filter(k=>k>=first).map(k=>({wk:k,v:Math.round((buckets[k]||0)*10)/10}));
}
// ── Consistency metrics ──
function consistency(){
const ss=D.sessions;const dates=[...new Set(ss.map(s=>s.date))].sort();
// avg sessions/week over active span
const first=dates[0],last=dates[dates.length-1];
const spanWk=first?Math.max(1,(new Date(last+'T00:00:00')-new Date(first+'T00:00:00'))/6048e5):1;
const perWk=Math.round(ss.length/spanWk*10)/10;
// warmup compliance — null means "not recorded" (retro logs) and stays out of the rate
const wuSessions=ss.filter(s=>s.warmup!=null);
const wuRate=wuSessions.length?Math.round(wuSessions.filter(s=>s.warmup>0).length/wuSessions.length*100):null;
// avg gap between sessions
let gaps=[];for(let i=1;i<dates.length;i++)gaps.push((new Date(dates[i]+'T00:00:00')-new Date(dates[i-1]+'T00:00:00'))/864e5);
const avgGap=gaps.length?Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length*10)/10:null;
// avg duration & rpe
const durs=ss.filter(s=>s.duration).map(s=>s.duration);const avgDur=durs.length?Math.round(durs.reduce((a,b)=>a+b,0)/durs.length):null;
const rpes=ss.filter(s=>s.difficulty).map(s=>s.difficulty);const avgRpe=rpes.length?Math.round(rpes.reduce((a,b)=>a+b,0)/rpes.length*10)/10:null;
return{perWk,wuRate,avgGap,avgDur,avgRpe,spanWk:Math.round(spanWk)};
}

function rStats(el){

}else if(STAT_SEG==='balance'){

for(const[key,label,mev,mav] of MG_INFO){

  ${mev!=null&&mav?`<div style="position:relative;height:0"><div style="position:absolute;top:-7px;left:${Math.round(mev/mav*100)}%;width:1px;height:7px;background:var(--tx);opacity:.4"></div></div>`:''}</div>`;
  if(mev!=null){
    const series=muscleWeekly(key,8);const mxv=Math.max(...series.map(s=>s.v),mav,1);
    let bars='';for(const s of series){
      const empty=s.v<=0;const bh=empty?5:Math.max(12,Math.round(s.v/mxv*100));
      const bc=empty?'var(--ib)':(s.v<mev?'var(--am)':'var(--gr)');
      bars+=`<div title="${empty?'no sets':s.v}" style="flex:1;height:${bh}%;background:${bc};border-radius:2px;min-height:2px"></div>`}
    if(series.length)h+=`<div style="display:flex;align-items:flex-end;gap:2px;height:15px;margin-top:8px;opacity:.5">${bars}</div>`;
  }

}
if(!anyVol)h+=`<div class="dm">No logged sets in the last 10 days.</div>`;
// (verdict + priority nudge below share the same normalized per-week numbers)

// Push:pull set ratio over the same window. Side delts and legs are excluded by

{const push=(wv.chest||0)+(wv.fdelt||0)+(wv.triceps||0),pull=(wv.back||0)+(wv.reardelt||0)+(wv.biceps||0);
if(push||pull){const ratio=pull?Math.round(push/pull*100)/100:null;

// Whole-body joint flags, last 30 days (the per-exercise history sits in the

{const dcut=daysAgoStr(30);

if(d30.length){h+=`<div class="cd"><div class="lb" style="margin-bottom:6px">Joint Flags · last 30 days</div>`;

}else if(STAT_SEG==='consistency'){
// ═══ CONSISTENCY — am I showing up? ═══
const hm=(()=>{const d=[];const now=new Date(),st=new Date(now);st.setDate(st.getDate()-83); // -83..0 = includes TODAY (was -84..-1: today's session invisible until tomorrow)
for(let i=0;i<84;i++){const x=new Date(st);x.setDate(x.getDate()+i);const ds=ymd(x);
const s=D.sessions.filter(z=>z.date===ds),c=D.cardioLog.filter(z=>z.date===ds);
let day=null;s.forEach(z=>{day=z.day});d.push({date:ds,day,isC:c.length>0&&!s.length,d:x.getDate()})}return d})();

const marks=weeklyMarks(ws);
h+=`<div class="cd">${svgBars(volData,360,150,'#38bdf8','Weekly Tonnage (t)',{marks})}${trendMsg?`<div class="dm" style="text-align:center;margin-top:4px">${trendMsg}</div>`:''}${curW?`<div class="dm" style="text-align:center;margin-top:3px">This week so far: ${curW.vol>=1000?(curW.vol/1000).toFixed(1)+'t':curW.vol+'kg'} · ${curW.sessions} session${curW.sessions===1?'':'s'}</div>`:''}${marks.length?`<div class="dm" style="text-align:center;margin-top:3px">P# = phase change · DL = deload week</div>`:''}</div>`;
h+=`<div class="cd">${svgBars(sessData,360,130,'#60a5fa','Sessions / Week',{target:3})}<div class="dm" style="text-align:center;margin-top:4px">Dashed line = 3×/week target · complete weeks only</div></div>`;
// RPE trend if data exists
const rpeData=ws.filter(w=>w.rpe!=null).map(w=>({v:w.rpe,l:w.lbl})); // svgLine reads .l — .lbl printed literal "undefined" x-labels
if(rpeData.length>=2)h+=`<div class="cd">${svgLine(rpeData,360,140,'#fb7185','Avg RPE / Week')}</div>`;
}

h+=`<div class="cd"><div class="estrip">
<div class="estrip-cell"><div class="estrip-num" style="color:var(--pr)">${con.perWk}</div><div class="estrip-lbl">Sessions/wk</div></div>
<div class="estrip-cell"><div class="estrip-num">${con.avgGap!=null?con.avgGap+'d':'—'}</div><div class="estrip-lbl">Avg Gap</div></div>
<div class="estrip-cell"><div class="estrip-num" style="color:var(--bl)">${con.avgDur!=null?con.avgDur+'m':'—'}</div><div class="estrip-lbl">Avg Length</div></div>
<div class="estrip-cell"><div class="estrip-num" style="color:var(--am)">${con.avgRpe!=null?con.avgRpe:'—'}</div><div class="estrip-lbl">Avg RPE</div></div></div>`;
if(con.wuRate!=null){h+=`<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px"><span class="mu">Warm-up compliance</span><span style="color:${con.wuRate>=70?'var(--gr)':con.wuRate>=40?'var(--am)':'var(--rd)'};font-weight:700">${con.wuRate}%</span></div>
<div class="fg-bar"><div class="fg-fill" style="width:${con.wuRate}%;background:${con.wuRate>=70?'var(--gr)':con.wuRate>=40?'var(--am)':'var(--rd)'}"></div></div>`}
// Cardio is logged but was never surfaced anywhere on this tab
{const ccut=daysAgoStr(7);
const c7=D.cardioLog.filter(c=>c.date>=ccut);
const cMin=c7.reduce((a,c)=>a+(c.duration||0),0);
h+=`<div style="display:flex;justify-content:space-between;font-size:11px;margin-top:6px"><span class="mu">Cardio · last 7 days</span><span style="color:${cMin>=60?'var(--gr)':'var(--mu)'};font-weight:700">${cMin?`${cMin} min · ${c7.length} session${c7.length===1?'':'s'}`:'—'}</span></div>`}
h+=`</div>`;

}else{

</div>
<div class="dm" style="margin-top:8px;text-align:center">${snap.totalSets} work sets · ${snap.weeks} weeks since first session · ${snap.days} training days</div></div>`;

${!m.done&&m.pct!=null?`<div class="fg-bar"><div class="fg-fill" style="width:${m.pct}%;background:var(--pr)"></div></div>`:''}`}
h+=`</div>`}

// PRs — only exercises with real history
const allPrs=[];for(const ex of ALL_EX){if(!logged.has(ex.id))continue;const pr=getPRs(ex.id);if(pr.bestWt||pr.bestVol)allPrs.push({nm:ex.nm,...pr})}
allPrs.sort((a,b)=>(b.bestE1RM||0)-(a.bestE1RM||0));
if(allPrs.length){h+=`<div class="lb" style="margin-top:14px;margin-bottom:6px">All-Time PRs · ${allPrs.length} lifts</div>

for(const p of allPrs)h+=`<tr><td style="font-weight:600">${esc(p.nm)}</td><td style="color:var(--pr)">${p.bestWt?p.bestWt+'kg':'—'}</td>

h+=`</table></div>`}
h+=`<button class="btn btn-wh" style="margin-top:12px;font-size:13px" onclick="go('body')">📏 Body Tracking</button>`;
}
h+=`</div>`;el.innerHTML=h}

// ─── BODY ────────────────────────────────────
// Body-composition tracking: bodyweight (scale) + circumference sites (tape
// measure). Every field is optional per log, so you record only what you
// measured that day. Legacy entries stored weight/waist/arms/chest/thigh — those
// keys are preserved, the rest are additive, so old data renders unchanged.
const BODY_METRICS=[
  {k:'weight',    lb:'Weight',    u:'kg', c:'#38bdf8', step:'0.1'},
  {k:'neck',      lb:'Neck',      u:'cm', c:'#a78bfa', step:'0.5'},
  {k:'shoulders', lb:'Shoulders', u:'cm', c:'#f5a524', step:'0.5'},
  {k:'chest',     lb:'Chest',     u:'cm', c:'#34d399', step:'0.5'},
  {k:'arms',      lb:'Arms',      u:'cm', c:'#fb7185', step:'0.5'},
  {k:'forearms',  lb:'Forearms',  u:'cm', c:'#f59e0b', step:'0.5'},

  {k:'calf',      lb:'Calf',      u:'cm', c:'#94a3b8', step:'0.5'}
];
let BODY_METRIC='weight';
// Ordered {date,v} series for one metric (oldest→newest), only the logs that

function bodySeries(k){return (D.bodyLog||[]).filter(b=>b[k]!=null&&b[k]!=='').map(b=>({date:b.date,v:Number(b[k])}))}
function bodyStat(k){const s=bodySeries(k);if(!s.length)return null;
  const first=s[0],last=s[s.length-1];
  const change=s.length>=2?Math.round((last.v-first.v)*10)/10:null;
  return{first,last,change,n:s.length}}

function rBody(el){
const bl=D.bodyLog||[];
const wStat=bodyStat('weight');
let h=`<div class="sec"><div class="lb" style="margin-bottom:10px">Body Tracking</div>`;
// headline strip — bodyweight is the anchor metric
if(wStat){const wc=wStat.change;
h+=`<div class="estrip">
<div class="estrip-cell"><div class="estrip-num" style="color:var(--pr)">${wStat.last.v}<span style="font-size:10px;color:var(--mu)">kg</span></div><div class="estrip-lbl">Current</div></div>
<div class="estrip-cell"><div class="estrip-num" style="color:var(--tx)">${wc!=null?(wc>0?'+':'')+wc+'<span style="font-size:10px;color:var(--mu)">kg</span>':'—'}</div><div class="estrip-lbl">Change</div></div>
<div class="estrip-cell"><div class="estrip-num">${bl.length}</div><div class="estrip-lbl">Logs</div></div></div>`}

h+=`<div class="cd"><div class="lb" style="margin-bottom:8px">Log Today · <span class="dm" style="text-transform:none;letter-spacing:0">${fmtD(t)}</span></div>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px">`;
for(const m of BODY_METRICS){const val=todayE[m.k]!=null?todayE[m.k]:'';
h+=`<div><div class="lb">${m.lb} <span style="color:var(--dm)">${m.u}</span></div>
<input type="number" step="${m.step}" class="body-input" id="bm_${m.k}" value="${val}" placeholder="—" inputmode="decimal"></div>`}
h+=`</div><button class="btn btn-pr" style="padding:12px" onclick="saveBod()">${loggedToday?'Update Today':'Log Today'}</button>
<div class="dm" style="margin-top:8px">Measure at a consistent time (e.g. fasted, morning). Leave a field blank to skip it.</div></div>`;
// ── DATA PRESENTATION ──

const charted=BODY_METRICS.filter(m=>bodySeries(m.k).length>=2);
if(charted.length){
if(!bodySeries(BODY_METRIC).length)BODY_METRIC=charted[0].k;

<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">`;
for(const m of charted){const on=m.k===sel.k;
h+=`<button onclick="setBodyMetric('${m.k}')" style="font-family:var(--disp);font-size:10px;font-weight:800;letter-spacing:.3px;padding:5px 11px;border-radius:20px;cursor:pointer;border:1.5px solid ${on?m.c:'var(--cb)'};background:${on?m.c:'var(--cd)'};color:${on?'var(--ink)':'var(--mu)'}">${m.lb}</button>`}
h+=`</div>`;
const data=bodySeries(sel.k).map(s=>({v:s.v,l:new Date(s.date+'T00:00:00').toLocaleDateString('en-NZ',{day:'numeric',month:'short'})}));
h+=`<div class="cd">${svgLine(data,360,180,sel.c,sel.lb+' ('+sel.u+')')}</div>`}
// Summary table — current value + change-since-first for every tracked site
const tracked=BODY_METRICS.map(m=>({m,st:bodyStat(m.k)})).filter(x=>x.st);
if(tracked.length){
h+=`<div class="lb" style="margin-top:14px;margin-bottom:6px">All Measurements</div>

// Schema guard for imports. A malformed backup (sessions without ex arrays,
// non-numeric reps, garbage dates) used to merge silently and crash renders
// later. Coerce what's salvageable, return null for what isn't.
function validSession(s){
if(!s||typeof s!=='object'||Array.isArray(s))return null;
if(s.id==null||(typeof s.id!=='string'&&typeof s.id!=='number'))return null;
if(typeof s.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s.date))return null;
if(!Array.isArray(s.ex))return null;
const ex=[];
for(const e of s.ex){
  if(!e||typeof e!=='object'||typeof e.id!=='string')continue;
  const reps=Array.isArray(e.reps)?e.reps.map(r=>{const n=Number(r);return Number.isFinite(n)&&n>0?n:0}):[];
  const wt=e.wt==null?null:(Number.isFinite(Number(e.wt))?Number(e.wt):null);
  // Coerce free-text fields to strings — non-string band/notes from a hand-edited
  // backup used to flow into templates as objects/arrays (escaped at render too).
  ex.push({...e,reps,wt,band:typeof e.band==='string'?e.band:'',notes:typeof e.notes==='string'?e.notes:''})}
// `day` is load-bearing for render (badges, cycle, NEXT_DAY) — every render path calls
// s.day.toLowerCase(). The program uses A/B/C only; normalize anything else to 'A' so a
// malformed/hand-edited backup can't crash the Home/History screens it lands on.
const day=['A','B','C'].includes(s.day)?s.day:'A';
// Session ids are interpolated into inline onclick handlers (delete/expand) — constrain
// the charset so a hostile/hand-mangled backup id can't break out of the attribute.
const id=String(s.id).replace(/[^\w.-]/g,'');
if(!id)return null;
return{...s,id,day,ex}}
// Two-tab conflict merge (pure): union the append-only logs from another tab's store
// into ours — sessions by id, cardio by id, body by date, discomfort by composite key —
// while every scalar (phase, location, nextDay, prefs) keeps THIS tab's in-memory value.
// Their rows pass the same validSession guard as imports so a mangled store can't
// smuggle malformed sessions past the load-path validation.
function mergeStores(mine,theirs){const W=structuredClone(mine);
if(!theirs||typeof theirs!=='object')return W;
const sIds=new Set(W.sessions.map(s=>s.id));
for(const s of(Array.isArray(theirs.sessions)?theirs.sessions:[])){const v=validSession(s);if(v&&!sIds.has(v.id))W.sessions.push(v)}
W.sessions.sort((a,b)=>a.date.localeCompare(b.date));
const cIds=new Set(W.cardioLog.map(c=>c.id));
for(const c of(Array.isArray(theirs.cardioLog)?theirs.cardioLog:[])){if(c&&typeof c==='object'&&c.id&&!cIds.has(c.id))W.cardioLog.push(c)}
W.cardioLog.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
const bKeys=new Set(W.bodyLog.map(x=>x.date));
for(const x of(Array.isArray(theirs.bodyLog)?theirs.bodyLog:[])){if(x&&typeof x==='object'&&x.date&&!bKeys.has(x.date))W.bodyLog.push(x)}
W.bodyLog.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
const dKeys=new Set(W.discomfort.map(x=>x.date+x.exId+x.joint));
for(const x of(Array.isArray(theirs.discomfort)?theirs.discomfort:[])){if(x&&typeof x==='object'&&!dKeys.has(x.date+x.exId+x.joint))W.discomfort.push(x)}
return W}
// Pure merge core for imports — extracted from impD so the export→clear→import
// round-trip is provable in the Node test harness (impD itself is FileReader/DOM-bound).
// Takes the current state `cur` and a parsed backup `d`; returns {W,added,replaced,skipped}
// without touching D or storage. Throws on unsalvageable input.
function mergeImport(cur,d){
if(!d||typeof d!=='object'||!Array.isArray(d.sessions))throw 0;
let skipped=0;d.sessions=d.sessions.map(validSession).filter(s=>s?true:(skipped++,false));
if(!d.sessions.length&&skipped)throw 0; // nothing salvageable — reject outright
if(!d.cues||typeof d.cues!=='object'||Array.isArray(d.cues))d.cues={};
// Validate the auxiliary logs field-by-field — they render into templates and inline
// handlers (delBod('${date}')), so imported garbage must be dropped, not adopted.
d.bodyLog=(Array.isArray(d.bodyLog)?d.bodyLog:[]).filter(b=>b&&typeof b==='object'&&typeof b.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(b.date))
  .map(b=>{const o={date:b.date};for(const[k,v] of Object.entries(b)){if(k==='date')continue;const n=Number(v);if(Number.isFinite(n))o[k]=Math.round(n*100)/100}return o});
d.cardioLog=(Array.isArray(d.cardioLog)?d.cardioLog:[]).filter(c=>c&&typeof c==='object'&&typeof c.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(c.date)&&Number.isFinite(Number(c.duration)))
  .map(c=>({id:String(c.id||'c'+c.date).replace(/[^\w.-]/g,''),date:c.date,type:typeof c.type==='string'?c.type:'Other',duration:Number(c.duration),intensity:['easy','moderate','hard'].includes(c.intensity)?c.intensity:'easy'}));
d.discomfort=(Array.isArray(d.discomfort)?d.discomfort:[]).filter(x=>x&&typeof x==='object'&&typeof x.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&typeof x.exId==='string'&&/^[\w-]+$/.test(x.exId)&&['mild','moderate','none'].includes(x.level)&&JOINTS.includes(x.joint));
// ATOMIC merge: all work happens on a clone — a throw mid-merge used to leave D
// partially mutated with the drift persisted by the next save(). D is only replaced
// once the whole merge succeeded.
const W=structuredClone(cur);
// Fresh device = truly empty OR still on the bundled demo SEED (load() marks that with
// `seeded`) — the old sessions.length===0 test was unreachable because an empty store
// always loads the demo. On a fresh restore, demo rows are dropped, and phase/venue
// metadata is adopted from the backup instead of silently keeping the demo defaults.
const wasFresh=W.sessions.length===0||W.seeded===true;
if(W.seeded){W.sessions=[];W.cardioLog=[];W.bodyLog=[];W.discomfort=[]}
const existingMap=new Map(W.sessions.map(s=>[s.id,s]));
let added=0,replaced=0;
for(const s of d.sessions){if(existingMap.has(s.id))replaced++;else added++;existingMap.set(s.id,s)}
W.sessions=[...existingMap.values()];
W.sessions.sort((a,b)=>a.date.localeCompare(b.date));
// Merge cardio, discomfort, body logs (additive) — re-sort body log so date-ordered
// readers (current weight, change, trend chart, W:H ratio, relative strength) stay correct.
const cIds=new Set(W.cardioLog.map(c=>c.id));
for(const c of d.cardioLog){if(!cIds.has(c.id))W.cardioLog.push(c)}
W.cardioLog.sort((a,b)=>a.date.localeCompare(b.date));
const dKeys=new Set(W.discomfort.map(x=>x.date+x.exId+x.joint));
for(const x of d.discomfort){if(!dKeys.has(x.date+x.exId+x.joint))W.discomfort.push(x)}
const bKeys=new Set(W.bodyLog.map(x=>x.date));
for(const x of d.bodyLog){if(!bKeys.has(x.date))W.bodyLog.push(x)}
W.bodyLog.sort((a,b)=>a.date.localeCompare(b.date));
// Cue KEYS are interpolated into the delete-button onclick — constrain the charset.
for(const[k,v] of Object.entries(d.cues))if(typeof v==='string'&&/^[\w-]{1,60}$/.test(k))W.cues[k]=v;
if(d.lastDeload!==undefined)W.lastDeload=(typeof d.lastDeload==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d.lastDeload))?d.lastDeload:null;
// Adopt global metadata (phase clock / venue) ONLY when migrating into a fresh device,
// and VALIDATED — phase:9 / phaseStart:'banana' / location:'moon' used to be adopted verbatim.
// Deliberately DEVICE-LOCAL (never imported): `notify` mirrors THIS device's Notification
// permission; `dismissed` banners are situational; `lastBackup`/`lastBackupCount` must stay
// unset so a fresh device is nagged into its own first backup; `gen` is this device's
// two-tab write generation (the clone of `cur` already carries the right one).
if(wasFresh){
  if([1,2,3].includes(d.phase))W.phase=d.phase;
  if(typeof d.phaseStart==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d.phaseStart))W.phaseStart=d.phaseStart;
  if(['home','partner'].includes(d.location))W.location=d.location;
}
// Update nextDay from latest session — location aware
if(W.sessions.length){const last=W.sessions[W.sessions.length-1];
W.nextDay=NEXT_DAY[last.day]||W.nextDay}
// On a fresh restore the backup's own nextDay wins over the re-derive — it captures a
// manual rotation override, and same-date A+B sessions make last-by-date ambiguous.
if(wasFresh&&['A','B','C'].includes(d.nextDay))W.nextDay=d.nextDay;
// Run migration on imported data
migrateData(W);
delete W.seeded;
return{W,added,replaced,skipped}}
function impD(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();
r.onload=e=>{try{const d=JSON.parse(e.target.result);
const{W,added,replaced,skipped}=mergeImport(D,d);
D=W;
if(!save())alert('⚠ Import merged but could not be written to storage (quota?). Export a backup before closing.');
render();
alert(`Import: ${added} new, ${replaced} updated (${D.sessions.length} total)${skipped?` · ${skipped} malformed session${skipped>1?'s':''} skipped`:''}`)}catch(e){alert('Invalid file — nothing was changed.')}};
r.readAsText(f);ev.target.value=''}

// ═══════════════ INIT ═══════════════
load();render();
// Arm the shared AudioContext from the first user gesture (iOS requirement — a context
// created cold at rest-timer end stays suspended and the beep is silent).
document.addEventListener('touchstart',initAC,{once:true,passive:true});
document.addEventListener('click',initAC,{once:true});
// Register the real same-origin service worker file. Blob-URL workers are
// rejected by all browsers, so offline support needs an actual ./sw.js.
if('serviceWorker'in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').then(reg=>{
    // When a new SW finishes installing AND a worker already controls the page, a fresh
    // version is ready — prompt to reload rather than swapping code mid-session.
    reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(!nw)return;
      nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)showUpdateToast()})})
  }).catch(()=>{})})}
function showUpdateToast(){if(document.getElementById('upd-toast'))return;
  const t=document.createElement('div');t.id='upd-toast';
  t.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:300;background:var(--cd);border:1px solid var(--pr);border-radius:30px;padding:9px 10px 9px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.55);font-size:12px;color:var(--tx)';
  t.innerHTML='<span>New version available</span><button style="background:var(--pr);color:var(--ink);border:none;border-radius:20px;padding:8px 16px;font-weight:700;font-size:12px;cursor:pointer">Reload</button><button aria-label="Dismiss update" style="background:0;border:none;color:var(--mu);font-size:17px;cursor:pointer;line-height:1;padding:12px 14px;margin:-8px -6px">✕</button>';
  const b=t.querySelectorAll('button');b[0].onclick=()=>location.reload();b[1].onclick=()=>t.remove();
  document.body.appendChild(t)}

</script>
</body>
