<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Tracker">
<!-- Browser chrome colour. The media-scoped pair is the PRE-JS paint: a dark-OS device
     used to get light chrome from parse until applyTheme() ran at INIT. Browsers use the
     first theme-color whose media matches, so the dark rule wins on a dark OS and the
     unmediated #tc below is the fallback. Once applyTheme() runs it REMOVES the pair and
     owns #tc outright -- otherwise an explicit light preference on a dark-OS device would
     stay overridden by the dark media rule. -->
<meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1220" media="(prefers-color-scheme: dark)">
<meta name="theme-color" id="tc" content="#f4f6fb">
<meta name="mobile-web-app-capable" content="yes">
<title>Rack-Free Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- crossorigin makes the stylesheet response CORS (not opaque) so the service worker
     can safely inspect + cache it — without it, offline loads fell back to system fonts. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@600;700;800;900&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">
<style>
:root{
/* Bright light — white cards on a cool near-white base, vivid cyan signature.
   Every accent is picked to pass BOTH ways on white: ≥4.5:1 as text on the card
   AND ≥4.5:1 under white --ink when used as a fill (buttons, badges, chips). */
--bg:#f4f6fb;--bg2:#eceff7;--cd:#ffffff;--cd2:#f4f7fd;--cb:#dde3f0;--ib:#eef1f8;--ibr:#c3cce0;
--tx:#111527;--mu:#5a6478;--dm:#6f7890;
/* vivid-cyan signature accent (deep enough for white ink on top) */
--prRGB:0,123,168;--pr:#007ba8;--prl:#dcf2fa;--prg:#0069b8;--ink:#ffffff;
--gr:#0c8050;--grl:#d9f4e7;--am:#b26102;--aml:#fdf0da;--rd:#d61f5e;--rdl:#fce4ee;
--pu:#6d47e6;--pul:#ebe6fd;--bl:#1263d6;--bll:#e2edfd;
/* Day identity (A deep azure / B hot pink / C deep green) — validated categorical
   trio, light mode, all pairs (protan ΔE 9.5, normal 21.0, all in-band). The pink
   is deliberately LIGHTER than A/C (lightness survives colorblindness); heatmap
   letters are white on A/C and dark ink on B. X (violet) was the v19 off-rotation core
   block — a 4th hue, deliberately outside the A/B/C trio because it was not part of the
   cycle. v20 dissolved that day, but the hue STAYS: sessions logged against it are still in
   users' stores and still render in history and the heat map. Mirror of JS
   DAY_COLORS/DAY_INK. */
--dayA:#0069b8;--dayAl:#ddedfa;--dayB:#ea62ab;--dayBl:#fce4f1;--dayC:#0b7a3f;--dayCl:#dcf3e5;--dayX:#6b46c8;--dayXl:#e9e3fb;
/* plate chips carry white --ink labels — each plate hue clears 4.5:1 under white */
--p10:#d61f5e;--p5:#1263d6;--p25:#0c8050;--p1:#64748b;--slate:#64748b;
--sh:0 1px 3px rgba(20,28,50,.08);--shm:0 10px 32px rgba(20,28,50,.14);--sab:env(safe-area-inset-bottom,0px);
--hdrbg:rgba(246,248,252,.86);--glow2:rgba(109,71,230,.07);
--rad:16px;--rad-sm:10px;--s1:4px;--s2:8px;--s3:12px;--s4:16px;
--disp:'Archivo Expanded',-apple-system,system-ui,sans-serif;
--body:'Archivo',-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
/* ── Dark theme: mirrors every color token. Applies when the SYSTEM prefers dark
   (unless the user forces light in Settings) or when the user forces dark.
   Accents brighten so text passes on the dark cards; --ink flips near-black so
   filled buttons/badges keep ≥4.5:1 under the brighter fills.

   ONE block serves both paths. applyTheme() writes the RESOLVED theme to data-theme
   ('auto' on a dark-OS device writes 'dark'), so explicit-dark and auto-dark reach the
   same selector. These 40 tokens used to be duplicated verbatim into an
   @media(prefers-color-scheme:dark) block as well, so a token retuned in one place and
   not the other silently diverged the two paths, with nothing to catch it.

   Still mirrored by hand, and still the thing to keep in sync: the JS chart/day palette
   in applyTheme(), for canvas and string-built SVG that CSS vars cannot reach. ── */
:root[data-theme=dark]{
--bg:#0e1220;--bg2:#131829;--cd:#1a2032;--cd2:#202944;--cb:#2a3450;--ib:#222b42;--ibr:#3b4668;
--tx:#e9edf8;--mu:#9aa6c2;--dm:#808ba8;
--prRGB:47,179,232;--pr:#2fb3e8;--prl:#0e3448;--prg:#4aa3e8;--ink:#08101e;
--gr:#3ecf8e;--grl:#0f3326;--am:#f0a848;--aml:#3a2b10;--rd:#ff5f8d;--rdl:#3d1830;
--pu:#9b7bff;--pul:#241d4a;--bl:#5b9bf0;--bll:#132a4d;
--dayA:#4aa3e8;--dayAl:#12314e;--dayB:#f07cc0;--dayBl:#3c1c31;--dayC:#43c07a;--dayCl:#11331f;--dayX:#a98cf0;--dayXl:#241a3d;
--p10:#ff5f8d;--p5:#5b9bf0;--p25:#3ecf8e;--p1:#8a94ad;--slate:#8a94ad;
--sh:0 1px 3px rgba(0,0,0,.35);--shm:0 10px 32px rgba(0,0,0,.5);
--hdrbg:rgba(14,18,32,.86);--glow2:rgba(155,123,255,.06)}
/* Pre-JS paint ONLY: applyTheme() runs at INIT and sets data-theme, but between parse and
   that call a dark-OS device would flash the light background. Two tokens, not forty --
   just enough that the flash is the right colour. Self-disables the moment applyTheme()
   stamps the attribute, whichever way it resolves. */
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0e1220;--tx:#e9edf8}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:var(--body);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
/* atmospheric backdrop: subtle cyan glow top, deep fade */
body{max-width:480px;margin:0 auto;padding-bottom:calc(28px + var(--sab));position:relative;
background:radial-gradient(125% 55% at 50% -12%,rgba(var(--prRGB),.09),transparent 58%),radial-gradient(90% 50% at 100% 8%,var(--glow2),transparent 60%),var(--bg);background-attachment:fixed}
input,select,button,textarea{font-family:inherit}
/* Former div-onclick controls are real <button>s now — neutralize UA button chrome. */
button.set-tick,button.disc-btn,button.disc-joint,button.cardio-btn,button.diff-pick,button.set-prev{-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
::selection{background:var(--pr);color:var(--ink)}

/* Layout */
.hdr{padding:calc(16px + env(safe-area-inset-top,0px)) 18px 10px;background:var(--hdrbg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--cb);position:sticky;top:0;z-index:100}
.hdr h1{font-family:var(--disp);font-size:15px;font-weight:900;color:var(--tx);letter-spacing:1.5px;text-transform:uppercase}
.hdr h1::before{content:'';display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--pr);margin-right:9px;vertical-align:middle;box-shadow:0 0 0 3px rgba(var(--prRGB),.18)}
/* top offset includes the notch inset — .hdr grows by it, so the nav's sticky
   anchor must move with it or the two gap/overlap on notched devices */
.nav{display:flex;background:var(--hdrbg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);position:sticky;top:calc(48px + env(safe-area-inset-top,0px));z-index:99;border-bottom:1px solid var(--cb)}
.nav button{flex:1;padding:14px 0;font-family:var(--disp);font-size:10px;font-weight:700;border:none;border-bottom:2px solid transparent;background:0;color:var(--mu);cursor:pointer;letter-spacing:.6px;text-transform:uppercase;transition:color .2s}
.nav button.a{color:var(--pr);border-bottom-color:var(--pr);text-shadow:none}
.sec{padding:14px 14px;animation:fadeUp .4s ease both}
/* One screen-title treatment for every page (the nav bar hides on workout/summary/
   cardio/logpast, so in-screen titles are the only wayfinding there) */
.pg-title{font-family:var(--disp);font-size:16px;font-weight:900;letter-spacing:.5px;margin:0 0 10px}
/* Screen titles are <h2> so the app has a real heading outline under the header's <h1>.
   Screens with no VISIBLE title (Home, Workout, Progress) get an sr-only one rather than
   new on-screen text — the structure is for screen readers, not a redesign. */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Cards */
.cd{background:var(--cd);border-radius:var(--rad);padding:14px 16px;margin-bottom:10px;border:1px solid var(--cb);box-shadow:var(--sh)}

/* Type */
/* display:block is load-bearing, not decorative: several .lb elements are <label for>
   rather than <div> so the visible caption is the control's accessible name. A label is
   inline by default, which would drop the margin-bottom and pull the control onto the
   same line. Every .lb was already a block-level div, so this changes nothing visually. */
.lb{display:block;font-family:var(--disp);font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;font-weight:700}
.mu{font-size:12px;color:var(--mu)}.dm{font-size:11px;color:var(--dm)}

/* Badges */
.bg{display:inline-block;padding:3px 9px;border-radius:6px;font-family:var(--disp);font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase}
/* Day identity: A azure / B hot pink / C neon green — dedicated --day* tokens
   (validated categorical trio, see :root); every colored day surface also carries
   its letter as secondary encoding. Keep in sync with JS DAY_COLORS. */
.bg-a{background:var(--dayAl);color:var(--dayA)}.bg-b{background:var(--dayBl);color:var(--dayB)}.bg-c{background:var(--dayCl);color:var(--dayC)}.bg-x{background:var(--dayXl);color:var(--dayX)}
.sg{font-family:var(--disp);font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;display:inline-block;letter-spacing:.3px}
.sg-up{color:var(--ink);background:var(--pr)}.sg-st{color:var(--am);background:var(--aml)}.sg-nw{color:var(--pr);background:var(--prl)}
.sg-dn{color:var(--rd);background:var(--rdl)}.sg-cf{color:var(--bl);background:var(--bll)}
.regress{font-size:10px;color:var(--rd);padding:3px 7px;background:var(--rdl);border-radius:6px;display:inline-block;font-weight:600}
.pr-badge{font-family:var(--disp);font-size:10px;font-weight:800;color:var(--ink);background:var(--am);padding:3px 9px;border-radius:6px;letter-spacing:.5px;white-space:nowrap}
.max-badge{font-size:9px;font-weight:800;color:var(--rd);background:var(--rdl);padding:2px 7px;border-radius:5px;margin-left:4px}
.cue{font-size:12px;color:var(--tx);padding:9px 12px;background:var(--prl);border-radius:var(--rad-sm);margin:6px 0;border-left:3px solid var(--pr)}

/* Inputs */
.ri{width:54px;height:54px;font-family:var(--disp);font-size:21px;font-weight:800;background:var(--ib);border:2px solid var(--ibr);border-radius:var(--rad-sm);color:var(--tx);text-align:center;outline:none;transition:.15s;font-variant-numeric:tabular-nums}
.ri:focus{border-color:var(--pr);background:var(--cd2);box-shadow:0 0 0 3px rgba(var(--prRGB),.18)}
.ri.pf{color:var(--dm)}.ri.done{border-color:var(--gr);background:var(--grl);color:var(--gr)}
.ni{width:100%;padding:9px 11px;font-size:12px;background:var(--ib);border:1px solid var(--ibr);border-radius:var(--rad-sm);color:var(--tx);outline:none}
.ni:focus{border-color:var(--pr);color:var(--tx);background:var(--cd2)}
.bs{padding:9px 11px;font-size:12px;background:var(--ib);border:1px solid var(--ibr);border-radius:var(--rad-sm);color:var(--tx);outline:none;width:100%}
.body-input{width:84px;padding:11px;font-family:var(--disp);font-size:18px;background:var(--ib);border:1px solid var(--ibr);border-radius:var(--rad-sm);color:var(--tx);text-align:center;outline:none;font-weight:800;font-variant-numeric:tabular-nums}
.body-input:focus{border-color:var(--pr);background:var(--cd2)}
.sess-note{width:100%;padding:9px 11px;font-size:12px;background:var(--ib);border:1px solid var(--ibr);border-radius:var(--rad-sm);color:var(--tx);outline:none;resize:none;min-height:38px;font-family:inherit}
.sess-note:focus{border-color:var(--pr);background:var(--cd2)}

/* Weight stepper */
.stp{display:flex;align-items:center;gap:8px;justify-content:center}
.stp-b{width:50px;height:50px;display:flex;align-items:center;justify-content:center;border-radius:var(--rad-sm);border:1px solid var(--ibr);background:var(--ib);color:var(--tx);font-family:inherit;font-size:24px;font-weight:700;cursor:pointer;user-select:none;transition:.12s}
/* .dis is the visual state; :disabled is the real one. Both are emitted together so a
   greyed-out stepper genuinely stops responding instead of only looking inert. */
.stp-b:active:not(:disabled){background:var(--pr);color:var(--ink);transform:scale(.92)}
.stp-b.dis,.stp-b:disabled{color:var(--dm);cursor:default}
.stp-b.stp-sm{width:44px;height:44px;font-size:20px;border-radius:12px}
/* Dominant weight readout for the active barbell card */
.stp-big{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:6px}
.stp-hero{font-family:var(--disp);font-size:66px;font-weight:900;color:var(--pr);font-variant-numeric:tabular-nums;line-height:.88;letter-spacing:-2.5px;position:relative}
.stp-hero sub{font-family:var(--body);font-size:15px;font-weight:600;color:var(--mu);vertical-align:baseline;margin-left:4px;text-shadow:none;letter-spacing:0}
.stp-row{display:flex;align-items:center;gap:18px}
.stp-big .stp-b{width:56px;height:56px;font-size:28px;border-radius:50%}
.pls{display:flex;align-items:center;gap:3px;padding:3px 0;justify-content:center}
.pl{height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:var(--ink)}
.pl-10{background:var(--p10);width:24px}.pl-5{background:var(--p5);width:20px}.pl-2{background:var(--p25);width:17px}.pl-1{background:var(--p1);width:17px;font-size:7px;letter-spacing:-.3px}
/* Spinlock DB plates: chrome like the real ones — label carries the value */
.pl-db{height:20px;background:linear-gradient(180deg,#d7dce2,#9aa3ad);color:#1a2027;font-size:7px;font-weight:800;letter-spacing:-.3px;border:1px solid #7e8894}

/* Buttons */
.btn{padding:16px 20px;font-family:var(--disp);font-size:14px;font-weight:800;border:none;border-radius:var(--rad-sm);cursor:pointer;width:100%;display:block;transition:.15s;letter-spacing:1px;text-transform:uppercase}
.btn.btn-md{padding:10px 14px;font-size:13px} /* compact banner/inline actions — stop re-declaring sizes inline */
.btn:active{transform:scale(.97);opacity:.92}
.btn-pr{background:linear-gradient(135deg,var(--pr),var(--prg));color:var(--ink);box-shadow:0 4px 16px rgba(var(--prRGB),.30),inset 0 1px 0 rgba(255,255,255,.25)}
.btn-wh{background:var(--cd2);color:var(--tx);border:1px solid var(--cb)}
.btn-rd{background:var(--rdl);color:var(--rd);border:1px solid #f3c3d6}
.btn-sm{padding:7px 13px;font-size:10px;width:auto;display:inline-block;border-radius:8px;font-weight:700;letter-spacing:.5px}
.btn-ghost{background:0;border:none;color:var(--pr);font-weight:700;padding:6px 10px;font-size:12px;font-family:var(--body)}

/* Bars */
.fg-bar{height:6px;border-radius:4px;background:var(--ib);overflow:hidden;margin:5px 0}
.fg-fill{height:100%;border-radius:4px;transition:width .5s cubic-bezier(.34,1.56,.64,1)}
.prog-strip{display:flex;gap:3px;margin:7px 0}
.prog-seg{flex:1;height:6px;border-radius:4px;background:var(--ib);transition:.3s}
.prog-seg.pg-done{background:var(--pr);box-shadow:none}.prog-seg.pg-cur{background:var(--pu)}

/* Timer — compact floating pill */
/* fixed overlays anchor to the VIEWPORT — right:max() keeps the pill inside the
   480px app column on wide screens instead of floating at the window edge */
.timer-pill{position:fixed;bottom:calc(18px + var(--sab));right:max(16px,calc(50vw - 240px + 16px));max-width:170px;background:var(--cd);border:2px solid var(--pr);border-radius:40px;padding:9px 15px;z-index:200;display:flex;align-items:center;gap:8px;box-shadow:var(--shm),0 0 20px rgba(var(--prRGB),.15);font-variant-numeric:tabular-nums}
.timer-pill.done{border-color:var(--gr);background:var(--grl);animation:pulse .6s ease 2}
.timer-pill .t-time{font-family:var(--disp);font-size:19px;font-weight:800;color:var(--pr)}
.timer-pill.done .t-time{color:var(--gr)}
.timer-pill .t-x{width:44px;height:44px;border-radius:50%;border:none;background:var(--ib);color:var(--mu);font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.timer-pill .t-x:active{background:var(--cb)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* Rest-done full-screen takeover — deliberately hard to miss (pulsing green scrim +
   card, paired with the repeating alarm/buzz in startAlarm). Flash cycle is ~1.25 Hz,
   well under the 3 Hz photosensitivity threshold. Theme-aware via existing tokens. */
.alarm-overlay{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;padding:24px calc(24px + var(--sab)) calc(24px + var(--sab));animation:alarmFlash .8s ease-in-out infinite;-webkit-tap-highlight-color:transparent;cursor:pointer}
.alarm-card{position:relative;z-index:1;width:100%;max-width:420px;background:var(--cd);border:4px solid var(--gr);border-radius:24px;padding:32px 24px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:alarmPulse .8s ease-in-out infinite;cursor:auto}
.alarm-emoji{font-size:56px;line-height:1;margin-bottom:8px}
.alarm-title{font-family:var(--disp);font-size:40px;font-weight:900;letter-spacing:-.02em;color:var(--gr);margin:0 0 6px}
.alarm-sub{font-size:15px;font-weight:600;color:var(--tx);opacity:.85;margin:0 0 18px}
.alarm-time{font-family:var(--disp);font-size:17px;font-weight:800;color:var(--mu);font-variant-numeric:tabular-nums;margin:0 0 20px}
.alarm-dismiss{width:100%;max-width:320px;padding:20px;border:none;border-radius:16px;background:var(--gr);color:var(--ink);font-family:var(--disp);font-size:20px;font-weight:800;cursor:pointer;box-shadow:var(--shm)}
.alarm-dismiss:active{transform:scale(.98)}
@keyframes alarmFlash{0%,100%{background:rgba(8,20,15,.80)}50%{background:rgba(12,128,80,.72)}}
@keyframes alarmPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}

/* Banners */
.deload-banner{background:var(--aml);border:1px solid #ecd9ae;border-radius:var(--rad-sm);padding:10px 13px;margin-bottom:10px;font-size:12px;color:var(--am)}

/* Workout list */
.ex-row{background:var(--cd);border-radius:var(--rad);padding:12px 14px;margin-bottom:8px;border:1.5px solid var(--cb);cursor:pointer;transition:border-color .2s,background .2s,transform .1s}
.ex-row.cur{border-color:var(--pr);box-shadow:var(--shm),0 0 24px rgba(var(--prRGB),.1);cursor:default}
.ex-row.done-row{border-color:var(--gr);background:linear-gradient(135deg,var(--grl),var(--cd))}
.ex-row.upcoming{opacity:.55}
.ex-row.upcoming:active{opacity:.75}
.ex-row:not(.cur):hover{border-color:var(--ibr)}
.ex-row.upcoming:hover{opacity:.7}
.ex-expand{padding:12px 0 2px;margin-top:10px;border-top:1px solid var(--cb)}

/* Set tick */
.set-tick{width:44px;height:44px;border-radius:50%;border:2px solid var(--ibr);background:var(--ib);display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;transition:.15s;margin:6px auto 0;color:var(--mu)}
.set-tick.done{background:var(--pr);border-color:var(--pr);color:var(--ink);animation:tickpop .35s cubic-bezier(.34,1.56,.64,1)}
.set-tick:active{transform:scale(.85)}
/* Hevy-style set rows: SET | PREVIOUS | KG | REPS | tick */
.set-tbl{margin:6px 0 2px}
.set-gr{display:grid;grid-template-columns:24px minmax(0,1fr) 60px 54px 40px;gap:6px;align-items:center}
.set-hd span{font-size:9px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;text-align:center}
.set-hd span:nth-child(2){text-align:left}
.set-hd{padding:0 2px 4px}
.set-row{padding:4px 2px;border-radius:var(--rad-sm);margin-bottom:3px;border:1.5px solid transparent;transition:background .2s,border-color .2s}
.set-row.done{background:var(--grl);border-color:var(--gr)}
.set-num{font-family:var(--disp);font-size:14px;font-weight:800;color:var(--mu);text-align:center}
.set-row.done .set-num{color:var(--gr)}
.set-prev{font-size:10px;color:var(--dm);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.cyc-dash{width:20px;height:2px;background:var(--cb);border-radius:2px;margin-bottom:3px}

.prev2:active,.prev2:hover{background:var(--ib)}

.sg-up-txt{color:var(--pr)}.sg-dn-txt{color:var(--rd)}.sg-cf-txt{color:var(--bl)}.sg-nw-txt{color:var(--mu)}.sg-st-txt{color:var(--tx)}

svg text{font-family:var(--body)}

/* Progress tab: at-a-glance status header */
.status-hd{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--cb);border:1px solid var(--cb);border-radius:var(--rad);overflow:hidden;margin-bottom:10px;box-shadow:var(--sh)}
.status-cell{background:var(--cd);padding:14px 8px;text-align:center}
.status-k{font-family:var(--disp);font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mu);font-weight:700;margin-bottom:6px}

/* Progress tab: snapshot grid + stat strip */
.snap-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.snap-cell{background:var(--ib);border-radius:var(--rad-sm);padding:11px 8px;text-align:center}
.snap-num{font-family:var(--disp);font-size:25px;font-weight:900;color:var(--pr);font-variant-numeric:tabular-nums;line-height:1;text-shadow:none}

.seg-row{display:flex;gap:6px;margin:10px 0 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;

mask-image:linear-gradient(90deg,transparent 0,#000 20px,#000 calc(100% - 28px),transparent);
padding-left:4px;scroll-padding:24px}

.band-lad{display:flex;align-items:center;gap:4px;flex-wrap:wrap}

<body>
<div class="hdr"><h1>RACK-FREE TRACKER</h1></div>
<nav class="nav" id="nav" aria-label="Main"></nav>
<main id="app"></main>
<div id="timer-root"></div>
<div id="alarm-root"></div>
<script>
// ═══════════════ EQUIPMENT ═══════════════
// MAX_BB = the true inventory-loadable ceiling: the 11kg straight bar + all 74kg of plates
// (37kg/side, mirrored) = 85kg. The hex (7kg) and landmine ladders top out lower on the same
// plates (81kg / 85kg single-end) and are naturally bounded below this. Raised from a prior
// arbitrary 80 so the last few loadable rungs aren't hidden behind a false "🔒 MAX".
const BAR=11,HEXBAR=7,MAX_BB=85;
// Plate inventory: {w: plate weight kg, q: total count owned (pairs loaded symmetrically)}
// Mains + micro set (pairs of 0.25/0.5/0.75/1kg). q must be even to load evenly.
const PL=[{w:10,q:4},{w:5,q:4},{w:2.5,q:2},{w:1,q:6},{w:0.75,q:2},{w:0.5,q:2},{w:0.25,q:2}];
// Valid weights for a given bar: enumerate every loadable combo (each plate 0..floor(q/2) per side, ×2).
// Bar-aware: the hex/trap bar is lighter (7kg) than the straight bar (11kg), so its ladder differs.
function buildVW(barW,plates=PL){
  const per=plates.map(p=>({w:p.w,max:Math.floor(p.q/2)}));
  const set=new Set([barW]);
  let combos=[0];
  for(const p of per){
    const next=[];
    for(const base of combos)for(let c=0;c<=p.max;c++)next.push(base+c*p.w);
    combos=[...new Set(next)];
  }
  for(const side of combos){const t=Math.round((barW+2*side)*100)/100;if(t<=MAX_BB)set.add(t)}
  return [...set].sort((a,b)=>a-b);
}
const VW=buildVW(BAR);      // 11kg straight bar (default)
const VWH=buildVW(HEXBAR);  // 7kg hex/trap bar
// Coarse ladders (plates ≥1kg only) for WARM-UP snapping — fishing out 0.25/0.5/0.75
// micro plates for a warm-up set is pointless friction; micros are for work-set jumps.
const PL_COARSE=PL.filter(p=>p.w>=1);
const VW_C=buildVW(BAR,PL_COARSE),VWH_C=buildVW(HEXBAR,PL_COARSE);
// Landmine lifts (lm:true) load ONE end only — the other pivots on the floor — so plates
// are NOT mirrored: each plate type can fill the single sleeve up to its FULL owned count,
// and total = bar + that single-side load. This is a finer ladder than the symmetric one
// (a lone 0.25kg micro plate → 11.25kg, which mirrored pairs can't make). Bar is still 11kg.
function buildVWL(barW){
  let combos=[0];
  for(const p of PL){const next=[];for(const base of combos)for(let c=0;c<=p.q;c++)next.push(base+c*p.w);combos=[...new Set(next)]}
  const set=new Set([barW]);
  for(const side of combos){const t=Math.round((barW+side)*100)/100;if(t<=MAX_BB)set.add(t)}
  return [...set].sort((a,b)=>a-b);
}
const VWL=buildVWL(BAR);    // 11kg straight bar, single-end (landmine) loading
// Resolve the bar weight + valid-weight ladder an exercise loads on (hex lifts carry bar:7,

function perSide(t,bar=BAR,lm=false){let r=lm?(t-bar):(t-bar)/2;if(r<0)return null;const o=[];for(const p of PL){const m=lm?p.q:p.q/2;let c=Math.min(Math.floor(r/p.w),m);if(c>0){o.push({w:p.w,c});r-=c*p.w}}return Math.abs(r)<.01?o:null}

// Set 1: 4×0.5 + 4×1.25 + 8×2.5 kg plates, 2×35cm bars. Set 2 (Active Intent 20kg):

// 20kg total − 16kg plates over 2 bars); ASSUMED equal for Set 1's near-identical bars —
// correct DB_BAR here if Set 1's bars weigh differently.
const DB_BAR=2;
const DB_PL=[{w:2.5,q:8},{w:2,q:4},{w:1.25,q:4},{w:1,q:8},{w:0.5,q:4}];
const DB_SLEEVE_MAX=4; // plates per END — 35cm spinlock sleeves are short
// Valid per-bell weights (buildVW analog). Plates load one-per-end in pairs, so a bell
// consumes 2 of a denomination per step; MATCHED mode builds TWO identical bells (for
// loadUnit:'per_db' lifts — one in each hand) and therefore consumes 4 per step. Each
// distinct per-end sum keeps its minimum plate count so the sleeve cap never discards
// a sum reachable with fewer plates.
function buildDBW(matched){
const per=DB_PL.map(p=>({w:p.w,max:Math.floor(p.q/(matched?4:2))}));
let combos=[{s:0,n:0}];
for(const p of per){
  const next=[];
  for(const base of combos)for(let c=0;c<=p.max;c++){const n=base.n+c;if(n>DB_SLEEVE_MAX)break;next.push({s:base.s+c*p.w,n})}
  const seen=new Map();
  for(const x of next){const k=Math.round(x.s*100);if(!seen.has(k)||seen.get(k).n>x.n)seen.set(k,x)}
  combos=[...seen.values()];
}
const set=new Set();for(const c of combos)set.add(Math.round((DB_BAR+2*c.s)*100)/100);
return[...set].sort((a,b)=>a-b)}
const DBW_PAIR=buildDBW(true);    // two matched bells (per_db lifts)
const DBW_SINGLE=buildDBW(false); // one bell gets the whole pool
function dbwOf(ex){return ex&&ex.loadUnit==='per_db'?DBW_PAIR:DBW_SINGLE}
function snapDB(t,ex){const vw=dbwOf(ex);let b=vw[0];for(const w of vw)if(Math.abs(w-t)<Math.abs(b-t))b=w;return b}
// EXACT per-end breakdown for a bell weight (perSide/fmtPl analog). Greedy fails on
// these denominations — 2.75/end is 1.25+1+0.5, but greedy grabs the 2.5 and dead-ends —
// so this is a tiny DFS (≤ a few dozen states) returning the fewest-plates exact combo.
function dbEnd(t,matched){
const target=Math.round(((t-DB_BAR)/2)*100)/100;
if(target<-0.001)return null;
if(target<0.001)return[];
let best=null;
const walk=(i,rem,n,acc)=>{
  if(best&&n>=best.n)return;
  if(Math.abs(rem)<0.005){best={n,combo:acc.filter(x=>x.c>0).map(x=>({w:x.w,c:x.c}))};return}
  if(i>=DB_PL.length||rem<-0.005||n>=DB_SLEEVE_MAX)return;
  const p=DB_PL[i],m=Math.min(Math.floor(p.q/(matched?4:2)),DB_SLEEVE_MAX-n,Math.floor(rem/p.w+1e-9));
  for(let c=m;c>=0;c--){acc.push({w:p.w,c});walk(i+1,rem-c*p.w,n+c,acc);acc.pop()}
};
walk(0,target,0,[]);
return best?best.combo:null}
function fmtDbEnd(t,matched){if(t==null||t<=DB_BAR)return'Bar only';const p=dbEnd(t,matched);return p?p.map(x=>`${x.c}×${x.w%1?x.w:x.w|0}kg`).join(' + '):'—'}
// Chip diagram for one bell end — the barbell plateH sibling. Chrome-styled (the real
// plates are chrome spinlocks) so the barbell color code (blue=5kg etc.) can't lie here;
// the label carries the value, width scales with the denomination.
function dbPlateH(t,matched){if(!t||t<=DB_BAR)return'';const ps=dbEnd(t,matched);if(!ps||!ps.length)return'';
let h='<div class="pls">';for(const p of ps)for(let i=0;i<p.c;i++){
const wd=p.w>=2.5?22:p.w>=2?20:p.w>=1.25?17:p.w>=1?15:13;
h+=`<div class="pl pl-db" style="width:${wd}px">${p.w%1?p.w:p.w|0}</div>`}
h+='</div>';return h}

{id:'lm_press',nm:'Landmine Press (two-hand)',s:3,rp:'10-12',rst:'1:00',rir:'2-3',tp:'bb',lm:true,rl:'Two-hand landmine press — the long-pending landmine press lands here (Day-B OHP stays barbell). Hold the bar end at the sternum with both hands, press up and slightly forward along the arc, soft lockout. Load plates on the FREE end only. ⚠ The pivot offloads part of the weight — judge by RIR, not the plate number. Confirm → ↑ weight.',note:'Finding session — start at OHP load. Judge by RIR, not the plate number (the pivot offloads part of the weight). Target RIR 2-3 for 10-12 first session; if 12 reps with 3+ in reserve, next session go to ~30-31 kg. Expect to settle ~26-32 kg.',tg:12,rstS:60,tempo:'3-1-2-0',perSide:false},
{id:'lm_lateral_squat',nm:'Landmine Lateral Squat',s:3,rp:'8/side',rst:'1:00',rir:'2',tp:'bb',lm:true,rl:'Frontal-plane quad/adductor slot — replaces the Loaded Cossack (easier to groove and to load progressively). Front-rack the bar end at the shoulder or hold it in the crook of the arm, feet wide and parallel, and shift side to side: sit into one hip with that knee tracking over the toes while the other leg stays long, drive back to center, switch. Load plates on the FREE end only. ⚠ The pivot offloads part of the load — judge by RIR, not the plate number.',note:'Finding session — front-rack the landmine or hold it in the crook of the arm. Weak side leads; match the strong side\'s reps to the weak side. Judge by RIR, not the plate number (the pivot offloads part of the load). Easier to load than the Cossack was — once you own the depth with 2-3 reps in reserve, add to the free end.',tg:8,rstS:60,tempo:'3-1-2-0',perSide:true},
{id:'lm_pallof',nm:'Landmine Anti-Rotation',s:3,rp:'10/side',rst:'1:00',rir:'2',tp:'bb',lm:true,rl:'Finisher. Face the bar, both hands on the end. Press out and resist the rotation — brace hard, no trunk twist. Slow, controlled, both sides. Load plates on the FREE end only. Confirm → ↑ weight.',tg:10,rstS:60,tempo:'2-0-1-2',perSide:true},

{id:'deficit_pushup',nm:'Deficit Push-ups',s:2,rp:'12-15',rst:'1:00',rir:'1-2',tp:'bw',rl:'Optional finisher (v13) — extra chest volume on the historical push-up day. Hands on plates/low blocks, chest below hand level at the bottom for the deep stretch, body in one line. Skip freely on tight days.',note:'Bodyweight. Hands on 5 kg plates or DB handles for a ~5-8 cm deficit. Controlled, pain-free depth with a brief pause at the bottom. Progress: if 2x15 is easy with a full pause, add a 3s eccentric, then load (plate on back / backpack) — not more depth.',tg:15,rstS:60,tempo:'3-1-2-0',perSide:false,optional:true}]};

// (1) v19 was right that core-as-a-finisher gets skipped, and wrong about the fix: a block
//     that needs its OWN session on a rest day is a block that never gets run at all. The
//     lifter reported exactly that. So the four movements go back onto the lifting days —
//     but placed where the equipment already is, not tacked on as an afterthought:
//       • home    A ← dead_bugs_a  (it lives on the empty straight bar, so it closes the
//                                   bar block instead of asking for a fresh setup)
//                 B ← bb_rollout (same straight bar, on the floor, straight after the lying
//                                 extension) + bird_dog (bodyweight, zero setup, last)
//                 C ← lm_pallof   (folds into the landmine block)

//                 came from in v19, all three at the end where they cost no DB change.

//     the same slots, the same sets, just re-homed. It is now counted across A/B/C only,
//     so a weekly sweep no longer has a fourth day to forget.
// (2) Every day is ordered to minimise equipment changes: same-implement lifts run
//     back-to-back, and within a block the load DESCENDS so plates only come off. The
//     no-plate slots (band-assisted pull-ups/dips, bodyweight) are slotted inside a block
//     wherever they cost nothing, since they don't touch the bar at all. Two deliberate
//     compromises, both flagged so they don't read as sorting mistakes:
//       • home A runs lm_lateral 3rd (it's the light end of the landmine block). That
//         pre-fatigues side delts slightly before floor_press — accepted, because the
//         alternative buried the day's only quad slot behind six upper-body exercises.
//       • home C returns to the hex bar for hex_carry AFTER the landmine block. One extra
//         bar swap, bought deliberately: the carry is a finisher, and running it before a
//         4-set landmine squat would tax the trunk and grip that squat needs.
// (3) EVERY prescribed rest is now 1:00 (rst '1:00' / rstS 60), lifter's call across the
//     board. ⚠ Worth knowing rather than silently absorbing: the heavy pillars (hex_dl,
//     hex_squat_b, ohp, pullup_a, dips) were on 2:10-2:30 because that is roughly what
//     phosphocreatine resynthesis takes. At 1:00 expect the top-end sets to come down —
//     that is the trade, not a bug, and the progression engine will simply re-anchor to
//     whatever gets logged. If strength stalls on those five specifically, the rest is the
//     first thing to put back.
// Day counts: home A=9 B=9 C=10 (one optional), partner A=8 B=9 C=7. No day 'X'.

// Program v21 — THE PARTNER SPLIT IS COLLAPSED INTO ONE REPEATABLE SESSION.
// The lifter trains here irregularly (7 of 62 logged sessions over 21.9 weeks; gaps of
// 3-35 days) and wants "a day I can do that's close to home, so I'm still progressing".
// A 3-way A/B/C split cannot deliver that, for a reason that is arithmetic rather than
// preference:
//   • Day A had been run ONCE in five months. At the observed cadence a full partner
//     A→B→C cycle takes 9.4 weeks, so any day-specific lift got ~1 exposure per quarter.
//   • getSmartSugg's big-overshoot re-anchor needs 2-3 EXPOSURES of a lift to converge
//     (≈2.5%/rep over target, capped +12%/session). At 1 exposure per 9.4 weeks it never
//     converges: db_lunge logged 3×16 against a target of 10 would have taken five Day-C
//     visits — about nine months — to reach a load already within reach today.
// So A, B and C now share ONE full-body base (PARTNER_BASE) and differ only by a finisher.
// Every visit trains the same seven movements, so at ~3 visits/month the engine re-anchors
// inside a month instead of never. The A/B/C keys are KEPT: the rotation, day badges,
// history and nextDay derivation all key off them, and a partner visit should still consume
// the rotation slot it lands on.
// ─────────────────────────────────────────────────────────────────────────────────────────
// WHAT THE VENUE CAN AND CANNOT DO (measured, not assumed) — buildDBW enumerates the real
// spinlock inventory: MATCHED pair (per_db lifts) tops out at 18.5kg/DB, SINGLE bell at

function getWeeklyVolume(days){
  const cut=new Date();cut.setDate(cut.getDate()-(days||7));

// ── Per-session muscle split (Hevy-style): MG contributions × completed sets,
// rolled up to display groups and normalized to % of the session's stimulus. ──
const SPLIT_GROUPS={chest:'Chest',back:'Back',fdelt:'Shoulders',sidedelt:'Shoulders',reardelt:'Shoulders',
  cuff:'Shoulders',biceps:'Arms',triceps:'Arms',quads:'Quads',hams:'Hamstrings',glutes:'Glutes',
  core:'Core',calves:'Calves'};
function muscleSplit(exArr){
  const by={};let tot=0;
  for(const e of exArr||[]){const map=MG[e.id];if(!map)continue;
    const sets=(e.reps||[]).filter(r=>Number(r)>0).length;if(!sets)continue;
    for(const[m,w] of Object.entries(map)){const g=SPLIT_GROUPS[m]||m;
      by[g]=(by[g]||0)+sets*w;tot+=sets*w}}
  if(!tot)return[];
  // Largest-remainder rounding so displayed percentages always sum to exactly 100
  // (independent Math.round drifted the total to 97–104 with many groups).
  const rows=Object.entries(by).map(([g,v])=>({g,v:Math.round(v*10)/10,raw:v/tot*100}))
    .sort((a,b)=>b.v-a.v);
  let used=0;for(const r of rows){r.pct=Math.floor(r.raw);used+=r.pct}
  [...rows].sort((a,b)=>(b.raw%1)-(a.raw%1)).slice(0,100-used).forEach(r=>{r.pct++});
  for(const r of rows)delete r.raw;
  return rows}

// (like the reference app), the % label carries the absolute share.

  for(const s of sp)h+=`<div class="msp-row"><div class="msp-top"><span>${s.g}</span><span class="msp-pct">${s.pct}%</span></div>
  <div class="msp-track"><div class="msp-fill" style="width:${Math.max(3,Math.round(s.pct/mx*100))}%"></div></div></div>`;
  return h+`</div>`}

function getPhaseInfo(){

const sessSince=D.sessions.filter(s=>s.date>=D.phaseStart).length;
const p=PHASES[D.phase]||PHASES[1];

// Dedupe by id first — a lift on two days (e.g. lm_lateral on A+B) is ONE exercise
// and must be counted once, or a single stall/progress reads as two and skews the
// phase-change + deload signals.
// v21.1: assess BOTH venues, not just the one the location toggle happens to sit on.
// getCurPR() is location-scoped, so the phase verdict used to be computed over ~7 partner
// lifts when the toggle was left on "Partner's" and ~23 home lifts otherwise — a decision
// about the whole training block was reading whichever venue was selected. It is worse than
// it sounds after v21: most partner slots are new, so they read as 'up'/'new' and a
// partner-scoped assessment can never show a stall. Muscle stimulus and progression both
// accumulate across venues (getWeeklyVolume already works this way), so the phase signal
// must too. Ids are shared where the movement is identical, hence the dedupe.
const seenEx=new Set();const uniqEx=[];
for(const loc of ['home','partner'])for(const day of Object.values(getProgram(D.phase,loc)))for(const ex of day){
  if(seenEx.has(ex.id))continue;seenEx.add(ex.id);uniqEx.push(ex)}

for(const ex of uniqEx){if(ex.tp==='bw'||ex.tp==='carry'||ex.tp==='club'||ex.tp==='mace')continue;

  if(sg.type==='dn'||sg.stalled)stalledEx++;

  // (sg.stalled = 3 sessions below range) on a COMPOUND lift (MG recruits ≥2 muscles).
  // A lateral raise or curl dipping is not systemic fatigue; two compounds grinding to a
  // halt is. stalledEx (any stall) still drives phase-change logic, untouched.
  if(sg.stalled&&Object.keys(MG[ex.id]||{}).length>=2)stalledMajor++;
  if(sg.type==='up'||sg.type==='cf')progressingEx++}

// Walks RAW rep indices (not effectiveReps, which compacts) — a compacted index read against
// wts[i] scores the wrong set whenever a zero-rep set precedes an override, the same trap
// exSetE1RMMax documents. Entries without wts return e.wt exactly, so every session logged
// before v15 — and every uniform session, since finishW only persists wts when a counted set
// differs from wt — is completely unaffected.
function sessLoad(e,nSets){
if(!e)return 0;
const base=Number(e.wt)>0?Number(e.wt):0;
if(!Array.isArray(e.wts))return base;
const rr=e.reps||[];let n=0,m=Infinity;
for(let i=0;i<rr.length&&n<nSets;i++){if(!(Number(rr[i])>0))continue;n++;
const w=setWt(e,i);if(!(w>0))return base;if(w<m)m=w}
return m===Infinity?base:m}
// Live in-workout totals from the LOG global's shape: only CHECKED sets count
// (the Hevy semantic — the header shows work banked, not work planned).
function liveStats(log){let sets=0,vol=0;
for(const[id,v] of Object.entries(log||{})){
  if(!v||!Array.isArray(v.reps))continue;
  const done=v.setDone||[];
  for(let i=0;i<v.reps.length;i++){const r=Number(v.reps[i]);
    if(!done[i]||!(r>0))continue;sets++;
    vol+=calcExVol(id,Number(v.wts?.[i])>0?Number(v.wts[i]):(Number(v.wt)||null),[r])}}
return{sets,vol:Math.round(vol)}}
// "Previous" column label for set i of the last session's entry (Hevy-style).
function prevSetLbl(last,i){if(!last)return'—';
const r=Number((last.reps||[])[i]);if(!(r>0))return'—';
const w=setWt(last,i);return w?`${w}×${r}`:`×${r}`}
// Compact per-set line for a saved entry: uniform-weight sessions keep the old
// "46kg [8,8,8]" shape; per-set overrides expand to "46×8, 50×6, 40×10".
function fmtSets(e){const vr=(e.reps||[]).map(Number);
if(Array.isArray(e.wts)&&e.wts.some(w=>Number(w)>0)){
  const parts=[];for(let i=0;i<vr.length;i++){if(!(vr[i]>0))continue;
    const w=setWt(e,i);parts.push(w?`${w}×${vr[i]}`:`×${vr[i]}`)}
  return parts.join(', ')}
return`${e.wt?e.wt+'kg ':''}[${vr.filter(r=>r>0).join(',')}]`}

function getRelatedSuggestion(ex){
  const rel=RELATED_EX[ex.id];
  if(!rel)return null;
  // No peer lift — use explicit seed value from audit prescription
  if(!rel.id){
    if(rel.seedBand)return{wt:null,band:rel.seedBand,note:rel.note,relName:'starting load'};
    if(rel.seedWt!=null)return{wt:rel.seedWt,band:'',note:rel.note,relName:'starting load'};
    return null;
  }
  const relHist=getHist(rel.id,5).filter(h=>!h.noProg); // user-excluded sessions can't seed peers either
  const relLast=relHist.length?relHist[relHist.length-1]:null;
  // Peer lift has no history — fall back to seed if one is provided
  if(!relLast){
    if(rel.seedWt!=null)return{wt:rel.seedWt,band:'',note:rel.note,relName:'starting load'};
    return null;
  }
  // Band exercises: copy band setting
  if(ex.tp==='band'&&relLast.band){
    return{wt:null,band:relLast.band,note:`${rel.note} (${relLast.band})`,relName:(ALL_EX.find(e=>e.id===rel.id)||{}).nm||rel.id};
  }
  // BW exercises with no weight: use rep total as reference
  if(ex.tp==='bw'&&(!relLast.wt||relLast.wt===0)){
    const tot=relLast.reps.reduce((a,b)=>a+b,0);
    return{wt:null,band:'',note:`${rel.note} — last: ${tot} reps`,relName:(ALL_EX.find(e=>e.id===rel.id)||{}).nm||rel.id};
  }
  // Weighted: compute suggested kg. DB targets snap onto the real spinlock ladder
  // (matched-pair or single-bell); everything else rounds to 0.5kg as before.
  if(relLast.wt){
    let kg=relLast.wt*(rel.mult||1.0)+(rel.addKg||0);
    kg=ex.tp==='db'?snapDB(kg,ex):Math.round(kg*2)/2;
    return{wt:kg,band:'',note:`${rel.note} (last ${relLast.wt}kg)`,relName:(ALL_EX.find(e=>e.id===rel.id)||{}).nm||rel.id};
  }
  return null;
}

function getSmartSugg(ex){
let hist=getHist(ex.id,8);
// Sessions the user flagged in History ("ignore for progression" — e.g. a glitch session
// logged at submaximal loads after a data mishap) are invisible to the engine only:
// they still count for rotation, history, tonnage and every analytics view.
hist=hist.filter(h=>!h.noProg);
// Deload-week sessions are deliberately light — drop them from progression memory so
// (a) post-deload suggestions resume from the pre-deload load, not the deload load, and
// (b) an easy deload session can't read as a fresh confirm or an overshoot. They still
// count everywhere else (history, tonnage, analytics). If ALL history is deload-week
// (edge case), keep it — a light anchor beats "first time".
if(D.lastDeload){const de=new Date(D.lastDeload+'T12:00:00');de.setDate(de.getDate()+6);const dlEnd=ymd(de);
  const f=hist.filter(h=>h.date<D.lastDeload||h.date>dlEnd);if(f.length)hist=f}
// Rows with a weight but NO reps carry no progression signal. savePast saves one as soon as a
// weight or band is entered (`if(wt)hasData=true`), so "I trained this at 32kg" with the rep
// boxes left blank produced a session the engine read as below-range — three of them forced a
// full ~10% deload and raised the stalled-lift count feeding the deload banner. Dropped from
// the ENGINE's view only; they still count for history, tonnage and the muscle split.
{const withReps=hist.filter(h=>effectiveReps(ex,h.reps).length>0);
 // All we have is weight-only rows: don't fall through to the first-session seed as though
 // nothing were known — the load IS known, the reps aren't. Say exactly that.
 if(!withReps.length&&hist.length){
   const lw=hist[hist.length-1],w=Number(lw.wt)>0?Number(lw.wt):exMaxWt(lw);
   if(w>0)return{text:`→ ${w}kg`,type:'stay',wt:w,traj:[],
     detail:`Logged at ${w}kg but with no reps recorded — log your reps to start progressing this lift.`,regress:''};
   if(lw.band)return{text:`→ ${lw.band}`,type:'stay',wt:null,band:lw.band,traj:[],
     detail:`Logged with a band but no reps — log your reps to start progressing this lift.`,regress:''}}
 hist=withReps}
hist=hist.slice(-5);
const last=hist.length?hist[hist.length-1]:null;
if(!last){
  // No history for this exercise — try a related-exercise fallback
  const rs=getRelatedSuggestion(ex);
  if(rs){
    if(rs.wt!=null)return{text:`Try ${rs.wt}kg`,type:'new',wt:rs.wt,traj:[],detail:`Based on ${rs.relName} · ${rs.note}`,regress:''};
    if(rs.band)return{text:`Try ${rs.band}`,type:'new',wt:null,band:rs.band,traj:[],detail:`Based on ${rs.relName} · ${rs.note}`,regress:''};
    return{text:'New — start light',type:'new',wt:null,traj:[],detail:`Based on ${rs.relName} · ${rs.note}`,regress:''};
  }
  return{text:'First time — find your weight',type:'new',wt:null,traj:[],detail:'',regress:''};
}

// Discomfort check — if moderate discomfort in last 2 sessions, auto-hold
const recentDisc=getDiscomfortRecent(ex.id,3);
const modDisc=recentDisc.filter(d=>d.level==='moderate').length;
const mildDisc=recentDisc.filter(d=>d.level==='mild').length;
let discWarn='';
if(modDisc>=2)discWarn='⚠ Repeated moderate discomfort — hold weight';
else if(modDisc>=1)discWarn='⚠ Moderate discomfort last session — consider holding';
else if(mildDisc>=3)discWarn='⚠ Mild discomfort 3 sessions running — monitor closely';
// Active deload week ("Took one" tapped <7 days ago): every lift carries the advisory.
const dlDay=D.lastDeload?dayDiff(today(),D.lastDeload):null;
if(dlDay!=null&&dlDay>=0&&dlDay<7&&!discWarn)discWarn=`🛌 Deload week · day ${dlDay+1}/7 — take ~10% off, stop 2-3 reps shy`;

// How many sets of a logged session count as WORKING sets: today's prescription, capped by
// what was actually logged (the same id can be 4 sets on one day and 3 on another).
const nS=h=>Math.min(ex.s,(h.reps||[]).length||ex.s);
// The load a session is judged AT. Per-set kg overrides make the bare `wt` field a lie about
// what was lifted, so progression anchors on sessLoad — the weight every working set carried.
const loadOf=h=>sessLoad(h,nS(h));
const lastLoad=loadOf(last);

// ─── WEIGHT-BASED (bb, mace, db, kb) — handle null wt fallback for type migrations (e.g., Cossack bw→bb) ───
// kb (legacy kettlebell moves) progresses like db: rep-first double progression with
// micro-load steps, rather than falling through to a bare "Continue".
if(ex.tp==='bb'||ex.tp==='mace'||ex.tp==='db'||ex.tp==='kb'){
  // Find most recent session with a valid weight; if none, treat as a brand-new exercise
  const lastWithWt=[...hist].reverse().find(h=>loadOf(h)>0);
  if(!lastWithWt){
    return{text:'First weighted session — find your starting load',type:'new',wt:null,traj:[],detail:'Earlier sessions were bodyweight or unrecorded.',regress:discWarn}}
  // If most recent session had no weight but earlier ones did, use the earlier weight as reference
  if(!lastLoad){
    const lw=loadOf(lastWithWt);
    return{text:`→ ${lw}kg`,type:'stay',wt:lw,traj:[],detail:`Last weighted: ${lw}kg on ${lastWithWt.date}`,regress:discWarn}}
  // kb→bb conversion (dead bugs v26): legacy kettlebell history sits BELOW the bar
  // weight, which isn't a loadable barbell number — the empty bar is the floor.
  // Re-anchor there once; the normal plate ladder takes over from the next session.
  if(ex.tp==='bb'&&lastLoad<barOf(ex)){
    return{text:`→ ${barOf(ex)}kg (bar only)`,type:'new',wt:barOf(ex),traj:[],
      detail:`Now on the barbell — the empty bar (${barOf(ex)}kg) already outweighs the old ${lastLoad}kg load. Control first, then progress on the plate ladder.`,regress:discWarn}}
}
if((ex.tp==='bb'||ex.tp==='mace'||ex.tp==='db'||ex.tp==='kb')&&lastLoad){
  const mn=getRepMin(ex);
  const atW=hist.filter(h=>wEq(loadOf(h),lastLoad));
  // Disclosure when the session ran heavier than its anchor: the user overrode some sets up
  // but not all of them, so progression correctly holds at the sustained load — say why, and
  // name the number they need to match on every set to move the anchor.
  const topSet=exMaxWt(last);
  const topNote=topSet>lastLoad?` · top set ${topSet}kg — match all ${ex.s} sets at ${topSet}kg to progress there`:'';
  // hitTarget gates a weight INCREASE — you must complete ALL prescribed sets at/above target.
  // inRange gates STALL detection — judge only the sets actually performed: a session with a
  // skipped/blank trailing set (stored as 0, then dropped by effectiveReps) whose performed
  // sets all clear the minimum must NOT count as a stall (that produced phantom deloads on
  // clearly strong, over-target sessions). A genuine stall (full or partial sets BELOW min)
  // still fails this and accrues toward the deload.
  // Set-count context comes from the SESSION (reps array length, via nS above), not today's
  // ex.s — the same id can be prescribed 4 sets on one day and 3 on another (db_lateral A/B),
  // and a clean 3/3 session must read as a hit even when today asks for 4.
  // CONVENTION: the first nS counted sets are the WORKING sets; anything logged after them
  // is accessory volume (a back-off set, a drop set, a bonus AMRAP) and must not be judged
  // against the working prescription. Capping the COUNT alone wasn't enough — the every()
  // scan still saw the extra sets, so 4×10 followed by a lighter 6 read as "below min", and
  // three such sessions forced an ~11% deload on a lifter who hit target every time. That
  // also fought the engine's own advice, which tells you to add a set when you plateau.
  const workSets=h=>effectiveReps(ex,h.reps).slice(0,nS(h));
  // Floor on how much of the prescription must actually be covered to EARN a load increase.
  // nS deliberately takes its count from the session (the same id is 4 sets on one day and 3
  // on another), but that had no lower bound — a single set at target read as a full hit and
  // moved the weight up, captioned "Hit 4×10" for a 1×10 session. Checked against the real
  // program: only db_lateral and db_rear_fly vary across days, both 4→3, so ex.s-1 preserves
  // every legitimate cross-day case exactly while blocking 2-of-4 and below.
  const minSets=Math.max(1,ex.s-1);
  const hitTarget=h=>{const v=workSets(h);return v.length>=nS(h)&&v.length>=minSets&&v.every(r=>r>=ex.tg)};
  const inRange=h=>{const v=workSets(h);return v.length>=1&&v.every(r=>r>=mn)};
  // Total reps across the WORKING sets only — the basis for the user-visible "reps dropped"
  // warning, which must not fire (or be silenced) because accessory sets came and went.
  const workReps=h=>workSets(h).reduce((a,b)=>a+b,0);
  // The 2-stall branch below PRESCRIBES (ex.s+1)×(mn-2) — reps deliberately under the range
  // minimum — so scoring a compliant session against the base range made the app's own advice
  // the third strike. Recognise the attempt by its shape.
  // Reads UNSLICED reps on purpose: the extra sets ARE the signal, which is exactly why the
  // workSets slice above must not be applied here.
  const clusterFloor=Math.max(1,mn-2);
  const isClusterAttempt=h=>{const v=effectiveReps(ex,h.reps);
    return v.length>=ex.s+1&&v.every(r=>r>=clusterFloor)};
  // The current stall RUN at this load, oldest→newest: consecutive below-range sessions
  // ending now. A failure 4 sessions ago followed by two clean sessions is history, not a
  // stall-in-progress, and must not trip a deload.
  const stallRun=(()=>{const r=[];
    for(let i=hist.length-1;i>=0;i--){const h=hist[i];
      if(!wEq(loadOf(h),lastLoad))break;
      if(inRange(h))break;
      r.unshift(h)}
    return r})();
  // Count the run forward, forgiving at most ONE cluster — and only where the advice had
  // actually been earned (≥2 stalls already banked at that point in the run). Two failure
  // modes this threads between: counting the cluster punished a lifter for doing exactly what
  // the app prescribed, while forgiving EVERY cluster let them hold the same load forever on
  // 5×6 with the ladder never terminating. A second cluster scores as the ordinary
  // below-range session it is, and a cluster-shaped session nobody prescribed earns nothing.
  // clusterHeld additionally records whether the session being judged RIGHT NOW is that
  // forgiven cluster — i.e. the advice had been shown and the lifter has just taken it. A
  // cluster-shaped session nobody prescribed must not print "that was the prescribed
  // intervention", even though holding the load is the same outcome either way.
  const {stalls,clusterHeld}=(()=>{let n=0,forgiven=false,held=false;
    for(const h of stallRun){
      if(!forgiven&&n>=2&&isClusterAttempt(h)){forgiven=true;held=(h===stallRun[stallRun.length-1]);continue}
      n++;held=false}
    return{stalls:n,clusterHeld:held}})();
  const plateauSess=atW.filter(h=>inRange(h)&&!hitTarget(h)).length;
  // Confirm brake counts CONSECUTIVE recent clean target-hits at the current weight ending
  // now — not lifetime hits — so re-approaching a previously-confirmed weight (after a
  // deload) still requires a fresh confirm session rather than advancing immediately.
  const hitsAtW=(()=>{let n=0;for(let i=hist.length-1;i>=0;i--){const h=hist[i];if(wEq(loadOf(h),lastLoad)&&hitTarget(h)&&sessClean(h))n++;else break}return n})();
  const lastHit=hitTarget(last)&&sessClean(last);const lastInRange=inRange(last);
  // Report what was ACTUALLY covered. A 3-of-4 cross-day session legitimately earns the
  // increase, but captioning it "Hit 4×10" claims work that wasn't done.
  const lastSets=workSets(last).length||ex.s;
  // traj is deliberately NOT sliced — the trend glyph reports total work done, and an extra
  // set genuinely is more work. Only the judging paths (hit/stall/regress) use workSets.
  const traj=hist.map((h,i)=>{const p=hist[i-1];if(!p)return{s:'●',c:'same'};if(h.wt>p.wt)return{s:'↑',c:'up'};if(h.wt<p.wt)return{s:'↓',c:'dn'};
    const ps=effectiveReps(ex,p.reps).reduce((a,b)=>a+b,0),cs=effectiveReps(ex,h.reps).reduce((a,b)=>a+b,0);
    return cs>ps?{s:'↗',c:'up'}:cs<ps?{s:'↘',c:'dn'}:{s:'→',c:'same'}});
  let regress='';
  if(atW.length>=2){const prev=atW[atW.length-2],curr=atW[atW.length-1];
    const pT=workReps(prev),cT=workReps(curr);
    if(cT<pT-2)regress=`Reps dropped ${pT}→${cT} at ${lastLoad}kg`}
  if(!regress&&hist.length>=2){const prev=hist[hist.length-2],pL=loadOf(prev);
    if(pL&&lastLoad&&lastLoad<pL&&!wEq(lastLoad,pL)&&!inRange(last))regress=`Weight dropped ${pL}→${lastLoad}kg`;
    else if(wEq(pL,lastLoad)){const pT=workReps(prev),cT=workReps(last);
    if(cT<pT-2)regress=`Reps dropped ${pT}→${cT}`}}
  if(discWarn)regress=discWarn;
  const dbInc=ex.tp==='db'?0.5:1;
  const u=ex.loadUnit==='per_db'?'/DB':''; // per-DB label only when the load really is per dumbbell
  // Discomfort override — hold weight if moderate pain trending
  if(modDisc>=2){return{text:`→ ${lastLoad}kg${u} (hold)`,type:'stay',wt:lastLoad,traj,detail:'Holding due to discomfort trend',regress}}
  // Phase-transition re-anchor: if the last session belongs to the PREVIOUS phase and this
  // lift's rep target changed, re-derive the working load for the new target.
  // • Phase membership: sessions are stamped with `phase` at save time (exact — survives a
  //   same-day phase switch); pre-stamp history falls back to the date-vs-phaseStart compare.
  // • Anchor reps: the BEST lowest-set across recent sessions at the current weight — one
  //   bad/tired final session must not set the whole next phase's loads.
  // • Curve: PURE Epley on both sides. e1rmF's min(Epley,Lombardi) switches curves past
  //   ~6 reps, so a 5→8 translation mixed curves and under-dropped (~5% instead of ~8%).
  //   Reps capped at the new target so an over-target AMRAP can't anchor heavier; a
  //   lower-rep phase holds at the proven load (ratio=1) and progresses from there.
  const epleyF=r=>r<=1?1:1+r/30;
  const prePhase=last.phase!=null?last.phase!==D.phase:(D.phaseStart&&last.date<D.phaseStart);
  if(PHASE_ADJ_IDS.has(ex.id)&&prePhase){
    const bestMin=Math.max(0,...atW.map(h=>{const v=workSets(h);return v.length?Math.min(...v):0}));
    const repsAch=Math.min(bestMin>0?bestMin:ex.tg,ex.tg);
    if(lastLoad>0){
      const raw=lastLoad*epleyF(repsAch)/epleyF(ex.tg);
      const tgt=ex.tp==='bb'?snapW(raw,vwOf(ex)):ex.tp==='db'?snapDB(raw,ex):Math.round(raw*2)/2;
      if(tgt>0&&!wEq(tgt,lastLoad)){
        const dir=tgt<lastLoad?'lighter':'heavier';
        return{text:`→ ${tgt}kg${u}`,type:'new',wt:tgt,traj,
          detail:`New phase (${(PHASES[D.phase]||PHASES[1]).name}) — re-anchored ${dir} for ${ex.s}×${ex.tg}${ex.perSide?'/side':''}. Adjust to taste, then progress from here.`,regress}}
    }
  }
  // SHORT SESSION — every logged set cleared target, but too few of them to earn the load.
  // Without this the session fell through to the generic "Push for 4×10", which is confusing
  // when the reps you did were all at target; say plainly that it's the set count that's short.
  if(lastSets<minSets&&workSets(last).length&&workSets(last).every(r=>r>=ex.tg)){
    return{text:`→ ${lastLoad}kg${u}`,type:'stay',wt:lastLoad,traj,
      detail:`Only ${lastSets} of ${ex.s} sets logged — all at target, but complete the prescription before adding load.`,regress}}
  // FORM GATE — hit the reps but a working set was rated below clean: hold load and
  // clean it up rather than advancing on broken-down reps.
  if(hitTarget(last)&&!sessClean(last)){
    return{text:`→ ${lastLoad}kg${u} (clean up)`,type:'stay',wt:lastLoad,traj,
      detail:`Hit ${lastSets}×${ex.tg}${ex.perSide?'/side':''} but form slipped (${FORM_LABELS[sessForm(last)]||'breakdown'}) — hold and get strict reps before adding load.`,regress}}
  // HIT TARGET (single-session double progression). AMRAP signal = reps over target on the last set.
  if(lastHit){
    const isConfirmLift=CONFIRM_LIFTS.has(ex.id);
    // AMRAP: how many reps over target on the lowest working set drives the jump size.
    // Working sets only — an accessory back-off set used to drag minRep below target and
    // silently suppress the big-overshoot re-anchor on an otherwise crushing session.
    const eRl=workSets(last);
    const minRep=eRl.length?Math.min(...eRl):ex.tg;
    const over=minRep-ex.tg; // 0 = just hit target; higher = lots in reserve
    // NOTE: the big-overshoot check runs BEFORE the confirm brake — confirming a load you
    // beat by 4+ reps on every set just wastes a session at a weight that is plainly too
    // light (the hex_dl coach note says exactly this). Confirm lifts keep a tighter jump
    // cap (+8% vs +12%) since they are the heavy spinal movements.
    // BIG-OVERSHOOT re-anchor: a single plate/micro step moves ~0.5-1kg, which can never
    // catch up to a load you're beating by many reps (e.g. a 3×8 slot logged at 20/side
    // crawls +1kg/session for ~15 sessions). When the LOWEST working set clears target by
    // ≥4 reps, jump proportionally — ≈2.5% per rep over, capped at +12%/session for joint
    // safety — and snap to a valid load. Keyed off the lowest set (not one hot AMRAP set),
    // so it only fires when EVERY set is well over target. Re-fires until you land in range.
    if(over>=4){
      const pct=Math.min(isConfirmLift?0.08:0.12,0.025*over);
      const raw=lastLoad*(1+pct);
      const nxt=ex.tp==='bb'?snapW(raw,vwOf(ex)):ex.tp==='db'?snapDB(raw,ex):Math.round(raw*2)/2;
      if(nxt>lastLoad){
        const jump=Math.round((nxt-lastLoad)*10)/10;
        return{text:`↑ ${nxt}kg${u}`,type:'up',wt:nxt,traj,
          detail:`Hit ${lastSets}×${ex.tg}+${over} — well over target, jumping +${jump}kg (≈${Math.round(pct*100)}%). Aim for ${ex.s}×${ex.tg}${ex.perSide?'/side':''}; the app keeps escalating until you land in range.`,regress}}
    }
    // Heavy spinal compounds keep a 1-session confirm brake (joint safety): need 2 sessions at target.
    if(isConfirmLift&&hitsAtW<2){
      return{text:`→ Confirm ${lastLoad}kg`,type:'cf',wt:lastLoad,traj,detail:`Hit ${lastSets}×${ex.tg}${ex.perSide?'/side':''} — confirm once more (heavy lift), then ↑${topNote}`,regress}}
    if(ex.tp==='bb'){
      // joint-capped: 1 plate-step normally, 2 steps only if comfortably over (≥3 reps past target on every set)
      const steps=over>=3?2:1;
      const nxt=nxUpN(lastLoad,steps,vwOf(ex));
      // nxUpN can't exceed the plate inventory, so "at ceiling" shows up as no
      // movement (nxt===last.wt), not as nxt>MAX_BB — that branch was unreachable.
      if(nxt<=lastLoad){
        return{text:`🔒 MAX — push reps`,type:'st',wt:lastLoad,traj,detail:`At plate ceiling. Expand rep range or add tempo.`,regress,maxed:true}}
      const jump=Math.round((nxt-lastLoad)*10)/10;
      return{text:`↑ ${nxt}kg`,type:'up',wt:nxt,traj,detail:(over>=3?`Hit ${lastSets}×${ex.tg}+${over} — strong, +${jump}kg`:`Hit ${lastSets}×${ex.tg} — +${jump}kg`)+topNote,regress}}
    // DB: walk the real spinlock ladder (rungs the rack can actually build) — the old
    // flat +0.5 could propose unloadable weights. AMRAP scales rungs (1, or 2 if ≥3 over).
    if(ex.tp==='db'){
      const steps=over>=3?2:1;
      const nxt=nxUpN(lastLoad,steps,dbwOf(ex));
      if(nxt<=lastLoad){
        return{text:`🔒 MAX — push reps`,type:'st',wt:lastLoad,traj,detail:`Top of the DB rack. Expand rep range or add tempo.`,regress,maxed:true}}
      const jump=Math.round((nxt-lastLoad)*10)/10;
      return{text:`↑ ${nxt}kg${u}`,type:'up',wt:nxt,traj,detail:(over>=3?`Hit ${lastSets}×${ex.tg}+${over} — strong, +${jump}kg`:`Hit ${lastSets}×${ex.tg} — +${jump}kg`)+topNote,regress}}
    // KB / mace: micro-load. AMRAP scales how many 0.5kg steps (1 normally, 2 if ≥3 over).
    const steps=over>=3?2:1;
    const nxt=Math.round((lastLoad+dbInc*steps)*10)/10;
    return{text:`↑ ${nxt}kg${u}`,type:'up',wt:nxt,traj,detail:over>=3?`Hit ${lastSets}×${ex.tg}+${over} — +${(dbInc*steps)}kg`:`Hit ${lastSets}×${ex.tg} — +${dbInc}kg`,regress}}
  // FAILING (below minimum) → escalation ladder: rep-scheme cluster first, then load reset
  if(!lastInRange){
    // clusterHeld is true only for the ONE forgiven cluster, and only on the session that
    // took the advice. A second cluster scores as an ordinary stall, pushing stalls to 3 and
    // falling through to the deload below — that is what stops the hold repeating forever.
    if(clusterHeld){
      const cv=effectiveReps(ex,last.reps);
      return{text:`→ ${lastLoad}kg${u}`,type:'stay',wt:lastLoad,traj,
        detail:`Cluster hit (${cv.length}×${Math.min(...cv)}) — that was the prescribed intervention, not a third stall. Retry ${ex.s}×${mn}${ex.perSide?'/side':''} at ${lastLoad}kg before any load cut.`,regress}}
    if(stalls>=3){
      // True deload: back off ~10% (the prior one-rung step was <2% on a micro-plate

      if(d>=lastLoad){

      const cut=Math.round((lastLoad-d)*10)/10;
      const pct=Math.round((lastLoad-d)/lastLoad*100);
      return{text:`↓ ${d}kg${u}`,type:'dn',wt:d,traj,stalled:true,detail:`${stalls} sessions below ${ex.s}×${mn}${ex.perSide?'/side':''} — deload to ${d}kg (−${cut}kg, ~${pct}%) and rebuild`,regress}}
    if(stalls===2){

      return{text:`→ ${lastLoad}kg (cluster)`,type:'stay',wt:lastLoad,traj,detail:`${stalls}/3 stalls. Try clusters: ${ex.s+1}×${Math.max(1,mn-2)} this session before any load cut.`,regress}}
    return{text:`→ ${lastLoad}kg`,type:'stay',wt:lastLoad,traj,detail:`Below min. ${stalls}/3 stalls. Push for ${ex.s}×${mn}+${ex.perSide?' /side':''}`,regress}}
  // IN RANGE but not at target → push reps; if stuck for many sessions, escalate to adding a set
  const eR=workSets(last);
  const avgRep=eR.length?Math.round(eR.reduce((a,b)=>a+b,0)/eR.length):0;
  let tip=`Push for ${ex.s}×${ex.tg}${ex.perSide?'/side':''}`;
  if(plateauSess>=4)tip=`${plateauSess} sessions stuck at ~${avgRep}. Add a set (${ex.s+1}×) to push volume, or try ${Math.min(avgRep+1,ex.tg)},${avgRep},${avgRep}.`;
  else if(plateauSess>=2)tip=`Building at ~${avgRep}. Push the top set for ${Math.min(avgRep+1,ex.tg)}.`;
  return{text:`→ ${lastLoad}kg`,type:'stay',wt:lastLoad,traj,detail:tip+topNote,regress}}

// ─── CLUB exercises (perSide-aware) ───
if(ex.tp==='club'){
  const traj=hist.map((h,i)=>{if(!i)return{s:'●',c:'same'};const pw=hist[i-1].wt||0,cw=h.wt||0;
    return cw>pw?{s:'↑',c:'up'}:cw<pw?{s:'↓',c:'dn'}:{s:'→',c:'same'}});

  const totalReps=reps.reduce((a,b)=>a+b,0);
  const allHit=reps.length>=ex.s&&reps.slice(0,ex.s).every(r=>r>=ex.tg);
  if(allHit&&modDisc>=2){return{text:`${last.wt||6}kg (hold)`,type:'stay',wt:last.wt,traj,detail:'Holding due to discomfort trend',regress:discWarn}}
  if(allHit){return{text:`${last.wt||6}kg — smooth? → try ${(last.wt||6)+2}kg`,type:'up',wt:last.wt,traj,detail:`Hit target${ex.perSide?' /side':''}. Progress if shoulder feels smooth.`,regress:discWarn}}
  return{text:`${last.wt||6}kg club`,type:'stay',wt:last.wt,traj,detail:`Focus on smooth form. ${totalReps} eff. reps${ex.perSide?' /side':''}.`,regress:discWarn}}

// ─── BAND exercises (bandMode-aware: assist vs resist) ───
if(ex.tp==='band'){
  const isResist=ex.bandMode==='resist';
  const traj=hist.map((h,i)=>{if(!i)return{s:'●',c:'same'};const pi=BAND_IDX(hist[i-1].band),ci=BAND_IDX(h.band);
    if(isResist){return ci<pi?{s:'↑',c:'up'}:ci>pi?{s:'↓',c:'dn'}:{s:'→',c:'same'}}
    return ci>pi?{s:'↑',c:'up'}:ci<pi?{s:'↓',c:'dn'}:{s:'→',c:'same'}});
  const reps=effectiveReps(ex,last.reps);
  const hitTop=reps.length>=ex.s&&reps.slice(0,ex.s).every(r=>r>=ex.tg);
  const mnB=getRepMin(ex);
  // Band stall signal — bands used to be invisible to the phase-change/deload stall
  // counters because this branch never set `stalled`. Count consecutive sessions on the
  // SAME band with performed sets below the rep minimum, same shape as the weight path.
  const stallsB=(()=>{let n=0;for(let i=hist.length-1;i>=0;i--){const h=hist[i];
    if(BAND_IDX(h.band)!==BAND_IDX(last.band))break;
    const v=effectiveReps(ex,h.reps);if(v.length&&v.every(r=>r>=mnB))break;n++}return n})();
  let regress=discWarn;if(!regress&&hist.length>=2){const prev=hist[hist.length-2];
    if(BAND_IDX(prev.band)===BAND_IDX(last.band)){const pT=effectiveReps(ex,prev.reps).reduce((a,b)=>a+b,0),cT=reps.reduce((a,b)=>a+b,0);
    if(cT<pT-2)regress=`Reps dropped ${pT}→${cT}`}}
