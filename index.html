  if(modDisc>=2&&hitTop){
    return{text:`Stay on ${last.band||'band'} (hold)`,type:'stay',wt:null,traj,detail:'Holding due to discomfort trend',regress}}
  // FORM GATE — for assist bands this is the key save: hitting reps with negatives/
  // partials must NOT trigger "less assistance", or it pushes you off a cliff.
  if(hitTop&&!sessClean(last)){
    const fl=FORM_LABELS[sessForm(last)]||'breakdown';
    return{text:`Stay on ${last.band||'band'} — clean up`,type:'stay',wt:null,traj,
      detail:isResist?`Hit ${ex.s}×${ex.tg} but form slipped (${fl}) — get strict reps before more resistance.`:`Hit ${ex.s}×${ex.tg} with ${fl.toLowerCase()} (not strict) — get clean reps on this band before reducing assistance.`,regress}}
  if(hitTop){
    if(isResist){
      const curIdx=BAND_IDX(last.band);
      if(curIdx<=0)return{text:'At max resistance — add pause/tension',type:'st',wt:null,traj,
        detail:`Hit ${ex.s}×${ex.tg}${ex.perSide?'/side':''} at heaviest band`,regress};
      return{text:'↑ More resistance (thicker)',type:'up',wt:null,traj,
        detail:`Hit ${ex.s}×${ex.tg}${ex.perSide?'/side':''} — increase band resistance`,regress}}
    // assist mode
    const curIdx=BAND_IDX(last.band);
    // At 'None' (or no band logged) you're ALREADY unassisted — "try unassisted" was a
    // dead-end. Progress by reps, pauses or external load instead.
    if(!last.band||last.band==='None'||curIdx>=BANDS.length-1)return{text:'Unassisted ✓ — add reps or load',type:'up',wt:null,traj,
      detail:`Hit ${ex.s}×${ex.tg} with no band — extend the rep range, add a pause, or add load (belt/vest).`,regress};
    return{text:'↑ Less assistance (thinner)',type:'up',wt:null,traj,
      detail:`Hit ${ex.s}×${ex.tg} — reduce band help`,regress}}
  if(stallsB>=3)return{text:last.band||'Check band',type:'stay',wt:null,traj,stalled:true,
    detail:`${stallsB} sessions below ${ex.s}×${mnB} on ${last.band||'this band'} — step back a band rung for a session and rebuild`,regress};
  return{text:last.band||'Check band',type:'stay',wt:null,traj,detail:`Stay on ${last.band||'current'}`,regress}}

// ─── CARRY exercises ───
if(ex.tp==='carry'||(ex.tp==='db'&&ex.id.includes('carry'))){
  const lastWt=last.wt||0;
  return{text:lastWt?`${lastWt}kg`:'Log weight',type:'stay',wt:lastWt,traj:[],detail:'↑ load or distance when comfortable',regress:discWarn}}

// ─── BODYWEIGHT (push-ups, inverted rows, dead bugs, dand-baithak) — perSide-aware ───
if(ex.tp==='bw'){
  const reps=effectiveReps(ex,last.reps);
  const totalReps=reps.reduce((a,b)=>a+b,0);
  const isDand=ex.id.includes('dand');
  if(isDand){return{text:`${last.reps.filter(r=>r>0).reduce((a,b)=>a+b,0)} total`,type:'stay',wt:null,traj:[],detail:ex.rl,regress:''}}
  const traj=hist.map((h,i)=>{if(!i)return{s:'●',c:'same'};
    const pt=effectiveReps(ex,hist[i-1].reps).reduce((a,b)=>a+b,0),ct=effectiveReps(ex,h.reps).reduce((a,b)=>a+b,0);
    return ct>pt?{s:'↗',c:'up'}:ct<pt?{s:'↘',c:'dn'}:{s:'→',c:'same'}});
  const allHit=reps.length>=ex.s&&reps.slice(0,ex.s).every(r=>r>=ex.tg);
  let regress=discWarn;
  if(!regress&&hist.length>=2){const pt=effectiveReps(ex,hist[hist.length-2].reps).reduce((a,b)=>a+b,0);
    if(totalReps<pt-3)regress=`Total reps dropped ${pt}→${totalReps}`}
  if(allHit&&!sessClean(last))return{text:`Clean up the reps`,type:'stay',wt:null,traj,detail:`Hit ${ex.s}×${ex.tg} but form slipped (${FORM_LABELS[sessForm(last)]||'breakdown'}) — get strict full-ROM reps before progressing.`,regress};
  if(allHit&&modDisc>=2)return{text:`Hold — discomfort`,type:'stay',wt:null,traj,detail:'Holding due to discomfort trend',regress};
  if(allHit)return{text:`Hit target${ex.perSide?' /side':''} — progress`,type:'up',wt:null,traj,detail:ex.rl,regress};
  return{text:`${totalReps} reps${ex.perSide?' /side':''}`,type:'stay',wt:null,traj,detail:`Push for ${ex.s}×${ex.tg}${ex.perSide?'/side':''}`,regress}}

// ─── Fallback ───
return{text:last.wt?`${last.wt}kg`:'Continue',type:'stay',wt:last.wt,traj:[],detail:'',regress:discWarn}}

// e1RM only makes sense where the rep field holds REPS of a rep-max-style lift.
// Carries log steps/metres (e1rmF(40 steps) minted nonsense "E1RM PRs" on farmer's
// carries) and band/bw lifts have no meaningful load — all excluded.
const E1RM_TYPES=new Set(['bb','db','kb','mace','club']);
// Best e1RM across an entry's sets — per-set weights make "max reps at wt" wrong,
// so score each set at its own resolved weight. With no overrides this collapses to
// e1rm(wt, max reps) exactly (e1rmF is monotonic in reps), so old data is unchanged.
// exSetE1RMMax is ungated (trend fitters guard type at the call site); exBestE1RM
// applies the E1RM_TYPES gate for PR minting.
// NOTE: walks the RAW reps array (not effectiveReps, which filters+compacts) — a
// compacted index read against e.wts[i] scored the wrong set's weight whenever an
// override session had a zero-rep set before a later set (reps [8,0,6] + wts
// [40,40,50] priced the 6-rep set at 40).
function exSetE1RMMax(def,e){
const rr=e.reps||[];let be=0;
for(let i=0;i<rr.length;i++){const r=Number(rr[i]);if(!(r>0))continue;
const w=setWt(e,i);if(!w)continue;const x=e1rm(w,r);if(x>be)be=x}
return be}
function exBestE1RM(def,e){return def&&E1RM_TYPES.has(def.tp)?exSetE1RMMax(def,e):0}
function getPRs(exId){let bw=0,bv=0,be=0;const def=ALL_EX.find(x=>x.id===exId);
for(const s of D.sessions)for(const e of s.ex)if(e.id===exId){const vr=e.reps.filter(r=>r>0);if(!vr.length)continue;
const vol=calcExVol(e.id,e.wt,e.reps,e.wts);
const mw=exMaxWt(e);if(mw>bw)bw=mw;if(vol>bv)bv=vol;
const x=exBestE1RM(def,e);if(x>be)be=x}
return{bestWt:bw,bestVol:bv,bestE1RM:Math.round(be*10)/10}}
// Strength PRs only (weight / e1RM) — volume "PRs" fire constantly under progressive
// overload and were never tracked by the Recent-PRs feed or the Monthly count, so a
// summary badge for them just made the screens disagree.
function checkPR(exId,wt,reps,wts){const pr=getPRs(exId),vr=reps.filter(r=>r>0);if(!vr.length)return[];const ps=[];
// e1RM PR catches a strength gain that isn't a top-weight PR (e.g. more reps at the same load).
const def=ALL_EX.find(x=>x.id===exId),entry={wt,reps,wts};
const mw=exMaxWt(entry),e=exBestE1RM(def,entry);
if(mw&&mw>pr.bestWt&&pr.bestWt>0)ps.push('WT');
else if(mw&&e>pr.bestE1RM&&pr.bestE1RM>0)ps.push('E1RM');
return ps}
// Rep→1RM multiplier. Epley (1+r/30) tracks well at low reps but turns optimistic
// past ~10; Lombardi (r^0.1) is the conservative curve there. min() of the two is
// continuous (crossover ≈6 reps: Epley wins at 5, Lombardi from 6 up) and keeps
// 10–20-rep accessory e1RMs honest. NOTE: the phase re-anchor deliberately uses PURE
// Epley on both sides of its ratio (see getSmartSugg) — mixing the two curves across
// the crossover would systematically under-drop rep-target translations.
function e1rmF(reps){return reps<=1?1:Math.min(1+reps/30,Math.pow(reps,0.10))}
function e1rm(wt,reps){return reps<=0||!wt?0:Math.round(wt*e1rmF(reps)*10)/10}
// Warm-ups snap to the COARSE ladder (plates ≥1kg) — fishing out 0.25kg micro plates
// for a warm-up set is pure friction. lm keeps the fine ladder (single-end loading is
// already coarse in practice: one plate at a time).
function warmupSets(wt,bar=BAR,vw=VW,lm=false){if(!wt||wt<=bar)return[];
const cvw=lm?vw:(bar===HEXBAR?VWH_C:bar===BAR?VW_C:vw);
const s=[{wt:bar,reps:8,l:'Bar only'}];const w60=snapW(bar+(wt-bar)*.5,cvw),w80=snapW(bar+(wt-bar)*.8,cvw);if(w60>bar&&w60<wt)s.push({wt:w60,reps:5,l:fmtPl(w60,bar,lm)});if(w80>w60&&w80<wt)s.push({wt:w80,reps:3,l:fmtPl(w80,bar,lm)});return s}

// Discomfort analysis
function getDiscomfortTrend(exId,joint){const recent=D.discomfort.filter(d=>d.exId===exId&&d.joint===joint).slice(-5);
return{count:recent.length,recent3:recent.slice(-3).filter(d=>d.level!=='none').length}}

// Bar chart for weekly series; data=[{v,lbl}], optional target line
// Chart palette — JS mirrors of the CSS tokens (string-built SVG can't reach CSS vars
// without getComputedStyle). Keep in sync: CH_GRID=--cb, CH_TXT=--mu, CH_DOT=--bg2,
// CH_TARGET=--rd.
// Theme-switchable (applyTheme reassigns): light values are the declared defaults
// so the Node test harnesses (no matchMedia, no D) always see the light palette.
let CH_GRID='#dde3f0',CH_TXT='#5a6478',CH_DOT='#ffffff',CH_TARGET='#d61f5e',CH_TITLE='#111527',CH_PR='#b26102';
let C_PR='#007ba8',C_BL='#1263d6',C_GR='#0c8050'; // chart line/bar fills
// One switch point for every string-built color (SVG fills + inline hex — CSS vars
// can't reach them). Mirrors the CSS dark token block; keep the two in sync.
function isDarkTheme(){const t=(typeof D!=='undefined'&&D&&D.theme)||'auto';
if(t==='dark')return true;if(t==='light')return false;
try{return !!(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)}catch(e){return false}}
function applyTheme(){const dk=isDarkTheme();
if(dk){CH_GRID='#2a3450';CH_TXT='#9aa6c2';CH_DOT='#1a2032';CH_TARGET='#ff5f8d';CH_TITLE='#e9edf8';CH_PR='#f0a848';
C_PR='#2fb3e8';C_BL='#5b9bf0';C_GR='#3ecf8e';
DAY_COLORS={A:'#4aa3e8',B:'#f07cc0',C:'#43c07a',X:'#a98cf0',cardio:'#f0a848'};
DAY_INK={A:'#08101e',B:'#08101e',C:'#08101e',X:'#08101e'};
FORM_C=['','var(--rd)','#e8703a','var(--am)','#7fb069','var(--gr)'];
}else{CH_GRID='#dde3f0';CH_TXT='#5a6478';CH_DOT='#ffffff';CH_TARGET='#d61f5e';CH_TITLE='#111527';CH_PR='#b26102';
C_PR='#007ba8';C_BL='#1263d6';C_GR='#0c8050';
DAY_COLORS={A:'#0069b8',B:'#ea62ab',C:'#0b7a3f',X:'#6b46c8',cardio:'#b26102'};
DAY_INK={A:'#ffffff',B:'var(--tx)',C:'#ffffff',X:'#ffffff'};
FORM_C=['','var(--rd)','#c2410c','var(--am)','#4d7c0f','var(--gr)'];}
setHeatPal(dk);
if(typeof BODY_METRICS!=='undefined'&&typeof BM_C!=='undefined')BODY_METRICS.forEach((m,i)=>m.c=BM_C[dk?'dark':'light'][i]);
// data-theme carries the RESOLVED theme, never the preference: 'auto' on a dark-OS device
// writes 'dark'. That is what lets one CSS block serve both the explicit and the automatic
// dark path. The user's preference stays in D.theme, which is what the settings UI reads.
try{document.documentElement.dataset.theme=dk?'dark':'light';
// Drop the pre-JS media pair and own #tc: with the pair still present, an explicit light
// preference on a dark-OS device would keep losing to the dark media rule.
document.querySelectorAll('meta[name=theme-color][media]').forEach(m=>m.remove());
const meta=document.getElementById('tc');
if(meta)meta.setAttribute('content',dk?'#0e1220':'#f4f6fb')}catch(e){}}
// Day identity colors (A/B/C + cardio) for string-built markup — mirrors the CSS
// --dayA/--dayB/--dayC tokens. Trio validated full-strength on white, all pairs
// (protan ΔE 9.5, normal 21.0); heatmap cells render SOLID with a letter on top —
// DAY_INK picks the letter ink per day (white on the deep A/C fills, dark ink on
// the deliberately-lighter pink B). Cardio renders as an amber-tint DOT cell
// (different mark), outside the letter set.
let DAY_COLORS={A:'#0069b8',B:'#ea62ab',C:'#0b7a3f',X:'#6b46c8',cardio:'#b26102'}; // theme-switched
let DAY_INK={A:'#ffffff',B:'var(--tx)',C:'#ffffff',X:'#ffffff'}; // theme-switched
// One place that turns a session into its badge text. 'X' was the v19 off-rotation core
// block — it has no venue-numbered day name, so "Day X1" would be nonsense on every history
// row. Nothing writes 'X' since v20, but stored ones still flow through here.
const dayBadge=s=>s.day==='X'?'Core':`Day ${s.day}${s.loc==='partner'?'2':'1'}`;
function svgBars(data,W,H,color,label,opts){
opts=opts||{};
if(!data.length)return`<div class="dm" style="text-align:center;padding:16px">Not enough data yet — log a session or two.</div>`;
const pad={t:22,r:14,b:24,l:34},w=W-pad.l-pad.r,h=H-pad.t-pad.b;
const mx=Math.max(...data.map(d=>d.v),opts.target||0,1);
const bw=w/data.length,gap=Math.min(6,bw*0.25);
// Sub-8 ranges get 1-decimal tick labels — integer rounding printed duplicate rows
// ("3 3 3 4") on small-range charts.
const fmtT=v=>mx>=8?Math.round(v):Math.round(v*10)/10;
let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="${esc(label)} bar chart, ${data.length} points, max ${fmtT(mx)}">`;
for(let i=0;i<=3;i++){const y=pad.t+(h/3)*i,v=fmtT(mx-(mx/3)*i);
s+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="${CH_GRID}" stroke-width="1" stroke-opacity=".6"/><text x="${pad.l-4}" y="${y+3}" text-anchor="end" fill="${CH_TXT}" font-size="9">${v}</text>`}
data.forEach((d,i)=>{const bh=Math.max(1,(d.v/mx)*h);const x=pad.l+i*bw+gap/2,y=pad.t+h-bh;
s+=`<rect x="${x}" y="${y}" width="${bw-gap}" height="${bh}" rx="4" fill="${color}"><title>${d.lbl}: ${d.v}</title></rect>`;
if(data.length<=12)s+=`<text x="${x+(bw-gap)/2}" y="${H-12}" text-anchor="middle" fill="${CH_TXT}" font-size="7.5">${d.lbl}</text>`});
if(opts.target){const ty=pad.t+h-(opts.target/mx)*h;s+=`<line x1="${pad.l}" y1="${ty}" x2="${W-pad.r}" y2="${ty}" stroke="${CH_TARGET}" stroke-width="1" stroke-dasharray="4 3"/>`}
// Vertical event markers (opts.marks=[{i,label,color?}]) — phase changes / deload
// weeks on the weekly charts. Drawn at the left edge of bar i, label at the top.
if(Array.isArray(opts.marks))for(const m of opts.marks){if(m.i==null||m.i<0||m.i>=data.length)continue;
const mxp=pad.l+m.i*bw+gap/2-1,mc=m.color||CH_TXT;
s+=`<line x1="${mxp}" y1="${pad.t-2}" x2="${mxp}" y2="${pad.t+h}" stroke="${mc}" stroke-width="1" stroke-dasharray="2 3"/>`;
if(m.label)s+=`<text x="${mxp+3}" y="${pad.t+6}" fill="${mc}" font-size="7.5" font-weight="700">${m.label}</text>`}
// Title wears text ink, not the series color — colored text is a legibility/CVD
// smell; the mark itself carries the hue (dataviz guidance).
s+=`<text x="${W/2}" y="14" text-anchor="middle" fill="${CH_TITLE}" font-size="11" font-weight="700" font-family="Archivo Expanded,sans-serif">${label}</text></svg>`;return s}

function svgLine(data,W,H,color,label,opts){
opts=opts||{};
if(data.length<2)return`<div class="dm" style="text-align:center;padding:16px">Not enough data yet — need 2+ sessions.</div>`;
const pad={t:22,r:18,b:28,l:36},w=W-pad.l-pad.r,h=H-pad.t-pad.b;
let vals=data.map(d=>d.v),mn=Math.min(...vals),mx=Math.max(...vals);
const rawMn=mn;
// A perfectly flat series (e.g. every week RPE 3) printed four identical tick
// labels — pad the domain by ±1 so ticks differ and the line sits mid-chart.
if(mx===mn){mn=mn-1;mx=mx+1}
else{
// Honest y-domain: pinning min..max exactly to the chart edges turned a
// 55.3→55.5kg drift into a full-height "climb". Tiny ranges expand to a 5%-of-max
// minimum span; everything gets 8% headroom top and bottom.
const span=mx-mn,minSpan=Math.abs(mx)*0.05;
if(span<minSpan){const c=(mx+mn)/2;mn=c-minSpan/2;mx=c+minSpan/2}
else{mn-=span*0.08;mx+=span*0.08}
if(rawMn>=0&&mn<0)mn=0}
const rng=mx-mn||1;
const pts=data.map((d,i)=>({x:pad.l+(i/(data.length-1))*w,y:pad.t+h-((d.v-mn)/rng)*h,...d}));
const gid='g'+Math.random().toString(36).slice(2,7);
// 1-decimal ticks on narrow ranges (bodyweight moves <1kg between logs — integer
// rounding printed "82 82 82 81" style duplicate labels).
const fmtT=v=>rng>=8?Math.round(v):Math.round(v*10)/10;
let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="${esc(label)} line chart, ${data.length} points, ${fmtT(mn)} to ${fmtT(mx)}">`;
s+=`<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.22"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>`;
for(let i=0;i<=3;i++){const y=pad.t+(h/3)*i,v=fmtT(mx-((mx-mn)/3)*i);
s+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="${CH_GRID}" stroke-width="1" stroke-opacity=".6"/><text x="${pad.l-4}" y="${y+3}" text-anchor="end" fill="${CH_TXT}" font-size="9">${v}</text>`}
// area fill under the line
const area=`${pts.map(p=>`${p.x},${p.y}`).join(' ')} ${pts[pts.length-1].x},${pad.t+h} ${pts[0].x},${pad.t+h}`;
s+=`<polygon points="${area}" fill="url(#${gid})"/>`;
s+=`<polyline points="${pts.map(p=>`${p.x},${p.y}`).join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
for(const p of pts)s+=`<circle cx="${p.x}" cy="${p.y}" r="4" fill="${color}" stroke="${CH_DOT}" stroke-width="2"><title>${p.l}: ${p.v}</title></circle>`;
// PR markers (opts.marks = data indices) — amber ring + ▲ above the point, matching
// the .pr-badge hue so "PR" reads the same everywhere.
if(Array.isArray(opts.marks))for(const i of opts.marks){const p=pts[i];if(!p)continue;
s+=`<circle cx="${p.x}" cy="${p.y}" r="6.5" fill="none" stroke="${CH_PR}" stroke-width="2"/><text x="${p.x}" y="${Math.max(10,p.y-10)}" text-anchor="middle" fill="${CH_PR}" font-size="8" font-weight="800">▲</text>`}
if(data.length<=8)for(const p of pts)s+=`<text x="${p.x}" y="${H-4}" text-anchor="middle" fill="${CH_TXT}" font-size="8">${p.l}</text>`;
// Title in text ink — the line itself carries the series hue.
s+=`<text x="${W/2}" y="14" text-anchor="middle" fill="${CH_TITLE}" font-size="11" font-weight="700" font-family="Archivo Expanded,sans-serif">${label}</text></svg>`;return s}

// Inline sparkline — bare trend polyline for list rows (no axes/labels; the row
// text carries the numbers, the spark only shows shape). <2 points renders nothing.
function spark(vals,w,h,color){if(!Array.isArray(vals)||vals.length<2)return'';
const mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1;
const pts=vals.map((v,i)=>`${(2+(i/(vals.length-1))*(w-4)).toFixed(1)},${(h-2-((v-mn)/rng)*(h-4)).toFixed(1)}`).join(' ');
return`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true" style="flex-shrink:0;overflow:visible"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/></svg>`}

function getFatigue(){const now=new Date(),scores=[];
for(let i=0;i<7;i++){const d=new Date(now);d.setDate(d.getDate()-i);const ds=ymd(d);
D.sessions.filter(s=>s.date===ds).forEach(s=>{let vol=0;s.ex.forEach(e=>{vol+=calcExVol(e.id,e.wt,e.reps,e.wts)});scores.push({vol,diff:s.difficulty||3,load:1})});
// Cardio intensity maps onto the effort term too (hard 4 / moderate 3 / easy 2) —
// a hard 40-min row is real fatigue; flat diff:3 made intensity nearly invisible.
// `load` is what the entry is worth in the FREQUENCY term. Cardio used to count as a whole
// lifting session there, which broke the meter in both directions at once: seven easy walks
// and zero lifting read "Ready", while four walks pushed a normal lifting week from Ready
// into Building — and because easy cardio carries diff 2, it simultaneously dragged the
// effort term down. A hard row is genuine systemic fatigue and still registers; a 30-minute
// walk is not a squat session.
D.cardioLog.filter(c=>c.date===ds).forEach(c=>scores.push({vol:c.duration*(c.intensity==='hard'?30:c.intensity==='moderate'?25:20),diff:c.intensity==='hard'?4:c.intensity==='moderate'?3:2,load:c.intensity==='hard'?.5:c.intensity==='moderate'?.35:.2}))}
if(!scores.length)return{score:0,label:'Fresh',color:'var(--gr)'};
// Calibration (audit fix): the old weights (f*1.2 + ad*0.9 + vol/1200f) pushed a
// perfectly normal week — 3 sessions, RPE 3, ~9t — to 8.8/10 "Fatigued", so the meter
// red-lined permanently. Target anchors: 3 sessions @RPE3 & normal volume ≈ 5 (Ready);
// 5-6 hard sessions @RPE4+ ≈ 8+ (Fatigued); 1 light session ≈ 2 (Fresh).
// f is session-EQUIVALENTS (summed load), not a raw entry count — see `load` above.
// MONOTONICITY (audit 6). The invariant this function has always claimed — "logging more work
// must never make the meter read less fatigued" — was FALSE, and load-weighting the means did
// not fix it, only shrink it. Any MEAN is non-monotone: the added entry lands in the numerator
// AND the denominator, so a below-average one drags the term down. Measured on the old
// formula: one brutal session (RPE 5, 10t) read 8.6 Fatigued, and logging a second, easy,
// light session dropped it to 4.9 Ready — two bands lower for strictly more work. Cardio hit
// the same wall (3.1 Ready → 2.9 Fresh after a 10-minute row); 182 of 1080 sampled
// lifting+cardio states scored LOWER with the cardio logged, 724 of 6480 crossing a label.
// Effort and per-session volume are now read as PEAKS rather than load-weighted means. A max
// over non-negative per-entry terms can only grow, so the score is monotone by construction,
// and on a UNIFORM week (every entry the same effort and volume — which is what all three
// documented calibration anchors are) max == mean, so this reproduces the existing
// calibration exactly: 3 sessions @RPE3 & normal volume ≈ 5 (Ready); 5-6 hard sessions
// @RPE4+ ≈ 8+ (Fatigued); 1 light session ≈ 2 (Fresh). It differs only on MIXED weeks, and
// only upward — reading "the hardest thing you did, plus how often you trained" instead of
// letting an easy session average a hard one away.
const f=scores.reduce((a,b)=>a+(b.load??1),0);
const pk=scores.reduce((a,b)=>Math.max(a,Math.max(0,b.diff-2)),0);
const pv=scores.reduce((a,b)=>Math.max(a,b.vol),0);
const sc=Math.round(Math.min(10,Math.max(0,f*.8+pk*1.5+pv/3000))*10)/10;
if(sc<=3)return{score:sc,label:'Fresh',color:'var(--gr)'};if(sc<=5)return{score:sc,label:'Ready',color:'var(--pr)'};
if(sc<=7)return{score:sc,label:'Building',color:'var(--am)'};return{score:sc,label:'Fatigued',color:'var(--rd)'}}

function getDeload(stalledMajor=0){const st=D.lastDeload||D.sessions[0]?.date;if(!st)return null;const wk=Math.max(1,Math.floor((new Date()-new Date(st+'T00:00:00'))/6048e5)+1);
const sc=D.lastDeload?D.sessions.filter(s=>s.date>D.lastDeload).length:D.sessions.length;
// Signal-driven: don't deload on timer alone — check for actual fatigue signals.
// Average RPE over the last 14 days (not the last 5 sessions whenever they were)
// so a fortnight-old hard block can't keep flagging fatigue today. Fall back to
// the 5 most recent rated sessions if nothing falls inside the window.
const cut14=daysAgoStr(14);
let rated=D.sessions.filter(s=>s.date>=cut14&&s.difficulty);
if(!rated.length)rated=D.sessions.filter(s=>s.difficulty).slice(-5);
const avgDiff=rated.length?rated.reduce((a,s)=>a+s.difficulty,0)/rated.length:0;
const highFatigue=avgDiff>=4;
// For beginners (<30 sessions), extend timer to 8 weeks and require signals
const isBeginner=D.sessions.length<30;const timerThresh=isBeginner?8:6;
// Two independent fatigue signals: self-reported RPE (subjective, often under-rated) OR
// 2+ lifts genuinely stalling/regressing (objective, from getSmartSugg). Either one, with
// the timer met, recommends a deload — so an athlete who under-rates effort but is clearly
// grinding to a halt still gets caught. Timer met with neither signal = optional checkpoint.
const stallDue=stalledMajor>=2;
// Cadence-aware: timer met after `timerThresh` completed weeks OR ~3×/week sessions'
// worth (timerThresh*3) since the last deload — whichever first — so a training break
// doesn't stretch the deload clock the way calendar-only did. Strict > on weeks keeps the
// off-by-one fix ("every 6 weeks" = after 6 completed weeks, not at week 6's start).
const timerMet=wk>timerThresh||sc>=timerThresh*3;
const due=timerMet&&(highFatigue||stallDue);
const consider=timerMet&&!due;
const reason=highFatigue&&stallDue?`RPE ${Math.round(avgDiff*10)/10}/5 + ${stalledMajor} key lifts stalling`
  :highFatigue?`RPE avg ${Math.round(avgDiff*10)/10}/5 high`
  :stallDue?`${stalledMajor} key lifts stalling`:'';
return{wk,sc,due,consider,isBeginner,avgDiff:Math.round(avgDiff*10)/10,stallDue,stalledMajor,reason}}

// ═══════════════ TIMER ═══════════════
// Wall-clock based: setInterval is throttled/paused with the screen off on
// mobile, so counting ticks drifts long. Recompute remaining from an end
// timestamp each tick — after a background pause the display resyncs instantly.
// Keeps ticking past zero so the pill shows +overtime (was clamped at 0:00 and the
// interval killed — the overtime branch in rTimer was unreachable dead code).
function startTimer(secs){clearTimer();TIMER={tot:secs,end:Date.now()+secs*1000,left:secs,done:false,dismissed:false};
TIV=setInterval(()=>{TIMER.left=Math.ceil((TIMER.end-Date.now())/1000);
if(TIMER.left<=0&&!TIMER.done){TIMER.done=true;startAlarm();notifyRestDone()}rTimer()},500);rTimer()}
// Notifications — best-effort, no backend. The reliably-deliverable case is the
// rest-timer alert while the app sits backgrounded on a locked phone; true
// scheduled "train today" pushes need a server, so we only fire what the browser
// will honour from a live (even if hidden) page.
function notifyOK(){return D.notify&&D.notify.enabled&&D.notify.rest&&typeof Notification!=='undefined'&&Notification.permission==='granted'}
// ONE delivery path for every notification this app fires. Prefer the service worker:
// reg.showNotification honours requireInteraction + vibrate + renotify (page-context
// `new Notification` does not on most mobile browsers, and on Android Chrome the
// constructor throws outright inside an installed PWA). The constructor is the fallback
// for desktop browsers with no controlling worker, not the primary.
//
// This used to be inlined in notifyRestDone only, so the two notifications the user
// actually SEES first — the "Notifications on ✓" confirmation and the "Send test ping"
// button — went through the constructor, wrapped in a bare catch. On Android both did
// nothing, silently: you granted permission, saw no confirmation, tapped a button
// labelled "Send test ping", saw nothing, and concluded notifications were broken —
// while the real rest ping, on the working path, would have fired. A test that exercises
// a different path from the thing it is testing proves nothing about the thing.
function showNotif(title,opts){
try{if(typeof navigator!=='undefined'&&navigator.serviceWorker&&navigator.serviceWorker.ready){
  return navigator.serviceWorker.ready.then(reg=>reg.showNotification(title,opts))
    .catch(()=>{try{new Notification(title,opts)}catch(e){}});
}
new Notification(title,opts)}catch(e){}}
function notifyRestDone(){if(!notifyOK())return;
if(typeof document!=='undefined'&&document.visibilityState==='visible')return; // takeover+alarm already on-screen
const ic=notifIcon();
const opts={body:'Back to it — next set.',tag:'rft-rest',renotify:true,requireInteraction:true,silent:false,vibrate:[500,200,500,200,500,200,500]};
if(ic){opts.icon=ic;opts.badge=ic}
showNotif('Rest complete 💪',opts)}

// and how many rest days fell between recent sessions.
function getCycleInfo(){
const order=['A','B','C'];
// The cycle view answers "where am I in A→B→C" — off-rotation core blocks are not part of
// that answer, and leaving them in made the timeline's rest-day gaps lie (a core block on a
// rest day read as "b2b" training). Filtered out here, so every consumer below is clean.
const ss=[...D.sessions].filter(s=>isRotDay(s.day)).sort((a,b)=>a.date.localeCompare(b.date));
// recent timeline: last up to 5 sessions; gap = calendar days from the previous session
const recent=ss.slice(-5).map((s,i,arr)=>{const prev=arr[i-1];
const gap=prev?Math.round((new Date(s.date+'T00:00:00')-new Date(prev.date+'T00:00:00'))/864e5):null;
return{day:s.day,loc:s.loc||'home',date:s.date,gap}});
// days completed in the current cycle: walk back to and including the most recent 'A'
let done=new Set();
for(let i=ss.length-1;i>=0;i--){const d=ss[i].day;if(!order.includes(d))continue;done.add(d);if(d==='A')break}
const next=D.nextDay||'A';
if(next==='A')done=new Set(); // a fresh A→B→C cycle is about to start
// days since last session + average gap across all sessions
const last=ss[ss.length-1];
const sinceLast=last?Math.round((new Date(today()+'T00:00:00')-new Date(last.date+'T00:00:00'))/864e5):null;
let gaps=[];for(let i=1;i<ss.length;i++)gaps.push((new Date(ss[i].date+'T00:00:00')-new Date(ss[i-1].date+'T00:00:00'))/864e5);
const avgGap=gaps.length?Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length*10)/10:null;
return{order,recent,done,next,sinceLast,avgGap}}

// ─── WORKOUT ───────────────────────────────────
// Seed a LOG row for one exercise (prefilled from last session / smart suggestion).
// Idempotent — used by beginW and by the swap flow when a new movement enters the day.
function ensureLog(ex){if(!ex||LOG[ex.id])return;const last=getLast(ex.id),sg=getSmartSugg(ex);
const defWt=ex.tp==='bb'||(ex.tp==='carry'&&ex.bar)?barOf(ex):'';
// Prefill is PADDED to today's set count — slice() alone left a 3-entry reps array when
// the last session had fewer sets than today prescribes (same id on a 3-set and a 4-set
// day, or a set-count bump like floor press 3→4 in v21), rendering "undefined" in the
// 4th input and mis-reading the exercise as done.
LOG[ex.id]={wt:sg.wt||last?.wt||defWt,band:last?.band||sg.band||'',
reps:Array.from({length:ex.s},(_,i)=>{const r=last?last.reps[i]:null;return r>0?String(r):''}),
wts:Array(ex.s).fill(''), // per-set weight overrides; '' = inherit wt
setDone:Array(ex.s).fill(false),form:Array(ex.s).fill(0),notes:'',pf:!!last,wu:false,disc:'none',discJoints:[],touched:false}}

// The day's exercise list with any in-session swaps applied. Each returned object
// carries _slot (the original program id it occupies) so the swap controls can
// re-swap or revert that slot regardless of what currently fills it.
function dayExs(day,sw){sw=sw||SWAP;return (getCurPR()[day]||[]).map(ex=>{
const id=sw[ex.id],alt=id&&ALL_EX.find(e=>e.id===id);
// Swapped-in movements get the CURRENT phase's rep prescription too — the raw ALL_EX
// def carries base (phase-1) rp/tg, which silently un-periodized any swap.
const adj=alt&&(PHASES[D.phase]||PHASES[1]).adj[id];
return alt?{...alt,...(adj?{rp:adj.rp,tg:adj.tg}:{}),_slot:ex.id,_swapped:true}:{...ex,_slot:ex.id}})}

// Candidate replacements for a slot: library movements sharing a primary muscle,
// not already in today's session, not legacy stubs, optionally filtered by gear.
const TP_LABEL={bb:'Barbell',db:'Dumbbell',band:'Band',kb:'Kettlebell',bw:'Bodyweight',mace:'Mace',club:'Club',carry:'Carry'};
// Equipment actually present per location — swap suggestions must not offer hex-bar/
// landmine lifts at the partner's or DB lifts at home.
const LOC_TP={home:['bb','band','kb','bw','carry','mace'],partner:['db','band','club','bw','carry']};
function swapCandidates(slotId,curId,tpFilter){
const src=MG[curId]||MG[slotId]||{};
const prim=Object.keys(src).filter(m=>src[m]>=1);const pset=prim.length?prim:Object.keys(src);
const shown=new Set(dayExs(ADAY).map(e=>e.id));
const okTp=LOC_TP[D.location||'home']||LOC_TP.home;
return ALL_EX.filter(e=>{
  if(e.id===curId||shown.has(e.id))return false;
  if(/legacy|retired/i.test(e.rl||''))return false;
  if(!okTp.includes(e.tp))return false;
  if(tpFilter!=='all'&&e.tp!==tpFilter)return false;
  const m=MG[e.id];return m&&pset.some(x=>m[x])})
.map(e=>({e,ov:pset.reduce((a,x)=>a+((MG[e.id]||{})[x]||0),0)}))
.sort((a,b)=>b.ov-a.ov).slice(0,12).map(x=>x.e)}

function openSwap(slotId){SWAP_OPEN=SWAP_OPEN===slotId?null:slotId;SWAP_FILTER='all';render()}
function doSwap(slotId,newId){const oldId=SWAP[slotId]||slotId;
if(oldId!==newId&&LOG[oldId]&&!LOG[oldId].touched)delete LOG[oldId];
SWAP[slotId]=newId;ensureLog(ALL_EX.find(e=>e.id===newId));
SWAP_OPEN=null;saveAW();render()}
function revertSwap(slotId){const oldId=SWAP[slotId];
if(oldId&&LOG[oldId]&&!LOG[oldId].touched)delete LOG[oldId];
delete SWAP[slotId];ensureLog((getCurPR()[ADAY]||[]).find(e=>e.id===slotId));
SWAP_OPEN=null;saveAW();render()}

function beginW(day){
// A pending resumable session dies the moment a new one starts (saveAW overwrites the
// blob) — one accidental tap on Start used to silently destroy 45 minutes of logging.
// Guards on pendingAW, NOT checkResume: a blob hidden by a venue/phase switch is still
// sitting in storage about to be overwritten, and that is precisely when it is hardest to
// get back (the Resume card isn't showing, so the user has no idea it exists). Name the
// mismatch so the prompt isn't baffling when no Resume card is visible.
const pend=pendingAW();
if(pend&&typeof confirm==='function'){
  const where=pend.why==='venue'?` from a different venue (${pend.loc})`:pend.why==='phase'?` from phase ${pend.phase}`:'';
  if(!confirm(`You have an unfinished workout${where} waiting to resume — starting a new one discards it. Continue?`))return}
ADAY=day;WU_CHECKS=[false,false,false];SNOTES='';SWAP={};SWAP_OPEN=null;
const exs=dayExs(day);LOG={};SS=Date.now();CIDX=0;
for(const ex of exs)ensureLog(ex);
saveAW();VIEW='workout';acquireWake();render();window.scrollTo(0,0)}

function resumeW(){const r=checkResume();if(!r)return;ADAY=r.day;LOG=r.log;SS=r.start;CIDX=r.cidx||0;SWAP=r.swaps||{};SWAP_OPEN=null;
SNOTES=typeof r.notes==='string'?r.notes:'';
WU_CHECKS=Array.isArray(r.wu)&&r.wu.length===3?r.wu:[false,false,false];
// Normalize resumed LOG rows: a blob written by an older build may lack fields newer
// code dereferences (discJoints, setDone, form) — crash-proof them.
for(const[id,row] of Object.entries(LOG)){if(!row||typeof row!=='object'){delete LOG[id];continue}
if(!Array.isArray(row.reps))row.reps=[];
if(!Array.isArray(row.setDone))row.setDone=Array(row.reps.length).fill(false);
if(!Array.isArray(row.wts))row.wts=Array(row.reps.length).fill('');
if(!Array.isArray(row.form))row.form=[];
if(!Array.isArray(row.discJoints))row.discJoints=[];
if(row.disc==null)row.disc='none';if(row.notes==null)row.notes=''}
for(const ex of dayExs(ADAY))ensureLog(ex);
// A drifted blob may carry a cidx beyond the current day's exercise count — clamp so
// the workout screen never opens on a nonexistent slot.
CIDX=Math.min(CIDX,Math.max(0,dayExs(ADAY).length-1));
VIEW='workout';acquireWake();render();window.scrollTo(0,0)}

function stepWt(id,dir){const ex=ALL_EX.find(e=>e.id===id);

function setL(id,f,v){LOG[id][f]=v;LOG[id].touched=true}

// had prefilled history (all inputs start non-empty). Fire on any rep committed to a
// non-final set; a finished (overtime) pill counts as free to restart.
function setRep(id,i,v){LOG[id].reps[i]=v;LOG[id].pf=false;LOG[id].touched=true;saveAW();
const ex=ALL_EX.find(e=>e.id===id);
if(ex&&Number(v)>0&&i<ex.s-1&&(!TIMER||TIMER.done))startTimer(ex.rstS)}
function toggleSetDone(id,i){if(!LOG[id].setDone)LOG[id].setDone=Array(LOG[id].reps.length).fill(false);

// Per-set weight override — no re-render on keystroke (matches setRep/setL); the
// sticky header's interval picks the new volume up within a second.
function setSetWt(id,i,v){if(!Array.isArray(LOG[id].wts))LOG[id].wts=[];LOG[id].wts[i]=v;LOG[id].pf=false;LOG[id].touched=true;saveAW()}

// behavior). A previous weight equal to today's working weight stays an implicit

const w=setWt(last,i);
if(w!=null&&Array.isArray(LOG[id].wts)){const cur=Number(LOG[id].wt);LOG[id].wts[i]=cur&&wEq(w,cur)?'':String(w)}

function finishW(){

// happened" signal. This also makes the live header and the summary agree by
// construction (liveStats counts checked sets too), and it replaces the old
// touched/pf phantom-session guard: prefilled reps without ticks save nothing.
// Typed-but-unchecked sets are discarded, but never silently — confirm first.
let dropped=0;
for(const v of Object.values(LOG)){const done=v.setDone||[];
  for(let i=0;i<v.reps.length;i++)if(Number(v.reps[i])>0&&!done[i])dropped++}
if(dropped&&typeof confirm==='function'&&!confirm(`${dropped} set${dropped>1?'s':''} with reps ${dropped>1?"aren't":"isn't"} checked off (✓) and won't be saved. Finish anyway?`))return;
const logged=Object.entries(LOG).map(([id,v])=>{
  const done=v.setDone||[];
  // Unchecked sets zero out IN PLACE — positions must survive so wts stays aligned.
  const reps=v.reps.map((r,i)=>done[i]&&Number(r)>0?Number(r):0);
  if(!reps.some(r=>r>0))return null;
  const wt=v.wt?Number(v.wt):null;
  const row={id,wt,reps,band:v.band||'',form:Array.isArray(v.form)?v.form.map(f=>Number(f)||0):[],notes:v.notes};
  // Per-set overrides persist (fully resolved) ONLY when some counted set actually
  // differs from the working weight — uniform sessions keep the lean legacy shape.
  const ov=(v.wts||[]).map(w=>Number(w)>0?Number(w):null);
  if(ov.some((w,i)=>w!=null&&reps[i]>0&&!wEq(w,wt)))row.wts=reps.map((_,i)=>ov[i]??wt);
  return row}).filter(Boolean);
if(!logged.length)return;
const prs=[];for(const e of logged){const p=checkPR(e.id,e.wt,e.reps,e.wts);if(p.length)prs.push({nm:ALL_EX.find(x=>x.id===e.id)?.nm||e.id})}

// stamp the wrong day and skew nextDay/streaks/heatmap.
window._S={exs:logged,prs,tv,ts,tr,dur:SS?Math.round((Date.now()-SS)/6e4):0,day:ADAY,date:ymd(new Date(SS||Date.now())),warmup:WU_CHECKS.filter(Boolean).length,discCount,notes:SNOTES};

// kill/reload on the summary screen (before Save) lost the entire workout. The backup
// now survives until saveSumm() has definitely persisted the session.
SDIFF=0;VIEW='summary';render();window.scrollTo(0,0)}

function saveSumm(){const S=window._S;if(!S)return;

// the workout and finishing again can't duplicate them, and an abandoned summary
// leaves no phantom rows.

// gate reads it, which survives a same-day phase switch (date comparison alone can't).

  if(!sinceDays)return all;

// session's sessForm (worst rated working set), bucketed by week. Sessions with

// only; a lift with no ratings at all returns []. ──
function formWeekly(exId,weeks){

v:buckets[k]?Math.round(buckets[k].reduce((a,b)=>a+b,0)/buckets[k].length*10)/10:null,
lbl:new Date(k+'T00:00:00').toLocaleDateString('en-NZ',{day:'numeric',month:'short'})}));

// ── Per-muscle weekly volume history (for trend bars) ──

function muscleWeekly(muscleKey,weeks){

for(const s of D.sessions){const wk=weekKey(s.date);if(!first||wk<first)first=wk;if(!buckets[wk])buckets[wk]=0;
for(const e of s.ex){const map=MG[e.id];if(!map||!map[muscleKey])continue;const sets=(e.reps||[]).filter(r=>Number(r)>0).length;buckets[wk]+=sets*map[muscleKey]}}

// ── Consistency metrics ──
function consistency(){
const ss=D.sessions;const dates=[...new Set(ss.map(s=>s.date))].sort();
// avg sessions/week over first-session → TODAY. Ending the span at the LAST session
// meant a current layoff never lowered sessions/week — while the status header's
// "On track" gate demands ≥3/wk. The denominator now sees the layoff too.
const first=dates[0];
const spanWk=first?Math.max(1,(new Date(today()+'T00:00:00')-new Date(first+'T00:00:00'))/6048e5):1;
const perWk=Math.round(ss.length/spanWk*10)/10;
// Rolling 8-week cadence — the STATUS verdict reads this, not the lifetime average:
// lifetime carries every old layoff forever, so a slow first month kept a perfectly
// consistent lifter on "Light" permanently. The window still sees a CURRENT layoff
// (empty recent weeks drop it immediately). Histories younger than 8wk use their
// own span so a strong first fortnight isn't diluted by weeks that never existed.
const winWk=Math.min(8,spanWk);
const recentN=ss.filter(s=>s.date>=daysAgoStr(56)).length;
const perWk8=Math.round(recentN/winWk*10)/10;
// warmup compliance — null means "not recorded" (retro logs) and stays out of the rate
const wuSessions=ss.filter(s=>s.warmup!=null);
const wuRate=wuSessions.length?Math.round(wuSessions.filter(s=>s.warmup>0).length/wuSessions.length*100):null;
// avg gap between sessions
let gaps=[];for(let i=1;i<dates.length;i++)gaps.push((new Date(dates[i]+'T00:00:00')-new Date(dates[i-1]+'T00:00:00'))/864e5);

const rpes=ss.filter(s=>s.difficulty).map(s=>s.difficulty);const avgRpe=rpes.length?Math.round(rpes.reduce((a,b)=>a+b,0)/rpes.length*10)/10:null;
return{perWk,perWk8,wuRate,avgGap,avgDur,avgRpe,spanWk:Math.round(spanWk)};
}

function bodyStat(k){const s=bodySeries(k);if(!s.length)return null;
  const first=s[0],last=s[s.length-1];

window.setBodyMetric=function(k){BODY_METRIC=k;render()}
window.saveBod=function(){
const t=today();const ix=D.bodyLog.findIndex(b=>b.date===t);
// Merge onto today's existing entry so a partial re-log doesn't wipe earlier fields.
const entry=ix>=0?{...D.bodyLog[ix]}:{date:t};
// A blank field means two different things, and which one depends on whether the field
// was PREFILLED. The form loads today's stored values, so blanking a field that showed a
// number is the only way to say "that reading was wrong, remove it" — previously the
// merge just kept the old value and a mistyped 850kg could not be taken back except by
// deleting the whole day. Blanking a field that was already empty still means "not
// measuring this today" and writes nothing.
// A blank field deletes the key. On a FIRST log of the day that is a no-op (entry starts
// as {date} and has no key to delete), which is what makes "blank = skip" and
// "blank = retract" the same line of code rather than two branches.
for(const m of BODY_METRICS){const el=document.getElementById('bm_'+m.k);if(!el)continue;
const raw=(el.value==null?'':String(el.value)).trim();const v=parseFloat(raw);
if(!isNaN(v))entry[m.k]=Math.round(v*100)/100;
else if(raw==='')delete entry[m.k]}
// Clearing every field is a request to remove the day, not a malformed save — but deleting
// a log silently on a blank form would be a nasty surprise, so point at the explicit
// control instead. delBod() is confirm-gated and already does exactly this.
if(!BODY_METRICS.some(m=>entry[m.k]!=null&&entry[m.k]!=='')){
alert(ix>=0?'That would clear every measurement for today. Use ✕ on the entry below to delete the whole day.':'Enter at least one measurement');return}
if(ix>=0)D.bodyLog[ix]=entry;else D.bodyLog.push(entry);
D.bodyLog.sort((a,b)=>a.date.localeCompare(b.date));save();render()}
window.delBod=function(date){if(!confirm('Delete this measurement log?'))return;
D.bodyLog=(D.bodyLog||[]).filter(b=>b.date!==date);save();render()}

// Schema guard for imports. A malformed backup (sessions without ex arrays,
// non-numeric reps, garbage dates) used to merge silently and crash renders
// later. Coerce what's salvageable, return null for what isn't.
function validSession(s){
if(!s||typeof s!=='object'||Array.isArray(s))return null;
if(s.id==null||(typeof s.id!=='string'&&typeof s.id!=='number'))return null;
if(typeof s.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s.date))return null;
if(!Array.isArray(s.ex))return null;
const ex=[];
for(const e of s.ex){
  if(!e||typeof e!=='object'||typeof e.id!=='string')continue;
  const reps=Array.isArray(e.reps)?e.reps.map(r=>{const n=Number(r);return Number.isFinite(n)&&n>0?n:0}):[];
  const wt=e.wt==null?null:(Number.isFinite(Number(e.wt))?Number(e.wt):null);
  // Per-set weight overrides: keep only a well-formed array of positive numbers
  // (null = inherit wt); anything else — or an all-null array — drops the key so
  // readers can trust `Array.isArray(e.wts)` implies real overrides.
  let wts;if(Array.isArray(e.wts)){wts=e.wts.map(w=>{const n=Number(w);return Number.isFinite(n)&&n>0?n:null});
    if(!wts.some(w=>w!=null))wts=undefined}
  // Coerce free-text fields to strings — non-string band/notes from a hand-edited
  // backup used to flow into templates as objects/arrays (escaped at render too).
  const row={...e,reps,wt,band:typeof e.band==='string'?e.band:'',notes:typeof e.notes==='string'?e.notes:''};
  if(wts)row.wts=wts;else delete row.wts;
  ex.push(row)}
// `day` is load-bearing for render (badges, cycle, NEXT_DAY) — every render path calls
// s.day.toLowerCase(). The program uses A/B/C only; normalize anything else to 'A' so a
// malformed/hand-edited backup can't crash the Home/History screens it lands on.
const day=['A','B','C'].includes(s.day)?s.day:'A';
// Session ids are interpolated into inline onclick handlers (delete/expand) — constrain
// the charset so a hostile/hand-mangled backup id can't break out of the attribute.
const id=String(s.id).replace(/[^\w.-]/g,'');
if(!id)return null;
return{...s,id,day,ex}}
// Two-tab conflict merge (pure): union the append-only logs from another tab's store
// into ours — sessions by id, cardio by id, body by date, discomfort by composite key —
// while every scalar (phase, location, nextDay, prefs) keeps THIS tab's in-memory value.
// Their rows pass the same validSession guard as imports so a mangled store can't
// smuggle malformed sessions past the load-path validation.
function mergeStores(mine,theirs){const W=structuredClone(mine);
if(!theirs||typeof theirs!=='object')return W;
// Deletion is the one thing a pure union cannot express. Deleting a session in this tab and
// then saving anything at all in the other one — dismissing a banner, tapping a theme, logging
// cardio — used to union the still-present row straight back in, and the deleted session
// reappeared with no interaction that could have caused it. D.deleted is a tombstone list
// (session ids only, capped); it is unioned from both stores and applied to both sides, so a
// delete in either tab wins and then propagates on the next write.
const tomb=new Set([...(Array.isArray(W.deleted)?W.deleted:[]),...(Array.isArray(theirs.deleted)?theirs.deleted:[])]
  .filter(x=>typeof x==='string'&&/^[\w.-]{1,64}$/.test(x)));
W.sessions=W.sessions.filter(s=>!tomb.has(s.id));
const sIds=new Map(W.sessions.map(s=>[s.id,s]));
for(const s of(Array.isArray(theirs.sessions)?theirs.sessions:[])){const v=validSession(s);if(!v)continue;
  if(tomb.has(v.id))continue;
  const mine=sIds.get(v.id);
  // On an id collision the local row wins — EXCEPT for noProg, which marks a session the user
  // deliberately excluded from progression. Dropping it silently re-admitted that session to
  // the engine, so the flag is sticky: set in either tab, it survives.
  if(mine){if(v.noProg)mine.noProg=true;continue}
  sIds.set(v.id,v);W.sessions.push(v)}
W.sessions.sort((a,b)=>a.date.localeCompare(b.date));
const cIds=new Set(W.cardioLog.map(c=>c.id));
// Cardio ids reach a delete-button onclick (the same sink cue keys do), and this branch
// adopted whatever the other tab's store held. Apply mergeImport's charset guard here too —
// guard both entrances identically rather than trusting that one of them is safe.
for(const c of(Array.isArray(theirs.cardioLog)?theirs.cardioLog:[])){
  if(!c||typeof c!=='object')continue;
  const cid=String(c.id==null?'':c.id).replace(/[^\w.-]/g,'');
  if(!cid||cIds.has(cid))continue;
  cIds.add(cid);W.cardioLog.push({...c,id:cid})}
W.cardioLog.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
const bKeys=new Set(W.bodyLog.map(x=>x.date));
for(const x of(Array.isArray(theirs.bodyLog)?theirs.bodyLog:[])){if(x&&typeof x==='object'&&x.date&&!bKeys.has(x.date))W.bodyLog.push(x)}
W.bodyLog.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
const dKeys=new Set(W.discomfort.map(x=>x.date+x.exId+x.joint));
for(const x of(Array.isArray(theirs.discomfort)?theirs.discomfort:[])){if(x&&typeof x==='object'&&!dKeys.has(x.date+x.exId+x.joint))W.discomfort.push(x)}
// Cues had no branch here at all, so a coaching cue typed in one tab was dropped the moment
// the other tab saved. Union by key, local wins a conflict (this tab is the live one), and
// apply the SAME charset guard load() and mergeImport use — cue keys are interpolated into a
// delete-button onclick, and this is the third entrance to that sink.
if(!W.cues||typeof W.cues!=='object')W.cues={};
if(theirs.cues&&typeof theirs.cues==='object'){
  for(const[k,v] of Object.entries(theirs.cues))
    if(typeof v==='string'&&/^[\w-]{1,60}$/.test(k)&&!(k in W.cues))W.cues[k]=v}
// Carry the union forward (newest last, capped) so the delete keeps propagating until every
// tab has seen it. TOMB_MAX is a bound on unbounded growth, not a correctness knob: a
// tombstone only has to outlive the other tab's stale in-memory snapshot.
W.deleted=[...tomb].slice(-TOMB_MAX);
return W}
// Pure merge core for imports — extracted from impD so the export→clear→import
// round-trip is provable in the Node test harness (impD itself is FileReader/DOM-bound).
// Takes the current state `cur` and a parsed backup `d`; returns {W,added,replaced,skipped}
// without touching D or storage. Throws on unsalvageable input.
function mergeImport(cur,d){
if(!d||typeof d!=='object'||!Array.isArray(d.sessions))throw 0;
let skipped=0;d.sessions=d.sessions.map(validSession).filter(s=>s?true:(skipped++,false));
if(!d.sessions.length&&skipped)throw 0; // nothing salvageable — reject outright
if(!d.cues||typeof d.cues!=='object'||Array.isArray(d.cues))d.cues={};
// Validate the auxiliary logs field-by-field — they render into templates and inline
// handlers (delBod('${date}')), so imported garbage must be dropped, not adopted.
d.bodyLog=(Array.isArray(d.bodyLog)?d.bodyLog:[]).filter(b=>b&&typeof b==='object'&&typeof b.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(b.date))
  .map(b=>{const o={date:b.date};for(const[k,v] of Object.entries(b)){if(k==='date')continue;const n=Number(v);if(Number.isFinite(n))o[k]=Math.round(n*100)/100}return o});
d.cardioLog=(Array.isArray(d.cardioLog)?d.cardioLog:[]).filter(c=>c&&typeof c==='object'&&typeof c.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(c.date)&&Number.isFinite(Number(c.duration)))
  .map(c=>({id:String(c.id||'c'+c.date).replace(/[^\w.-]/g,''),date:c.date,type:typeof c.type==='string'?c.type:'Other',duration:Number(c.duration),intensity:['easy','moderate','hard'].includes(c.intensity)?c.intensity:'easy'}));
d.discomfort=(Array.isArray(d.discomfort)?d.discomfort:[]).filter(x=>x&&typeof x==='object'&&typeof x.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&typeof x.exId==='string'&&/^[\w-]+$/.test(x.exId)&&['mild','moderate','none'].includes(x.level)&&JOINTS.includes(x.joint));
// ATOMIC merge: all work happens on a clone — a throw mid-merge used to leave D
// partially mutated with the drift persisted by the next save(). D is only replaced
// once the whole merge succeeded.
const W=structuredClone(cur);
// Fresh device = truly empty OR still on the bundled demo SEED (load() marks that with
// `seeded`) — the old sessions.length===0 test was unreachable because an empty store
// always loads the demo. On a fresh restore, demo rows are dropped, and phase/venue
// metadata is adopted from the backup instead of silently keeping the demo defaults.
const wasFresh=W.sessions.length===0||W.seeded===true;
if(W.seeded){W.sessions=[];W.cardioLog=[];W.bodyLog=[];W.discomfort=[]}
const existingMap=new Map(W.sessions.map(s=>[s.id,s]));
let added=0,replaced=0;
for(const s of d.sessions){if(existingMap.has(s.id))replaced++;else added++;existingMap.set(s.id,s)}
W.sessions=[...existingMap.values()];
W.sessions.sort((a,b)=>a.date.localeCompare(b.date));
// An import is an explicit, reported act — unlike the silent cross-tab union — so it is
// allowed to bring back a session this device once deleted. Lift the tombstone for anything
// the backup actually carries, or the next two-tab merge would immediately re-delete it.
{const back=new Set(d.sessions.map(s=>s.id));
 W.deleted=(Array.isArray(W.deleted)?W.deleted:[]).filter(x=>!back.has(x));}
// Merge cardio, discomfort, body logs (additive) — re-sort body log so date-ordered
// readers (current weight, change, trend chart, W:H ratio, relative strength) stay correct.
const cIds=new Set(W.cardioLog.map(c=>c.id));
for(const c of d.cardioLog){if(!cIds.has(c.id))W.cardioLog.push(c)}
W.cardioLog.sort((a,b)=>a.date.localeCompare(b.date));
const dKeys=new Set(W.discomfort.map(x=>x.date+x.exId+x.joint));
for(const x of d.discomfort){if(!dKeys.has(x.date+x.exId+x.joint))W.discomfort.push(x)}
const bKeys=new Set(W.bodyLog.map(x=>x.date));
for(const x of d.bodyLog){if(!bKeys.has(x.date))W.bodyLog.push(x)}
W.bodyLog.sort((a,b)=>a.date.localeCompare(b.date));
// Cue KEYS are interpolated into the delete-button onclick — constrain the charset.
for(const[k,v] of Object.entries(d.cues))if(typeof v==='string'&&/^[\w-]{1,60}$/.test(k))W.cues[k]=v;
// Adopt global metadata (phase clock / venue / deload date) ONLY when migrating into a fresh
// device, and VALIDATED — phase:9 / phaseStart:'banana' / location:'moon' used to be adopted
// verbatim.
// Deliberately DEVICE-LOCAL (never imported): `notify` mirrors THIS device's Notification
// permission; `dismissed` banners are situational; `lastBackup`/`lastBackupCount` must stay
// unset so a fresh device is nagged into its own first backup; `gen` is this device's
// two-tab write generation (the clone of `cur` already carries the right one).
if(wasFresh){
  if([1,2,3].includes(d.phase))W.phase=d.phase;
  if(typeof d.phaseStart==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d.phaseStart))W.phaseStart=d.phaseStart;
  if(['home','partner'].includes(d.location))W.location=d.location;
  // lastDeload belongs with the phase clock, not with the additive merges above. It used to
  // be adopted UNCONDITIONALLY, which broke two ways on a device that already had history:
  // getSmartSugg drops sessions falling inside the deload week, so an imported date landing
  // on top of real training silently removed those sessions from every suggestion; and the
  // `: null` fallback meant a backup with a malformed lastDeload wiped a valid local one.
  if(d.lastDeload!==undefined)W.lastDeload=(typeof d.lastDeload==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d.lastDeload))?d.lastDeload:null;
}
// Update nextDay from latest session — location aware
{const last=lastRotSession(W.sessions);if(last)W.nextDay=NEXT_DAY[last.day];}
// On a fresh restore the backup's own nextDay wins over the re-derive — it captures a
// manual rotation override, and same-date A+B sessions make last-by-date ambiguous.
if(wasFresh&&['A','B','C'].includes(d.nextDay))W.nextDay=d.nextDay;
// Run migration on imported data
migrateData(W);
delete W.seeded;
return{W,added,replaced,skipped}}
function impD(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();
r.onload=e=>{try{const d=JSON.parse(e.target.result);
const{W,added,replaced,skipped}=mergeImport(D,d);
D=W;
if(!save())alert('⚠ Import merged but could not be written to storage (quota?). Export a backup before closing.');
render();
alert(`Import: ${added} new, ${replaced} updated (${D.sessions.length} total)${skipped?` · ${skipped} malformed session${skipped>1?'s':''} skipped`:''}`)}catch(e){alert('Invalid file — nothing was changed.')}};
r.readAsText(f);ev.target.value=''}

// ═══════════════ INIT ═══════════════
load();applyTheme();render();acquireWake();
// Screen Wake Lock is auto-released when the tab hides/locks — re-acquire it when the user
// returns to a still-active workout so the rest alarm keeps firing on time.
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&SS!=null)acquireWake()});
// Re-theme live when the phone flips its scheme (only matters on 'auto').
try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{applyTheme();render()})}catch(e){}
// Arm the shared AudioContext from the first user gesture (iOS requirement — a context
// created cold at rest-timer end stays suspended and the beep is silent).
document.addEventListener('touchstart',initAC,{once:true,passive:true});
document.addEventListener('click',initAC,{once:true});
// Register the real same-origin service worker file. Blob-URL workers are
// rejected by all browsers, so offline support needs an actual ./sw.js.
if('serviceWorker'in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').then(reg=>{
    // When a new SW finishes installing AND a worker already controls the page, a fresh
    // version is ready — prompt to reload rather than swapping code mid-session.
    reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(!nw)return;
      nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)showUpdateToast()})})
  }).catch(()=>{})})}
function showUpdateToast(){if(document.getElementById('upd-toast'))return;
  const t=document.createElement('div');t.id='upd-toast';
  t.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:300;background:var(--cd);border:1px solid var(--pr);border-radius:30px;padding:9px 10px 9px 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--shm);font-size:12px;color:var(--tx)';
  t.innerHTML='<span>New version available</span><button style="background:var(--pr);color:var(--ink);border:none;border-radius:20px;padding:8px 16px;font-weight:700;font-size:12px;cursor:pointer">Reload</button><button aria-label="Dismiss update" style="background:0;border:none;color:var(--mu);font-size:17px;cursor:pointer;line-height:1;padding:12px 14px;margin:-8px -6px">✕</button>';
  const b=t.querySelectorAll('button');b[0].onclick=()=>location.reload();b[1].onclick=()=>t.remove();
  document.body.appendChild(t)}

</script>
