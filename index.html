// Derived: waist-to-hip ratio when both are on record
const hSt=bodyStat('hips'),waSt=bodyStat('waist');
if(hSt&&waSt){const r=Math.round(waSt.last.v/hSt.last.v*100)/100;
h+=`<div class="cd" style="display:flex;justify-content:space-between;align-items:center;padding:11px 14px">
<span style="font-size:12px;font-weight:600">Waist-to-Hip Ratio</span>
<span class="std-ratio" style="color:var(--pr)">${r}</span></div>`}
}else{h+=`<div class="cd" style="text-align:center;padding:20px"><div style="font-size:24px;margin-bottom:6px">📏</div><div class="dm">Log a few measurements and trend charts plus a summary table appear here. Weigh in and measure at a consistent time of day for clean data.</div></div>`}
// history with per-entry delete
if(bl.length){h+=`<div class="lb" style="margin-top:14px;margin-bottom:6px">History · ${bl.length}</div>`;
for(const b of[...bl].reverse().slice(0,20)){
const parts=[];for(const m of BODY_METRICS){const v=b[m.k];if(v==null||v==='')continue;

else parts.push(`<span class="dm">${m.lb} ${v}</span>`)}
h+=`<div class="cd" style="padding:9px 14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
<span style="font-size:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">${parts.join('')}</span>
<span style="display:flex;align-items:center;gap:8px;flex-shrink:0"><span class="dm">${fmtD(b.date)}</span>
<button onclick="delBod('${b.date}')" title="Delete" style="border:none;background:var(--ib);color:var(--rd);width:24px;height:24px;border-radius:6px;font-size:12px;cursor:pointer">✕</button></span></div></div>`}}
h+=`<button class="btn btn-wh" style="margin-top:10px;font-size:13px" onclick="go('stats')">← Back to Progress</button>`;
h+=`</div>`;el.innerHTML=h}
window.setBodyMetric=function(k){BODY_METRIC=k;render()}
window.saveBod=function(){
const t=today();const ix=D.bodyLog.findIndex(b=>b.date===t);
// Merge onto today's existing entry so a partial re-log doesn't wipe earlier fields.
const entry=ix>=0?{...D.bodyLog[ix]}:{date:t};
for(const m of BODY_METRICS){const el=document.getElementById('bm_'+m.k);const v=el?parseFloat(el.value):NaN;
if(!isNaN(v))entry[m.k]=Math.round(v*100)/100}
if(!BODY_METRICS.some(m=>entry[m.k]!=null&&entry[m.k]!=='')){alert('Enter at least one measurement');return}
if(ix>=0)D.bodyLog[ix]=entry;else D.bodyLog.push(entry);
D.bodyLog.sort((a,b)=>a.date.localeCompare(b.date));save();render()}
window.delBod=function(date){if(!confirm('Delete this measurement log?'))return;
D.bodyLog=(D.bodyLog||[]).filter(b=>b.date!==date);save();render()}

if(ex.tp==='band')
h+=`<div style="margin-bottom:4px"><select class="bs" style="width:auto" id="${inputId}_band"><option value="">Band...</option>
${BANDS.map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join('')}</select></div>`;
// Rep inputs
h+=`<div style="display:flex;gap:6px">`;
for(let i=0;i<ex.s;i++)h+=`<input type="number" class="ri" style="width:42px" id="${inputId}_r${i}" placeholder="S${i+1}" inputmode="numeric">`;
h+=`</div></div>`}

h+=`<div style="display:flex;gap:8px;margin-top:14px">
<button class="btn btn-pr" style="flex:2" onclick="savePast()">Save Session</button>
<button class="btn btn-wh" style="flex:1" onclick="go('history')">Cancel</button></div></div>`;
el.innerHTML=h}

function savePast(){
const pr=getProgram(D.phase,LP.loc);
const exs=pr[LP.day]||[];const logged=[];
for(const ex of exs){
const wEl=document.getElementById(`lp_${ex.id}_wt`);
const bEl=document.getElementById(`lp_${ex.id}_band`);
const reps=[];let hasData=false;
for(let i=0;i<ex.s;i++){const r=document.getElementById(`lp_${ex.id}_r${i}`);const v=r?parseInt(r.value)||0:0;reps.push(v);if(v>0)hasData=true}
const wt=wEl?parseFloat(wEl.value)||null:null;
const band=bEl?bEl.value:'';
if(wt)hasData=true;if(band)hasData=true;
if(hasData)logged.push({id:ex.id,wt,reps,band,notes:'(logged retroactively)'})}
if(!logged.length){alert('No data entered');return}
// Patch 9: Compute volume
let tv=0;for(const e of logged){tv+=calcExVol(e.id,e.wt,e.reps)}
const dt=LP.date||today();
D.sessions.push({id:'s'+Date.now(),date:dt,day:LP.day,loc:LP.loc,ex:logged,volume:tv,duration:null,difficulty:null,warmup:0});
// Sort sessions by date
D.sessions.sort((a,b)=>a.date.localeCompare(b.date));
// Update nextDay based on latest session — location aware
const last=D.sessions[D.sessions.length-1];
D.nextDay=NEXT_DAY[last.day]||'A';
save();go('history')}
// ─── PLATES ──────────────────────────────────
function rPlates(el){
  // Render one weight ladder as a labelled section. lm=true → single-end (landmine) plate
  // breakdown; otherwise symmetric per-side. Reused for the straight bar and the landmine.
  const ladder=(title,sub,vw,lm)=>{
    let h=`<div class="lb" style="margin:16px 0 4px">${title} <span class="dm" style="font-weight:400">· ${vw.length}</span></div>`;
    if(sub)h+=`<div style="font-size:11px;color:var(--mu);margin-bottom:8px">${sub}</div>`;
    let prev=null;
    for(let i=0;i<vw.length;i++){const w=vw[i],j=prev!==null?`+${Math.round((w-prev)*100)/100}kg`:'';
      h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 12px;border-radius:8px;margin-bottom:2px;${i%2?'':'background:var(--cd)'}">
      <div><span style="font-size:15px;font-weight:700">${w}</span><span class="dm"> kg</span></div>
      <div style="text-align:right"><div style="font-size:10px;color:var(--mu)">${esc(fmtPl(w,BAR,lm))}</div>
      ${j?`<div style="font-size:9px;color:var(--gr)">${j}</div>`:''}</div></div>`;prev=w}
    return h;
  };
  let h=`<div class="sec"><div class="lb" style="margin-bottom:2px">All Valid Weights</div>`;
  h+=ladder('Straight Bar (11kg)','Plates mirror on both ends, per side.',VW,false);
  h+=ladder('Landmine — load 1 end (11kg bar)','One end pivots on the floor; plates go on the free sleeve only — finer steps than the straight bar (a lone 0.25kg → 11.25kg). Feels lighter than the number due to leverage.',VWL,true);
  h+=`</div>`;el.innerHTML=h;
}

// ─── SETTINGS ────────────────────────────────
function rSet(el){const sz=(new Blob([JSON.stringify(D)])).size;const phi=getPhaseInfo();
let h=`<div class="sec">
<div class="lb" style="margin-bottom:6px">Data</div>
<div class="cd"><div style="font-size:12px;line-height:1.8">
Sessions: ${D.sessions.length} · Cardio: ${D.cardioLog.length} · Body: ${D.bodyLog.length}<br>
Phase ${phi.phase}: ${phi.name} (Wk ${phi.wk}/${phi.maxWk}) · Location: ${D.location==='partner'?"Partner's":'Home'} · ${(sz/1024).toFixed(1)}KB<br>
Cues: ${Object.keys(D.cues).length} · Discomfort entries: ${D.discomfort.length}</div></div>
<button class="btn btn-wh" style="margin-bottom:8px" onclick="go('plates')">📐 Plate Reference</button>
<div class="lb" style="margin-top:10px;margin-bottom:6px">Location</div>
<div class="cd"><div style="font-size:12px;margin-bottom:8px">Active: <strong>${D.location==='partner'?"🏘 Partner's":"🏠 Home"}</strong></div>
<div style="display:flex;gap:6px">
<button class="btn-sm ${D.location==='home'?'btn-pr':'btn-wh'}" onclick="D.location='home';save();render()">🏠 Home</button>
<button class="btn-sm ${D.location==='partner'?'btn-pr':'btn-wh'}" onclick="D.location='partner';save();render()">🏘 Partner's</button>
</div><div class="dm" style="margin-top:6px">Home: barbell + KBs + mace + pull-up tower<br>Partner's: DBs + bands + clubbells + parallel bars</div></div>
<div class="lb" style="margin-top:10px;margin-bottom:6px">Notifications</div>`;
{const supported=typeof Notification!=='undefined';
const perm=supported?Notification.permission:'unsupported';
const on=D.notify&&D.notify.enabled&&perm==='granted';
h+=`<div class="cd">`;
if(!supported){h+=`<div class="dm">This browser doesn't support notifications.</div>`;}
else if(perm==='denied'){h+=`<div style="font-size:12px;color:var(--am);margin-bottom:4px">⚠ Blocked in browser settings</div><div class="dm">Allow notifications for this site, then reload to enable rest-timer alerts.</div>`;}
else if(!on){h+=`<div style="font-size:12px;margin-bottom:8px">Get a ping when your rest timer finishes while the app is in the background.</div>
<button class="btn btn-pr" style="padding:9px" onclick="reqNotify()">🔔 Enable notifications</button>`;}
else{h+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
<span style="font-size:12px;font-weight:600">Rest-timer alerts</span>
<button class="toggle${D.notify.rest?' on':''}" onclick="toggleNotifyRest()"><span class="toggle-dot"></span></button></div>
<button class="btn btn-wh btn-sm" onclick="notifyRestDone.__test=1;(function(){try{new Notification('Test ping 🔔',{body:'Notifications are working.',tag:'rft-test'})}catch(e){}})()">Send test ping</button>
<div class="dm" style="margin-top:6px">Fires only when the app is backgrounded — on-screen you still get the beep + buzz. Scheduled “train today” reminders aren't possible without a server.</div>`;}
h+=`</div>`;}
h+=`<div class="lb" style="margin-top:10px;margin-bottom:6px">Phase Control</div>
<div class="cd"><div style="font-size:12px;margin-bottom:8px">Current: <strong>Phase ${phi.phase} — ${phi.name}</strong> (Week ${phi.wk}/${phi.maxWk})</div>
<div style="display:flex;gap:6px">`;
for(let i=1;i<=3;i++)h+=`<button class="btn-sm ${D.phase===i?'btn-pr':'btn-wh'}" onclick="D.phase=${i};D.phaseStart=today();save();render()">P${i}: ${PHASES[i].name}</button>`;
h+=`</div></div>
<div class="lb" style="margin-top:10px;margin-bottom:6px">Backup</div>
<button class="btn btn-wh" style="margin-bottom:6px" onclick="expD()">↓ Export</button>
<label class="btn btn-wh" style="text-align:center;cursor:pointer;display:block;margin-bottom:6px">↑ Import
<input type="file" accept=".json" style="display:none" onchange="impD(event)"></label>
<div class="lb" style="margin-top:10px;margin-bottom:6px">Cues</div>`;
const ck=Object.keys(D.cues);if(ck.length){for(const k of ck){const ex=ALL_EX.find(e=>e.id===k);
h+=`<div class="cd" style="padding:8px 14px;display:flex;justify-content:space-between;align-items:center">
<div><span style="font-size:12px;font-weight:600">${esc(ex?.nm||k)}</span> · <span style="color:var(--pr);font-size:11px">${esc(D.cues[k])}</span></div>
<button class="btn-sm btn-rd" onclick="delete D.cues['${k}'];save();render()">✕</button></div>`}}
else h+=`<div class="dm">No cues yet</div>`;
h+=`<div class="lb" style="margin-top:10px;margin-bottom:6px">Band order (thickest → thinnest)</div>
<div class="cd" style="font-size:11px;color:var(--mu);line-height:1.9">${BANDS.join(' → ')}<div class="dm" style="margin-top:6px"><b>Assist</b> (pull-ups, dips): band helps you. Thinner = harder = progress. Move right.</div><div class="dm" style="margin-top:4px"><b>Resist</b> (lateral raise, face pull, Pallof, ext rot): band is the load. Thicker = harder = progress. Move left.</div></div>
<div class="lb" style="margin-top:10px;margin-bottom:6px">Danger Zone</div>
<button class="btn btn-rd" id="resetBtn" onclick="if(this.dataset.armed==='1'){D=structuredClone(SEED);save();this.dataset.armed='0';go('home')}else{this.dataset.armed='1';this.textContent='Tap again to confirm reset';setTimeout(()=>{this.dataset.armed='0';this.textContent='Reset All Data'},3000)}">Reset All Data</button>
</div>`;el.innerHTML=h}

function expD(){const b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`workout-${today()}.json`;a.click();
D.lastBackup=today();D.lastBackupCount=D.sessions.length;save();render()}
// Schema guard for imports. A malformed backup (sessions without ex arrays,
// non-numeric reps, garbage dates) used to merge silently and crash renders
// later. Coerce what's salvageable, return null for what isn't.
function validSession(s){
if(!s||typeof s!=='object'||Array.isArray(s))return null;
if(s.id==null||(typeof s.id!=='string'&&typeof s.id!=='number'))return null;
if(typeof s.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s.date))return null;
if(!Array.isArray(s.ex))return null;
const ex=[];
for(const e of s.ex){
  if(!e||typeof e!=='object'||typeof e.id!=='string')continue;
  const reps=Array.isArray(e.reps)?e.reps.map(r=>{const n=Number(r);return Number.isFinite(n)&&n>0?n:0}):[];
  const wt=e.wt==null?null:(Number.isFinite(Number(e.wt))?Number(e.wt):null);
  ex.push({...e,reps,wt})}
return{...s,id:String(s.id),ex}}
function impD(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();
r.onload=e=>{try{const d=JSON.parse(e.target.result);
if(!d||typeof d!=='object'||!Array.isArray(d.sessions))throw 0;
let skipped=0;d.sessions=d.sessions.map(validSession).filter(s=>s?true:(skipped++,false));
if(!d.sessions.length&&skipped)throw 0; // nothing salvageable — reject outright
if(!d.cues||typeof d.cues!=='object'||Array.isArray(d.cues))d.cues={};
if(!Array.isArray(d.bodyLog))d.bodyLog=[];
if(!Array.isArray(d.cardioLog))d.cardioLog=[];
if(!Array.isArray(d.discomfort))d.discomfort=[];
// Patch 10: Merge sessions — REPLACE same-ID, ADD new
const existingMap=new Map(D.sessions.map(s=>[s.id,s]));
let added=0,replaced=0;
for(const s of d.sessions){if(existingMap.has(s.id))replaced++;else added++;existingMap.set(s.id,s)}
D.sessions=[...existingMap.values()];
D.sessions.sort((a,b)=>a.date.localeCompare(b.date));
// Merge cardio, discomfort, body logs (additive)
const cIds=new Set(D.cardioLog.map(c=>c.id));
for(const c of d.cardioLog){if(!cIds.has(c.id))D.cardioLog.push(c)}
const dKeys=new Set(D.discomfort.map(x=>x.date+x.exId+x.joint));
for(const x of d.discomfort){if(!dKeys.has(x.date+x.exId+x.joint))D.discomfort.push(x)}
const bKeys=new Set(D.bodyLog.map(x=>x.date));
for(const x of d.bodyLog){if(!bKeys.has(x.date))D.bodyLog.push(x)}
for(const[k,v] of Object.entries(d.cues))D.cues[k]=v;
// Patch 10: Adopt global metadata from import
if(d.phase)D.phase=d.phase;
if(d.phaseStart)D.phaseStart=d.phaseStart;
if(d.lastDeload!==undefined)D.lastDeload=d.lastDeload;
if(d.trainingWeek)D.trainingWeek=d.trainingWeek;
if(d.location)D.location=d.location;
// Update nextDay from latest session — location aware
if(D.sessions.length){const last=D.sessions[D.sessions.length-1];
D.nextDay=NEXT_DAY[last.day]||D.nextDay}
// Run migration on imported data
migrateData(D);
save();render();
alert(`Import: ${added} new, ${replaced} updated (${D.sessions.length} total)${skipped?` · ${skipped} malformed session${skipped>1?'s':''} skipped`:''}`)}catch(e){alert('Invalid file')}};
r.readAsText(f);ev.target.value=''}

// ═══════════════ INIT ═══════════════
load();render();
// Register the real same-origin service worker file. Blob-URL workers are
// rejected by all browsers, so offline support needs an actual ./sw.js.
if('serviceWorker'in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})})}

</script>
