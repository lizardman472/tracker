<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tracker">
<meta name="theme-color" content="#f4f6f8">
<meta name="mobile-web-app-capable" content="yes">
<title>Rack-Free Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
<style>
:root{--bg:#f4f6f8;--cd:#fff;--cb:#e2e8f0;--ib:#f0f2f5;--ibr:#d5dce6;--tx:#1e293b;--mu:#8594a7;--dm:#a8b5c4;
--pr:#4a6fa5;--prl:#e8eef6;--gr:#2d8a6e;--grl:#e6f5ef;--am:#b8862d;--aml:#faf3e6;--rd:#c45050;--rdl:#fce8e8;
--pu:#7c6aad;--pul:#f0ecf7;--bl:#3b82c4;--bll:#e5f3ff;
--p10:#c44040;--p5:#4a6fa5;--p25:#2d8a6e;--p1:#8594a7;
--sh:0 1px 3px rgba(0,0,0,.06);--shm:0 4px 12px rgba(0,0,0,.08);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body{max-width:480px;margin:0 auto;padding-bottom:calc(74px + var(--sab))}
input,select,button,textarea{font-family:inherit}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
.hdr{padding:14px 16px 10px;background:#fff;border-bottom:1px solid var(--cb);position:sticky;top:0;z-index:100;box-shadow:var(--sh)}
.hdr h1{font-size:15px;font-weight:700;color:var(--pr);letter-spacing:.5px}
.hdr small{font-size:10px;color:var(--dm)}
.nav{display:flex;padding:0 12px;background:#fff;position:sticky;top:48px;z-index:99;box-shadow:var(--sh)}
.nav button{flex:1;padding:10px 0;font-size:10px;font-weight:600;border:none;border-bottom:2px solid transparent;background:0;color:var(--mu);cursor:pointer;letter-spacing:.3px}
.nav button.a{color:var(--pr);border-bottom-color:var(--pr)}
.sec{padding:14px 16px}
.cd{background:var(--cd);border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--sh)}
.cd-hl{box-shadow:var(--shm);border:1px solid var(--pr)}
.bg{display:inline-block;padding:3px 10px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.8px}
.bg-a{background:var(--prl);color:var(--pr)}.bg-b{background:var(--bll);color:var(--bl)}.bg-c{background:var(--grl);color:var(--gr)}.bg-d{background:var(--aml);color:var(--am)}
.lb{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:4px;font-weight:600}
.mu{font-size:12px;color:var(--mu)}.dm{font-size:11px;color:var(--dm)}
.sg{font-size:12px;font-weight:600;padding:4px 10px;border-radius:6px;display:inline-block;margin-bottom:4px}
.sg-up{color:var(--gr);background:var(--grl)}.sg-st{color:var(--am);background:var(--aml)}.sg-nw{color:var(--pr);background:var(--prl)}
.sg-dn{color:var(--rd);background:var(--rdl)}.sg-cf{color:var(--bl);background:var(--bll)}
.ri{width:56px;height:56px;font-size:22px;font-weight:700;background:var(--ib);border:2px solid var(--ibr);border-radius:12px;color:var(--tx);text-align:center;outline:none}
.ri:focus{border-color:var(--pr);background:#fff;box-shadow:0 0 0 3px rgba(74,111,165,.15)}
.ri.pf{color:var(--dm)}.ri.done{border-color:var(--gr);background:var(--grl);color:var(--gr)}
.ni{width:100%;padding:10px 12px;font-size:13px;background:var(--ib);border:1px solid var(--ibr);border-radius:10px;color:var(--mu);outline:none}
.ni:focus{border-color:var(--pr);color:var(--tx);background:#fff}
.bs{padding:10px 12px;font-size:13px;background:var(--ib);border:1px solid var(--ibr);border-radius:10px;color:var(--tx);outline:none;width:100%}
.stp{display:flex;align-items:center;gap:6px;justify-content:center}
.stp-b{width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:12px;border:1px solid var(--ibr);background:var(--ib);color:var(--tx);font-size:24px;font-weight:700;cursor:pointer;user-select:none}
.stp-b:active{background:var(--cb);transform:scale(.95)}.stp-b.dis{color:var(--dm)}
.stp-v{min-width:90px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#fff;border:2px solid var(--pr);font-size:22px;font-weight:800;color:var(--pr)}
.stp-v span{font-size:11px;color:var(--mu);margin-left:3px;font-weight:500}
.pls{display:flex;align-items:center;gap:3px;padding:4px 0;justify-content:center}
.pl{height:28px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff}
.pl-10{background:var(--p10);width:26px}.pl-5{background:var(--p5);width:22px}.pl-2{background:var(--p25);width:18px}.pl-1{background:var(--p1);width:14px}
.btn{padding:16px 24px;font-size:16px;font-weight:700;border:none;border-radius:12px;cursor:pointer;width:100%;display:block;transition:.15s}
.btn:active{transform:scale(.98);opacity:.9}
.btn-pr{background:var(--pr);color:#fff;box-shadow:0 2px 8px rgba(74,111,165,.25)}
.btn-wh{background:#fff;color:var(--tx);border:1px solid var(--cb);box-shadow:var(--sh)}
.btn-rd{background:var(--rdl);color:var(--rd);border:1px solid #e5bfbf}
.btn-sm{padding:8px 14px;font-size:11px;width:auto;display:inline-block;border-radius:8px;font-weight:600}
.btn-ghost{background:0;border:none;color:var(--pr);font-weight:600;padding:8px 12px;font-size:13px}
.ch{display:inline-block;font-size:10px;padding:3px 8px;border-radius:6px;background:var(--ib);color:var(--mu);margin:0 3px 4px 0;font-weight:500}
.timer-bar{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#fff;border-top:2px solid var(--pr);padding:12px 20px calc(12px + var(--sab));z-index:200;display:flex;justify-content:space-between;align-items:center;box-shadow:0 -4px 20px rgba(0,0,0,.1)}
.timer-bar.done{border-top-color:var(--gr);background:var(--grl)}
.timer-time{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--pr)}
.timer-bar.done .timer-time{color:var(--gr)}
.dots{display:flex;gap:6px;align-items:center;justify-content:center;padding:8px 0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ibr);cursor:pointer;transition:.2s}
.dot.done{background:var(--gr)}.dot.cur{background:var(--pr);transform:scale(1.3);box-shadow:0 0 0 3px rgba(74,111,165,.2)}
.pr-badge{display:inline-block;font-size:10px;font-weight:700;color:var(--am);background:var(--aml);padding:2px 8px;border-radius:5px;margin-left:6px}
.max-badge{display:inline-block;font-size:9px;font-weight:700;color:var(--rd);background:var(--rdl);padding:2px 6px;border-radius:4px;margin-left:4px}
.cue{font-size:12px;color:var(--pr);padding:8px 12px;background:var(--prl);border-radius:8px;margin-bottom:8px;border-left:3px solid var(--pr)}
.fg-bar{height:6px;border-radius:3px;background:var(--ib);overflow:hidden;margin:6px 0}
.fg-fill{height:100%;border-radius:3px;transition:.3s}
.deload-banner{background:var(--aml);border:1px solid #e5d4b8;border-radius:10px;padding:10px 14px;margin-bottom:10px;font-size:12px;color:var(--am)}
.deload-ok{background:var(--grl);border-color:#b8dcc8;color:var(--gr)}
.skip-warn{font-size:11px;color:var(--am);padding:3px 8px;background:var(--aml);border-radius:6px;display:inline-block}
.regress{font-size:11px;color:var(--rd);padding:3px 8px;background:var(--rdl);border-radius:6px;display:inline-block}
.streak-banner{background:var(--aml);border-radius:10px;padding:12px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.streak-num{font-size:28px;font-weight:800;color:var(--am)}
.milestone{background:var(--pul);border:1px solid #d8d0e8;border-radius:10px;padding:8px 14px;margin-bottom:8px;font-size:12px;color:var(--pu)}
svg text{font-family:-apple-system,system-ui,sans-serif}
.hm-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.hm-cell{aspect-ratio:1;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--dm)}
.pr-tbl{width:100%}.pr-tbl td,.pr-tbl th{padding:6px 8px;text-align:left;font-size:11px;border-bottom:1px solid var(--cb)}
.pr-tbl th{color:var(--mu);font-size:9px;text-transform:uppercase;font-weight:600}
.ex-sel{width:100%;padding:12px;font-size:14px;background:var(--ib);border:1px solid var(--ibr);border-radius:10px;color:var(--pr);font-weight:600;outline:none;margin-bottom:12px}
.body-input{width:80px;padding:10px;font-size:16px;background:var(--ib);border:1px solid var(--ibr);border-radius:10px;color:var(--tx);text-align:center;outline:none;font-weight:600}
.body-input:focus{border-color:var(--pr);background:#fff}
.diff-btn{width:48px;height:48px;border-radius:50%;border:2px solid var(--ibr);background:var(--ib);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.diff-btn.sel{border-color:var(--pr);background:var(--prl)}
.cardio-btn{padding:12px;border-radius:10px;border:1px solid var(--ibr);background:var(--ib);color:var(--tx);font-size:12px;font-weight:600;cursor:pointer;text-align:center}
.cardio-btn.sel{border-color:var(--gr);background:var(--grl);color:var(--gr)}
.focus-card{background:#fff;border-radius:16px;padding:20px;margin:0 -4px;box-shadow:var(--shm)}
.focus-name{font-size:20px;font-weight:800;color:var(--tx);text-align:center;margin-bottom:2px}
.focus-meta{font-size:12px;color:var(--mu);text-align:center;margin-bottom:12px}
.focus-nav{display:flex;justify-content:space-between;align-items:center;padding:12px 0;margin-top:8px}
.focus-nav-btn{padding:14px 28px;border-radius:12px;border:1px solid var(--cb);background:#fff;font-size:14px;font-weight:700;color:var(--tx);cursor:pointer;box-shadow:var(--sh)}
.focus-nav-btn:active{background:var(--ib);transform:scale(.97)}
.focus-nav-btn.pr{background:var(--pr);color:#fff;border-color:var(--pr)}
.warmup{background:var(--ib);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:12px;color:var(--mu)}
.warmup-set{display:flex;justify-content:space-between;padding:3px 0}
.summary-card{background:#fff;border-radius:16px;padding:24px;margin-bottom:14px;box-shadow:var(--shm);text-align:center}
.summary-num{font-size:28px;font-weight:800;color:var(--pr)}
.summary-label{font-size:9px;color:var(--mu);text-transform:uppercase;letter-spacing:1px}
.traj{display:flex;gap:3px;align-items:center;justify-content:center;margin-bottom:6px}
.traj-dot{font-size:10px;padding:2px 5px;border-radius:4px;font-weight:600}
.traj-up{color:var(--gr);background:var(--grl)}.traj-same{color:var(--am);background:var(--aml)}.traj-dn{color:var(--rd);background:var(--rdl)}
/* Phase banner */
.phase-banner{background:var(--prl);border:1px solid #c5d4e8;border-radius:10px;padding:10px 14px;margin-bottom:10px;font-size:12px;color:var(--pr);display:flex;justify-content:space-between;align-items:center}
.phase-bar{height:4px;border-radius:2px;background:var(--ib);overflow:hidden;flex:1;margin-left:12px}
.phase-fill{height:100%;border-radius:2px;background:var(--pr)}
/* Warmup checklist */
.wu-check{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--cb);cursor:pointer}
.wu-box{width:28px;height:28px;border-radius:8px;border:2px solid var(--ibr);background:var(--ib);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.wu-box.checked{background:var(--grl);border-color:var(--gr);color:var(--gr)}
/* Discomfort */
.disc-row{display:flex;gap:6px;justify-content:center;margin-top:8px}
.disc-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--ibr);background:var(--ib);font-size:11px;font-weight:600;cursor:pointer;color:var(--mu)}
.disc-btn.sel-none{border-color:var(--gr);background:var(--grl);color:var(--gr)}
.disc-btn.sel-mild{border-color:var(--am);background:var(--aml);color:var(--am)}
.disc-btn.sel-mod{border-color:var(--rd);background:var(--rdl);color:var(--rd)}
.disc-joints{display:flex;gap:4px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.disc-joint{padding:4px 10px;border-radius:6px;border:1px solid var(--ibr);background:var(--ib);font-size:10px;font-weight:600;cursor:pointer;color:var(--mu)}
.disc-joint.sel{border-color:var(--rd);background:var(--rdl);color:var(--rd)}
</style>
</head>
<body>
<div class="hdr"><h1>RACK-FREE TRACKER</h1><small>11kg bar · Hypermobility-adapted · Tempo controlled</small></div>
<div class="nav" id="nav"></div>
<div id="app"></div>
<div id="timer-root"></div>
<script>
// ═══════════════ EQUIPMENT ═══════════════
const BAR=11,MAX_BB=80,PL=[{w:10,q:4},{w:5,q:4},{w:2.5,q:2},{w:1,q:4}];
const VW=(()=>{const s=new Set();for(let a=0;a<=2;a++)for(let b=0;b<=2;b++)for(let c=0;c<=1;c++)for(let d=0;d<=2;d++)s.add(BAR+2*(a*10+b*5+c*2.5+d*1));return[...s].sort((a,b)=>a-b)})();
function perSide(t){let r=(t-BAR)/2;if(r<0)return null;const o=[];for(const p of PL){const m=p.q/2;let c=Math.min(Math.floor(r/p.w),m);if(c>0){o.push({w:p.w,c});r-=c*p.w}}return Math.abs(r)<.01?o:null}
function fmtPl(t){if(t<=BAR)return'Bar only';const p=perSide(t);return p?p.map(x=>`${x.c}×${x.w%1?x.w:x.w|0}kg`).join(' + '):'—'}
function nxUp(c){for(const w of VW)if(w>c)return w;return c}
function nxDn(c){for(let i=VW.length-1;i>=0;i--)if(VW[i]<c)return VW[i];return c}
function snapW(t){let b=VW[0];for(const w of VW)if(Math.abs(w-t)<Math.abs(b-t))b=w;return b}
function plateH(t){if(!t||t<=BAR)return'';const ps=perSide(t);if(!ps||!ps.length)return'';let h='<div class="pls">';for(const p of ps)for(let i=0;i<p.c;i++){const c=p.w>=10?'pl-10':p.w>=5?'pl-5':p.w>=2.5?'pl-2':'pl-1';h+=`<div class="pl ${c}">${p.w%1?p.w:p.w|0}</div>`}h+=`</div>`;return h}

// ═══════════════ PROGRAM — Phase-aware rep ranges ═══════════════
const PHASES={1:{name:'Linear',wk:8,desc:'Build strength. Add weight with confirmation sessions.',
  adj:{deadlift:{rp:'5',tg:5},zercher_b:{rp:'5-6',tg:6},ohp:{rp:'5-7',tg:7},floor_press:{rp:'8-10',tg:10},zercher_a:{rp:'6-8',tg:8},bb_row:{rp:'8-10',tg:10},rdl:{rp:'8-10',tg:10}}},
2:{name:'Hypertrophy',wk:8,desc:'Higher reps, more volume. Weight drops ~15%.',
  adj:{deadlift:{rp:'8',tg:8},zercher_b:{rp:'8',tg:8},ohp:{rp:'8-10',tg:10},floor_press:{rp:'10-12',tg:12},zercher_a:{rp:'8-10',tg:10},bb_row:{rp:'10-12',tg:12},rdl:{rp:'10-12',tg:12}}},
3:{name:'Strength',wk:8,desc:'Return to lower reps at higher weights.',
  adj:{deadlift:{rp:'3-5',tg:5},zercher_b:{rp:'4-5',tg:5},ohp:{rp:'5-6',tg:6},floor_press:{rp:'6-8',tg:8},zercher_a:{rp:'5-6',tg:6},bb_row:{rp:'6-8',tg:8},rdl:{rp:'6-8',tg:8}}}};

const BASE_PR={A:[
{id:'deadlift',nm:'Deadlift',s:3,rp:'5',rst:'3:00',rir:'2',tp:'bb',rl:'Confirm → ↑ weight',tg:5,rstS:180,tempo:'3-1-2-0',isoWU:'Mid-pull hold 2×10s'},
{id:'pullup_a',nm:'Pull-ups (Wide)',s:4,rp:'4-8',rst:'2:30',rir:'1-2',tp:'band',rl:'4×8 → thinner band',tg:8,rstS:150,tempo:'3-1-2-1'},
{id:'floor_press',nm:'Floor Press',s:3,rp:'8-10',rst:'2:00',rir:'2',tp:'bb',rl:'Confirm → ↑ weight',tg:10,rstS:120,tempo:'3-1-2-0'},
{id:'zercher_a',nm:'Zercher Squat',s:3,rp:'6-8',rst:'2:00',rir:'2',tp:'bb',rl:'Confirm → ↑ weight',tg:8,rstS:120,tempo:'3-1-2-0'},
{id:'face_pull',nm:'Face Pull',s:3,rp:'15-20',rst:'1:00',rir:'2-3',tp:'band',rl:'3×20 → heavier band',tg:20,rstS:60,tempo:'2-1-2-1'},
{id:'leg_raise',nm:'Floor Leg Raise',s:3,rp:'10-15',rst:'1:00',rir:'2',tp:'bw',rl:'+reps → +weight → slow ecc',tg:15,rstS:60,tempo:'2-0-2-0'},
{id:'pull_aparts',nm:'Band Pull-Aparts',s:3,rp:'15',rst:'0:45',rir:'—',tp:'band',rl:'Quality reps > more reps',tg:15,rstS:45,tempo:'2-1-2-0'}],
B:[
{id:'zercher_b',nm:'Zercher Squat (Heavy)',s:4,rp:'5-6',rst:'3:30',rir:'1-2',tp:'bb',rl:'Confirm → ↑ weight',tg:6,rstS:210,tempo:'3-1-2-0',isoWU:'Zercher hold at 90° 2×10s'},
{id:'ohp',nm:'Barbell OHP',s:3,rp:'5-7',rst:'2:30',rir:'1-2',tp:'bb',rl:'Confirm → ↑ weight (slow!)',tg:7,rstS:150,tempo:'3-1-2-0'},
{id:'dips',nm:'Dips',s:4,rp:'4-8',rst:'2:30',rir:'1-2',tp:'band',rl:'4×8 → thinner band',tg:8,rstS:150,tempo:'3-1-2-1'},
{id:'bb_row',nm:'Barbell Row',s:4,rp:'8-10',rst:'2:00',rir:'2',tp:'bb',rl:'Confirm → ↑ weight',tg:10,rstS:120,tempo:'3-1-2-0'},
{id:'kb_swing',nm:'KB Swing',s:3,rp:'12-15',rst:'1:30',rir:'2-3',tp:'kb',rl:'20→32kg→single-arm',tg:15,rstS:90,tempo:'—'},
{id:'dead_bugs',nm:'Dead Bugs',s:3,rp:'8/side',rst:'1:00',rir:'—',tp:'bw',rl:'Slow. Press back into floor.',tg:8,rstS:60,tempo:'3-0-3-1'}],
C:[
{id:'rdl',nm:'Romanian DL',s:3,rp:'8-10',rst:'2:00',rir:'2',tp:'bb',rl:'Confirm → ↑ weight',tg:10,rstS:120,tempo:'3-1-2-0'},
{id:'split_squat',nm:'Split Squat',s:3,rp:'10/leg',rst:'1:30',rir:'2',tp:'bw',rl:'BW→20kg→30kg→Zercher',tg:10,rstS:90,tempo:'3-0-2-0'},
{id:'pushups',nm:'Push-ups (Bar Grip + Band)',s:4,rp:'8-15',rst:'1:30',rir:'1-2',tp:'bw',rl:'Chest to bar level. Band off to finish.',tg:15,rstS:90,tempo:'3-1-2-1'},
{id:'pullup_c',nm:'Pull-ups (Volume)',s:3,rp:'6-10',rst:'2:00',rir:'2-3',tp:'band',rl:'One band easier than Day A',tg:10,rstS:120,tempo:'3-1-2-1'},
{id:'kb_press',nm:'KB Press',s:3,rp:'10/arm',rst:'1:00',rir:'2',tp:'kb',rl:'↑ KB or reps',tg:10,rstS:60,tempo:'2-1-2-1'},
{id:'carry',nm:'Loaded Carry',s:3,rp:'40m',rst:'1:30',rir:'—',tp:'carry',rl:'↑ load or distance',tg:1,rstS:90,tempo:'—'},
{id:'ext_rot',nm:'Banded External Rotations',s:2,rp:'15/side',rst:'0:45',rir:'—',tp:'band',rl:'Rotator cuff. Light band.',tg:15,rstS:45,tempo:'2-1-2-1'},
{id:'arms',nm:'Arms (Curl/Ext)',s:2,rp:'12-15',rst:'1:00',rir:'2',tp:'kb',rl:'+reps → +weight. Soft lockout.',tg:15,rstS:60,tempo:'2-1-2-0'}],
D:[
{id:'mace_360',nm:'360° Swing',s:5,rp:'8/side',rst:'1:30',rir:'2',tp:'mace',rl:'+reps → heavier',tg:8,rstS:90,tempo:'controlled'},
{id:'mace_grave',nm:'Gravedigger',s:4,rp:'8/side',rst:'1:30',rir:'2',tp:'mace',rl:'+reps → heavier',tg:8,rstS:90,tempo:'controlled'},
{id:'mace_barb',nm:'Barbarian Squat',s:3,rp:'10',rst:'1:30',rir:'2',tp:'mace',rl:'+reps → heavier → pause',tg:10,rstS:90,tempo:'3-1-2-0'},

function svgLine(data,W,H,color,label){

const pad={t:22,r:10,b:28,l:36},w=W-pad.l-pad.r,h=H-pad.t-pad.b;
const vals=data.map(d=>d.v),mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1;
const pts=data.map((d,i)=>({x:pad.l+(i/(data.length-1))*w,y:pad.t+h-((d.v-mn)/rng)*h,...d}));
let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">`;
for(let i=0;i<=3;i++){const y=pad.t+(h/3)*i,v=Math.round(mx-((mx-mn)/3)*i);
s+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#e2e8f0" stroke-width="1"/><text x="${pad.l-4}" y="${y+3}" text-anchor="end" fill="#8594a7" font-size="9">${v}</text>`}
s+=`<polyline points="${pts.map(p=>`${p.x},${p.y}`).join(' ')}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
for(const p of pts)s+=`<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="${color}" stroke="#fff" stroke-width="2"/>`;
if(data.length<=8)for(const p of pts)s+=`<text x="${p.x}" y="${H-4}" text-anchor="middle" fill="#8594a7" font-size="8">${p.l}</text>`;
s+=`<text x="${W/2}" y="14" text-anchor="middle" fill="${color}" font-size="11" font-weight="600">${label}</text></svg>`;return s}

function getFatigue(){const now=new Date(),scores=[];
for(let i=0;i<7;i++){const d=new Date(now);d.setDate(d.getDate()-i);const ds=d.toISOString().split('T')[0];
D.sessions.filter(s=>s.date===ds).forEach(s=>{let vol=0;s.ex.forEach(e=>{const vr=e.reps.filter(r=>r>0);vol+=(e.wt||0)*vr.reduce((a,b)=>a+b,0)});scores.push({vol,diff:s.difficulty||3})});
D.cardioLog.filter(c=>c.date===ds).forEach(c=>scores.push({vol:c.duration*(c.intensity==='hard'?30:20),diff:3}))}
if(!scores.length)return{score:0,label:'Fresh',color:'var(--gr)'};
const f=scores.length,ad=scores.reduce((a,b)=>a+b.diff,0)/f,tv=scores.reduce((a,b)=>a+b.vol,0);
const sc=Math.round(Math.min(10,f*1.1+ad*.8+tv/2500)*10)/10;
if(sc<=3)return{score:sc,label:'Fresh',color:'var(--gr)'};if(sc<=5)return{score:sc,label:'Ready',color:'var(--pr)'};

for(let i=0;i<off;i++)h+=`<div class="hm-cell"></div>`;
for(const d of hm){let bg='var(--ib)';
if(d.isC)bg='rgba(45,138,110,.15)';else if(d.day==='A')bg='rgba(74,111,165,.3)';else if(d.day==='B')bg='rgba(59,130,196,.3)';
else if(d.day==='C')bg='rgba(45,138,110,.3)';else if(d.day==='D')bg='rgba(184,134,45,.3)';
h+=`<div class="hm-cell" style="background:${bg}">${d.d===1?d.d:''}</div>`}
h+=`</div></div>`;

// PRs
const allPrs=[];for(const ex of ALL_EX){const pr=getPRs(ex.id);if(pr.bestWt||pr.bestVol)allPrs.push({nm:ex.nm,...pr})}
if(allPrs.length){h+=`<div class="lb" style="margin-top:12px;margin-bottom:6px">All-Time PRs</div>
<div class="cd" style="overflow-x:auto"><table class="pr-tbl"><tr><th>Exercise</th><th>Best</th><th>E1RM</th></tr>`;
for(const p of allPrs)h+=`<tr><td style="font-weight:600">${esc(p.nm)}</td><td style="color:var(--pr)">${p.bestWt?p.bestWt+'kg':'—'}</td>
<td style="color:var(--pu)">${p.bestE1RM?p.bestE1RM+'kg':'—'}</td></tr>`;
h+=`</table></div>`}
h+=`</div>`;el.innerHTML=h}

// ─── BODY ────────────────────────────────────
function rBody(el){
let h=`<div class="sec"><div class="lb" style="margin-bottom:10px">Body Tracking</div>
<div class="cd"><div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px">
<div><div class="lb">Weight (kg)</div><input type="number" step="0.1" class="body-input" id="bw" placeholder="—" inputmode="decimal"></div>
<div><div class="lb">Waist (cm)</div><input type="number" step="0.5" class="body-input" id="bwa" placeholder="—" inputmode="decimal"></div>
<div><div class="lb">Arms (cm)</div><input type="number" step="0.5" class="body-input" id="bar" placeholder="—" inputmode="decimal"></div></div>
<button class="btn btn-pr" style="padding:12px" onclick="saveBod()">Log</button></div>`;
const bD=D.bodyLog.filter(b=>b.weight).map(b=>({v:b.weight,l:new Date(b.date+'T00:00:00').toLocaleDateString('en-NZ',{day:'numeric',month:'short'})}));
h+=`<div class="cd">${svgLine(bD,360,170,'#4a6fa5','Bodyweight (kg)')}</div>`;
if(D.bodyLog.length){h+=`<div class="lb" style="margin-top:8px;margin-bottom:6px">History</div>`;
for(const b of[...D.bodyLog].reverse().slice(0,6))
h+=`<div class="cd" style="padding:8px 14px"><div style="display:flex;justify-content:space-between">
<span style="font-size:12px">${b.weight?b.weight+'kg':''} ${b.waist?'W:'+b.waist:''} ${b.arms?'A:'+b.arms:''}</span>
<span class="dm">${fmtD(b.date)}</span></div></div>`}
h+=`</div>`;el.innerHTML=h}
window.saveBod=function(){const wt=parseFloat(document.getElementById('bw')?.value)||null,wa=parseFloat(document.getElementById('bwa')?.value)||null,ar=parseFloat(document.getElementById('bar')?.value)||null;
if(!wt&&!wa&&!ar){alert('Enter at least one');return}D.bodyLog.push({date:today(),weight:wt,waist:wa,arms:ar});save();render()}

// ─── HISTORY ─────────────────────────────────
function rHist(el){const ss=[...D.sessions].reverse();
let h=`<div class="sec"><div class="lb" style="margin-bottom:10px">All Sessions (${ss.length})</div>`;
for(const s of ss){h+=`<div class="cd" style="padding:10px 14px;cursor:pointer" onclick="EXP=EXP==='${s.id}'?null:'${s.id}';render()">
<div style="display:flex;justify-content:space-between;align-items:center">
<div style="display:flex;align-items:center;gap:8px"><span class="bg bg-${s.day.toLowerCase()}">Day ${s.day}</span>
<span class="mu" style="font-size:11px">${fmtD(s.date)}</span>
${s.difficulty?`<span style="font-size:11px">${['😌','🙂','💪','😤','🔥'][s.difficulty-1]}</span>`:''}</div>
<span class="dm">${s.duration?s.duration+'m':''}</span></div>`;
if(EXP===s.id){h+=`<div style="margin-top:8px">`;for(const e of s.ex){const def=ALL_EX.find(p=>p.id===e.id);
h+=`<div style="padding:5px 0;border-top:1px solid var(--cb)"><div style="font-size:12px;font-weight:600">${esc(def?.nm||e.id)}</div>
<div class="mu" style="font-size:11px">${e.wt?e.wt+'kg':''}${e.band?' '+e.band:''} [${e.reps.join(',')}]${e.notes?' — '+esc(e.notes):''}</div>`;
if(e.wt&&e.wt>BAR)h+=plateH(e.wt);h+=`</div>`}
h+=`<button class="btn-sm btn-rd" style="margin-top:6px" onclick="event.stopPropagation();delS('${s.id}')">${DEL_ARMED===s.id?'Tap again to delete':'Delete'}</button></div>`}
h+=`</div>`}h+=`</div>`;el.innerHTML=h}
let DEL_ARMED=null;
function delS(id){if(DEL_ARMED===id){D.sessions=D.sessions.filter(s=>s.id!==id);DEL_ARMED=null;
if(D.sessions.length){const l=D.sessions[D.sessions.length-1].day;D.nextDay={A:'B',B:'C',C:'A'}[l]||'A'}else D.nextDay='A';save();render()}
else{DEL_ARMED=id;setTimeout(()=>{DEL_ARMED=null;render()},3000);render()}}

// ─── PLATES ──────────────────────────────────
function rPlates(el){let h=`<div class="sec"><div class="lb" style="margin-bottom:10px">All Valid Weights (${VW.length})</div>`;
let prev=null;for(const w of VW){const j=prev!==null?`+${w-prev}kg`:'';
h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 12px;border-radius:8px;margin-bottom:2px;${VW.indexOf(w)%2?'':'background:var(--cd)'}">
<div><span style="font-size:15px;font-weight:700">${w}</span><span class="dm"> kg</span></div>
<div style="text-align:right"><div style="font-size:10px;color:var(--mu)">${esc(fmtPl(w))}</div>
${j?`<div style="font-size:9px;color:var(--gr)">${j}</div>`:''}</div></div>`;prev=w}
h+=`</div>`;el.innerHTML=h}

// ─── SETTINGS ────────────────────────────────
function rSet(el){const sz=(new Blob([JSON.stringify(D)])).size;const phi=getPhaseInfo();
let h=`<div class="sec">
<div class="lb" style="margin-bottom:6px">Data</div>
<div class="cd"><div style="font-size:12px;line-height:1.8">
Sessions: ${D.sessions.length} · Cardio: ${D.cardioLog.length} · Body: ${D.bodyLog.length}<br>
Phase ${phi.phase}: ${phi.name} (Wk ${phi.wk}/${phi.maxWk}) · ${(sz/1024).toFixed(1)}KB<br>
Cues: ${Object.keys(D.cues).length} · Discomfort entries: ${D.discomfort.length}</div></div>
<button class="btn btn-wh" style="margin-bottom:8px" onclick="go('plates')">📐 Plate Reference</button>
<div class="lb" style="margin-top:10px;margin-bottom:6px">Phase Control</div>
<div class="cd"><div style="font-size:12px;margin-bottom:8px">Current: <strong>Phase ${phi.phase} — ${phi.name}</strong> (Week ${phi.wk}/${phi.maxWk})</div>
<div style="display:flex;gap:6px">`;
for(let i=1;i<=3;i++)h+=`<button class="btn-sm ${D.phase===i?'btn-pr':'btn-wh'}" onclick="D.phase=${i};D.phaseStart=today();D.confirmed={};save();render()">P${i}: ${PHASES[i].name}</button>`;
h+=`</div></div>
<div class="lb" style="margin-top:10px;margin-bottom:6px">Backup</div>
<button class="btn btn-wh" style="margin-bottom:6px" onclick="expD()">↓ Export</button>
<label class="btn btn-wh" style="text-align:center;cursor:pointer;display:block;margin-bottom:6px">↑ Import
<input type="file" accept=".json" style="display:none" onchange="impD(event)"></label>
<div class="lb" style="margin-top:10px;margin-bottom:6px">Cues</div>`;
const ck=Object.keys(D.cues);if(ck.length){for(const k of ck){const ex=ALL_EX.find(e=>e.id===k);
h+=`<div class="cd" style="padding:8px 14px;display:flex;justify-content:space-between;align-items:center">
<div><span style="font-size:12px;font-weight:600">${esc(ex?.nm||k)}</span> · <span style="color:var(--pr);font-size:11px">${esc(D.cues[k])}</span></div>
<button class="btn-sm btn-rd" onclick="delete D.cues['${k}'];save();render()">✕</button></div>`}}
else h+=`<div class="dm">No cues yet</div>`;
h+=`<div class="lb" style="margin-top:10px;margin-bottom:6px">Bands (most → least help)</div>
<div class="cd" style="font-size:11px;color:var(--mu);line-height:2">${BANDS.join(' → ')}<div class="dm">Right = harder. Blue→Green is progress.</div></div>
<div class="lb" style="margin-top:10px;margin-bottom:6px">Danger Zone</div>
<button class="btn btn-rd" id="resetBtn" onclick="if(this.dataset.armed==='1'){D=structuredClone(SEED);save();this.dataset.armed='0';go('home')}else{this.dataset.armed='1';this.textContent='Tap again to confirm reset';setTimeout(()=>{this.dataset.armed='0';this.textContent='Reset All Data'},3000)}">Reset All Data</button>
</div>`;el.innerHTML=h}

function expD(){const b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`workout-${today()}.json`;a.click()}
function impD(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();
r.onload=e=>{try{const d=JSON.parse(e.target.result);if(!d.sessions)throw 0;
if(!d.cues)d.cues={};if(!d.bodyLog)d.bodyLog=[];if(!d.cardioLog)d.cardioLog=[];
if(!d.phase)d.phase=1;if(!d.phaseStart)d.phaseStart=d.sessions[0]?.date||today();
if(!d.confirmed)d.confirmed={};if(!d.discomfort)d.discomfort=[];
D=d;save();render()}catch(e){alert('Invalid')}};
r.readAsText(f);ev.target.value=''}

// ═══════════════ INIT ═══════════════
load();render();
if('serviceWorker'in navigator){const c=`const C='rft-v8';self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(['./','/index.html'])));self.skipWaiting()});self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k)))));return self.clients.claim()});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>new Response('Offline'))))});`;
navigator.serviceWorker.register(URL.createObjectURL(new Blob([c],{type:'application/javascript'}))).catch(()=>{})}
const mf={name:'Rack-Free Tracker',short_name:'Tracker',start_url:'.',display:'standalone',background_color:'#f4f6f8',theme_color:'#f4f6f8',
icons:[{src:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23f4f6f8' width='100' height='100' rx='22'/><text x='50' y='68' text-anchor='middle' font-size='55'>🏋️</text></svg>",sizes:'any',type:'image/svg+xml'}]};
const ml=document.createElement('link');ml.rel='manifest';ml.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/json'}));document.head.appendChild(ml);
</script>
</body>
</html>
