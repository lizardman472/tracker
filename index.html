<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tracker">
<meta name="theme-color" content="#0d0f14">
<meta name="mobile-web-app-capable" content="yes">
<title>Rack-Free Tracker v12</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@600;700;800;900&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
/* Bold athletic dark — gym-at-night, volt accent */
--bg:#0c0e13;--bg2:#0f1219;--cd:#161a23;--cd2:#1b2029;--cb:#252b38;--ib:#1a1f29;--ibr:#2c3340;
--tx:#f2f5fa;--mu:#808aa0;--dm:#5a6378;
/* volt-green signature accent */
--pr:#c4f82a;--prl:#1f2a10;--prg:#a8e000;
--gr:#3ddc97;--grl:#11241d;--am:#ffb13d;--aml:#2a2010;--rd:#ff5d5d;--rdl:#2a1414;
--pu:#9d8cff;--pul:#1c1830;--bl:#48b6ff;--bll:#0f2230;
--p10:#ff5d5d;--p5:#48b6ff;--p25:#3ddc97;--p1:#808aa0;
--sh:0 1px 3px rgba(0,0,0,.4);--shm:0 8px 28px rgba(0,0,0,.55);--sab:env(safe-area-inset-bottom,0px);
--rad:16px;--rad-sm:10px;
--disp:'Archivo Expanded',-apple-system,system-ui,sans-serif;
--body:'Archivo',-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:var(--body);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
/* atmospheric backdrop: subtle volt glow top, deep fade */
body{max-width:480px;margin:0 auto;padding-bottom:calc(28px + var(--sab));position:relative;
background:radial-gradient(120% 60% at 50% -10%,rgba(196,248,42,.07),transparent 60%),var(--bg)}
input,select,button,textarea{font-family:inherit}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
::selection{background:var(--pr);color:#0c0e13}

/* Layout */
.hdr{padding:16px 18px 10px;background:rgba(12,14,19,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--cb);position:sticky;top:0;z-index:100}
.hdr h1{font-family:var(--disp);font-size:15px;font-weight:900;color:var(--tx);letter-spacing:1.5px;text-transform:uppercase}
.hdr h1::before{content:'';display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--pr);margin-right:8px;vertical-align:middle;box-shadow:0 0 10px var(--pr)}
.nav{display:flex;background:rgba(12,14,19,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);position:sticky;top:48px;z-index:99;border-bottom:1px solid var(--cb)}
.nav button{flex:1;padding:12px 0;font-family:var(--disp);font-size:10px;font-weight:700;border:none;border-bottom:2px solid transparent;background:0;color:var(--mu);cursor:pointer;letter-spacing:1px;text-transform:uppercase;transition:color .2s}
.nav button.a{color:var(--pr);border-bottom-color:var(--pr)}
.sec{padding:14px 14px;animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Cards */
.cd{background:var(--cd);border-radius:var(--rad);padding:14px 16px;margin-bottom:10px;border:1px solid var(--cb);box-shadow:var(--sh)}

/* Type */
.lb{font-family:var(--disp);font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;font-weight:700}
.mu{font-size:12px;color:var(--mu)}.dm{font-size:11px;color:var(--dm)}

/* Badges */
.bg{display:inline-block;padding:3px 9px;border-radius:6px;font-family:var(--disp);font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase}
.bg-a{background:var(--prl);color:var(--pr)}.bg-b{background:var(--bll);color:var(--bl)}.bg-c{background:var(--grl);color:var(--gr)}.bg-d{background:var(--aml);color:var(--am)}
.sg{font-family:var(--disp);font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;display:inline-block;letter-spacing:.3px}
.sg-up{color:#0c0e13;background:var(--pr)}.sg-st{color:var(--am);background:var(--aml)}.sg-nw{color:var(--pr);background:var(--prl)}
.sg-dn{color:var(--rd);background:var(--rdl)}.sg-cf{color:var(--bl);background:var(--bll)}
.wk-1{background:var(--prl);color:var(--pr)}.wk-2{background:var(--pul);color:var(--pu)}
.regress{font-size:10px;color:var(--rd);padding:3px 7px;background:var(--rdl);border-radius:6px;display:inline-block;font-weight:600}
.pr-badge{font-family:var(--disp);font-size:10px;font-weight:800;color:#0c0e13;background:var(--am);padding:3px 9px;border-radius:6px;letter-spacing:.5px}
.max-badge{font-size:9px;font-weight:800;color:var(--rd);background:var(--rdl);padding:2px 7px;border-radius:5px;margin-left:4px}
.cue{font-size:12px;color:var(--tx);padding:9px 12px;background:var(--prl);border-radius:var(--rad-sm);margin:6px 0;border-left:3px solid var(--pr)}

/* Inputs */
.ri{width:54px;height:54px;font-family:var(--disp);font-size:21px;font-weight:800;background:var(--ib);border:2px solid var(--ibr);border-radius:var(--rad-sm);color:var(--tx);text-align:center;outline:none;transition:.15s;font-variant-numeric:tabular-nums}
.ri:focus{border-color:var(--pr);background:var(--cd2);box-shadow:0 0 0 3px rgba(196,248,42,.18)}
.ri.pf{color:var(--dm)}.ri.done{border-color:var(--gr);background:var(--grl);color:var(--gr)}
.ni{width:100%;padding:9px 11px;font-size:12px;background:var(--ib);border:1px solid var(--ibr);border-radius:var(--rad-sm);color:var(--tx);outline:none}
.ni:focus{border-color:var(--pr);color:var(--tx);background:var(--cd2)}
.bs{padding:9px 11px;font-size:12px;background:var(--ib);border:1px solid var(--ibr);border-radius:var(--rad-sm);color:var(--tx);outline:none;width:100%}
.body-input{width:84px;padding:11px;font-family:var(--disp);font-size:18px;background:var(--ib);border:1px solid var(--ibr);border-radius:var(--rad-sm);color:var(--tx);text-align:center;outline:none;font-weight:800;font-variant-numeric:tabular-nums}
.body-input:focus{border-color:var(--pr);background:var(--cd2)}
.sess-note{width:100%;padding:9px 11px;font-size:12px;background:var(--ib);border:1px solid var(--ibr);border-radius:var(--rad-sm);color:var(--tx);outline:none;resize:none;min-height:38px;font-family:inherit}
.sess-note:focus{border-color:var(--pr);background:var(--cd2)}

/* Weight stepper */
.stp{display:flex;align-items:center;gap:8px;justify-content:center}
.stp-b{width:50px;height:50px;display:flex;align-items:center;justify-content:center;border-radius:var(--rad-sm);border:1px solid var(--ibr);background:var(--ib);color:var(--tx);font-size:24px;font-weight:700;cursor:pointer;user-select:none;transition:.12s}
.stp-b:active{background:var(--pr);color:#0c0e13;transform:scale(.92)}.stp-b.dis{color:var(--dm)}
.stp-v{min-width:88px;height:50px;display:flex;align-items:center;justify-content:center;border-radius:var(--rad-sm);background:var(--ib);border:2px solid var(--pr);font-family:var(--disp);font-size:21px;font-weight:800;color:var(--pr);font-variant-numeric:tabular-nums;box-shadow:0 0 16px rgba(196,248,42,.12)}
.stp-v span{font-size:10px;color:var(--mu);margin-left:3px;font-weight:500;font-family:var(--body)}
/* Dominant weight readout for the active barbell card */
.stp-big{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:6px}
.stp-hero{font-family:var(--disp);font-size:58px;font-weight:900;color:var(--pr);font-variant-numeric:tabular-nums;line-height:.9;letter-spacing:-2px;text-shadow:0 0 30px rgba(196,248,42,.35);position:relative}
.stp-hero sub{font-family:var(--body);font-size:15px;font-weight:600;color:var(--mu);vertical-align:baseline;margin-left:4px;text-shadow:none;letter-spacing:0}
.stp-row{display:flex;align-items:center;gap:18px}
.stp-big .stp-b{width:56px;height:56px;font-size:28px;border-radius:50%}
.pls{display:flex;align-items:center;gap:3px;padding:3px 0;justify-content:center}
.pl{height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#0c0e13}
.pl-10{background:var(--p10);width:24px}.pl-5{background:var(--p5);width:20px}.pl-2{background:var(--p25);width:17px}.pl-1{background:var(--p1);width:13px}

/* Buttons */
.btn{padding:16px 20px;font-family:var(--disp);font-size:14px;font-weight:800;border:none;border-radius:var(--rad-sm);cursor:pointer;width:100%;display:block;transition:.15s;letter-spacing:1px;text-transform:uppercase}
.btn:active{transform:scale(.97);opacity:.92}
.btn-pr{background:var(--pr);color:#0c0e13;box-shadow:0 4px 20px rgba(196,248,42,.28)}
.btn-wh{background:var(--cd2);color:var(--tx);border:1px solid var(--cb)}
.btn-rd{background:var(--rdl);color:var(--rd);border:1px solid #4a2020}
.btn-sm{padding:7px 13px;font-size:10px;width:auto;display:inline-block;border-radius:8px;font-weight:700;letter-spacing:.5px}
.btn-ghost{background:0;border:none;color:var(--pr);font-weight:700;padding:6px 10px;font-size:12px;font-family:var(--body)}

/* Bars */
.fg-bar{height:6px;border-radius:4px;background:var(--ib);overflow:hidden;margin:5px 0}
.fg-fill{height:100%;border-radius:4px;transition:width .5s cubic-bezier(.34,1.56,.64,1)}
.prog-strip{display:flex;gap:3px;margin:7px 0}
.prog-seg{flex:1;height:6px;border-radius:4px;background:var(--ib);transition:.3s}
.prog-seg.pg-done{background:var(--pr);box-shadow:0 0 8px rgba(196,248,42,.4)}.prog-seg.pg-cur{background:var(--bl)}

/* Timer — compact floating pill */
.timer-pill{position:fixed;bottom:18px;right:16px;max-width:170px;background:var(--cd);border:2px solid var(--pr);border-radius:40px;padding:9px 15px;z-index:200;display:flex;align-items:center;gap:8px;box-shadow:0 6px 24px rgba(0,0,0,.5),0 0 20px rgba(196,248,42,.15);font-variant-numeric:tabular-nums}
.timer-pill.done{border-color:var(--gr);background:var(--grl);animation:pulse .6s ease 2}
.timer-pill .t-time{font-family:var(--disp);font-size:19px;font-weight:800;color:var(--pr)}
.timer-pill.done .t-time{color:var(--gr)}
.timer-pill .t-x{width:30px;height:30px;border-radius:50%;border:none;background:var(--ib);color:var(--mu);font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.timer-pill .t-x:active{background:var(--cb)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* Banners */
.deload-banner{background:var(--aml);border:1px solid #4a3a18;border-radius:var(--rad-sm);padding:10px 13px;margin-bottom:10px;font-size:12px;color:var(--am)}

/* Workout list */
.ex-row{background:var(--cd);border-radius:var(--rad);padding:12px 14px;margin-bottom:8px;border:1.5px solid var(--cb);cursor:pointer;transition:border-color .2s,background .2s,transform .1s}
.ex-row.cur{border-color:var(--pr);box-shadow:var(--shm),0 0 24px rgba(196,248,42,.1);cursor:default}
.ex-row.done-row{border-color:var(--gr);background:linear-gradient(135deg,var(--grl),var(--cd))}
.ex-row.upcoming{opacity:.45}
.ex-row.upcoming:active{opacity:.65}
.ex-expand{padding:12px 0 2px;margin-top:10px;border-top:1px solid var(--cb)}

/* Set tick */
.set-tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--ibr);background:var(--ib);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;transition:.15s;margin:4px auto 0;color:var(--mu)}
.set-tick.done{background:var(--pr);border-color:var(--pr);color:#0c0e13;animation:tickpop .35s cubic-bezier(.34,1.56,.64,1)}
.set-tick:active{transform:scale(.85)}
@keyframes tickpop{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}

/* Warmup */
.wu-check{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--cb);cursor:pointer}
.wu-box{width:28px;height:28px;border-radius:8px;border:2px solid var(--ibr);background:var(--ib);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:.15s;color:var(--mu)}
.wu-box.checked{background:var(--pr);border-color:var(--pr);color:#0c0e13}

/* Discomfort */
.disc-row{display:flex;gap:5px;justify-content:center;margin-top:7px}
.disc-btn{padding:6px 11px;border-radius:8px;border:1px solid var(--ibr);background:var(--ib);font-size:10px;font-weight:700;cursor:pointer;color:var(--mu)}
.disc-btn.sel-none{border-color:var(--gr);background:var(--grl);color:var(--gr)}
.disc-btn.sel-mild{border-color:var(--am);background:var(--aml);color:var(--am)}
.disc-btn.sel-mod{border-color:var(--rd);background:var(--rdl);color:var(--rd)}
.disc-joints{display:flex;gap:5px;justify-content:center;margin-top:5px;flex-wrap:wrap}
.disc-joint{padding:4px 9px;border-radius:6px;border:1px solid var(--ibr);background:var(--ib);font-size:10px;font-weight:600;cursor:pointer;color:var(--mu)}
.disc-joint.sel{border-color:var(--rd);background:var(--rdl);color:var(--rd)}

/* RPE scale */
.diff-btn{width:46px;height:46px;border-radius:50%;border:2px solid var(--ibr);background:var(--ib);font-family:var(--disp);font-size:18px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;color:var(--tx)}
.diff-btn.sel{border-color:var(--pr);background:var(--prl);color:var(--pr)}

/* Summary */
.summary-card{background:var(--cd);border-radius:var(--rad);padding:22px;margin-bottom:12px;border:1px solid var(--cb);box-shadow:var(--shm);text-align:center}
.summary-num{font-family:var(--disp);font-size:30px;font-weight:900;color:var(--pr);font-variant-numeric:tabular-nums}
.summary-label{font-family:var(--disp);font-size:9px;color:var(--mu);text-transform:uppercase;letter-spacing:1.2px;font-weight:700}

/* Hero start */
.start-hero{background:linear-gradient(135deg,#1a2410,#11160d);border:1px solid #2e3d18;color:#fff;border-radius:var(--rad);padding:22px;text-align:center;margin-bottom:12px;position:relative;overflow:hidden;box-shadow:var(--shm)}
.start-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(80% 100% at 50% 0%,rgba(196,248,42,.18),transparent 70%);pointer-events:none}
.start-hero h2{font-family:var(--disp);font-size:22px;font-weight:900;margin-bottom:4px;letter-spacing:.5px;text-transform:uppercase;position:relative}
.start-hero .meta{font-size:11px;color:var(--mu);margin-bottom:16px;position:relative;letter-spacing:.3px}
.start-hero button{background:var(--pr);color:#0c0e13;border:none;border-radius:var(--rad-sm);padding:14px 40px;font-family:var(--disp);font-size:15px;font-weight:800;cursor:pointer;letter-spacing:1px;text-transform:uppercase;box-shadow:0 4px 20px rgba(196,248,42,.3);position:relative}
.start-hero button:active{transform:scale(.96)}
.dpick{display:flex;gap:6px;justify-content:center;margin-bottom:14px;position:relative}
.dpick button{flex:0 0 auto;min-width:54px;padding:8px 0;border-radius:9px;border:1.5px solid var(--cb);background:rgba(255,255,255,.04);color:var(--mu);font-family:var(--disp);font-size:12px;font-weight:800;letter-spacing:.5px;cursor:pointer;transition:.15s}
.dpick button.on{background:var(--pr);color:#0c0e13;border-color:var(--pr);box-shadow:0 2px 14px rgba(196,248,42,.3)}
.preview-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--cb);font-size:12px}
.preview-row:last-child{border:none}
.prev2{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px solid var(--cb);cursor:pointer;transition:background .15s}
.prev2:last-child{border:none}
.prev2:active{background:var(--ib)}
.prev2-ic{width:30px;height:30px;border-radius:9px;background:var(--ib);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.prev2-load{font-family:var(--disp);font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.prev2-arr{font-family:var(--disp);font-size:13px;font-weight:800;width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.sg-up-txt{color:var(--pr)}.sg-dn-txt{color:var(--rd)}.sg-cf-txt{color:var(--bl)}.sg-nw-txt{color:var(--mu)}.sg-st-txt{color:var(--tx)}

/* Stats */
.ch{display:inline-block;font-size:9px;padding:3px 7px;border-radius:6px;background:var(--ib);color:var(--mu);margin:0 2px 3px 0;font-weight:600}
svg text{font-family:var(--body)}
.hm-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.hm-cell{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--dm)}
.pr-tbl{width:100%}.pr-tbl td,.pr-tbl th{padding:6px 6px;text-align:left;font-size:11px;border-bottom:1px solid var(--cb)}
.pr-tbl th{color:var(--mu);font-size:9px;text-transform:uppercase;font-weight:700;font-family:var(--disp);letter-spacing:.5px}
.ex-sel{width:100%;padding:11px;font-size:13px;background:var(--ib);border:1px solid var(--ibr);border-radius:var(--rad-sm);color:var(--pr);font-weight:700;outline:none;margin-bottom:10px}
.warmup{background:var(--ib);border-radius:var(--rad-sm);padding:9px 11px;margin-bottom:6px;font-size:11px;color:var(--mu)}
.warmup-set{display:flex;justify-content:space-between;padding:2px 0}
.cardio-btn{padding:11px;border-radius:var(--rad-sm);border:1px solid var(--ibr);background:var(--ib);color:var(--tx);font-size:12px;font-weight:600;cursor:pointer;text-align:center}
.cardio-btn.sel{border-color:var(--gr);background:var(--grl);color:var(--gr)}
.phase-banner{background:var(--prl);border:1px solid #2e3d18;border-radius:var(--rad-sm);padding:9px 13px;margin-bottom:10px;font-size:11px;color:var(--pr);display:flex;justify-content:space-between;align-items:center}
.phase-bar{height:4px;border-radius:3px;background:var(--ib);overflow:hidden;flex:1;margin-left:10px}
.phase-fill{height:100%;border-radius:3px;background:var(--pr)}
/* Progress tab: snapshot grid + stat strip */
.snap-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.snap-cell{background:var(--ib);border-radius:var(--rad-sm);padding:11px 8px;text-align:center}
.snap-num{font-family:var(--disp);font-size:22px;font-weight:900;color:var(--pr);font-variant-numeric:tabular-nums;line-height:1}
.snap-num.alt{color:var(--bl)}.snap-num.alt2{color:var(--gr)}
.snap-lbl{font-family:var(--disp);font-size:8px;color:var(--mu);text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin-top:4px}
.estrip{display:flex;gap:8px;margin-bottom:10px}
.estrip-cell{flex:1;background:var(--ib);border-radius:var(--rad-sm);padding:9px 6px;text-align:center}
.estrip-num{font-family:var(--disp);font-size:16px;font-weight:800;color:var(--tx);font-variant-numeric:tabular-nums;line-height:1}
.estrip-lbl{font-size:8px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-top:3px;font-weight:600}

/* PR celebration flash */
@keyframes prflash{0%{transform:scale(.5);opacity:0}40%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
.pr-badge{animation:prflash .5s cubic-bezier(.34,1.56,.64,1)}
</style>
</head>
<body>
<div class="hdr"><h1>RACK-FREE TRACKER</h1></div>
<div class="nav" id="nav"></div>
<div id="app"></div>
<div id="timer-root"></div>
<script>
// ═══════════════ EQUIPMENT ═══════════════
const BAR=11,MAX_BB=80;
// Plate inventory: {w: plate weight kg, q: total count owned (pairs loaded symmetrically)}
// Mains + micro set (pairs of 0.25/0.5/0.75/1kg). q must be even to load evenly.
const PL=[{w:10,q:4},{w:5,q:4},{w:2.5,q:2},{w:1,q:6},{w:0.75,q:2},{w:0.5,q:2},{w:0.25,q:2}];
// Valid barbell weights: enumerate every loadable combo (each plate used 0..floor(q/2) per side, ×2).
const VW=(()=>{
  const perSide=PL.map(p=>({w:p.w,max:Math.floor(p.q/2)}));
  const set=new Set([BAR]);
  // iterative combination across plate types
  let combos=[0];

function getRelatedSuggestion(ex){
  const rel=RELATED_EX[ex.id];

  }
  const relHist=getHist(rel.id,5);
  const relLast=relHist.length?relHist[relHist.length-1]:null;
  // Peer lift has no history — fall back to seed if one is provided
  if(!relLast){
    if(rel.seedWt!=null)return{wt:rel.seedWt,band:'',note:rel.note,relName:'starting load'};
    return null;
  }
  // Band exercises: copy band setting
  if(ex.tp==='band'&&relLast.band){

  }

  }

function getSmartSugg(ex){
const hist=getHist(ex.id,5),last=hist.length?hist[hist.length-1]:null;
if(!last){

  const rs=getRelatedSuggestion(ex);
  if(rs){
    if(rs.wt!=null)return{text:`Try ${rs.wt}kg`,type:'new',wt:rs.wt,traj:[],detail:`Based on ${rs.relName} · ${rs.note}`,regress:''};
    if(rs.band)return{text:`Try ${rs.band}`,type:'new',wt:null,band:rs.band,traj:[],detail:`Based on ${rs.relName} · ${rs.note}`,regress:''};
    return{text:'New — start light',type:'new',wt:null,traj:[],detail:`Based on ${rs.relName} · ${rs.note}`,regress:''};
  }
  return{text:'First time — find your weight',type:'new',wt:null,traj:[],detail:'',regress:''};
}

// Discomfort check — if moderate discomfort in last 2 sessions, auto-hold
const recentDisc=getDiscomfortRecent(ex.id,3);
const modDisc=recentDisc.filter(d=>d.level==='moderate').length;
const mildDisc=recentDisc.filter(d=>d.level==='mild').length;
let discWarn='';
if(modDisc>=2)discWarn='⚠ Repeated moderate discomfort — hold weight';
else if(modDisc>=1)discWarn='⚠ Moderate discomfort last session — consider holding';
else if(mildDisc>=3)discWarn='⚠ Mild discomfort 3 sessions running — monitor closely';

// ─── WEIGHT-BASED (bb, mace, db) — handle null wt fallback for type migrations (e.g., Cossack bw→bb) ───
if(ex.tp==='bb'||ex.tp==='mace'||ex.tp==='db'){
  // Find most recent session with a valid weight; if none, treat as a brand-new exercise
  const lastWithWt=[...hist].reverse().find(h=>h.wt&&Number(h.wt)>0);
  if(!lastWithWt){
    return{text:'First weighted session — find your starting load',type:'new',wt:null,traj:[],detail:'Earlier sessions were bodyweight or unrecorded.',regress:discWarn}}
  // If most recent session had no weight but earlier ones did, use the earlier weight as reference
  if(!last.wt){
    return{text:`→ ${lastWithWt.wt}kg`,type:'stay',wt:lastWithWt.wt,traj:[],detail:`Last weighted: ${lastWithWt.wt}kg on ${lastWithWt.date}`,regress:discWarn}}
}
if((ex.tp==='bb'||ex.tp==='mace'||ex.tp==='db')&&last.wt){
  const mn=getRepMin(ex);
  const atW=hist.filter(h=>h.wt===last.wt);
  const hitTarget=h=>{const v=effectiveReps(ex,h.reps);return v.length>=ex.s&&v.every(r=>r>=ex.tg)};
  const inRange=h=>{const v=effectiveReps(ex,h.reps);return v.length>=ex.s&&v.every(r=>r>=mn)};
  const stalls=atW.filter(h=>!inRange(h)).length;
  const plateauSess=atW.filter(h=>inRange(h)&&!hitTarget(h)).length;
  const hitsAtW=atW.filter(h=>hitTarget(h)).length;

    const ps=effectiveReps(ex,p.reps).reduce((a,b)=>a+b,0),cs=effectiveReps(ex,h.reps).reduce((a,b)=>a+b,0);
    return cs>ps?{s:'↗',c:'up'}:cs<ps?{s:'↘',c:'dn'}:{s:'→',c:'same'}});
  let regress='';
  if(atW.length>=2){const prev=atW[atW.length-2],curr=atW[atW.length-1];
    const pT=effectiveReps(ex,prev.reps).reduce((a,b)=>a+b,0),cT=effectiveReps(ex,curr.reps).reduce((a,b)=>a+b,0);
    if(cT<pT-2)regress=`Reps dropped ${pT}→${cT} at ${last.wt}kg`}
  if(!regress&&hist.length>=2){const prev=hist[hist.length-2];
    if(prev.wt&&last.wt&&last.wt<prev.wt)regress=`Weight dropped ${prev.wt}→${last.wt}kg`;
    else if(prev.wt===last.wt){const pT=effectiveReps(ex,prev.reps).reduce((a,b)=>a+b,0),cT=effectiveReps(ex,last.reps).reduce((a,b)=>a+b,0);
    if(cT<pT-2)regress=`Reps dropped ${pT}→${cT}`}}

  if(modDisc>=2){return{text:`→ ${last.wt}kg (hold)`,type:'stay',wt:last.wt,traj,detail:'Holding due to discomfort trend',regress}}
  // HIT TARGET (single-session double progression). AMRAP signal = reps over target on the last set.
  if(lastHit){
    const isConfirmLift=CONFIRM_LIFTS.has(ex.id);
    // Heavy spinal compounds keep a 1-session confirm brake (joint safety): need 2 sessions at target.
    if(isConfirmLift&&hitsAtW<2){
      return{text:`→ Confirm ${last.wt}kg`,type:'cf',wt:last.wt,traj,detail:`Hit ${ex.s}×${ex.tg}${ex.perSide?'/side':''} — confirm once more (heavy lift), then ↑`,regress}}
    // AMRAP: how many reps over target on the lowest working set drives the jump size.

    if(ex.tp==='bb'){

      const steps=over>=3?2:1;

    return{text:`→ ${last.wt}kg`,type:'stay',wt:last.wt,traj,detail:`Below min. ${stalls}/3 stalls. Push for ${ex.s}×${mn}+${ex.perSide?' /side':''}`,regress}}

  else if(plateauSess>=2)tip=`Building at ~${avgRep}. Push the top set for ${Math.min(avgRep+1,ex.tg)}.`;
  return{text:`→ ${last.wt}kg`,type:'stay',wt:last.wt,traj,detail:tip,regress}}

// ─── CLUB exercises (perSide-aware) ───
if(ex.tp==='club'){
  const traj=hist.map((h,i)=>{if(!i)return{s:'●',c:'same'};const pw=hist[i-1].wt||0,cw=h.wt||0;
    return cw>pw?{s:'↑',c:'up'}:cw<pw?{s:'↓',c:'dn'}:{s:'→',c:'same'}});
  const reps=effectiveReps(ex,last.reps);
  const totalReps=reps.reduce((a,b)=>a+b,0);
  const allHit=reps.length>=ex.s&&reps.slice(0,ex.s).every(r=>r>=ex.tg);
  if(allHit){return{text:`${last.wt||6}kg — smooth? → try ${(last.wt||6)+2}kg`,type:'up',wt:last.wt,traj,detail:`Hit target${ex.perSide?' /side':''}. Progress if shoulder feels smooth.`,regress:discWarn}}
  return{text:`${last.wt||6}kg club`,type:'stay',wt:last.wt,traj,detail:`Focus on smooth form. ${totalReps} eff. reps${ex.perSide?' /side':''}.`,regress:discWarn}}

// ─── BAND exercises (bandMode-aware: assist vs resist) ───
if(ex.tp==='band'){
  const isResist=ex.bandMode==='resist';
  const traj=hist.map((h,i)=>{if(!i)return{s:'●',c:'same'};const pi=BAND_IDX(hist[i-1].band),ci=BAND_IDX(h.band);
    if(isResist){return ci<pi?{s:'↑',c:'up'}:ci>pi?{s:'↓',c:'dn'}:{s:'→',c:'same'}}
    return ci>pi?{s:'↑',c:'up'}:ci<pi?{s:'↓',c:'dn'}:{s:'→',c:'same'}});
  const reps=effectiveReps(ex,last.reps);
  const hitTop=reps.length>=ex.s&&reps.slice(0,ex.s).every(r=>r>=ex.tg);
  let regress=discWarn;if(!regress&&hist.length>=2){const prev=hist[hist.length-2];
    if(BAND_IDX(prev.band)===BAND_IDX(last.band)){const pT=effectiveReps(ex,prev.reps).reduce((a,b)=>a+b,0),cT=reps.reduce((a,b)=>a+b,0);
    if(cT<pT-2)regress=`Reps dropped ${pT}→${cT}`}}
  if(hitTop){
    if(isResist){
      const curIdx=BAND_IDX(last.band);
      if(curIdx<=0)return{text:'At max resistance — add pause/tension',type:'st',wt:null,traj,
        detail:`Hit ${ex.s}×${ex.tg}${ex.perSide?'/side':''} at heaviest band`,regress};
      return{text:'↑ More resistance (thicker)',type:'up',wt:null,traj,
        detail:`Hit ${ex.s}×${ex.tg}${ex.perSide?'/side':''} — increase band resistance`,regress}}
    // assist mode
    const curIdx=BAND_IDX(last.band);
    if(curIdx>=BANDS.length-1)return{text:'No band! 🎉',type:'up',wt:null,traj,
      detail:`Hit ${ex.s}×${ex.tg} — try unassisted`,regress};
    return{text:'↑ Less assistance (thinner)',type:'up',wt:null,traj,
      detail:`Hit ${ex.s}×${ex.tg} — reduce band help`,regress}}
  return{text:last.band||'Check band',type:'stay',wt:null,traj,detail:`Stay on ${last.band||'current'}`,regress}}

// ─── CARRY exercises ───
if(ex.tp==='carry'||(ex.tp==='db'&&ex.id.includes('carry'))){
  const lastWt=last.wt||0;
  return{text:lastWt?`${lastWt}kg`:'Log weight',type:'stay',wt:lastWt,traj:[],detail:'↑ load or distance when comfortable',regress:discWarn}}

// ─── BODYWEIGHT (push-ups, inverted rows, dead bugs, dand-baithak) — perSide-aware ───
if(ex.tp==='bw'){
  const reps=effectiveReps(ex,last.reps);
  const totalReps=reps.reduce((a,b)=>a+b,0);
  const isDand=ex.id.includes('dand');
  if(isDand){return{text:`${last.reps.filter(r=>r>0).reduce((a,b)=>a+b,0)} total`,type:'stay',wt:null,traj:[],detail:ex.rl,regress:''}}
  const traj=hist.map((h,i)=>{if(!i)return{s:'●',c:'same'};
    const pt=effectiveReps(ex,hist[i-1].reps).reduce((a,b)=>a+b,0),ct=effectiveReps(ex,h.reps).reduce((a,b)=>a+b,0);
    return ct>pt?{s:'↗',c:'up'}:ct<pt?{s:'↘',c:'dn'}:{s:'→',c:'same'}});
  const allHit=reps.length>=ex.s&&reps.slice(0,ex.s).every(r=>r>=ex.tg);
  let regress=discWarn;
  if(!regress&&hist.length>=2){const pt=effectiveReps(ex,hist[hist.length-2].reps).reduce((a,b)=>a+b,0);
    if(totalReps<pt-3)regress=`Total reps dropped ${pt}→${totalReps}`}
  if(allHit)return{text:`Hit target${ex.perSide?' /side':''} — progress`,type:'up',wt:null,traj,detail:ex.rl,regress};
  return{text:`${totalReps} reps${ex.perSide?' /side':''}`,type:'stay',wt:null,traj,detail:`Push for ${ex.s}×${ex.tg}${ex.perSide?'/side':''}`,regress}}

// ─── Fallback ───
return{text:last.wt?`${last.wt}kg`:'Continue',type:'stay',wt:last.wt,traj:[],detail:'',regress:discWarn}}

function getPRs(exId){let bw=0,bv=0,be=0;const def=ALL_EX.find(x=>x.id===exId);
for(const s of D.sessions)for(const e of s.ex)if(e.id===exId){const vr=e.reps.filter(r=>r>0);if(!vr.length)continue;
const eR=effectiveReps(def,e.reps);const mx=eR.length?Math.max(...eR):0;
const vol=calcExVol(e.id,e.wt,e.reps);
if(e.wt>bw)bw=e.wt;if(vol>bv)bv=vol;if(e.wt&&mx>0){const x=e.wt*(1+mx/30);if(x>be)be=x}}
return{bestWt:bw,bestVol:bv,bestE1RM:Math.round(be*10)/10}}
function checkPR(exId,wt,reps){const pr=getPRs(exId),vr=reps.filter(r=>r>0);if(!vr.length)return[];const ps=[];
const vol=calcExVol(exId,wt,reps);
if(wt&&wt>pr.bestWt&&pr.bestWt>0)ps.push('WT');if(vol>pr.bestVol&&pr.bestVol>0)ps.push('VOL');return ps}
function e1rm(wt,reps){return reps<=0||!wt?0:reps===1?wt:Math.round(wt*(1+reps/30)*10)/10}
function warmupSets(wt){if(!wt||wt<=BAR)return[];const s=[{wt:BAR,reps:8,l:'Bar only'}];const w60=snapW(BAR+(wt-BAR)*.5),w80=snapW(BAR+(wt-BAR)*.8);if(w60>BAR&&w60<wt)s.push({wt:w60,reps:5,l:fmtPl(w60)});if(w80>w60&&w80<wt)s.push({wt:w80,reps:3,l:fmtPl(w80)});return s}

// Discomfort analysis
function getDiscomfortTrend(exId,joint){const recent=D.discomfort.filter(d=>d.exId===exId&&d.joint===joint).slice(-5);
return{count:recent.length,recent3:recent.slice(-3).filter(d=>d.level!=='none').length}}

// Bar chart for weekly series; data=[{v,lbl}], optional target line
function svgBars(data,W,H,color,label,opts){
opts=opts||{};
if(!data.length)return`<div class="dm" style="text-align:center;padding:16px">No data yet</div>`;
const pad={t:22,r:10,b:24,l:34},w=W-pad.l-pad.r,h=H-pad.t-pad.b;
const mx=Math.max(...data.map(d=>d.v),opts.target||0,1);
const bw=w/data.length,gap=Math.min(6,bw*0.25);
let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">`;
for(let i=0;i<=3;i++){const y=pad.t+(h/3)*i,v=Math.round(mx-(mx/3)*i);
s+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#252b38" stroke-width="1"/><text x="${pad.l-4}" y="${y+3}" text-anchor="end" fill="#808aa0" font-size="9">${v}</text>`}
data.forEach((d,i)=>{const bh=Math.max(1,(d.v/mx)*h);const x=pad.l+i*bw+gap/2,y=pad.t+h-bh;
s+=`<rect x="${x}" y="${y}" width="${bw-gap}" height="${bh}" rx="3" fill="${color}"/>`;
if(data.length<=12)s+=`<text x="${x+(bw-gap)/2}" y="${H-12}" text-anchor="middle" fill="#808aa0" font-size="7.5">${d.lbl}</text>`});
if(opts.target){const ty=pad.t+h-(opts.target/mx)*h;s+=`<line x1="${pad.l}" y1="${ty}" x2="${W-pad.r}" y2="${ty}" stroke="#ff5d5d" stroke-width="1" stroke-dasharray="4 3"/>`}
s+=`<text x="${W/2}" y="14" text-anchor="middle" fill="${color}" font-size="11" font-weight="700" font-family="Archivo Expanded,sans-serif">${label}</text></svg>`;return s}

function svgLine(data,W,H,color,label){
if(data.length<2)return`<div class="dm" style="text-align:center;padding:16px">Need 2+ data points</div>`;
const pad={t:22,r:10,b:28,l:36},w=W-pad.l-pad.r,h=H-pad.t-pad.b;
const vals=data.map(d=>d.v),mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1;
const pts=data.map((d,i)=>({x:pad.l+(i/(data.length-1))*w,y:pad.t+h-((d.v-mn)/rng)*h,...d}));

for(let i=0;i<=3;i++){const y=pad.t+(h/3)*i,v=Math.round(mx-((mx-mn)/3)*i);
s+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#252b38" stroke-width="1"/><text x="${pad.l-4}" y="${y+3}" text-anchor="end" fill="#808aa0" font-size="9">${v}</text>`}
// area fill under the line

s+=`<polygon points="${area}" fill="url(#${gid})"/>`;

function getFatigue(){const now=new Date(),scores=[];
for(let i=0;i<7;i++){const d=new Date(now);d.setDate(d.getDate()-i);const ds=d.toISOString().split('T')[0];
D.sessions.filter(s=>s.date===ds).forEach(s=>{let vol=0;s.ex.forEach(e=>{vol+=calcExVol(e.id,e.wt,e.reps)});scores.push({vol,diff:s.difficulty||3})});
D.cardioLog.filter(c=>c.date===ds).forEach(c=>scores.push({vol:c.duration*(c.intensity==='hard'?30:20),diff:3}))}
if(!scores.length)return{score:0,label:'Fresh',color:'var(--gr)'};
const f=scores.length,ad=scores.reduce((a,b)=>a+b.diff,0)/f,tv=scores.reduce((a,b)=>a+b.vol,0);
const sc=Math.round(Math.min(10,f*1.2+ad*.9+tv/(1200*Math.max(1,f)))*10)/10;
if(sc<=3)return{score:sc,label:'Fresh',color:'var(--gr)'};if(sc<=5)return{score:sc,label:'Ready',color:'var(--pr)'};
if(sc<=7)return{score:sc,label:'Building',color:'var(--am)'};return{score:sc,label:'Fatigued',color:'var(--rd)'}}

function getDeload(){const st=D.lastDeload||D.sessions[0]?.date;if(!st)return null;const wk=Math.max(1,Math.floor((new Date()-new Date(st+'T00:00:00'))/6048e5)+1);
const sc=D.lastDeload?D.sessions.filter(s=>s.date>D.lastDeload).length:D.sessions.length;
// Signal-driven: don't deload on timer alone — check for actual fatigue signals
const recent5=D.sessions.slice(-5);
const avgDiff=recent5.filter(s=>s.difficulty).length?recent5.filter(s=>s.difficulty).reduce((a,s)=>a+s.difficulty,0)/recent5.filter(s=>s.difficulty).length:0;
const highFatigue=avgDiff>=4;
// For beginners (<30 sessions), extend timer to 8 weeks and require signals
const isBeginner=D.sessions.length<30;const timerThresh=isBeginner?8:6;
const due=wk>=timerThresh&&highFatigue;const consider=wk>=timerThresh&&!highFatigue;
return{wk,sc,due,consider,isBeginner,avgDiff:Math.round(avgDiff*10)/10}}

} else if(ex.tp==='db'){

} else if(ex.tp==='band'){

${BANDS.map(b=>`<option value="${esc(b)}"${log.band===b?' selected':''}>${esc(b)}</option>`).join('')}</select></div>`
} else if(ex.tp==='carry'){
h+=`<div style="display:flex;align-items:center;gap:6px;justify-content:center;margin-bottom:6px">
<input type="number" class="body-input" style="width:76px" value="${log.wt||''}" placeholder="—" oninput="setL('${ex.id}','wt',this.value);saveAW()" inputmode="numeric"><span class="dm">kg</span></div>`
} else if(ex.tp==='club'||ex.tp==='mace'||ex.tp==='kb'){

// ─── HELPERS ───────────────────────────────────
function stepWt(id,dir){const c=Number(LOG[id].wt)||BAR,ix=VW.indexOf(c);
const ni=Math.max(0,Math.min(VW.length-1,ix+dir));LOG[id].wt=VW[ni];LOG[id].pf=false;saveAW();render()}
function setL(id,f,v){LOG[id][f]=v}
function setRep(id,i,v){LOG[id].reps[i]=v;LOG[id].pf=false;saveAW();
const ex=ALL_EX.find(e=>e.id===id);if(ex){const filled=LOG[id].reps.filter(r=>r!==''&&Number(r)>0).length;
if(filled===i+1&&filled<ex.s&&!TIMER)startTimer(ex.rstS)}}
function toggleSetDone(id,i){if(!LOG[id].setDone)LOG[id].setDone=Array(LOG[id].reps.length).fill(false);
LOG[id].setDone[i]=!LOG[id].setDone[i];
if(LOG[id].setDone[i]){const ex=ALL_EX.find(e=>e.id===id);if(ex&&!TIMER)startTimer(ex.rstS)}
saveAW();render()}
function toggleJoint(exId,joint){const j=LOG[exId].discJoints;const idx=j.indexOf(joint);
if(idx>=0)j.splice(idx,1);else j.push(joint);saveAW();render()}
let CANCEL_ARMED=false;
function cancelW(){if(CANCEL_ARMED){ADAY=null;LOG={};SS=null;CANCEL_ARMED=false;SNOTES='';clearAW();clearTimer();go('home')}
else{CANCEL_ARMED=true;setTimeout(()=>CANCEL_ARMED=false,3000);render()}}
function editCue(exId){const cur=D.cues[exId]||'';const v=prompt(`Cue for ${ALL_EX.find(e=>e.id===exId)?.nm||exId}:`,cur);
if(v!==null){if(v.trim())D.cues[exId]=v.trim();else delete D.cues[exId];save();render()}}

// ─── FINISH + SUMMARY ─────────────────────────
function finishW(){
const pr=getCurPR(),exs=pr[ADAY];
const logged=Object.entries(LOG).filter(([,v])=>v.reps.some(r=>r!==''&&Number(r)>0))
  .map(([id,v])=>({id,wt:v.wt?Number(v.wt):null,reps:v.reps.map(r=>r===''?0:Number(r)),band:v.band||'',notes:v.notes}));
if(!logged.length)return;
for(const[id,v] of Object.entries(LOG)){if(v.disc&&v.disc!=='none'&&v.discJoints.length){
  for(const j of v.discJoints)D.discomfort.push({date:today(),exId:id,level:v.disc,joint:j})}}
const prs=[];for(const e of logged){const p=checkPR(e.id,e.wt,e.reps);if(p.length)prs.push({nm:ALL_EX.find(x=>x.id===e.id)?.nm||e.id})}
let tv=0,ts=0,tr=0;for(const e of logged){const vr=e.reps.filter(r=>r>0);ts+=vr.length;tr+=vr.reduce((a,b)=>a+b,0);tv+=calcExVol(e.id,e.wt,e.reps)}
const discCount=Object.values(LOG).filter(v=>v.disc&&v.disc!=='none').length;
window._S={exs:logged,prs,tv,ts,tr,dur:SS?Math.round((Date.now()-SS)/6e4):0,day:ADAY,warmup:WU_CHECKS.filter(Boolean).length,discCount,notes:SNOTES};
SDIFF=0;clearAW();VIEW='summary';render();window.scrollTo(0,0)}

function rSumm(el){const S=window._S;
let h=`<div class="sec"><div class="summary-card">
<div style="font-size:17px;font-weight:800;margin-bottom:6px">Session Complete ✓</div>
<span class="bg bg-${S.day.toLowerCase()}">Day ${S.day}</span>
<div style="display:flex;justify-content:center;gap:16px;margin:14px 0">
<div><div class="summary-num">${S.dur}</div><div class="summary-label">min</div></div>

${S.tv?`<div><div class="summary-num">${(S.tv/1000).toFixed(1)}k</div><div class="summary-label">vol</div></div>`:''}</div>`;

<div style="display:flex;justify-content:center;gap:4px">`;

<div style="font-size:8px;color:${SDIFF===i?RPE_COLORS[i-1]:'var(--dm)'};margin-top:2px;font-weight:${SDIFF===i?700:400}">${RPE_LABELS[i-1]}</div></div>`;

// Headline numbers
function statSnapshot(){

// current streak = consecutive weeks with >=1 session, counting back from this week

const hit=dates.some(d=>{const x=new Date(d+'T00:00:00');return x>=wStart&&x<=wEnd});
if(hit)streak++;else if(w>0)break;cur.setDate(cur.getDate()-7)}}
const first=dates[0],span=first?Math.round((now-new Date(first+'T00:00:00'))/6048e5):0;
return{sessions:sess.length,days:dates.length,totalVol:Math.round(totalVol),totalSets,last7,last30,streak,weeks:span,first};

// ── ISO-week key (Mon-anchored) for time bucketing ──
function weekKey(dateStr){const d=new Date(dateStr+'T00:00:00');const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d.toISOString().split('T')[0]}
// ── Weekly tonnage + session-count series (last N weeks), location-aware optional ──
function weeklySeries(weeks){
const buckets={};
for(const s of D.sessions){const wk=weekKey(s.date);if(!buckets[wk])buckets[wk]={vol:0,sets:0,sessions:0,rpe:[],dur:0};
let v=0,st=0;for(const e of s.ex){v+=calcExVol(e.id,e.wt,e.reps);st+=(e.reps||[]).filter(r=>Number(r)>0).length}
buckets[wk].vol+=v;buckets[wk].sets+=st;buckets[wk].sessions++;if(s.difficulty)buckets[wk].rpe.push(s.difficulty);if(s.duration)buckets[wk].dur+=s.duration}
const keys=Object.keys(buckets).sort();const recent=keys.slice(-(weeks||10));
return recent.map(k=>({wk:k,vol:Math.round(buckets[k].vol),sets:buckets[k].sets,sessions:buckets[k].sessions,
rpe:buckets[k].rpe.length?Math.round(buckets[k].rpe.reduce((a,b)=>a+b,0)/buckets[k].rpe.length*10)/10:null,dur:buckets[k].dur,
lbl:new Date(k+'T00:00:00').toLocaleDateString('en-NZ',{day:'numeric',month:'short'})}));
}
// ── Recent PRs: scan history, find sessions that set a new best-weight or best-e1RM at the time ──
function recentPRs(sinceDays){
const cut=sinceDays?new Date(Date.now()-sinceDays*864e5).toISOString().split('T')[0]:null;
const prs=[];
for(const ex of ALL_EX){const h=getHist(ex.id,200);if(h.length<1)continue;
let bw=0,be=0;
for(const e of h){const vr=(e.reps||[]).filter(r=>Number(r)>0);if(!vr.length)continue;
const def=ALL_EX.find(x=>x.id===ex.id);const eR=effectiveReps(def,e.reps);const mx=eR.length?Math.max(...eR):0;
const e1=e.wt&&mx>0?Math.round(e.wt*(1+mx/30)*10)/10:0;
let isPR=null;
if(e.wt&&e.wt>bw){bw=e.wt;isPR={type:'weight',val:e.wt}}
if(e1>be){be=e1;if(!isPR)isPR={type:'e1rm',val:e1}}
if(isPR&&(!cut||e.date>=cut))prs.push({nm:ex.nm,date:e.date,...isPR})}}
prs.sort((a,b)=>b.date.localeCompare(a.date));return prs;
}
// ── Milestones: cumulative tonnage / session / streak achievements ──
function milestones(){
const snap=statSnapshot();const out=[];
const tonnes=snap.totalVol/1000;
const volMarks=[10,25,50,75,100,150,200,300];const nextVol=volMarks.find(m=>m>tonnes);
const lastVol=[...volMarks].reverse().find(m=>m<=tonnes);
if(lastVol)out.push({icon:'🏔',label:`${lastVol}t lifted`,done:true});
if(nextVol)out.push({icon:'🎯',label:`${nextVol}t (${(nextVol-tonnes).toFixed(1)}t to go)`,done:false,pct:Math.round(tonnes/nextVol*100)});
const sessMarks=[10,25,50,100,150,200];const lastS=[...sessMarks].reverse().find(m=>m<=snap.sessions);const nextS=sessMarks.find(m=>m>snap.sessions);
if(lastS)out.push({icon:'💪',label:`${lastS} sessions`,done:true});
if(nextS)out.push({icon:'🎯',label:`${nextS} sessions (${nextS-snap.sessions} to go)`,done:false,pct:Math.round(snap.sessions/nextS*100)});
if(snap.streak>=4)out.push({icon:'🔥',label:`${snap.streak}-week streak`,done:true});
return out;
}
// ── Per-muscle weekly volume history (for trend bars) ──
function muscleWeekly(muscleKey,weeks){
const buckets={};
for(const s of D.sessions){const wk=weekKey(s.date);if(!buckets[wk])buckets[wk]=0;
for(const e of s.ex){const map=MG[e.id];if(!map||!map[muscleKey])continue;const sets=(e.reps||[]).filter(r=>Number(r)>0).length;buckets[wk]+=sets*map[muscleKey]}}
const keys=Object.keys(buckets).sort().slice(-(weeks||8));
return keys.map(k=>({wk:k,v:Math.round(buckets[k]*10)/10}));
}
// ── Consistency metrics ──
function consistency(){
const ss=D.sessions;const dates=[...new Set(ss.map(s=>s.date))].sort();
// avg sessions/week over active span
const first=dates[0],last=dates[dates.length-1];
const spanWk=first?Math.max(1,(new Date(last+'T00:00:00')-new Date(first+'T00:00:00'))/6048e5):1;
const perWk=Math.round(ss.length/spanWk*10)/10;
// warmup compliance
const wuSessions=ss.filter(s=>s.warmup!==undefined);
const wuRate=wuSessions.length?Math.round(wuSessions.filter(s=>s.warmup>0).length/wuSessions.length*100):null;
// avg gap between sessions
let gaps=[];for(let i=1;i<dates.length;i++)gaps.push((new Date(dates[i]+'T00:00:00')-new Date(dates[i-1]+'T00:00:00'))/864e5);
const avgGap=gaps.length?Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length*10)/10:null;
// avg duration & rpe
const durs=ss.filter(s=>s.duration).map(s=>s.duration);const avgDur=durs.length?Math.round(durs.reduce((a,b)=>a+b,0)/durs.length):null;
const rpes=ss.filter(s=>s.difficulty).map(s=>s.difficulty);const avgRpe=rpes.length?Math.round(rpes.reduce((a,b)=>a+b,0)/rpes.length*10)/10:null;
return{perWk,wuRate,avgGap,avgDur,avgRpe,spanWk:Math.round(spanWk)};
}

function impD(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();

D.sessions=[...existingMap.values()];

// Merge cardio, discomfort, body logs (additive)
const cIds=new Set(D.cardioLog.map(c=>c.id));
