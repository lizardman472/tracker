<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root{--bg:#0c0d10;--card:#13141a;--cb:#1e2028;--ib:#1a1c24;--ibr:#2a2d38;--tx:#dce0e8;--mu:#6b7084;
--dm:#444;--go:#f0c850;--bl:#50b0f0;--gr:#50f0a0;--rd:#f07070;--or:#ffaa44;--pu:#c084fc;
--p10:#c44040;--p5:#4080c4;--p25:#50a050;--p1:#a0a0a0;--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;
min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body{max-width:480px;margin:0 auto;padding-bottom:calc(70px + var(--sab))}
input,select,button,textarea{font-family:inherit}
input[type="number"]::-webkit-inner-spin-button,input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type="number"]{-moz-appearance:textfield}
.hdr{padding:16px 16px 10px;border-bottom:1px solid var(--cb);position:sticky;top:0;background:var(--bg);z-index:100}
.hdr h1{font-size:17px;font-weight:800;color:var(--go);letter-spacing:1.5px;margin-bottom:2px}
.hdr small{font-size:10px;color:var(--dm);letter-spacing:.3px}
.nav{display:flex;gap:1px;padding:4px 16px 2px;background:var(--bg);position:sticky;top:50px;z-index:99}
.nav button{flex:1;padding:9px 0;font-size:11px;font-weight:600;border:none;border-bottom:2px solid transparent;
background:0;color:var(--mu);cursor:pointer;letter-spacing:.5px;transition:.15s}
.nav button.a{color:var(--go);border-bottom-color:var(--go)}
.sec{padding:14px 16px}.sec.h{display:none}
.cd{background:var(--card);border-radius:10px;padding:14px 16px;margin-bottom:10px;border:1px solid var(--cb)}
.cd-hl{border-color:var(--go)}
.bg{display:inline-block;padding:2px 10px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:1px}
.bg-a{background:var(--go);color:var(--bg)}.bg-b{background:var(--bl);color:var(--bg)}.bg-c{background:var(--gr);color:var(--bg)}
.lb{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:4px}
.mu{font-size:12px;color:var(--mu)}.dm{font-size:11px;color:var(--dm)}
.ex-cd{background:var(--card);border-radius:10px;padding:14px 16px;margin-bottom:14px;border:1px solid var(--cb)}
.ex-nm{font-size:15px;font-weight:700;color:var(--tx);margin-bottom:1px}
.ex-mt{font-size:11px;color:var(--mu);margin-bottom:6px}
.sg{font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px;display:inline-block;margin-bottom:6px}
.sg-up{color:var(--gr);background:rgba(80,240,160,.08)}.sg-st{color:var(--go);background:rgba(240,200,80,.08)}
.sg-nw{color:var(--bl);background:rgba(80,176,240,.08)}.sg-dn{color:var(--rd);background:rgba(240,107,107,.08)}
.ri{width:44px;height:40px;padding:4px;font-size:16px;font-weight:600;background:var(--ib);border:1px solid var(--ibr);
border-radius:8px;color:#fff;text-align:center;outline:none}
.ri:focus{border-color:var(--go)}.ri.prefilled{color:var(--mu)}
.ni{width:100%;padding:7px 10px;font-size:12px;background:var(--ib);border:1px solid var(--ibr);border-radius:8px;
color:#999;outline:none;margin-top:6px}.ni:focus{border-color:var(--go);color:var(--tx)}
.bs{padding:7px 10px;font-size:13px;background:var(--ib);border:1px solid var(--ibr);border-radius:8px;
color:#fff;outline:none;max-width:200px;-webkit-appearance:none}
.stp{display:flex;align-items:center;gap:4px}
.stp-b{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:8px;
border:1px solid var(--ibr);background:var(--ib);color:var(--tx);font-size:22px;font-weight:700;
cursor:pointer;user-select:none;-webkit-user-select:none;transition:.1s}
.stp-b:active{background:var(--cb)}.stp-b.dis{color:#333;cursor:default}
.stp-v{min-width:68px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:8px;
background:var(--ib);border:2px solid var(--go);font-size:18px;font-weight:800;color:var(--go);padding:0 6px}
.stp-v span{font-size:10px;color:var(--mu);margin-left:2px;font-weight:400}
.pls{display:flex;align-items:center;gap:2px;padding:4px 0;flex-wrap:wrap}
.pls-l{font-size:9px;color:var(--dm);margin-right:4px}
.pl{height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff}
.pl-10{background:var(--p10);width:26px}.pl-5{background:var(--p5);width:22px}
.pl-2{background:var(--p25);width:18px}.pl-1{background:var(--p1);width:14px}
.pls-t{font-size:10px;color:var(--dm);margin-left:4px}
.btn{padding:14px 20px;font-size:15px;font-weight:700;border:none;border-radius:10px;cursor:pointer;
letter-spacing:.3px;width:100%;display:block;transition:.15s}.btn:active{opacity:.8}
.btn-go{background:var(--go);color:var(--bg)}.btn-dk{background:var(--cb);color:var(--tx)}
.btn-rd{background:#2a1a1a;color:var(--rd);border:1px solid #3a2020}
.btn-sm{padding:7px 14px;font-size:11px;width:auto;display:inline-block;border-radius:6px}
.ch{display:inline-block;font-size:10px;padding:3px 7px;border-radius:4px;background:var(--ib);color:var(--mu);margin:0 3px 3px 0}
.pr-row{padding:6px 0;border-bottom:1px solid #1a1c24;display:flex;justify-content:space-between;align-items:flex-start}
.pr-row:last-child{border-bottom:none}
.prog{font-size:10px;color:var(--dm);font-style:italic;margin-top:6px}
.ptr{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-radius:6px;margin-bottom:2px}
.ptr:nth-child(odd){background:var(--card)}
/* Rest timer */
.timer-bar{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#1a1c24;
border-top:2px solid var(--go);padding:12px 20px calc(12px + var(--sab));z-index:200;
display:flex;justify-content:space-between;align-items:center}
.timer-bar.done{border-top-color:var(--gr);animation:pulse .5s ease 3}
@keyframes pulse{0%,100%{background:#1a1c24}50%{background:#1a2d1a}}
.timer-time{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--go)}
.timer-bar.done .timer-time{color:var(--gr)}
.timer-btn{padding:10px 18px;border-radius:8px;border:none;font-size:13px;font-weight:700;cursor:pointer}
/* PR badge */
.pr-badge{display:inline-block;font-size:9px;font-weight:800;color:#ffd700;background:rgba(255,215,0,.15);
padding:2px 6px;border-radius:4px;margin-left:6px;letter-spacing:.5px;animation:prPop .4s ease}
@keyframes prPop{0%{transform:scale(0)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
/* Deload banner */
.deload-banner{background:rgba(255,170,68,.08);border:1px solid rgba(255,170,68,.25);border-radius:8px;
padding:10px 14px;margin-bottom:12px;font-size:12px;color:var(--or)}
.deload-ok{background:rgba(80,240,160,.06);border-color:rgba(80,240,160,.2);color:var(--gr)}
/* Skip warning */
.skip-warn{font-size:10px;color:var(--or);padding:3px 7px;background:rgba(255,170,68,.08);
border-radius:5px;display:inline-block;margin-bottom:6px}
/* Trajectory */
.traj{display:flex;gap:3px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.traj-dot{font-size:10px;padding:2px 5px;border-radius:3px;font-weight:600}
.traj-up{color:var(--gr);background:rgba(80,240,160,.1)}.traj-same{color:var(--go);background:rgba(240,200,80,.1)}
.traj-dn{color:var(--rd);background:rgba(240,107,107,.1)}
/* Warm-up */
.warmup{background:var(--ib);border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:11px;color:var(--mu)}
.warmup-set{display:flex;justify-content:space-between;padding:2px 0}
/* Superset hint */
.ss-hint{font-size:10px;color:var(--pu);padding:2px 6px;background:rgba(192,132,252,.08);
border-radius:4px;display:inline-block;margin-left:4px}
/* Session summary */
.summary-card{background:var(--card);border-radius:12px;padding:20px;margin-bottom:14px;border:1px solid var(--go);text-align:center}
.summary-stat{display:inline-block;text-align:center;margin:0 12px}
.summary-num{font-size:24px;font-weight:800;color:var(--go)}
.summary-label{font-size:9px;color:var(--mu);text-transform:uppercase;letter-spacing:1px}
.diff-btn{width:44px;height:44px;border-radius:50%;border:2px solid var(--ibr);background:var(--ib);
font-size:18px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center}
.diff-btn.sel{border-color:var(--go);background:rgba(240,200,80,.15)}
/* Session clock */
.sess-clock{font-size:11px;color:var(--mu);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="hdr"><h1>RACK-FREE TRACKER</h1><small>11kg bar · 4×10 · 4×5 · 2×2.5 · 4×1 · KB 32/20</small></div>
<div class="nav" id="nav"></div>
<div id="app"></div>
<div id="timer-root"></div>

<script>
// ═══════════════════════════════════════════════════════════
// EQUIPMENT
// ═══════════════════════════════════════════════════════════
const BAR=11,PL=[{w:10,q:4},{w:5,q:4},{w:2.5,q:2},{w:1,q:4}];
const VW=(()=>{const s=new Set();for(let a=0;a<=2;a++)for(let b=0;b<=2;b++)for(let c=0;c<=1;c++)for(let d=0;d<=2;d++)s.add(BAR+2*(a*10+b*5+c*2.5+d*1));return[...s].sort((a,b)=>a-b)})();
function perSide(t){let r=(t-BAR)/2;if(r<0)return null;const o=[];for(const p of PL){const m=p.q/2;let c=Math.min(Math.floor(r/p.w),m);if(c>0){o.push({w:p.w,c});r-=c*p.w}}return Math.abs(r)<.01?o:null}
function fmtPl(t){if(t<=BAR)return'Bar only';const p=perSide(t);return p?p.map(x=>`${x.c}×${x.w%1?x.w:x.w|0}kg`).join(' + '):'—'}
function nxUp(c){for(const w of VW)if(w>c)return w;return c}
function nxDn(c){for(let i=VW.length-1;i>=0;i--)if(VW[i]<c)return VW[i];return c}
function snapW(t){let b=VW[0];for(const w of VW)if(Math.abs(w-t)<Math.abs(b-t))b=w;return b}

// ═══════════════════════════════════════════════════════════
// PROGRAM
// ═══════════════════════════════════════════════════════════
const PR={A:[
{id:'deadlift',nm:'Deadlift',s:3,rp:'5',rst:'3:00',rir:'1-2',tp:'bb',rl:'Hit 3×5 → next weight',tg:5,rstS:180,ss:''},
{id:'pullup_a',nm:'Pull-ups (Wide)',s:4,rp:'4-8',rst:'2:30',rir:'1-2',tp:'band',rl:'4×8 → thinner band',tg:8,rstS:150,ss:'floor_press'},
{id:'floor_press',nm:'Floor Press',s:3,rp:'8-10',rst:'2:00',rir:'2',tp:'bb',rl:'Hit 3×10 → next weight',tg:10,rstS:120,ss:'pullup_a'},
{id:'zercher_a',nm:'Zercher Squat',s:3,rp:'6-8',rst:'2:00',rir:'2',tp:'bb',rl:'Hit 3×8 → next weight',tg:8,rstS:120,ss:'face_pull'},
{id:'face_pull',nm:'Face Pull',s:3,rp:'15-20',rst:'1:00',rir:'2-3',tp:'band',rl:'3×20 → heavier band',tg:20,rstS:60,ss:'zercher_a'},
{id:'leg_raise',nm:'Floor Leg Raise',s:3,rp:'10-15',rst:'1:00',rir:'2',tp:'bw',rl:'+reps → +weight → slow ecc',tg:15,rstS:60,ss:''}],
B:[
{id:'zercher_b',nm:'Zercher Squat (Heavy)',s:4,rp:'5-6',rst:'3:30',rir:'1-2',tp:'bb',rl:'Hit 4×6 → next weight',tg:6,rstS:210,ss:''},
{id:'ohp',nm:'Barbell OHP',s:3,rp:'5-7',rst:'2:30',rir:'1-2',tp:'bb',rl:'Hit 3×7 → next weight (slow!)',tg:7,rstS:150,ss:'bb_row'},
{id:'dips',nm:'Dips',s:4,rp:'4-8',rst:'2:30',rir:'1-2',tp:'band',rl:'4×8 → thinner band',tg:8,rstS:150,ss:'kb_swing'},
{id:'bb_row',nm:'Barbell Row',s:3,rp:'8-10',rst:'2:00',rir:'2',tp:'bb',rl:'Hit 3×10 → next weight',tg:10,rstS:120,ss:'ohp'},
{id:'kb_swing',nm:'KB Swing',s:3,rp:'12-15',rst:'1:30',rir:'2-3',tp:'kb',rl:'20→32kg→single-arm',tg:15,rstS:90,ss:'dips'},
{id:'pallof',nm:'Pallof Press',s:3,rp:'10/side',rst:'1:00',rir:'2',tp:'band',rl:'Heavier band → step-out',tg:10,rstS:60,ss:''}],
C:[
{id:'rdl',nm:'Romanian DL',s:3,rp:'8-10',rst:'2:00',rir:'2',tp:'bb',rl:'Hit 3×10 → next weight',tg:10,rstS:120,ss:''},
{id:'split_squat',nm:'Split Squat',s:3,rp:'10/leg',rst:'1:30',rir:'2',tp:'bw',rl:'BW→20kg bag→30kg→Zercher',tg:10,rstS:90,ss:'pullup_c'},
{id:'pushups',nm:'Push-ups',s:4,rp:'8-15',rst:'1:30',rir:'1-2',tp:'bw',rl:'4×15 → advance variation',tg:15,rstS:90,ss:'pullup_c'},
{id:'pullup_c',nm:'Pull-ups (Volume)',s:3,rp:'6-10',rst:'2:00',rir:'2-3',tp:'band',rl:'One band easier than Day A',tg:10,rstS:120,ss:'pushups'},
{id:'kb_press',nm:'KB Press',s:3,rp:'10/arm',rst:'1:00',rir:'2',tp:'kb',rl:'Increase KB or reps',tg:10,rstS:60,ss:'carry'},
{id:'carry',nm:'Loaded Carry',s:3,rp:'40m',rst:'1:30',rir:'—',tp:'carry',rl:'Increase load or distance',tg:1,rstS:90,ss:'kb_press'},
{id:'arms',nm:'Arms (Curl/Ext)',s:2,rp:'12-15',rst:'1:00',rir:'2',tp:'kb',rl:'+reps → +weight',tg:15,rstS:60,ss:''}]};

const BANDS=['Green (heaviest)','Blue','Purple','Red','Purple+Red','Red+Black','Black','None'];
const BAND_IDX=b=>{const i=BANDS.findIndex(x=>x===b);return i<0?99:i};

const SEED={sessions:[
{id:'s1',date:'2026-02-26',day:'A',ex:[
{id:'deadlift',wt:41,reps:[8,7,7],band:'',notes:'Finding week'},
{id:'pullup_a',wt:null,reps:[6,5,5,4],band:'Blue',notes:'Wide grip'},
{id:'floor_press',wt:26,reps:[8,8,8],band:'',notes:'Did 4 sets by mistake'},
{id:'face_pull',wt:null,reps:[18,16,15],band:'Purple',notes:''},
{id:'leg_raise',wt:5,reps:[12,10,10],band:'',notes:'5kg overhead'}]},
{id:'s2',date:'2026-03-01',day:'A',ex:[
{id:'deadlift',wt:46,reps:[6,6,6],band:'',notes:''},
{id:'pullup_a',wt:null,reps:[5,5,4,4],band:'Green',notes:''},
{id:'zercher_a',wt:28,reps:[7,6,6],band:'',notes:''}]},
{id:'s3',date:'2026-03-04',day:'A',ex:[
{id:'deadlift',wt:46,reps:[1,1,1],band:'',notes:'Heavy singles'},
{id:'floor_press',wt:26,reps:[8,8,8],band:'',notes:''},
{id:'zercher_a',wt:21,reps:[8,7,6],band:'',notes:''}]},
{id:'s4',date:'2026-03-06',day:'B',ex:[
{id:'zercher_b',wt:26,reps:[6,6,5,5],band:'',notes:''},
{id:'ohp',wt:16,reps:[7,6,5],band:'',notes:'Ramped cautiously'}]},
{id:'s5',date:'2026-03-10',day:'B',ex:[
{id:'zercher_b',wt:31,reps:[6,6,6,5],band:'',notes:'Too light → going up'},
{id:'ohp',wt:21,reps:[6,5,5],band:'',notes:''},
{id:'dips',wt:null,reps:[6,5,5,4],band:'Purple+Red',notes:''},
{id:'bb_row',wt:30,reps:[10,9,8],band:'',notes:''}]},
{id:'s6',date:'2026-03-14',day:'C',ex:[
{id:'rdl',wt:46,reps:[8,8,8],band:'',notes:''}]}],
nextDay:'A',lastDeload:null,difficulty:{}};

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
const SK='rft-v4';let D,VIEW='home',ADAY=null,LOG={},EXP=null,TIMER=null,TIMER_IV=null,SESS_START=null,SHOW_SUMMARY=false,SUMM_DIFF=0;
function load(){try{const s=localStorage.getItem(SK);D=s?JSON.parse(s):structuredClone(SEED)}catch(e){D=structuredClone(SEED)}}
function save(){try{localStorage.setItem(SK,JSON.stringify(D))}catch(e){}}

// ═══════════════════════════════════════════════════════════
// SMART PROGRESSION ENGINE
// ═══════════════════════════════════════════════════════════
function getHistory(exId,n=5){
  const hits=[];
  for(let i=D.sessions.length-1;i>=0&&hits.length<n;i--){
    const e=D.sessions[i].ex.find(x=>x.id===exId);
    if(e)hits.unshift({...e,date:D.sessions[i].date,day:D.sessions[i].day})}
  return hits}

function getLast(exId){const h=getHistory(exId,1);return h.length?h[0]:null}

function getPR(exId){
  let bestWt=0,bestVol=0,bestReps=0;
  for(const s of D.sessions)for(const e of s.ex)if(e.id===exId){
    const vr=e.reps.filter(r=>r>0);if(!vr.length)continue;
    const mx=Math.max(...vr),vol=(e.wt||0)*vr.reduce((a,b)=>a+b,0);
    if(e.wt>bestWt)bestWt=e.wt;if(vol>bestVol)bestVol=vol;if(mx>bestReps)bestReps=mx}
  return{bestWt,bestVol,bestReps}}

function checkPR(exId,wt,reps){
  const pr=getPR(exId),vr=reps.filter(r=>r>0);if(!vr.length)return[];
  const prs=[],mx=Math.max(...vr),vol=(wt||0)*vr.reduce((a,b)=>a+b,0);
  if(wt&&wt>pr.bestWt&&pr.bestWt>0)prs.push('WEIGHT');
  if(vol>pr.bestVol&&pr.bestVol>0)prs.push('VOLUME');
  return prs}

function getSmartSugg(ex){
  const hist=getHistory(ex.id,5),last=hist.length?hist[hist.length-1]:null;
  if(!last)return{text:'First time — find your weight',type:'new',wt:null,traj:[],stalls:0,detail:''};

  if(ex.tp==='bb'&&last.wt){
    const atWeight=hist.filter(h=>h.wt===last.wt);
    const hitTarget=h=>{const v=h.reps.filter(r=>r>0);return v.length>=ex.s&&v.slice(0,ex.s).every(r=>r>=ex.tg)};
    const stalls=atWeight.length>0?atWeight.filter(h=>!hitTarget(h)).length:0;
    const lastHit=hitTarget(last);
    // Build trajectory
    const traj=hist.map(h=>{
      const prev=hist[hist.indexOf(h)-1];
      if(!prev)return{sym:'●',cls:'same'};
      if(h.wt>prev.wt)return{sym:'↑',cls:'up'};
      if(h.wt<prev.wt)return{sym:'↓',cls:'dn'};
      const pv=prev.reps.filter(r=>r>0),cv=h.reps.filter(r=>r>0);
      const ps=pv.reduce((a,b)=>a+b,0),cs=cv.reduce((a,b)=>a+b,0);
      return cs>ps?{sym:'↗',cls:'up'}:cs<ps?{sym:'↘',cls:'dn'}:{sym:'→',cls:'same'}});

    if(lastHit){const n=nxUp(last.wt);return{text:`↑ ${n}kg`,type:'up',wt:n,traj,stalls:0,detail:`Hit ${ex.s}×${ex.tg} — go up!`}}
    if(stalls>=3){const d=nxDn(last.wt);return{text:`↓ Drop to ${d}kg`,type:'dn',wt:d,traj,stalls,detail:`${stalls} stalls at ${last.wt}kg — reset & rebuild`}}
    // Check if trending up
    const repsImproving=atWeight.length>=2&&(()=>{const r=atWeight.map(h=>h.reps.filter(x=>x>0).reduce((a,b)=>a+b,0));return r[r.length-1]>r[0]})();
    const det=stalls>0?`Stall ×${stalls}/3 at ${last.wt}kg`+(repsImproving?' but reps trending ↑':''):
      `Stay at ${last.wt}kg — push for ${ex.s}×${ex.tg}`;
    return{text:`→ ${last.wt}kg`,type:'stay',wt:last.wt,traj,stalls,detail:det}}

  if(ex.tp==='band'){
    const traj=hist.map((h,i)=>{if(!i)return{sym:'●',cls:'same'};
      const pi=BAND_IDX(hist[i-1].band),ci=BAND_IDX(h.band);
      return ci>pi?{sym:'↑',cls:'up'}:ci<pi?{sym:'↓',cls:'dn'}:{sym:'→',cls:'same'}});
    const hitTop=last.reps.filter(r=>r>0).length>=ex.s&&last.reps.slice(0,ex.s).every(r=>r>=ex.tg);
    if(hitTop)return{text:'↑ Try thinner band',type:'up',wt:null,traj,stalls:0,detail:`Hit ${ex.s}×${ex.tg} — advance band`};
    return{text:last.band||'Check band',type:'stay',wt:null,traj,stalls:0,detail:`Stay on ${last.band||'current band'}`}}

  return{text:last.wt?`${last.wt}kg`:'Continue',type:'stay',wt:last.wt,traj:[],stalls:0,detail:''}}

// Skip tracking
function getSkips(dayType,exId){
  const daySessions=D.sessions.filter(s=>s.day===dayType).slice(-3);
  let skips=0;for(const s of daySessions)if(!s.ex.find(e=>e.id===exId))skips++;
  return{skips,total:daySessions.length}}

// Deload
function getDeloadInfo(){
  const start=D.lastDeload||D.sessions[0]?.date;if(!start)return null;
  const days=Math.floor((new Date()-new Date(start+'T00:00:00'))/864e5);
  const weeks=Math.max(1,Math.round(days/7));
  const sessionsSince=D.lastDeload?D.sessions.filter(s=>s.date>D.lastDeload).length:D.sessions.length;
  return{weeks,sessionsSince,due:weeks>=6}}

// Warm-up calculator
function warmupSets(workingWt){
  if(!workingWt||workingWt<=BAR)return[];
  const sets=[{wt:BAR,reps:8,label:'Bar only'}];
  const w60=snapW(BAR+(workingWt-BAR)*.5);
  const w80=snapW(BAR+(workingWt-BAR)*.8);
  if(w60>BAR&&w60<workingWt)sets.push({wt:w60,reps:5,label:fmtPl(w60)});
  if(w80>w60&&w80<workingWt)sets.push({wt:w80,reps:3,label:fmtPl(w80)});
  return sets}

// ═══════════════════════════════════════════════════════════
// TIMER
// ═══════════════════════════════════════════════════════════
function startTimer(secs){
  clearTimer();TIMER={total:secs,left:secs,done:false};
  TIMER_IV=setInterval(()=>{TIMER.left--;if(TIMER.left<=0){TIMER.done=true;clearInterval(TIMER_IV);TIMER_IV=null;
    try{navigator.vibrate([200,100,200,100,200])}catch(e){}playBeep();renderTimer()}renderTimer()},1000);
  renderTimer()}
function clearTimer(){if(TIMER_IV)clearInterval(TIMER_IV);TIMER_IV=null;TIMER=null;renderTimer()}
function playBeep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();
  o.connect(g);g.connect(a.destination);o.frequency.value=880;o.type='square';g.gain.value=.3;
  o.start();o.stop(a.currentTime+.15);setTimeout(()=>{const o2=a.createOscillator(),g2=a.createGain();
  o2.connect(g2);g2.connect(a.destination);o2.frequency.value=1100;o2.type='square';g2.gain.value=.3;
  o2.start();o2.stop(a.currentTime+.2)},200)}catch(e){}}
function renderTimer(){const el=document.getElementById('timer-root');
  if(!TIMER){el.innerHTML='';return}
  const m=Math.floor(Math.abs(TIMER.left)/60),s=Math.abs(TIMER.left)%60;
  const sign=TIMER.left<0?'+':'';
  el.innerHTML=`<div class="timer-bar${TIMER.done?' done':''}">
    <div><div class="timer-time">${sign}${m}:${String(s).padStart(2,'0')}</div>
    <div class="dm">${TIMER.done?'REST DONE — GO':'Resting...'}</div></div>
    <div><button class="timer-btn" style="background:${TIMER.done?'var(--gr)':'var(--rd)'};color:var(--bg)"
      onclick="clearTimer()">✕</button></div></div>`}

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
function fmtD(d){return new Date(d+'T00:00:00').toLocaleDateString('en-NZ',{weekday:'short',day:'numeric',month:'short'})}
function dAgo(d){const x=Math.floor((new Date()-new Date(d+'T00:00:00'))/864e5);return x===0?'Today':x===1?'Yesterday':`${x}d ago`}
function today(){return new Date().toISOString().split('T')[0]}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function elapsed(){if(!SESS_START)return'';const s=Math.floor((Date.now()-SESS_START)/1000),m=Math.floor(s/60);return`${m}:${String(s%60).padStart(2,'0')}`}

function plateH(t){if(!t||t<=BAR)return'';const ps=perSide(t);if(!ps||!ps.length)return'';
  let h='<div class="pls"><span class="pls-l">/side:</span>';
  for(const p of ps)for(let i=0;i<p.c;i++){const c=p.w>=10?'pl-10':p.w>=5?'pl-5':p.w>=2.5?'pl-2':'pl-1';
    h+=`<div class="pl ${c}">${p.w%1?p.w:p.w|0}</div>`}
  h+=`<span class="pls-t">= ${t}kg</span></div>`;return h}

function trajH(traj){if(!traj.length)return'';return'<div class="traj">'+traj.map(t=>
  `<span class="traj-dot traj-${t.cls}">${t.sym}</span>`).join('')+'</div>'}

// ═══════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════
let clockIV=null;
function render(){
  const n=document.getElementById('nav');
  if(VIEW==='workout'||VIEW==='summary'){n.innerHTML=''}
  else{const ts=[['home','NEXT UP'],['history','HISTORY'],['plates','PLATES'],['settings','⚙']];
    n.innerHTML=ts.map(([v,l])=>`<button class="${VIEW===v?'a':''}" onclick="go('${v}')">${l}</button>`).join('')}
  const a=document.getElementById('app');
  if(clockIV){clearInterval(clockIV);clockIV=null}
  if(VIEW==='home')rHome(a);else if(VIEW==='workout'){rWork(a);clockIV=setInterval(()=>{const c=document.getElementById('sess-clock');if(c)c.textContent=elapsed()},1000)}
  else if(VIEW==='summary')rSummary(a);else if(VIEW==='history')rHist(a);else if(VIEW==='plates')rPlates(a);else if(VIEW==='settings')rSettings(a)}
function go(v){VIEW=v;EXP=null;render();window.scrollTo(0,0)}

// ─── HOME ────────────────────────────────────────────────
function rHome(el){
  const nd=D.nextDay||'A',exs=PR[nd];
  const dl=getDeloadInfo();

  let h='<div class="sec">';
  // Deload banner
  if(dl){if(dl.due)h+=`<div class="deload-banner">⚠ Week ${dl.weeks} — consider a deload this week (${dl.sessionsSince} sessions since last)
    <button class="btn-sm btn-dk" style="margin-top:6px" onclick="markDeload()">I deloaded</button></div>`;
  else h+=`<div class="deload-banner deload-ok">Week ${dl.weeks}/7 · ${dl.sessionsSince} sessions since ${dl.due?'start':'last deload'}</div>`}

  h+=`<div class="cd cd-hl"><div class="lb">NEXT WORKOUT</div>
  <div style="display:flex;align-items:center;gap:10px;margin:6px 0 10px">
    <span class="bg bg-${nd.toLowerCase()}">DAY ${nd}</span>
    <span class="mu" style="font-size:11px">${D.sessions.length} sessions</span></div>`;

  for(const ex of exs){
    const sg=getSmartSugg(ex),skip=getSkips(nd,ex.id);
    const ssPartner=ex.ss?exs.find(e=>e.id===ex.ss):null;
    h+=`<div class="pr-row"><div style="flex:1">
      <span style="font-size:13px;color:var(--tx);font-weight:500">${esc(ex.nm)}</span>
      <span class="mu" style="margin-left:6px;font-size:10px">${ex.s}×${ex.rp}</span>
      ${ssPartner?`<span class="ss-hint">⇄ ${esc(ssPartner.nm)}</span>`:''}
      ${skip.skips>=2&&skip.total>=2?`<div class="skip-warn">⚠ Skipped ${skip.skips}/${skip.total} recent sessions</div>`:''}
      ${sg.detail?`<div class="dm" style="margin-top:1px">${esc(sg.detail)}</div>`:''}
      </div><div style="text-align:right;flex-shrink:0">`;
    if(sg.type==='up')h+=`<span style="font-size:11px;color:var(--gr);font-weight:600">${sg.text}</span>`;
    else if(sg.type==='dn')h+=`<span style="font-size:11px;color:var(--rd);font-weight:600">${sg.text}</span>`;
    else if(sg.type==='stay')h+=`<span style="font-size:11px;color:var(--go)">${sg.text}</span>`;
    else h+=`<span style="font-size:11px;color:var(--bl)">NEW</span>`;
    h+=`</div></div>`;
    if(ex.tp==='bb'&&sg.wt)h+=`<div style="font-size:9px;color:var(--dm);margin:-4px 0 2px 2px">Load /side: ${esc(fmtPl(sg.wt))}</div>`}

  h+=`<button class="btn btn-go" style="margin-top:14px" onclick="startW('${nd}')">START DAY ${nd}</button></div>`;
  h+=`<div style="display:flex;gap:8px;margin-bottom:16px">`;
  for(const d of['A','B','C'])if(d!==nd)h+=`<button class="btn btn-dk" style="flex:1;font-size:12px;padding:10px 0" onclick="startW('${d}')">DAY ${d}</button>`;
  h+=`</div>`;

  const rec=[...D.sessions].reverse().slice(0,5);
  if(rec.length){h+=`<div class="lb" style="margin-bottom:8px">RECENT</div>`;
    for(const s of rec){h+=`<div class="cd"><div style="display:flex;align-items:center;gap:8px">
      <span class="bg bg-${s.day.toLowerCase()}">DAY ${s.day}</span>
      <span style="font-size:11px;color:#999">${fmtD(s.date)}</span>
      <span class="dm">${dAgo(s.date)}</span>
      ${s.difficulty?`<span style="font-size:10px;color:var(--or)">RPE ${s.difficulty}/5</span>`:''}
      </div><div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:3px">`;
      for(const e of s.ex){const def=[...PR.A,...PR.B,...PR.C].find(p=>p.id===e.id);
        const mx=Math.max(...e.reps.filter(r=>r>0));
        h+=`<span class="ch">${esc(def?.nm||e.id)}: ${e.wt?e.wt+'kg':''}${e.band||''}${mx>0?' ×'+mx:''}</span>`}
      h+=`</div></div>`}}
  h+=`</div>`;el.innerHTML=h}

function markDeload(){D.lastDeload=today();save();render()}

// ─── START WORKOUT ───────────────────────────────────────
function startW(day){
  ADAY=day;LOG={};SESS_START=Date.now();
  for(const ex of PR[day]){const last=getLast(ex.id),sg=getSmartSugg(ex);
    LOG[ex.id]={wt:sg.wt||last?.wt||(ex.tp==='bb'?BAR:''),band:last?.band||'',
      reps:last?last.reps.slice(0,ex.s).map(r=>r>0?r:''):Array(ex.s).fill(''),
      notes:'',prefilled:!!last,showWarmup:false}}
  VIEW='workout';render();window.scrollTo(0,0)}

// ─── WORKOUT ─────────────────────────────────────────────
function rWork(el){
  const exs=PR[ADAY],filled=Object.values(LOG).filter(v=>v.reps.some(r=>r!==''&&r>0)).length;
  let h=`<div class="sec">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:10px">
        <span class="bg bg-${ADAY.toLowerCase()}">DAY ${ADAY}</span>
        <span class="mu">${filled}/${exs.length}</span>
        <span class="sess-clock" id="sess-clock">${elapsed()}</span></div>
      <button class="btn btn-dk btn-sm" onclick="cancelW()">✕</button></div>`;

  exs.forEach((ex,idx)=>{
    const last=getLast(ex.id),sg=getSmartSugg(ex),log=LOG[ex.id];
    const skip=getSkips(ADAY,ex.id);
    const ssPartner=ex.ss?exs.find(e=>e.id===ex.ss):null;
    const pr=last?checkPR(ex.id,Number(log.wt)||0,log.reps.map(Number)):[];

    h+=`<div class="ex-cd">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div><div class="ex-nm">${idx+1}/${exs.length} ${esc(ex.nm)}${pr.length?'<span class="pr-badge">🏆 PR!</span>':''}</div>
        <div class="ex-mt">${ex.s}×${ex.rp} · Rest ${ex.rst} · RIR ${ex.rir}
        ${ssPartner?`<span class="ss-hint">⇄ ${esc(ssPartner.nm)}</span>`:''}</div></div></div>`;

    // Skip warning
    if(skip.skips>=2&&skip.total>=2)h+=`<div class="skip-warn">⚠ Skipped ${skip.skips} of last ${skip.total} sessions</div>`;

    // Smart suggestion with trajectory
    h+=`<div class="sg sg-${sg.type==='up'?'up':sg.type==='dn'?'dn':sg.type==='new'?'nw':'st'}">${esc(sg.text)}</div>`;
    if(sg.detail)h+=`<div class="dm" style="margin-bottom:4px">${esc(sg.detail)}</div>`;
    h+=trajH(sg.traj);

    // Last session
    if(last)h+=`<div class="dm" style="margin-bottom:6px">Last (${fmtD(last.date)}): ${last.wt?last.wt+'kg':''}${last.band?' '+last.band:''} [${last.reps.join(',')}]</div>`;

    // Weight / band input
    if(ex.tp==='bb'){
      const cur=Number(log.wt)||BAR,ix=VW.indexOf(cur);
      h+=`<div class="stp" style="margin-bottom:2px">
        <div class="stp-b${ix<=0?' dis':''}" onclick="stepWt('${ex.id}',-1)">−</div>
        <div class="stp-v">${cur}<span>kg</span></div>
        <div class="stp-b${ix>=VW.length-1?' dis':''}" onclick="stepWt('${ex.id}',1)">+</div>
        <button class="btn-sm btn-dk" style="margin-left:8px;font-size:9px;padding:5px 8px" onclick="togWarmup('${ex.id}')">${log.showWarmup?'Hide':'Warm-up'}</button></div>`;
      h+=plateH(cur);
      h+=`<div style="font-size:9px;color:var(--dm);margin-bottom:4px">/side: ${esc(fmtPl(cur))}</div>`;
      // Warm-up sets
      if(log.showWarmup){const wu=warmupSets(cur);
        if(wu.length){h+=`<div class="warmup"><div style="font-weight:600;margin-bottom:4px;color:var(--go)">WARM-UP</div>`;
          for(const s of wu)h+=`<div class="warmup-set"><span>${s.wt}kg × ${s.reps}</span><span style="color:var(--dm)">${s.label}</span></div>`;
          h+=`</div>`}}
    } else if(ex.tp==='band'){
      h+=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
        <span style="font-size:11px;color:var(--mu)">Band:</span>
        <select class="bs" onchange="setL('${ex.id}','band',this.value)">
        <option value="">Select...</option>${BANDS.map(b=>`<option value="${esc(b)}"${log.band===b?' selected':''}>${esc(b)}</option>`).join('')}</select></div>`;
    } else {
      h+=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
        <span style="font-size:11px;color:var(--mu)">Load:</span>
        <input type="number" class="ri" style="width:58px" value="${log.wt||''}" placeholder="—" oninput="setL('${ex.id}','wt',this.value)">
        <span class="dm">kg</span>${ex.tp==='kb'?'<span class="dm" style="margin-left:4px">KBs: 20/32</span>':''}</div>`}

    // Reps with pre-fill indicator
    h+=`<div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:4px">
      <span style="font-size:10px;color:var(--mu)">Reps:</span>`;
    for(let i=0;i<ex.s;i++){
      const v=log.reps[i],isPre=log.prefilled&&v!==''&&!document.querySelector(`[data-rep="${ex.id}-${i}"]`);
      h+=`<div style="text-align:center"><div style="font-size:8px;color:var(--dm);margin-bottom:1px">S${i+1}</div>
        <input type="number" class="ri${isPre?' prefilled':''}" value="${v}" placeholder="—" data-rep="${ex.id}-${i}"
          onfocus="repFocus(this,'${ex.id}',${i})" oninput="setRep('${ex.id}',${i},this.value)" inputmode="numeric"></div>`}
    h+=`</div>`;

    // Rest timer button
    h+=`<div style="display:flex;gap:8px;margin-top:8px;align-items:center">
      <button class="btn-sm btn-dk" style="font-size:10px;padding:6px 12px" onclick="startTimer(${ex.rstS})">⏱ Rest ${ex.rst}</button>`;
    // Copy last reps button
    if(last)h+=`<button class="btn-sm btn-dk" style="font-size:10px;padding:6px 12px" onclick="copyLast('${ex.id}')">↩ Copy last</button>`;
    h+=`</div>`;

    h+=`<input type="text" class="ni" value="${esc(log.notes)}" placeholder="Notes..." onchange="setL('${ex.id}','notes',this.value)">`;
    h+=`<div class="prog">${esc(ex.rl)}</div></div>`});

  h+=`<button class="btn btn-go" style="margin-top:10px" onclick="finishW()">FINISH & SAVE</button></div>`;
  el.innerHTML=h}

function stepWt(id,dir){const c=Number(LOG[id].wt)||BAR,ix=VW.indexOf(c);
  if(dir<0&&ix>0)LOG[id].wt=VW[ix-1];if(dir>0&&ix<VW.length-1)LOG[id].wt=VW[ix+1];LOG[id].prefilled=false;render()}
function setL(id,f,v){LOG[id][f]=v}
function setRep(id,i,v){LOG[id].reps[i]=v;LOG[id].prefilled=false}
function repFocus(el,id,i){if(LOG[id].prefilled){el.classList.remove('prefilled')}}
function togWarmup(id){LOG[id].showWarmup=!LOG[id].showWarmup;render()}
function copyLast(id){const last=getLast(id);if(!last)return;
  const ex=[...PR.A,...PR.B,...PR.C].find(e=>e.id===id);
  LOG[id].reps=last.reps.slice(0,ex?.s||4).map(r=>r>0?r:'');LOG[id].prefilled=true;render()}

function finishW(){
  const exs=Object.entries(LOG).filter(([,v])=>v.reps.some(r=>r!==''&&r>0))
    .map(([id,v])=>({id,wt:v.wt?Number(v.wt):null,reps:v.reps.map(r=>r===''?0:Number(r)),band:v.band||'',notes:v.notes}));
  if(!exs.length){if(!confirm('No exercises logged. Save empty session?'))return}
  // Detect PRs for summary
  const prs=[];for(const e of exs){const p=checkPR(e.id,e.wt,e.reps);if(p.length){
    const def=[...PR.A,...PR.B,...PR.C].find(x=>x.id===e.id);prs.push({name:def?.nm||e.id,types:p})}}
  // Calculate volume
  let totalVol=0,totalSets=0,totalReps=0;
  for(const e of exs){const vr=e.reps.filter(r=>r>0);totalSets+=vr.length;totalReps+=vr.reduce((a,b)=>a+b,0);
    if(e.wt)totalVol+=e.wt*vr.reduce((a,b)=>a+b,0)}
  const duration=SESS_START?Math.round((Date.now()-SESS_START)/60000):0;
  // Store summary for display
  window._summ={exs,prs,totalVol,totalSets,totalReps,duration,day:ADAY};
  SUMM_DIFF=0;SHOW_SUMMARY=true;VIEW='summary';render();window.scrollTo(0,0)}

function cancelW(){if(confirm('Discard this workout?')){ADAY=null;LOG={};SESS_START=null;clearTimer();go('home')}}

// ─── SUMMARY ─────────────────────────────────────────────
function rSummary(el){
  const S=window._summ;
  let h=`<div class="sec"><div class="summary-card">
    <div style="font-size:20px;font-weight:800;color:var(--go);margin-bottom:12px">SESSION COMPLETE</div>
    <div class="bg bg-${S.day.toLowerCase()}" style="margin-bottom:16px">DAY ${S.day}</div>
    <div style="display:flex;justify-content:center;gap:24px;margin-bottom:16px">
      <div class="summary-stat"><div class="summary-num">${S.duration}</div><div class="summary-label">MINUTES</div></div>
      <div class="summary-stat"><div class="summary-num">${S.totalSets}</div><div class="summary-label">SETS</div></div>
      <div class="summary-stat"><div class="summary-num">${S.totalReps}</div><div class="summary-label">REPS</div></div>
      ${S.totalVol?`<div class="summary-stat"><div class="summary-num">${Math.round(S.totalVol/100)/10}k</div><div class="summary-label">VOLUME KG</div></div>`:''}
    </div>`;

  // PRs
  if(S.prs.length){h+=`<div style="margin-bottom:14px">`;
    for(const p of S.prs)h+=`<div style="margin-bottom:4px"><span class="pr-badge">🏆 PR!</span> ${esc(p.name)} — ${p.types.join(' + ')}</div>`;
    h+=`</div>`}

  // Difficulty rating
  h+=`<div style="margin-bottom:8px"><div class="lb" style="margin-bottom:8px">HOW HARD WAS TODAY?</div>
    <div style="display:flex;justify-content:center;gap:10px">`;
  for(let i=1;i<=5;i++){
    const labels=['Easy','Moderate','Solid','Hard','Brutal'];
    h+=`<div style="text-align:center;cursor:pointer" onclick="setDiff(${i})">
      <div class="diff-btn${SUMM_DIFF===i?' sel':''}">${['😌','🙂','💪','😤','🔥'][i-1]}</div>
      <div style="font-size:8px;color:var(--dm);margin-top:3px">${labels[i-1]}</div></div>`}
  h+=`</div></div></div>`;

  // Exercise breakdown
  h+=`<div class="lb" style="margin-bottom:8px">EXERCISES</div>`;
  for(const e of S.exs){const def=[...PR.A,...PR.B,...PR.C].find(x=>x.id===e.id);
    h+=`<div class="cd"><div style="font-weight:600;color:var(--tx)">${esc(def?.nm||e.id)}</div>
      <div class="mu">${e.wt?e.wt+'kg':''}${e.band?' '+e.band:''} — [${e.reps.join(',')}]
      ${e.notes?'— '+esc(e.notes):''}</div></div>`}

  h+=`<button class="btn btn-go" style="margin-top:10px" onclick="saveSummary()">SAVE & CONTINUE</button></div>`;
  el.innerHTML=h}

function setDiff(n){SUMM_DIFF=n;render()}
function saveSummary(){
  const S=window._summ,nxt={A:'B',B:'C',C:'A'};
  D.sessions.push({id:'s'+Date.now(),date:today(),day:S.day,ex:S.exs,difficulty:SUMM_DIFF||null,
    duration:S.duration,volume:S.totalVol});
  D.nextDay=nxt[S.day];save();ADAY=null;LOG={};SESS_START=null;SHOW_SUMMARY=false;clearTimer();go('home')}

// ─── HISTORY ─────────────────────────────────────────────
function rHist(el){
  const ss=[...D.sessions].reverse();
  let h=`<div class="sec"><div class="lb" style="margin-bottom:12px">ALL SESSIONS (${ss.length})</div>`;
  for(const s of ss){
    h+=`<div class="cd" onclick="togExp('${s.id}')">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="bg bg-${s.day.toLowerCase()}">DAY ${s.day}</span>
          <span style="font-size:11px;color:#999">${fmtD(s.date)}</span>
          ${s.difficulty?`<span style="font-size:10px;color:var(--or)">${['😌','🙂','💪','😤','🔥'][s.difficulty-1]}</span>`:''}
        </div><span class="dm">${s.duration?s.duration+'min':''} ${dAgo(s.date)}</span></div>`;
    if(EXP===s.id){h+=`<div style="margin-top:10px">`;
      for(const e of s.ex){const def=[...PR.A,...PR.B,...PR.C].find(p=>p.id===e.id);
        h+=`<div style="padding:6px 0;border-bottom:1px solid #1a1c24"><div style="font-size:13px;font-weight:600;color:var(--tx)">${esc(def?.nm||e.id)}</div>
          <div style="font-size:12px;color:var(--mu)">${e.wt?e.wt+'kg':''}${e.band?' '+e.band:''} [${e.reps.join(',')}]
          ${e.notes?`<span style="color:var(--dm)"> — ${esc(e.notes)}</span>`:''}</div>`;
        if(e.wt&&e.wt>BAR)h+=plateH(e.wt);h+=`</div>`}
      h+=`<button class="btn btn-rd btn-sm" style="margin-top:8px" onclick="event.stopPropagation();delS('${s.id}')">DELETE</button></div>`}
    h+=`</div>`}
  h+=`</div>`;el.innerHTML=h}
function togExp(id){EXP=EXP===id?null:id;render()}
function delS(id){if(!confirm('Delete this session?'))return;D.sessions=D.sessions.filter(s=>s.id!==id);
  if(D.sessions.length){const l=D.sessions[D.sessions.length-1].day;D.nextDay={A:'B',B:'C',C:'A'}[l]}else D.nextDay='A';save();render()}

// ─── PLATES ──────────────────────────────────────────────
function rPlates(el){
  let h=`<div class="sec"><div class="lb" style="margin-bottom:12px">ALL VALID WEIGHTS (${VW.length})</div>`;
  let prev=null;for(const w of VW){const j=prev!==null?`+${w-prev}kg`:'';
    h+=`<div class="ptr"><div><span style="font-size:15px;font-weight:700;color:#fff">${w}</span>
      <span class="dm">kg</span></div><div style="text-align:right">
      <div style="font-size:10px;color:var(--mu)">${esc(fmtPl(w))}</div>
      ${j?`<div style="font-size:9px;color:var(--gr)">${j}</div>`:''}</div></div>`;prev=w}
  h+=`</div>`;el.innerHTML=h}

// ─── SETTINGS ────────────────────────────────────────────
function rSettings(el){
  const sz=(new Blob([JSON.stringify(D)])).size;
  let h=`<div class="sec">
    <div class="lb" style="margin-bottom:12px">DATA & SETTINGS</div>
    <div class="cd"><div style="font-size:12px;color:var(--tx);line-height:1.8">
      <div><span style="color:var(--go)">Sessions:</span> ${D.sessions.length}</div>
      <div><span style="color:var(--go)">Next day:</span> ${D.nextDay}</div>
      <div><span style="color:var(--go)">Data:</span> ${(sz/1024).toFixed(1)} KB</div></div></div>

    <div class="lb" style="margin-top:16px;margin-bottom:8px">EQUIPMENT</div>
    <div class="cd"><div style="font-size:12px;color:#999;line-height:1.8">
      <div><span style="color:var(--go)">Bar:</span> 11kg (1.8m Olympic, no bearings)</div>
      <div><span style="color:var(--p10)">10kg</span> ×4 · <span style="color:var(--p5)">5kg</span> ×4 · <span style="color:var(--p25)">2.5kg</span> ×2 · <span style="color:var(--p1)">1kg</span> ×4</div>
      <div>Range: ${VW[0]}–${VW[VW.length-1]}kg (${VW.length} combos)</div>
      <div style="margin-top:4px"><span style="color:var(--go)">KBs:</span> 32kg (fixed) · 20kg (adjustable)</div></div></div>

    <div class="lb" style="margin-top:16px;margin-bottom:8px">BACKUP</div>
    <button class="btn btn-dk" style="margin-bottom:8px" onclick="expD()">↓ EXPORT DATA</button>
    <label class="btn btn-dk" style="text-align:center;cursor:pointer;display:block;margin-bottom:8px">↑ IMPORT DATA
      <input type="file" accept=".json" style="display:none" onchange="impD(event)"></label>

    <div class="lb" style="margin-top:16px;margin-bottom:8px">DANGER ZONE</div>
    <button class="btn btn-rd" style="margin-bottom:6px" onclick="resetD()">RESET TO ORIGINAL DATA</button>
    <div class="dm" style="font-size:9px">Restores initial logged sessions</div>

    <div class="lb" style="margin-top:24px;margin-bottom:8px">BAND ORDER (most → least help)</div>
    <div class="cd"><div style="font-size:12px;color:var(--mu);line-height:2">${BANDS.map((b,i)=>
      `<span style="color:${i<3?'var(--gr)':i<5?'var(--go)':'var(--tx)'}">${esc(b)}</span>`).join(' → ')}</div></div>

    <div class="lb" style="margin-top:16px;margin-bottom:8px">PROGRESSION RULES</div>
    <div class="cd"><div style="font-size:12px;line-height:1.7">
      <div style="color:var(--gr);font-weight:600;margin-bottom:4px">↑ INCREASE</div>
      <div style="color:var(--mu);margin-bottom:10px">Hit top of rep range on ALL sets → next valid weight</div>
      <div style="color:var(--go);font-weight:600;margin-bottom:4px">→ MAINTAIN</div>
      <div style="color:var(--mu);margin-bottom:10px">Within range but not all sets at top → same weight, push reps</div>
      <div style="color:var(--or);font-weight:600;margin-bottom:4px">⟳ STALL (×3 = drop)</div>
      <div style="color:var(--mu);margin-bottom:10px">Bottom of range / mixed results → same weight. 3× stall → drop one step & rebuild</div>
      <div style="color:var(--rd);font-weight:600;margin-bottom:4px">↓ REDUCE</div>
      <div style="color:var(--mu);margin-bottom:10px">Missed minimum on 2+ sets → drop one weight step</div>
      <div style="color:var(--tx);font-weight:600;margin-top:12px;margin-bottom:4px">FALLBACK (can't add weight)</div>
      <div style="color:var(--mu)">More reps → 2s pause → 3s eccentric → +1 set</div></div></div>
  </div>`;
  el.innerHTML=h}

function expD(){const b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`workout-${today()}.json`;a.click()}
function impD(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=e=>{try{const d=JSON.parse(e.target.result);if(!d.sessions)throw 0;
    if(!confirm(`Import ${d.sessions.length} sessions?`))return;D=d;save();render()}catch(e){alert('Invalid file')}};
  r.readAsText(f);ev.target.value=''}
function resetD(){if(!confirm('Reset all data?'))return;D=structuredClone(SEED);save();go('home')}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
load();render();
if('serviceWorker' in navigator){const c=`self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(clients.claim()));self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>new Response('Offline'))))});`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([c],{type:'application/javascript'}))).catch(()=>{})}
const mf={name:'Rack-Free Tracker',short_name:'Tracker',start_url:'.',display:'standalone',background_color:'#0c0d10',theme_color:'#0c0d10',
  icons:[{src:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%230c0d10' width='100' height='100' rx='20'/><text x='50' y='65' text-anchor='middle' font-size='50'>🏋️</text></svg>",sizes:'any',type:'image/svg+xml'}]};
const ml=document.createElement('link');ml.rel='manifest';ml.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/json'}));document.head.appendChild(ml);
</script>
</body>
