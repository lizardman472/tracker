name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The SW cache-bump check diffs against the push/PR base — the default
          # shallow clone has no parent commits, which made every diff fail and
          # the warning fire on every push, including docs-only ones.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Calculation engine tests
        run: node tests/calc.test.js
      - name: Hex-bar / ladder tests
        run: node tests/hex.test.js
      - name: Render smoke tests
        run: node tests/render.smoke.js
      - name: Service-worker tests
        run: node tests/sw.test.js
      - name: Install Chromium for the browser suite
        # The stubbed-DOM suites cannot catch "the markup builds and says nothing useful" —
        # that is how the return-ramp advisory shipped invisible with every other suite green
        # (AUDIT §26.6). This installs the one browser tests/browser.test.js needs.
        run: npm i -D playwright@1.56 && npx playwright install --with-deps chromium
      - name: Browser tests
        run: node tests/browser.test.js
      - name: Service-worker mutation check
        # Proves the battery above actually fails when the SW breaks — a new test file that
        # passes on its first run has not yet demonstrated it can catch anything.
        run: node tests/sw.mutate.js
      - name: Service-worker cache version must change when app files change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # If index.html changed since the base but sw.js's cache name didn't, stale
          # clients would keep the old shell. Warn loudly (non-blocking for docs-only edits).
          # Base = PR base for pull_request events, previous head for pushes. A zero/unknown
          # SHA (new branch, force push) falls back to HEAD~1; if even that is missing, skip.
          BASE="$BASE_SHA"
          if [ -z "$BASE" ] || ! git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
            BASE="HEAD~1"
          fi
          if ! git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
            echo "no base commit to diff against — skip"
          elif git diff --quiet "$BASE" -- index.html; then
            echo "index.html unchanged — skip"
          elif git diff "$BASE" -- sw.js | grep -q "^[+-]const C"; then
            echo "cache version bumped ✓"
          else
            echo "::warning::index.html changed but sw.js cache version (const C) did not — installed PWAs may serve the stale shell"
          fi
