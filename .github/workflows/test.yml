name: tests
on:
  push:
  pull_request:
jobs:
  test:
    # Playwright 1.56 needs a supported runner; ubuntu-latest moved to 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The SW cache-bump check diffs against the push/PR base — the default
          # shallow clone has no parent commits, which made every diff fail and
          # the warning fire on every push, including docs-only ones.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Calculation engine tests
        run: node tests/calc.test.js
      - name: Hex-bar / ladder tests
        run: node tests/hex.test.js
      - name: Storage and recovery regressions
        run: node tests/storage.test.js
      - name: Deload and shorter routine regressions
        run: node tests/recovery.test.js
      - name: Analytics boundary and comparability regressions
        run: node tests/analytics.test.js
      - name: Render smoke tests
        run: node tests/render.smoke.js
      - name: Service-worker tests
        run: node tests/sw.test.js
      - name: Cache-version guard regression tests
        run: node tests/cache-version-guard.test.js
      - name: Install Chromium for the browser suite
        # The stubbed-DOM suites cannot catch "the markup builds and says nothing useful" —
        # that is how the return-ramp advisory shipped invisible with every other suite green
        # (AUDIT §26.6). This installs the one browser tests/browser.test.js needs.
        run: npm i -D playwright@1.56 && npx playwright install --with-deps chromium
      - name: Browser tests
        run: node tests/browser.test.js
      - name: Service-worker mutation check
        # Retain the semantic-fault report in the canonical screenshot/JSON artifact.
        run: node tests/sw.mutate.js
      - name: Recovery layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-layout
          path: |
            test-results/recovery-layout/*.png
            test-results/recovery-layout/*.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Service-worker cache version must change when app files change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .github/scripts/check-cache-version.cjs
