<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">
<meta name="theme-color" content="#0c0d10">
<meta name="mobile-web-app-capable" content="yes">
<title>Rack-Free Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
<style>
:root{--bg:#0c0d10;--cd:#13141a;--cb:#1e2028;--ib:#1a1c24;--ibr:#2a2d38;--tx:#dce0e8;--mu:#6b7084;
--dm:#444;--go:#f0c850;--bl:#50b0f0;--gr:#50f0a0;--rd:#f07070;--or:#ffaa44;--pu:#c084fc;
--p10:#c44040;--p5:#4080c4;--p25:#50a050;--p1:#a0a0a0;--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body{max-width:480px;margin:0 auto;padding-bottom:calc(74px + var(--sab))}
input,select,button,textarea{font-family:inherit}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
.hdr{padding:14px 16px 8px;border-bottom:1px solid var(--cb);position:sticky;top:0;background:var(--bg);z-index:100}
.hdr h1{font-size:16px;font-weight:800;color:var(--go);letter-spacing:1.5px}
.hdr small{font-size:10px;color:var(--dm)}
.nav{display:flex;gap:1px;padding:4px 10px 2px;background:var(--bg);position:sticky;top:46px;z-index:99}
.nav button{flex:1;padding:8px 0;font-size:10px;font-weight:600;border:none;border-bottom:2px solid transparent;
background:0;color:var(--mu);cursor:pointer;letter-spacing:.4px}
.nav button.a{color:var(--go);border-bottom-color:var(--go)}
.sec{padding:12px 16px}
.cd{background:var(--cd);border-radius:10px;padding:12px 14px;margin-bottom:10px;border:1px solid var(--cb)}
.cd-hl{border-color:var(--go)}
.bg{display:inline-block;padding:2px 9px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:1px}
.bg-a{background:var(--go);color:var(--bg)}.bg-b{background:var(--bl);color:var(--bg)}.bg-c{background:var(--gr);color:var(--bg)}
.lb{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:4px}
.mu{font-size:12px;color:var(--mu)}.dm{font-size:11px;color:var(--dm)}
.ex-cd{background:var(--cd);border-radius:10px;padding:12px 14px;margin-bottom:12px;border:1px solid var(--cb)}
.sg{font-size:11px;font-weight:600;padding:3px 7px;border-radius:5px;display:inline-block;margin-bottom:5px}
.sg-up{color:var(--gr);background:rgba(80,240,160,.08)}.sg-st{color:var(--go);background:rgba(240,200,80,.08)}
.sg-nw{color:var(--bl);background:rgba(80,176,240,.08)}.sg-dn{color:var(--rd);background:rgba(240,107,107,.08)}
.ri{width:44px;height:40px;font-size:16px;font-weight:600;background:var(--ib);border:1px solid var(--ibr);
border-radius:8px;color:#fff;text-align:center;outline:none}
.ri:focus{border-color:var(--go)}.ri.pf{color:var(--mu)}
.ni{width:100%;padding:7px 10px;font-size:12px;background:var(--ib);border:1px solid var(--ibr);border-radius:8px;color:#999;outline:none;margin-top:5px}
.ni:focus{border-color:var(--go);color:var(--tx)}
.bs{padding:7px 10px;font-size:12px;background:var(--ib);border:1px solid var(--ibr);border-radius:8px;color:#fff;outline:none;max-width:190px}
.stp{display:flex;align-items:center;gap:4px}
.stp-b{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:8px;
border:1px solid var(--ibr);background:var(--ib);color:var(--tx);font-size:22px;font-weight:700;cursor:pointer;user-select:none}
.stp-b:active{background:var(--cb)}.stp-b.dis{color:#333}
.stp-v{min-width:68px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:8px;
background:var(--ib);border:2px solid var(--go);font-size:18px;font-weight:800;color:var(--go)}
.stp-v span{font-size:10px;color:var(--mu);margin-left:2px;font-weight:400}
.pls{display:flex;align-items:center;gap:2px;padding:3px 0;flex-wrap:wrap}
.pl{height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff}
.pl-10{background:var(--p10);width:24px}.pl-5{background:var(--p5);width:20px}.pl-2{background:var(--p25);width:16px}.pl-1{background:var(--p1);width:13px}
.btn{padding:14px 20px;font-size:15px;font-weight:700;border:none;border-radius:10px;cursor:pointer;width:100%;display:block}
.btn:active{opacity:.8}
.btn-go{background:var(--go);color:var(--bg)}.btn-dk{background:var(--cb);color:var(--tx)}
.btn-rd{background:#2a1a1a;color:var(--rd);border:1px solid #3a2020}
.btn-sm{padding:6px 12px;font-size:10px;width:auto;display:inline-block;border-radius:6px}
.ch{display:inline-block;font-size:10px;padding:2px 6px;border-radius:4px;background:var(--ib);color:var(--mu);margin:0 3px 3px 0}
.prog{font-size:10px;color:var(--dm);font-style:italic;margin-top:5px}
.timer-bar{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#1a1c24;
border-top:2px solid var(--go);padding:10px 20px calc(10px + var(--sab));z-index:200;display:flex;justify-content:space-between;align-items:center}
.timer-bar.done{border-top-color:var(--gr);animation:pulse .5s ease 3}
@keyframes pulse{0%,100%{background:#1a1c24}50%{background:#1a2d1a}}
.timer-time{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--go)}
.timer-bar.done .timer-time{color:var(--gr)}
.pr-badge{display:inline-block;font-size:9px;font-weight:800;color:#ffd700;background:rgba(255,215,0,.15);
padding:2px 6px;border-radius:4px;margin-left:5px;letter-spacing:.5px}
.deload-banner{background:rgba(255,170,68,.08);border:1px solid rgba(255,170,68,.25);border-radius:8px;padding:10px 14px;margin-bottom:10px;font-size:12px;color:var(--or)}
.deload-ok{background:rgba(80,240,160,.06);border-color:rgba(80,240,160,.2);color:var(--gr)}
.skip-warn{font-size:10px;color:var(--or);padding:2px 6px;background:rgba(255,170,68,.08);border-radius:5px;display:inline-block;margin-bottom:4px}
.traj{display:flex;gap:3px;align-items:center;margin-bottom:5px}
.traj-dot{font-size:10px;padding:1px 4px;border-radius:3px;font-weight:600}
.traj-up{color:var(--gr);background:rgba(80,240,160,.1)}.traj-same{color:var(--go);background:rgba(240,200,80,.1)}
.traj-dn{color:var(--rd);background:rgba(240,107,107,.1)}
.warmup{background:var(--ib);border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:11px;color:var(--mu)}
.warmup-set{display:flex;justify-content:space-between;padding:2px 0}
.ss-hint{font-size:9px;color:var(--pu);padding:2px 5px;background:rgba(192,132,252,.08);border-radius:4px;display:inline-block;margin-left:3px}
.summary-card{background:var(--cd);border-radius:12px;padding:20px;margin-bottom:14px;border:1px solid var(--go);text-align:center}
.summary-num{font-size:24px;font-weight:800;color:var(--go)}
.summary-label{font-size:9px;color:var(--mu);text-transform:uppercase;letter-spacing:1px}
.diff-btn{width:42px;height:42px;border-radius:50%;border:2px solid var(--ibr);background:var(--ib);
font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.diff-btn.sel{border-color:var(--go);background:rgba(240,200,80,.15)}
/* Quick log */
.ql-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--cb)}
.ql-name{flex:1;font-size:13px;font-weight:600;color:var(--tx)}
.ql-last{font-size:10px;color:var(--mu);text-align:right;min-width:50px}
/* Stats */
.stat-card{background:var(--cd);border-radius:10px;padding:14px;margin-bottom:10px;border:1px solid var(--cb);text-align:center}
.stat-big{font-size:32px;font-weight:800;color:var(--go)}
.stat-med{font-size:20px;font-weight:700}
.stat-lbl{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
svg text{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
/* Heatmap */
.hm-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.hm-cell{aspect-ratio:1;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--dm)}
.hm-hdr{font-size:9px;color:var(--mu);text-align:center;padding:2px}
/* Fatigue gauge */
.fg-bar{height:8px;border-radius:4px;background:var(--ib);overflow:hidden;margin:6px 0}
.fg-fill{height:100%;border-radius:4px;transition:.3s}
/* Streak */
.streak-banner{background:rgba(240,200,80,.06);border:1px solid rgba(240,200,80,.2);border-radius:8px;
padding:10px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.streak-num{font-size:28px;font-weight:800;color:var(--go)}
.milestone{background:rgba(192,132,252,.08);border:1px solid rgba(192,132,252,.2);border-radius:8px;
padding:8px 14px;margin-bottom:8px;font-size:12px;color:var(--pu)}
/* PR table */
.pr-tbl{width:100%}.pr-tbl td,.pr-tbl th{padding:6px 8px;text-align:left;font-size:12px;border-bottom:1px solid var(--cb)}
.pr-tbl th{color:var(--mu);font-size:10px;text-transform:uppercase;letter-spacing:.5px}
/* Exercise select */
.ex-sel{width:100%;padding:10px 12px;font-size:14px;background:var(--ib);border:1px solid var(--ibr);border-radius:8px;color:var(--go);font-weight:600;outline:none;margin-bottom:12px}
</style>
</head>
<body>
<div class="hdr"><h1>RACK-FREE TRACKER</h1><small>11kg bar · 4×10 · 4×5 · 2×2.5 · 4×1 · KB 32/20</small></div>
<div class="nav" id="nav"></div>
<div id="app"></div>
<div id="timer-root"></div>
<script>
// ═══════════════════════ EQUIPMENT ═══════════════════════
const BAR=11,PL=[{w:10,q:4},{w:5,q:4},{w:2.5,q:2},{w:1,q:4}];
const VW=(()=>{const s=new Set();for(let a=0;a<=2;a++)for(let b=0;b<=2;b++)for(let c=0;c<=1;c++)for(let d=0;d<=2;d++)s.add(BAR+2*(a*10+b*5+c*2.5+d*1));return[...s].sort((a,b)=>a-b)})();
function perSide(t){let r=(t-BAR)/2;if(r<0)return null;const o=[];for(const p of PL){const m=p.q/2;let c=Math.min(Math.floor(r/p.w),m);if(c>0){o.push({w:p.w,c});r-=c*p.w}}return Math.abs(r)<.01?o:null}
function fmtPl(t){if(t<=BAR)return'Bar only';const p=perSide(t);return p?p.map(x=>`${x.c}×${x.w%1?x.w:x.w|0}kg`).join(' + '):'—'}
function nxUp(c){for(const w of VW)if(w>c)return w;return c}
function nxDn(c){for(let i=VW.length-1;i>=0;i--)if(VW[i]<c)return VW[i];return c}
function snapW(t){let b=VW[0];for(const w of VW)if(Math.abs(w-t)<Math.abs(b-t))b=w;return b}
function plateH(t){if(!t||t<=BAR)return'';const ps=perSide(t);if(!ps||!ps.length)return'';
let h='<div class="pls"><span style="font-size:9px;color:var(--dm);margin-right:3px">/side:</span>';
for(const p of ps)for(let i=0;i<p.c;i++){const c=p.w>=10?'pl-10':p.w>=5?'pl-5':p.w>=2.5?'pl-2':'pl-1';
h+=`<div class="pl ${c}">${p.w%1?p.w:p.w|0}</div>`}h+=`<span style="font-size:10px;color:var(--dm);margin-left:3px">= ${t}kg</span></div>`;return h}

// ═══════════════════════ PROGRAM ═══════════════════════
const PR={A:[
{id:'deadlift',nm:'Deadlift',s:3,rp:'5',rst:'3:00',rir:'1-2',tp:'bb',rl:'Hit 3×5 → next weight',tg:5,rstS:180,ss:''},
{id:'pullup_a',nm:'Pull-ups (Wide)',s:4,rp:'4-8',rst:'2:30',rir:'1-2',tp:'band',rl:'4×8 → next band down (less help)',tg:8,rstS:150,ss:'floor_press'},
{id:'floor_press',nm:'Floor Press',s:3,rp:'8-10',rst:'2:00',rir:'2',tp:'bb',rl:'Hit 3×10 → next weight',tg:10,rstS:120,ss:'pullup_a'},
{id:'zercher_a',nm:'Zercher Squat',s:3,rp:'6-8',rst:'2:00',rir:'2',tp:'bb',rl:'Hit 3×8 → next weight',tg:8,rstS:120,ss:'face_pull'},
{id:'face_pull',nm:'Face Pull',s:3,rp:'15-20',rst:'1:00',rir:'2-3',tp:'band',rl:'3×20 → heavier band (more resistance)',tg:20,rstS:60,ss:'zercher_a'},
{id:'leg_raise',nm:'Floor Leg Raise',s:3,rp:'10-15',rst:'1:00',rir:'2',tp:'bw',rl:'+reps → +weight → slow ecc',tg:15,rstS:60,ss:''}],
B:[
{id:'zercher_b',nm:'Zercher Squat (Heavy)',s:4,rp:'5-6',rst:'3:30',rir:'1-2',tp:'bb',rl:'Hit 4×6 → next weight',tg:6,rstS:210,ss:''},
{id:'ohp',nm:'Barbell OHP',s:3,rp:'5-7',rst:'2:30',rir:'1-2',tp:'bb',rl:'Hit 3×7 → next weight (slow!)',tg:7,rstS:150,ss:'bb_row'},
{id:'dips',nm:'Dips',s:4,rp:'4-8',rst:'2:30',rir:'1-2',tp:'band',rl:'4×8 → next band down (less help)',tg:8,rstS:150,ss:'kb_swing'},
{id:'bb_row',nm:'Barbell Row',s:3,rp:'8-10',rst:'2:00',rir:'2',tp:'bb',rl:'Hit 3×10 → next weight',tg:10,rstS:120,ss:'ohp'},
{id:'kb_swing',nm:'KB Swing',s:3,rp:'12-15',rst:'1:30',rir:'2-3',tp:'kb',rl:'20→32kg→single-arm',tg:15,rstS:90,ss:'dips'},
{id:'pallof',nm:'Pallof Press',s:3,rp:'10/side',rst:'1:00',rir:'2',tp:'band',rl:'Heavier band → step-out',tg:10,rstS:60,ss:''}],
C:[
{id:'rdl',nm:'Romanian DL',s:3,rp:'8-10',rst:'2:00',rir:'2',tp:'bb',rl:'Hit 3×10 → next weight',tg:10,rstS:120,ss:''},
{id:'split_squat',nm:'Split Squat',s:3,rp:'10/leg',rst:'1:30',rir:'2',tp:'bw',rl:'BW→20kg bag→30kg→Zercher',tg:10,rstS:90,ss:'pullup_c'},
{id:'pushups',nm:'Push-ups',s:4,rp:'8-15',rst:'1:30',rir:'1-2',tp:'bw',rl:'4×15 → advance variation',tg:15,rstS:90,ss:'pullup_c'},
{id:'pullup_c',nm:'Pull-ups (Volume)',s:3,rp:'6-10',rst:'2:00',rir:'2-3',tp:'band',rl:'One band easier than Day A',tg:10,rstS:120,ss:'pushups'},
{id:'kb_press',nm:'KB Press',s:3,rp:'10/arm',rst:'1:00',rir:'2',tp:'kb',rl:'Increase KB or reps',tg:10,rstS:60,ss:'carry'},
{id:'carry',nm:'Loaded Carry',s:3,rp:'40m',rst:'1:30',rir:'—',tp:'carry',rl:'↑ load or distance',tg:1,rstS:90,ss:'kb_press'},
{id:'arms',nm:'Arms (Curl/Ext)',s:2,rp:'12-15',rst:'1:00',rir:'2',tp:'kb',rl:'+reps → +weight',tg:15,rstS:60,ss:''}]};
const ALL_EX=[...PR.A,...PR.B,...PR.C];
const BANDS=['Blue (heaviest)','Green','Purple+Red','Purple','Red','None'];
const BAND_IDX=b=>{if(!b)return 99;const n=b.replace(/ \(heaviest\)/,'');const i=BANDS.findIndex(x=>x===b||x===n||x.replace(/ \(heaviest\)/,'')==n);return i<0?99:i};

// ═══════════════════════ SEED ═══════════════════════
const SEED={sessions:[
{id:'s1',date:'2026-02-26',day:'A',ex:[{id:'deadlift',wt:46,reps:[8,7,7],band:'',notes:'Finding week'},{id:'pullup_a',wt:null,reps:[6,5,5,4],band:'Blue',notes:'Wide grip'},{id:'floor_press',wt:26,reps:[8,8,8],band:'',notes:'Did 4 sets by mistake'},{id:'face_pull',wt:null,reps:[18,16,15],band:'Purple',notes:''},{id:'leg_raise',wt:5,reps:[12,10,10],band:'',notes:'5kg overhead'}]},
{id:'s2',date:'2026-03-01',day:'A',ex:[{id:'deadlift',wt:46,reps:[6,6,6],band:'',notes:''},{id:'pullup_a',wt:null,reps:[5,5,4,4],band:'Green',notes:''},{id:'zercher_a',wt:28,reps:[7,6,6],band:'',notes:''}]},
{id:'s3',date:'2026-03-04',day:'A',ex:[{id:'deadlift',wt:46,reps:[1,1,1],band:'',notes:'Heavy singles'},{id:'floor_press',wt:26,reps:[8,8,8],band:'',notes:''},{id:'zercher_a',wt:21,reps:[8,7,6],band:'',notes:''}]},
{id:'s4',date:'2026-03-06',day:'B',ex:[{id:'zercher_b',wt:26,reps:[6,6,5,5],band:'',notes:''},{id:'ohp',wt:16,reps:[7,6,5],band:'',notes:'Ramped cautiously'}]},
{id:'s5',date:'2026-03-10',day:'B',ex:[{id:'zercher_b',wt:31,reps:[6,6,6,5],band:'',notes:'Too light → going up'},{id:'ohp',wt:21,reps:[6,5,5],band:'',notes:''},{id:'dips',wt:null,reps:[6,5,5,4],band:'Purple+Red',notes:''},{id:'bb_row',wt:30,reps:[10,9,8],band:'',notes:''}]},
{id:'s6',date:'2026-03-14',day:'C',ex:[{id:'rdl',wt:41,reps:[8,8,8],band:'',notes:''}]},
{id:'s1773740828259',date:'2026-03-17',day:'B',difficulty:null,duration:40,volume:3013,ex:[{id:'zercher_b',wt:31,reps:[6,6,6,5],band:'',notes:''},{id:'ohp',wt:23,reps:[6,5,5],band:'',notes:''},{id:'dips',wt:null,reps:[6,6,6,6],band:'Purple+Red',notes:''},{id:'bb_row',wt:30,reps:[10,8,8],band:'',notes:''},{id:'kb_swing',wt:32,reps:[12,12,12],band:'',notes:''},{id:'pallof',wt:null,reps:[10,10,10],band:'Purple',notes:''}]},
{id:'s1773903323258',date:'2026-03-19',day:'C',difficulty:2,duration:56,volume:1758,ex:[{id:'rdl',wt:43,reps:[8,8,8],band:'',notes:''},{id:'split_squat',wt:10,reps:[10,10,10],band:'',notes:''},{id:'pushups',wt:null,reps:[10,10,10,10],band:'',notes:''},{id:'pullup_c',wt:null,reps:[6,6,6],band:'Green',notes:''},{id:'kb_press',wt:11,reps:[10,10,10],band:'',notes:''},{id:'carry',wt:32,reps:[1,1,1],band:'',notes:''},{id:'arms',wt:0,reps:[10,10],band:'',notes:''}]}],
nextDay:'A',lastDeload:null};

// ═══════════════════════ STATE ═══════════════════════
const SK='rft-v5';const OLD_KEYS=['rft-v4','rft-v3','workout-tracker-v2'];
let D,VIEW='home',ADAY=null,LOG={},EXP=null,TIMER=null,TIMER_IV=null,SS=null,SDIFF=0,QLOG=false,STAT_EX='deadlift';
function load(){try{let s=localStorage.getItem(SK);
if(!s){for(const k of OLD_KEYS){s=localStorage.getItem(k);if(s){localStorage.setItem(SK,s);break}}}
D=s?JSON.parse(s):structuredClone(SEED)}catch(e){D=structuredClone(SEED)}}
function save(){try{localStorage.setItem(SK,JSON.stringify(D))}catch(e){}}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function today(){return new Date().toISOString().split('T')[0]}
function fmtD(d){return new Date(d+'T00:00:00').toLocaleDateString('en-NZ',{weekday:'short',day:'numeric',month:'short'})}
function dAgo(d){const x=Math.floor((new Date()-new Date(d+'T00:00:00'))/864e5);return x===0?'Today':x===1?'Yesterday':`${x}d ago`}
function elapsed(){if(!SS)return'';const s=Math.floor((Date.now()-SS)/1000),m=Math.floor(s/60);return`${m}:${String(s%60).padStart(2,'0')}`}

// ═══════════════════════ PROGRESSION ENGINE ═══════════════════════
function getHist(exId,n=20){const h=[];for(let i=D.sessions.length-1;i>=0&&h.length<n;i--){const e=D.sessions[i].ex.find(x=>x.id===exId);if(e)h.unshift({...e,date:D.sessions[i].date})}return h}
function getLast(exId){const h=getHist(exId,1);return h.length?h[0]:null}

function getSmartSugg(ex){
const hist=getHist(ex.id,5),last=hist.length?hist[hist.length-1]:null;
if(!last)return{text:'First time — find your weight',type:'new',wt:null,traj:[],stalls:0,detail:'',regress:''};
if(ex.tp==='bb'&&last.wt){
  const atW=hist.filter(h=>h.wt===last.wt);
  const hit=h=>{const v=h.reps.filter(r=>r>0);return v.length>=ex.s&&v.slice(0,ex.s).every(r=>r>=ex.tg)};
  const stalls=atW.filter(h=>!hit(h)).length;const lastHit=hit(last);
  const traj=hist.map((h,i)=>{const p=hist[i-1];if(!p)return{s:'●',c:'same'};if(h.wt>p.wt)return{s:'↑',c:'up'};if(h.wt<p.wt)return{s:'↓',c:'dn'};
    const ps=p.reps.filter(r=>r>0).reduce((a,b)=>a+b,0),cs=h.reps.filter(r=>r>0).reduce((a,b)=>a+b,0);
    return cs>ps?{s:'↗',c:'up'}:cs<ps?{s:'↘',c:'dn'}:{s:'→',c:'same'}});
  // Rep regression detection: compare to previous session at same weight
  let regress='';
  if(atW.length>=2){const prev=atW[atW.length-2],curr=atW[atW.length-1];
    const pT=prev.reps.filter(r=>r>0).reduce((a,b)=>a+b,0),cT=curr.reps.filter(r=>r>0).reduce((a,b)=>a+b,0);
    const pMax=Math.max(...prev.reps.filter(r=>r>0)),cMax=Math.max(...curr.reps.filter(r=>r>0));
    if(cT<pT-2)regress=`⚠ Reps dropped: ${pT}→${cT} total at ${last.wt}kg. Check recovery/sleep.`;
    else if(cMax<pMax-1)regress=`⚠ Top set dropped: ${pMax}→${cMax} reps. Fatigue?`}
  // Also detect weight regression vs previous session
  if(!regress&&hist.length>=2){const prev=hist[hist.length-2];
    if(prev.wt&&last.wt&&last.wt<prev.wt)regress=`⚠ Weight dropped: ${prev.wt}→${last.wt}kg from last session`;
    else if(prev.wt===last.wt){const pT=prev.reps.filter(r=>r>0).reduce((a,b)=>a+b,0),cT=last.reps.filter(r=>r>0).reduce((a,b)=>a+b,0);
    if(cT<pT-2)regress=`⚠ Reps dropped: ${pT}→${cT} total. Check recovery/sleep.`}}
  if(lastHit){const n=nxUp(last.wt);return{text:`↑ ${n}kg`,type:'up',wt:n,traj,stalls:0,detail:`Hit ${ex.s}×${ex.tg} — go up!`,regress}}
  if(stalls>=3){const d=nxDn(last.wt);return{text:`↓ ${d}kg`,type:'dn',wt:d,traj,stalls,detail:`${stalls} stalls at ${last.wt}kg — reset`,regress}}
  const ri=atW.length>=2&&(()=>{const r=atW.map(h=>h.reps.filter(x=>x>0).reduce((a,b)=>a+b,0));return r[r.length-1]>r[0]})();
  return{text:`→ ${last.wt}kg`,type:'stay',wt:last.wt,traj,stalls,detail:stalls?`Stall ×${stalls}/3`+(ri?' — reps trending ↑':''):`Push for ${ex.s}×${ex.tg}`,regress}}
if(ex.tp==='band'){
  // Band order: lower BAND_IDX = more assistance. Progressing = higher index (less help)
  const traj=hist.map((h,i)=>{if(!i)return{s:'●',c:'same'};const pi=BAND_IDX(hist[i-1].band),ci=BAND_IDX(h.band);
    return ci>pi?{s:'↑',c:'up'}:ci<pi?{s:'↓',c:'dn'}:{s:'→',c:'same'}});
  const hitTop=last.reps.filter(r=>r>0).length>=ex.s&&last.reps.slice(0,ex.s).every(r=>r>=ex.tg);
  // Rep regression for band exercises
  let regress='';
  if(hist.length>=2){const prev=hist[hist.length-2];
    if(BAND_IDX(prev.band)===BAND_IDX(last.band)){const pT=prev.reps.filter(r=>r>0).reduce((a,b)=>a+b,0),cT=last.reps.filter(r=>r>0).reduce((a,b)=>a+b,0);
    if(cT<pT-2)regress=`⚠ Reps dropped on same band: ${pT}→${cT}`}}
  if(hitTop)return{text:'↑ Less band next',type:'up',wt:null,traj,stalls:0,detail:`Hit ${ex.s}×${ex.tg} — advance!`,regress};
  return{text:last.band||'Check band',type:'stay',wt:null,traj,stalls:0,detail:`Stay on ${last.band||'current'}`,regress}}
// Bodyweight/KB rep regression
let regress='';
if(hist.length>=2){const prev=hist[hist.length-2];
  if((prev.wt||0)===(last.wt||0)){const pT=prev.reps.filter(r=>r>0).reduce((a,b)=>a+b,0),cT=last.reps.filter(r=>r>0).reduce((a,b)=>a+b,0);
  if(cT<pT-2)regress=`⚠ Reps dropped: ${pT}→${cT} at same load`}}
return{text:last.wt?`${last.wt}kg`:'Continue',type:'stay',wt:last.wt,traj:[],stalls:0,detail:'',regress}}

function getSkips(day,exId){const ds=D.sessions.filter(s=>s.day===day).slice(-3);let sk=0;for(const s of ds)if(!s.ex.find(e=>e.id===exId))sk++;return{sk,tot:ds.length}}

// ═══════════════════════ PR / STATS ENGINE ═══════════════════════
function getPRs(exId){let bw=0,bv=0,br=0,be1rm=0;
for(const s of D.sessions)for(const e of s.ex)if(e.id===exId){const vr=e.reps.filter(r=>r>0);if(!vr.length)continue;
  const mx=Math.max(...vr),vol=(e.wt||0)*vr.reduce((a,b)=>a+b,0);
  if(e.wt>bw)bw=e.wt;if(vol>bv)bv=vol;if(mx>br)br=mx;
  if(e.wt){const e1=e.wt*(1+mx/30);if(e1>be1rm)be1rm=e1}}
return{bestWt:bw,bestVol:bv,bestReps:br,bestE1RM:Math.round(be1rm*10)/10}}

function checkPR(exId,wt,reps){const pr=getPRs(exId),vr=reps.filter(r=>r>0);if(!vr.length)return[];
const ps=[],mx=Math.max(...vr),vol=(wt||0)*vr.reduce((a,b)=>a+b,0);
if(wt&&wt>pr.bestWt&&pr.bestWt>0)ps.push('WEIGHT');if(vol>pr.bestVol&&pr.bestVol>0)ps.push('VOLUME');return ps}

function getAllPRs(){const result=[];for(const ex of ALL_EX){const pr=getPRs(ex.id);
if(pr.bestWt||pr.bestVol)result.push({id:ex.id,nm:ex.nm,tp:ex.tp,...pr})}return result}

// Est 1RM: Epley formula
function e1rm(wt,reps){return reps<=0||!wt?0:reps===1?wt:Math.round(wt*(1+reps/30)*10)/10}

// ═══════════════════════ GRAPHS ═══════════════════════
function svgLine(data,W,H,color,label,yLabel){
if(data.length<2)return`<div class="dm" style="text-align:center;padding:20px">Need 2+ sessions to graph</div>`;
const pad={t:20,r:10,b:30,l:36},w=W-pad.l-pad.r,h=H-pad.t-pad.b;
const vals=data.map(d=>d.v),mn=Math.min(...vals),mx=Math.max(...vals),range=mx-mn||1;
const pts=data.map((d,i)=>{const x=pad.l+(i/(data.length-1))*w,y=pad.t+h-(((d.v-mn)/range)*h);return{x,y,...d}});
let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">`;
// Grid lines
for(let i=0;i<=4;i++){const y=pad.t+(h/4)*i,v=Math.round(mx-((mx-mn)/4)*i);
svg+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#1e2028" stroke-width="1"/>
<text x="${pad.l-4}" y="${y+3}" text-anchor="end" fill="#6b7084" font-size="9">${v}</text>`}
// Line
svg+=`<polyline points="${pts.map(p=>`${p.x},${p.y}`).join(' ')}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
// Dots
for(const p of pts)svg+=`<circle cx="${p.x}" cy="${p.y}" r="4" fill="${color}" stroke="var(--bg)" stroke-width="2"/>`;
// X labels
if(data.length<=8)for(const p of pts)svg+=`<text x="${p.x}" y="${H-4}" text-anchor="middle" fill="#6b7084" font-size="8">${p.l}</text>`;
else{svg+=`<text x="${pts[0].x}" y="${H-4}" text-anchor="start" fill="#6b7084" font-size="8">${pts[0].l}</text>`;
svg+=`<text x="${pts[pts.length-1].x}" y="${H-4}" text-anchor="end" fill="#6b7084" font-size="8">${pts[pts.length-1].l}</text>`}
svg+=`<text x="${W/2}" y="12" text-anchor="middle" fill="${color}" font-size="11" font-weight="600">${label}</text>`;
svg+=`</svg>`;return svg}

function svgBar(data,W,H,color){
if(!data.length)return'';
const pad={t:20,r:10,b:30,l:36},w=W-pad.l-pad.r,h=H-pad.t-pad.b;
const mx=Math.max(...data.map(d=>d.v))||1;
const bw=Math.min(20,w/data.length*.7);
let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">`;
for(let i=0;i<=3;i++){const y=pad.t+(h/3)*i,v=Math.round(mx-((mx)/3)*i);
svg+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#1e2028" stroke-width="1"/>
<text x="${pad.l-4}" y="${y+3}" text-anchor="end" fill="#6b7084" font-size="9">${v}</text>`}
data.forEach((d,i)=>{const x=pad.l+(i+.5)/(data.length)*w-bw/2,bh=(d.v/mx)*h,y=pad.t+h-bh;
svg+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="2" fill="${color}" opacity=".7"/>`});
svg+=`<text x="${W/2}" y="12" text-anchor="middle" fill="${color}" font-size="11" font-weight="600">Volume per Session</text></svg>`;
return svg}

// ═══════════════════════ FATIGUE ═══════════════════════
function getFatigue(){
const now=new Date(),scores=[];
for(let i=0;i<7;i++){const d=new Date(now);d.setDate(d.getDate()-i);const ds=d.toISOString().split('T')[0];
const sess=D.sessions.filter(s=>s.date===ds);
for(const s of sess){let vol=0;for(const e of s.ex){const vr=e.reps.filter(r=>r>0);vol+=(e.wt||0)*vr.reduce((a,b)=>a+b,0)}
scores.push({vol,diff:s.difficulty||3})}}
if(!scores.length)return{score:0,label:'Fresh',color:'var(--gr)'};
const totalVol=scores.reduce((a,b)=>a+b.vol,0);const avgDiff=scores.reduce((a,b)=>a+b.diff,0)/scores.length;
const freq=scores.length;
const raw=Math.min(10,freq*1.2+avgDiff*.8+(totalVol/2000));
const score=Math.round(raw*10)/10;
if(score<=3)return{score,label:'Fresh',color:'var(--gr)'};
if(score<=5)return{score,label:'Ready',color:'var(--bl)'};
if(score<=7)return{score,label:'Accumulating',color:'var(--go)'};
if(score<=8.5)return{score,label:'High Fatigue',color:'var(--or)'};
return{score,label:'Overreaching',color:'var(--rd)'}}

// ═══════════════════════ STREAK & MILESTONES ═══════════════════════
function getStreak(){
const now=new Date();let streak=0,w=getWeekStart(now);
while(true){const wEnd=new Date(w);wEnd.setDate(wEnd.getDate()+6);
const cnt=D.sessions.filter(s=>{const d=new Date(s.date+'T00:00:00');return d>=w&&d<=wEnd}).length;
if(cnt>=3)streak++;else break;w.setDate(w.getDate()-7);if(streak>52)break}return streak}
function getWeekStart(d){const dt=new Date(d);const day=dt.getDay();dt.setDate(dt.getDate()-(day||7)+1);dt.setHours(0,0,0,0);return dt}

function getMilestones(){const ms=[];const n=D.sessions.length;
if(n>=50)ms.push('🏅 50 sessions logged!');else if(n>=25)ms.push('💪 25 sessions!');else if(n>=10)ms.push('🎯 10 sessions logged!');
const streak=getStreak();if(streak>=8)ms.push(`🔥 ${streak}-week streak!`);else if(streak>=4)ms.push(`⚡ ${streak}-week streak!`);
// Check for weight milestones
for(const ex of ALL_EX.filter(e=>e.tp==='bb')){const pr=getPRs(ex.id);
if(pr.bestWt>=71)ms.push(`🏋️ ${ex.nm}: ${pr.bestWt}kg — maxing your plates!`);
else if(pr.bestWt>=60)ms.push(`💥 ${ex.nm}: ${pr.bestWt}kg`)}
return ms.slice(0,3)}

// ═══════════════════════ HEATMAP ═══════════════════════
function getHeatmapData(){const weeks=12,data=[];const now=new Date();
const start=new Date(now);start.setDate(start.getDate()-weeks*7+1);
for(let i=0;i<weeks*7;i++){const d=new Date(start);d.setDate(d.getDate()+i);const ds=d.toISOString().split('T')[0];
const sess=D.sessions.filter(s=>s.date===ds);let vol=0,day=null;
for(const s of sess){day=s.day;for(const e of s.ex){const vr=e.reps.filter(r=>r>0);vol+=(e.wt||0)*vr.reduce((a,b)=>a+b,0)}}
data.push({date:ds,vol,day,dow:d.getDay(),d:d.getDate(),m:d.getMonth()})}return data}

// ═══════════════════════ WARMUP ═══════════════════════
function warmupSets(wt){if(!wt||wt<=BAR)return[];const s=[{wt:BAR,reps:8,l:'Bar only'}];
const w60=snapW(BAR+(wt-BAR)*.5),w80=snapW(BAR+(wt-BAR)*.8);
if(w60>BAR&&w60<wt)s.push({wt:w60,reps:5,l:fmtPl(w60)});
if(w80>w60&&w80<wt)s.push({wt:w80,reps:3,l:fmtPl(w80)});return s}

// ═══════════════════════ DELOAD ═══════════════════════
function getDeload(){const st=D.lastDeload||D.sessions[0]?.date;if(!st)return null;
const wk=Math.max(1,Math.round((new Date()-new Date(st+'T00:00:00'))/6048e5));
const sc=D.lastDeload?D.sessions.filter(s=>s.date>D.lastDeload).length:D.sessions.length;
return{wk,sc,due:wk>=6}}

// ═══════════════════════ TIMER ═══════════════════════
function startTimer(secs){clearTimer();TIMER={tot:secs,left:secs,done:false};
TIMER_IV=setInterval(()=>{TIMER.left--;if(TIMER.left<=0){TIMER.done=true;clearInterval(TIMER_IV);TIMER_IV=null;
try{navigator.vibrate([200,100,200,100,200])}catch(e){}playBeep();rTimer()}rTimer()},1000);rTimer()}
function clearTimer(){if(TIMER_IV)clearInterval(TIMER_IV);TIMER_IV=null;TIMER=null;rTimer()}
function playBeep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();
o.connect(g);g.connect(a.destination);o.frequency.value=880;o.type='square';g.gain.value=.3;o.start();o.stop(a.currentTime+.15);
setTimeout(()=>{const o2=a.createOscillator(),g2=a.createGain();o2.connect(g2);g2.connect(a.destination);
o2.frequency.value=1100;o2.type='square';g2.gain.value=.3;o2.start();o2.stop(a.currentTime+.2)},200)}catch(e){}}
function rTimer(){const el=document.getElementById('timer-root');if(!TIMER){el.innerHTML='';return}
const m=Math.floor(Math.abs(TIMER.left)/60),s=Math.abs(TIMER.left)%60,sg=TIMER.left<0?'+':'';
el.innerHTML=`<div class="timer-bar${TIMER.done?' done':''}"><div><div class="timer-time">${sg}${m}:${String(s).padStart(2,'0')}</div>
<div class="dm">${TIMER.done?'REST DONE — GO':'Resting...'}</div></div>
<button style="padding:10px 18px;border-radius:8px;border:none;font-size:13px;font-weight:700;cursor:pointer;
background:${TIMER.done?'var(--gr)':'var(--rd)'};color:var(--bg)" onclick="clearTimer()">✕</button></div>`}

// ─── START WORKOUT ───────────────────────────────────
function startW(day){ADAY=day;LOG={};SS=Date.now();QLOG=false;
for(const ex of PR[day]){const last=getLast(ex.id),sg=getSmartSugg(ex);
LOG[ex.id]={wt:sg.wt||last?.wt||(ex.tp==='bb'?BAR:''),band:last?.band||'',
reps:last?last.reps.slice(0,ex.s).map(r=>r>0?String(r):''):Array(ex.s).fill(''),notes:'',pf:!!last,wu:false}}

// ─── WORKOUT ─────────────────────────────────────────
function rWork(el){const exs=PR[ADAY],filled=Object.values(LOG).filter(v=>v.reps.some(r=>r!==''&&Number(r)>0)).length;
let h=`<div class="sec"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
<div style="display:flex;align-items:center;gap:8px">
<span class="bg bg-${ADAY.toLowerCase()}">DAY ${ADAY}</span><span class="mu">${filled}/${exs.length}</span>
<span class="dm" id="sc">${elapsed()}</span></div>
<div style="display:flex;gap:4px">
<button class="btn-sm ${QLOG?'btn-go':'btn-dk'}" onclick="QLOG=!QLOG;render()" style="font-size:9px">${QLOG?'FULL':'QUICK'}</button>
<button class="btn-sm btn-dk" onclick="cancelW()">✕</button></div></div>`;

if(QLOG){// ── QUICK LOG MODE ──
for(const ex of exs){const log=LOG[ex.id],last=getLast(ex.id),sg=getSmartSugg(ex);
h+=`<div class="ql-row"><div style="flex:1">
<div class="ql-name">${esc(ex.nm)}</div>
<div class="dm">${ex.s}×${ex.rp} · <span style="color:${sg.type==='up'?'var(--gr)':sg.type==='dn'?'var(--rd)':'var(--go)'}">${esc(sg.text)}</span></div></div>
<div style="display:flex;gap:3px;align-items:center">`;

if(ex.tp==='bb'){const cur=Number(log.wt)||BAR,ix=VW.indexOf(cur);
h+=`<div class="stp" style="margin-bottom:2px">

<div class="stp-v">${cur}<span>kg</span></div>
<div class="stp-b${ix>=VW.length-1?' dis':''}" onclick="stepWt('${ex.id}',1)">+</div>
<button class="btn-sm btn-dk" style="margin-left:6px;font-size:9px;padding:4px 7px" onclick="togWU('${ex.id}')">${log.wu?'Hide':'WU'}</button></div>`;
h+=plateH(cur)+`<div style="font-size:9px;color:var(--dm);margin-bottom:3px">/side: ${esc(fmtPl(cur))}</div>`;
if(log.wu){const wu=warmupSets(cur);if(wu.length){h+=`<div class="warmup"><div style="font-weight:600;margin-bottom:3px;color:var(--go);font-size:10px">WARM-UP</div>`;

function stepWt(id,dir){const c=Number(LOG[id].wt)||BAR,ix=VW.indexOf(c);
if(dir<0&&ix>0)LOG[id].wt=VW[ix-1];if(dir>0&&ix<VW.length-1)LOG[id].wt=VW[ix+1];LOG[id].pf=false;render()}
function setL(id,f,v){LOG[id][f]=v}
function setRep(id,i,v){LOG[id].reps[i]=v;LOG[id].pf=false}
function togWU(id){LOG[id].wu=!LOG[id].wu;render()}
function cpLast(id){const l=getLast(id);if(!l)return;const ex=ALL_EX.find(e=>e.id===id);
LOG[id].reps=l.reps.slice(0,ex?.s||4).map(r=>r>0?String(r):'');LOG[id].pf=true;render()}
function cancelW(){if(confirm('Discard?')){ADAY=null;LOG={};SS=null;clearTimer();go('home')}}

function finishW(){const exs=Object.entries(LOG).filter(([,v])=>v.reps.some(r=>r!==''&&Number(r)>0))
.map(([id,v])=>({id,wt:v.wt?Number(v.wt):null,reps:v.reps.map(r=>r===''?0:Number(r)),band:v.band||'',notes:v.notes}));
if(!exs.length&&!confirm('No exercises. Save empty?'))return;
const prs=[];for(const e of exs){const p=checkPR(e.id,e.wt,e.reps);if(p.length){const def=ALL_EX.find(x=>x.id===e.id);prs.push({nm:def?.nm||e.id,types:p})}}
let tv=0,ts=0,tr=0;for(const e of exs){const vr=e.reps.filter(r=>r>0);ts+=vr.length;tr+=vr.reduce((a,b)=>a+b,0);if(e.wt)tv+=e.wt*vr.reduce((a,b)=>a+b,0)}
window._S={exs,prs,tv,ts,tr,dur:SS?Math.round((Date.now()-SS)/6e4):0,day:ADAY};SDIFF=0;VIEW='summary';render();window.scrollTo(0,0)}
